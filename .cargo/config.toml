# The Windows executables link the C runtime statically, so that `nurt.exe`
# starts on a system without the Visual C++ Redistributable (no import of
# VCRUNTIME140.dll or api-ms-win-crt-*.dll).
# The static libraries of the runtime carry debug information that points to
# files of the build machine of Microsoft; the linker warns LNK4099 for each
# of them, and the warning is ignored.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=/ignore:4099"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=/ignore:4099"]
