format = "nurt-conformance-cases/1"

[[case]]
id = "correction/names/l01-remove-transposed"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "A changing command name one transposition away is not corrected; the corrected program is the candidate."
method = "correct"
program = 'remvoe "/home/user/app/build/old.log"'

[case.expect.error]
code = "E_AMBIGUOUS"
candidates = [{ program = 'remove "/home/user/app/build/old.log"' }]

[[case]]
id = "correction/names/l01-find-transposed"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "A reading command name one transposition away is corrected."
method = "correct"
program = 'fnid "/home/user/app" glob: "*.go"'

[case.expect]
program = 'find "/home/user/app" glob: "*.go"'
corrections = [{ rule = "L01", class = "F", from = "fnid", to = "find" }]

[[case]]
id = "correction/names/l01-search-transposed"
