format = "nurt-conformance-cases/1"

[[case]]
id = "correction/bash/b01-rm-rf"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "rm -rf removes a path; recursion and the absence of errors for missing paths are the defaults."
method = "correct"
program = "rm -rf /home/user/app/build"

[case.expect]
program = 'remove "/home/user/app/build"'

[[case]]
id = "correction/bash/b01-rm-file"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "rm without flags removes a file."
method = "correct"
program = "rm /home/user/app/old.log"

[case.expect]
program = 'remove "/home/user/app/old.log"'

[[case]]
id = "correction/bash/b01-rm-several"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "rm with several paths removes all of them in one operation."
method = "correct"
program = "rm -f /home/user/app/a.log /home/user/app/b.log"

[case.expect]
program = 'remove ["/home/user/app/a.log", "/home/user/app/b.log"]'

[[case]]
id = "correction/bash/b01-rm-quoted-path"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "A quoted shell path with a space is one path."
method = "correct"
program = 'rm -r "/home/user/my dir"'

[case.expect]
program = 'remove "/home/user/my dir"'

[[case]]
id = "correction/bash/b01-rm-single-quoted-path"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "A single-quoted shell path keeps its bytes."
method = "correct"
program = "rm '/home/user/a $b.txt'"

[case.expect]
program = 'remove "/home/user/a $b.txt"'

[[case]]
id = "correction/bash/b02-rm-glob"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "A shell glob of rm matches one directory level and skips hidden files."
method = "correct"
program = "rm /home/user/app/build/*.tmp"

[case.expect]
program = 'find "/home/user/app/build" glob: "*.tmp" depth: 1 hidden: false |> remove'

[[case]]
id = "correction/bash/b02-rm-rf-glob"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "rm -rf with a glob keeps the glob expansion of the shell."
method = "correct"
program = "rm -rf /home/user/app/cache/*"

[case.expect]
program = 'find "/home/user/app/cache" glob: "*" depth: 1 hidden: false |> remove'

[[case]]
id = "correction/bash/b03-mv"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "mv moves a path to a destination."
method = "correct"
program = "mv /home/user/a.txt /home/user/b.txt"

[case.expect]
program = 'move "/home/user/a.txt" to: "/home/user/b.txt"'

[[case]]
id = "correction/bash/b03-mv-into-directory-path"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "mv to a path that may be a directory is the same move; the directory case is decided at execution."
method = "correct"
program = "mv /home/user/a.txt /home/user/archive"

[case.expect]
program = 'move "/home/user/a.txt" to: "/home/user/archive"'

[[case]]
id = "correction/bash/b04-cp-r"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "cp -r copies a directory; recursion is the default."
method = "correct"
program = "cp -r /home/user/app/dist /home/user/backup"

[case.expect]
program = 'copy "/home/user/app/dist" to: "/home/user/backup"'

[[case]]
id = "correction/bash/b04-cp-a"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "cp -a keeps attributes, which is the default of copy."
method = "correct"
program = "cp -a /home/user/app/dist /home/user/backup"

[case.expect]
program = 'copy "/home/user/app/dist" to: "/home/user/backup"'

[[case]]
id = "correction/bash/b04-cp-file"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "cp copies a file."
method = "correct"
program = "cp /home/user/a.txt /home/user/b.txt"

[case.expect]
program = 'copy "/home/user/a.txt" to: "/home/user/b.txt"'

[[case]]
id = "correction/bash/b05-mkdir-p"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "mkdir -p creates a directory with its parents, the default of create."
method = "correct"
program = "mkdir -p /home/user/app/out/logs"

[case.expect]
program = 'create "/home/user/app/out/logs" type: directory'

[[case]]
id = "correction/bash/b05-mkdir-several"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "mkdir with several paths creates all of them."
method = "correct"
program = "mkdir /home/user/a /home/user/b"

[case.expect]
program = 'create ["/home/user/a", "/home/user/b"] type: directory'

[[case]]
id = "correction/bash/b06-touch"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "touch creates a file or updates its modification time."
method = "correct"
program = "touch /home/user/app/a.txt"

[case.expect]
program = 'create "/home/user/app/a.txt" type: file on_exists: touch'

[[case]]
id = "correction/bash/b07-chmod"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "chmod sets the mode as written."
method = "correct"
program = "chmod 755 /home/user/app/run.sh"

[case.expect]
program = 'attributes "/home/user/app/run.sh" mode: "755"'

[[case]]
id = "correction/bash/b07-chmod-recursive"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "chmod -R is recursive."
method = "correct"
program = "chmod -R 700 /home/user/secret"

[case.expect]
program = 'attributes "/home/user/secret" mode: "700" recursive: true'

[[case]]
id = "correction/bash/b07-chmod-symbolic"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "A symbolic mode is kept as written."
method = "correct"
program = "chmod u+x /home/user/app/run.sh"

[case.expect]
program = 'attributes "/home/user/app/run.sh" mode: "u+x"'

[[case]]
id = "correction/bash/b08-chown"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "chown with an account and a group sets both."
method = "correct"
program = "chown user:staff /home/user/a.txt"

[case.expect]
program = 'attributes "/home/user/a.txt" owner: "user" group: "staff"'

[[case]]
id = "correction/bash/b09-ln-s"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "ln -s creates a symbolic link at the second path pointing to the first."
method = "correct"
program = "ln -s /home/user/app/src /home/user/link"

[case.expect]
program = 'create "/home/user/link" type: link target: "/home/user/app/src"'

[[case]]
id = "correction/bash/b09-ln-hard"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "ln without -s creates a hard link."
method = "correct"
program = "ln /home/user/a.txt /home/user/b.txt"

[case.expect]
program = 'create "/home/user/b.txt" type: link target: "/home/user/a.txt" hard: true'

[[case]]
id = "correction/bash/b10-cat"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "cat reads a file."
method = "correct"
program = "cat /home/user/app/README.md"

[case.expect]
program = 'read "/home/user/app/README.md"'

[[case]]
id = "correction/bash/b10-cat-several"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "cat with several files reads each of them."
method = "correct"
program = "cat /home/user/a.txt /home/user/b.txt"

[case.expect]
program = 'read ["/home/user/a.txt", "/home/user/b.txt"]'

[[case]]
id = "correction/bash/b11-head-n"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "head -n N reads the first N lines."
method = "correct"
program = "head -n 5 /home/user/app/a.log"

[case.expect]
program = 'read "/home/user/app/a.log" lines: ..5'

[[case]]
id = "correction/bash/b11-head-default"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "head without -n reads ten lines."
method = "correct"
program = "head /home/user/app/a.log"

[case.expect]
program = 'read "/home/user/app/a.log" lines: ..10'

[[case]]
id = "correction/bash/b11-tail-n"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "tail -n N reads the last N lines."
method = "correct"
program = "tail -n 20 /home/user/app/a.log"

[case.expect]
program = 'read "/home/user/app/a.log" last: 20'

[[case]]
id = "correction/bash/b11-tail-default"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "tail without -n reads the last ten lines."
method = "correct"
program = "tail /home/user/app/a.log"

[case.expect]
program = 'read "/home/user/app/a.log" last: 10'

[[case]]
id = "correction/bash/b12-wc-l"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "wc -l counts the lines of a file."
method = "correct"
program = "wc -l /home/user/app/a.txt"

[case.expect]
program = 'lines "/home/user/app/a.txt" |> count'

[[case]]
id = "correction/bash/b13-ls"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "ls without -a hides hidden entries."
method = "correct"
program = "ls /home/user/app"

[case.expect]
program = 'list "/home/user/app" hidden: false'

[[case]]
id = "correction/bash/b13-ls-la"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "ls -la shows hidden entries, the default of list."
method = "correct"
program = "ls -la /home/user/app"

[case.expect]
program = 'list "/home/user/app"'

[[case]]
id = "correction/bash/b13-ls-glob"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "ls with a glob finds entries of one directory level."
method = "correct"
program = "ls /home/user/app/*.go"

[case.expect]
program = 'find "/home/user/app" glob: "*.go" depth: 1'

[[case]]
id = "correction/bash/b14-find-name"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "find -name matches the name at any depth."
method = "correct"
program = 'find /home/user/app -name "*.go"'

[case.expect]
program = 'find "/home/user/app" glob: "**/*.go"'

[[case]]
id = "correction/bash/b14-find-type-f"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "find -type f selects files."
method = "correct"
program = 'find /home/user/app -name "*.md" -type f'

[case.expect]
program = 'find "/home/user/app" glob: "**/*.md" type: file'

[[case]]
id = "correction/bash/b14-find-type-d"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "find -type d selects directories."
method = "correct"
program = 'find /home/user/app -name "node_modules" -type d'

[case.expect]
program = 'find "/home/user/app" glob: "**/node_modules" type: directory'

[[case]]
id = "correction/bash/b14-find-maxdepth"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "find -maxdepth K is depth K."
method = "correct"
program = 'find /home/user/app -maxdepth 2 -name "*.json"'

[case.expect]
program = 'find "/home/user/app" glob: "**/*.json" depth: 2'

[[case]]
id = "correction/bash/b14-find-mtime"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "find -mtime -N keeps entries modified in the last N days."
method = "correct"
program = 'find /home/user/app -name "*.log" -mtime -7'

[case.expect]
program = 'find "/home/user/app" glob: "**/*.log" |> filter modified > ago(7d)'

[[case]]
id = "correction/bash/b14-find-iname"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "find -iname matches without letter case."
method = "correct"
program = 'find /home/user/app -iname "readme*"'

[case.expect]
program = 'find "/home/user/app" glob: "**/readme*" case_sensitive: false'

[[case]]
id = "correction/bash/b14-find-delete"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "find -delete removes exactly the found entries."
method = "correct"
program = 'find /home/user/app -name "*.tmp" -delete'

[case.expect]
program = 'find "/home/user/app" glob: "**/*.tmp" |> remove'

[[case]]
id = "correction/bash/b15-grep-literal"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "grep -rn with a pattern without special characters searches the text; recursion and line numbers are the defaults."
method = "correct"
program = 'grep -rn "TODO" /home/user/app/src'

[case.expect]
program = 'search "TODO" "/home/user/app/src"'

[[case]]
id = "correction/bash/b15-grep-basic-regex-read"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "A basic regular expression with a literal parenthesis is read as text in a reading program; the regular expression is the alternative."
method = "correct"
program = 'grep -rn "oldName(" /home/user/app/src'

[case.expect]
program = 'search "oldName(" "/home/user/app/src"'
corrections = [{ rule = "B15", class = "P" }]

[[case]]
id = "correction/bash/b15-grep-i"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "grep -i searches without letter case."
method = "correct"
program = "grep -i todo /home/user/app/a.txt"

[case.expect]
program = 'search "todo" "/home/user/app/a.txt" case_sensitive: false'

[[case]]
id = "correction/bash/b15-grep-v"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "grep -v keeps the lines that do not match."
method = "correct"
program = "grep -v DEBUG /home/user/app/a.log"

[case.expect]
program = 'search "DEBUG" "/home/user/app/a.log" invert: true'

[[case]]
id = "correction/bash/b15-grep-w"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "grep -w matches whole words."
method = "correct"
program = "grep -w id /home/user/app/a.go"

[case.expect]
program = 'search "id" "/home/user/app/a.go" whole_word: true'

[[case]]
id = "correction/bash/b15-grep-context"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "grep -C N shows N lines of context."
method = "correct"
program = "grep -C 2 panic /home/user/app/a.log"

[case.expect]
program = 'search "panic" "/home/user/app/a.log" context: 2'

[[case]]
id = "correction/bash/b15-grep-l"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "grep -l lists the matching files."
method = "correct"
program = "grep -rl TODO /home/user/app"

[case.expect]
program = 'search "TODO" "/home/user/app" output: files'

[[case]]
id = "correction/bash/b15-grep-c"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "grep -c counts the matches per file."
method = "correct"
program = "grep -c TODO /home/user/app/a.go"

[case.expect]
program = 'search "TODO" "/home/user/app/a.go" output: counts'

[[case]]
id = "correction/bash/b15-grep-e"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "grep -E with an alternation is a regular expression."
method = "correct"
program = 'grep -E "error|warning" /home/user/app/a.log'

[case.expect]
program = 'search /error|warning/ "/home/user/app/a.log"'

[[case]]
id = "correction/bash/b15-grep-fixed"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "grep -F searches the pattern as text."
method = "correct"
program = 'grep -F "a.b[0]" /home/user/app/a.txt'

[case.expect]
program = 'search "a.b[0]" "/home/user/app/a.txt"'

[[case]]
id = "correction/bash/b16-sed-substitute"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "sed -i reads its pattern as a basic regular expression; in a change the readings are offered, not applied."
method = "correct"
program = "sed -i 's/old(/new(/g' /home/user/app/a.go"

[case.expect.error]
code = "E_AMBIGUOUS"
candidates = [
  { program = 'replace "old(" "new(" in: ["/home/user/app/a.go"]' },
  { program = 'replace /old\(/ "new(" in: ["/home/user/app/a.go"]' },
]

[[case]]
id = "correction/bash/b16-sed-plain-word"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Every sed substitution in a change is a probable reading and is offered, not applied."
method = "correct"
program = "sed -i 's/foo/bar/g' /home/user/app/a.txt"

[case.expect.error]
code = "E_AMBIGUOUS"

[[case]]
id = "correction/bash/b16-sed-first-only"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "A substitution without g replaces the first occurrence; the program is offered with the pattern anchored to the first match of a line."
method = "correct"
program = "sed -i 's/foo/bar/' /home/user/app/a.txt"

[case.expect.error]
code = "E_AMBIGUOUS"

[[case]]
id = "correction/bash/b17-sed-print-range"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "sed -n 'A,Bp' reads a range of lines."
method = "correct"
program = "sed -n '5,10p' /home/user/app/a.txt"

[case.expect]
program = 'read "/home/user/app/a.txt" lines: 5..10'

[[case]]
id = "correction/bash/b17-sed-delete-line"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "sed -i 'Nd' removes one line."
method = "correct"
program = "sed -i '3d' /home/user/app/a.txt"

[case.expect]
program = 'lines "/home/user/app/a.txt" 3 |> remove'

[[case]]
id = "correction/bash/b17-sed-delete-pattern"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Removing lines by a basic regular expression in a change is offered, not applied."
method = "correct"
program = "sed -i '/DEBUG/d' /home/user/app/a.log"

[case.expect.error]
code = "E_AMBIGUOUS"

[[case]]
id = "correction/bash/b17-sed-other-script"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Other sed scripts are not translated."
method = "correct"
program = "sed -e 'y/abc/xyz/' /home/user/app/a.txt"

[case.expect.error]
code = "E_UNCORRECTABLE"

[[case]]
id = "correction/bash/b18-awk-program"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "An awk program beyond printing fields is not translated."
method = "correct"
program = "awk 'BEGIN { s = 0 } { s += $1 } END { print s }' /home/user/app/a.txt"

[case.expect.error]
code = "E_UNCORRECTABLE"

[[case]]
id = "correction/bash/b19-echo-overwrite"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "echo with > writes the text and a line ending."
method = "correct"
program = 'echo "hello" > /home/user/app/a.txt'

[case.expect]
program = 'write "/home/user/app/a.txt" "hello\n" mode: overwrite'

[[case]]
id = "correction/bash/b19-echo-append"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "echo with >> appends."
method = "correct"
program = 'echo "dist/" >> /home/user/app/.gitignore'

[case.expect]
program = 'write "/home/user/app/.gitignore" "dist/\n" mode: append'

[[case]]
id = "correction/bash/b19-echo-n"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "echo -n writes no line ending."
method = "correct"
program = 'echo -n "x" > /home/user/app/a.txt'

[case.expect]
program = 'write "/home/user/app/a.txt" "x" mode: overwrite'

[[case]]
id = "correction/bash/b19-tee"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "echo piped to tee writes the file."
method = "correct"
program = 'echo "x" | tee /home/user/app/a.txt'

[case.expect]
program = 'write "/home/user/app/a.txt" "x\n" mode: overwrite'

[[case]]
id = "correction/bash/b20-cd-and-run"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "cd to an absolute directory before a program is its working directory."
method = "correct"
program = "cd /home/user/app && go test ./..."

[case.expect]
program = 'run ["go", "test", "./..."] cwd: "/home/user/app"'

[[case]]
id = "correction/bash/b20-cd-semicolon"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "cd followed by a semicolon is treated like cd followed by &&."
method = "correct"
program = "cd /home/user/app; make build"

[case.expect]
program = 'run ["make", "build"] cwd: "/home/user/app"'

[[case]]
id = "correction/bash/b20-cd-and-cat"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Relative paths after cd to an absolute directory are resolved against it."
method = "correct"
program = "cd /home/user/app && cat README.md"

[case.expect]
program = 'read "/home/user/app/README.md"'

[[case]]
id = "correction/bash/b20-relative-cd"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "cd to a relative directory has no base and is not translated."
method = "correct"
program = "cd src && make"

[case.expect.error]
code = "E_UNCORRECTABLE"

[[case]]
id = "correction/bash/b22-two-changes-and"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Two changing commands joined by && are two steps; neither runs."
method = "correct"
program = "mkdir /home/user/out && cp -r /home/user/app/dist /home/user/out"

[case.expect.error]
code = "E_ONE_EFFECT"

[[case]]
id = "correction/bash/b22-read-and-change"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "A reading and a changing command joined by && are two steps."
method = "correct"
