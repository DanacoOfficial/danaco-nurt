format = "nurt-conformance-cases/1"

[[case]]
id = "correction/values/v01-ascending"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "The value ascending of order is asc."
method = "correct"
program = 'list "/home/user/app" order: ascending'

[case.expect]
program = 'list "/home/user/app" order: asc'
corrections = [{ rule = "V01" }]

[[case]]
id = "correction/values/v01-descending"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "The value descending of order is desc."
method = "correct"
program = 'find "/home/user/app" |> sort size order: descending'

[case.expect]
program = 'find "/home/user/app" |> sort size order: desc'

[[case]]
id = "correction/values/v01-signal-term"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "The signal term is terminate; the changing stage and its input are unchanged."
method = "correct"
program = 'processes name: "sleep" |> stop signal: term'

[case.expect]
program = 'processes name: "sleep" |> stop signal: terminate'

[[case]]
id = "correction/values/v01-typo-name"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "A typing error in an enumeration value is corrected when one value is within the threshold."
method = "correct"
program = 'list "/home/user/app" sort: nmae'

[case.expect]
program = 'list "/home/user/app" sort: name'
corrections = [{ rule = "V01", class = "F", from = "nmae", to = "name" }]

[[case]]
id = "correction/values/v01-typo-file"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "The value fiel of type is file."
method = "correct"
program = 'find "/home/user/app" type: fiel'

[case.expect]
program = 'find "/home/user/app" type: file'
corrections = [{ rule = "V01", class = "F", from = "fiel", to = "file" }]

[[case]]
id = "correction/values/v01-on-conflict-typo-in-change"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "A mode value of a change is corrected only on an unambiguous hit."
method = "correct"
program = 'copy "/home/user/a.txt" to: "/home/user/b.txt" on_conflict: skpi'

[case.expect]
program = 'copy "/home/user/a.txt" to: "/home/user/b.txt" on_conflict: skip'
corrections = [{ rule = "V01", class = "F", from = "skpi", to = "skip" }]

[[case]]
id = "correction/values/v01-tie-uncorrected"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "A value equally close to asc and desc is not corrected."
method = "correct"
program = 'list "/home/user/app" order: dsc'

[case.expect.error]
code = "E_UNKNOWN_VALUE"

[[case]]
id = "correction/values/v01-create-type-not-guessed"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "A value of type in create that matches no value within the threshold is not guessed."
method = "correct"
program = 'create "/home/user/app/out" type: block'

[case.expect.error]
code = "E_UNKNOWN_VALUE"

