class = "mandatory"
language = "1.0"
summary = "The field mtime is modified."
method = "correct"
program = 'find "/home/user/app" |> filter mtime > ago(1h)'

[case.expect]
program = 'find "/home/user/app" |> filter modified > ago(1h)'
corrections = [{ rule = "V02" }]

