corrections = [{ rule = "V02", class = "F", from = "sise", to = "size" }]

[[case]]
id = "correction/values/v02-several-fields"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Value and field names of one pipeline are corrected together."
method = "correct"
program = 'find "/home/user/app" type: dir |> filter mtime > ago(1h) |> sort length order: ascending'

[case.expect]
program = 'find "/home/user/app" type: directory |> filter modified > ago(1h) |> sort size order: asc'

[[case]]
id = "correction/values/v03-lowercase"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "The function lowercase is lower."
method = "correct"
program = 'find "/home/user/app" |> filter lowercase(name) == "readme.md"'

[case.expect]
program = 'find "/home/user/app" |> filter lower(name) == "readme.md"'
corrections = [{ rule = "V03" }]

[[case]]
id = "correction/values/v03-length-function"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "The function length is len."
method = "correct"
program = 'find "/home/user/app" |> filter length(name) > 20'

[case.expect]
program = 'find "/home/user/app" |> filter len(name) > 20'

[[case]]
id = "correction/values/v04-let-name"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "A reference one edit from a let name of the program is that name."
method = "correct"
program = """
let changed = find "/home/user/app/src" glob: "**/*.ts" |> filter modified > ago(1h)
@chnaged |> count"""

[case.expect]
program = """
let changed = find "/home/user/app/src" glob: "**/*.ts" |> filter modified > ago(1h)
@changed |> count"""
corrections = [{ rule = "V04", class = "F", from = "chnaged", to = "changed" }]

[[case]]
id = "correction/values/v04-unknown-name"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "A reference far from every let name is not corrected."
method = "correct"
program = """
let changed = find "/home/user/app/src" glob: "**/*.ts"
@other |> count"""

[case.expect.error]
code = "E_UNKNOWN_NAME"
