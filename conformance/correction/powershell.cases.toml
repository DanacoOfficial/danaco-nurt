format = "nurt-conformance-cases/1"

[[case]]
id = "correction/powershell/p01-get-childitem"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Get-ChildItem without -Recurse lists one directory level."
method = "correct"
program = "Get-ChildItem -Path /home/user/app"

[case.expect]
program = 'list "/home/user/app"'

[[case]]
id = "correction/powershell/p01-gci"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "The alias gci with a positional path lists the directory."
method = "correct"
program = "gci /home/user/app"

[case.expect]
program = 'list "/home/user/app"'

[[case]]
id = "correction/powershell/p01-lower-case-cmdlet"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Cmdlet names are recognised without letter case."
method = "correct"
program = "get-childitem -path /home/user/app"

[case.expect]
program = 'list "/home/user/app"'

[[case]]
id = "correction/powershell/p02-recurse-filter-file"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Get-ChildItem -Recurse -File -Filter finds files at any depth."
method = "correct"
program = 'Get-ChildItem -Path /home/user/app -Recurse -File -Filter "*.go"'

[case.expect]
program = 'find "/home/user/app" glob: "**/*.go" type: file'

[[case]]
id = "correction/powershell/p02-recurse-directory"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Get-ChildItem -Recurse -Directory finds directories."
method = "correct"
program = 'Get-ChildItem -Path /home/user/app -Recurse -Directory -Filter "test*"'

[case.expect]
program = 'find "/home/user/app" glob: "**/test*" type: directory'

[[case]]
id = "correction/powershell/p02-depth"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Get-ChildItem -Depth K limits the depth."
method = "correct"
program = 'Get-ChildItem -Path /home/user/app -Recurse -File -Filter "*.json" -Depth 2'

[case.expect]
program = 'find "/home/user/app" glob: "**/*.json" type: file depth: 2'

[[case]]
id = "correction/powershell/p02-force"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Get-ChildItem -Force includes hidden entries."
method = "correct"
program = 'Get-ChildItem -Path /home/user/app -Recurse -File -Filter "*.env" -Force'

[case.expect]
program = 'find "/home/user/app" glob: "**/*.env" type: file hidden: true'

[[case]]
id = "correction/powershell/p02-name"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Get-ChildItem -Name returns only names."
method = "correct"
program = 'Get-ChildItem -Path /home/user/app -Recurse -File -Filter "*.md" -Name'

[case.expect]
program = 'find "/home/user/app" glob: "**/*.md" type: file |> select name'

[[case]]
id = "correction/powershell/p03-get-content"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Get-Content reads a file."
method = "correct"
program = "Get-Content /home/user/app/a.txt"

[case.expect]
program = 'read "/home/user/app/a.txt"'

[[case]]
id = "correction/powershell/p03-tail"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Get-Content -Tail N reads the last N lines."
method = "correct"
program = "Get-Content -Path /home/user/app/a.log -Tail 20"

[case.expect]
program = 'read "/home/user/app/a.log" last: 20'

[[case]]
id = "correction/powershell/p03-total-count"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Get-Content -TotalCount N reads the first N lines."
method = "correct"
program = "Get-Content -Path /home/user/app/a.log -TotalCount 5"

[case.expect]
program = 'read "/home/user/app/a.log" lines: ..5'

[[case]]
id = "correction/powershell/p03-raw"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Get-Content -Raw reads the whole text, the default of read."
method = "correct"
program = "Get-Content /home/user/app/a.txt -Raw"

[case.expect]
program = 'read "/home/user/app/a.txt"'

[[case]]
id = "correction/powershell/p03-encoding"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Get-Content -Encoding sets the encoding."
method = "correct"
program = "Get-Content /home/user/app/legacy.txt -Encoding utf8"

[case.expect]
program = 'read "/home/user/app/legacy.txt" encoding: "utf8"'

[[case]]
id = "correction/powershell/p03-gc"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "The alias gc reads a file."
method = "correct"
program = "gc /home/user/app/a.txt"

[case.expect]
program = 'read "/home/user/app/a.txt"'

[[case]]
id = "correction/powershell/p04-set-content"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Set-Content overwrites a file with the value."
method = "correct"
program = 'Set-Content -Path /home/user/app/a.txt -Value "x"'

[case.expect]
program = 'write "/home/user/app/a.txt" "x" mode: overwrite'

[[case]]
id = "correction/powershell/p04-add-content"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Add-Content appends the value."
method = "correct"
program = 'Add-Content -Path /home/user/app/a.txt -Value "x"'

[case.expect]
program = 'write "/home/user/app/a.txt" "x" mode: append'

[[case]]
id = "correction/powershell/p04-out-file"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "A text piped to Out-File overwrites the file."
method = "correct"
program = '"x" | Out-File /home/user/app/a.txt'

[case.expect]
program = 'write "/home/user/app/a.txt" "x" mode: overwrite'

[[case]]
id = "correction/powershell/p04-out-file-append"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Out-File -Append appends."
method = "correct"
program = '"x" | Out-File /home/user/app/a.txt -Append'

[case.expect]
program = 'write "/home/user/app/a.txt" "x" mode: append'

[[case]]
id = "correction/powershell/p05-select-string"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Select-String searches a regular expression without letter case, as PowerShell does by default."
method = "correct"
program = 'Select-String -Pattern "TODO" -Path /home/user/app/a.txt'

[case.expect]
program = 'search /TODO/ "/home/user/app/a.txt" case_sensitive: false'

[[case]]
id = "correction/powershell/p05-case-sensitive"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Select-String -CaseSensitive keeps the default of search."
method = "correct"
program = 'Select-String -Pattern "TODO" -Path /home/user/app/a.txt -CaseSensitive'

[case.expect]
program = 'search /TODO/ "/home/user/app/a.txt"'

[[case]]
id = "correction/powershell/p05-not-match"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Select-String -NotMatch inverts the match."
method = "correct"
program = 'Select-String -Pattern "DEBUG" -Path /home/user/app/a.log -NotMatch'

[case.expect]
program = 'search /DEBUG/ "/home/user/app/a.log" case_sensitive: false invert: true'

[[case]]
id = "correction/powershell/p05-list"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Select-String -List returns the matching files."
method = "correct"
program = 'Select-String -Pattern "TODO" -Path /home/user/app/a.txt -List'

[case.expect]
program = 'search /TODO/ "/home/user/app/a.txt" case_sensitive: false output: files'

[[case]]
id = "correction/powershell/p05-context"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Select-String -Context a,b sets lines before and after."
method = "correct"
program = 'Select-String -Pattern "panic" -Path /home/user/app/a.log -Context 2,3'

[case.expect]
program = 'search /panic/ "/home/user/app/a.log" case_sensitive: false before: 2 after: 3'

[[case]]
id = "correction/powershell/p06-copy-item"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Copy-Item copies to the destination."
method = "correct"
program = "Copy-Item -Path /home/user/a.txt -Destination /home/user/b.txt"

[case.expect]
program = 'copy "/home/user/a.txt" to: "/home/user/b.txt"'

[[case]]
id = "correction/powershell/p06-copy-recurse"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Copy-Item -Recurse -Force copies a directory."
method = "correct"
program = "Copy-Item -Path /home/user/app/dist -Destination /home/user/backup -Recurse -Force"

[case.expect]
program = 'copy "/home/user/app/dist" to: "/home/user/backup"'

[[case]]
id = "correction/powershell/p06-cpi"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "The alias cpi copies."
method = "correct"
program = "cpi /home/user/a.txt /home/user/b.txt"

[case.expect]
program = 'copy "/home/user/a.txt" to: "/home/user/b.txt"'

[[case]]
id = "correction/powershell/p07-move-item"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Move-Item moves to the destination."
method = "correct"
program = "Move-Item -Path /home/user/a.txt -Destination /home/user/archive/a.txt"

[case.expect]
program = 'move "/home/user/a.txt" to: "/home/user/archive/a.txt"'

[[case]]
id = "correction/powershell/p07-mi"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "The alias mi moves."
method = "correct"
program = "mi /home/user/a.txt /home/user/b.txt"

[case.expect]
program = 'move "/home/user/a.txt" to: "/home/user/b.txt"'

[[case]]
id = "correction/powershell/p08-remove-item"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Remove-Item -Recurse -Force removes a directory; recursion is the default."
method = "correct"
program = "Remove-Item -Path /home/user/app/build -Recurse -Force"

[case.expect]
program = 'remove "/home/user/app/build"'

[[case]]
id = "correction/powershell/p08-ri"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "The alias ri removes."
method = "correct"
program = "ri /home/user/app/old.log"

[case.expect]
program = 'remove "/home/user/app/old.log"'

[[case]]
id = "correction/powershell/p08-rd"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "The alias rd removes a directory."
method = "correct"
program = "rd /home/user/app/tmp -Recurse"

[case.expect]
program = 'remove "/home/user/app/tmp"'

[[case]]
id = "correction/powershell/p09-new-directory"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "New-Item -ItemType Directory creates a directory."
method = "correct"
program = "New-Item -ItemType Directory -Path /home/user/app/out"

[case.expect]
program = 'create "/home/user/app/out" type: directory'

[[case]]
id = "correction/powershell/p09-new-file"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "New-Item -ItemType File creates a file."
method = "correct"
program = "New-Item -ItemType File -Path /home/user/app/a.txt"

[case.expect]
program = 'create "/home/user/app/a.txt" type: file'

[[case]]
id = "correction/powershell/p09-new-link"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "New-Item -ItemType SymbolicLink creates a link."
method = "correct"
program = "New-Item -ItemType SymbolicLink -Path /home/user/link -Target /home/user/app/src"

[case.expect]
program = 'create "/home/user/link" type: link target: "/home/user/app/src"'

[[case]]
id = "correction/powershell/p10-rename-item"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Rename-Item gives an entry a new name in the same directory."
method = "correct"
program = "Rename-Item -Path /home/user/a.txt -NewName b.txt"

[case.expect]
program = 'rename path: "/home/user/a.txt" to: "b.txt"'

[[case]]
id = "correction/powershell/p11-test-path"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Test-Path describes the path, including its existence."
method = "correct"
program = "Test-Path /home/user/app/a.txt"

[case.expect]
program = 'info "/home/user/app/a.txt"'

[[case]]
id = "correction/powershell/p11-test-path-leaf"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Test-Path -PathType Leaf asserts that the path is a file."
method = "correct"
program = "Test-Path /home/user/app/a.txt -PathType Leaf"

[case.expect]
program = 'info "/home/user/app/a.txt" |> assert all: type == "file"'

[[case]]
id = "correction/powershell/p12-get-item"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Get-Item describes the path."
method = "correct"
program = "Get-Item /home/user/app/a.txt"

[case.expect]
program = 'info "/home/user/app/a.txt"'

[[case]]
id = "correction/powershell/p12-get-itemproperty-registry"
kind = "correction"
class = "mandatory"
language = "1.0"
requires = ["os:windows"]
summary = "Get-ItemProperty of a registry value reads it through the registry provider."
method = "correct"
program = 'Get-ItemProperty -Path HKCU:\Software\Example -Name Mode'

[case.expect]
program = 'read "registry:/HKCU/Software/Example/Mode"'

[[case]]
id = "correction/powershell/p13-set-itemproperty-registry"
kind = "correction"
class = "mandatory"
language = "1.0"
requires = ["os:windows"]
summary = "Set-ItemProperty of a registry value writes it with its value type."
method = "correct"
program = 'Set-ItemProperty -Path HKCU:\Software\Example -Name Mode -Value 3 -Type DWord'

[case.expect]
program = 'write "registry:/HKCU/Software/Example/Mode" "3" value_type: dword mode: overwrite'

[[case]]
id = "correction/powershell/p14-get-acl"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Get-Acl describes the path with its access control entries."
method = "correct"
program = "Get-Acl /home/user/app/a.txt"

[case.expect]
program = 'info "/home/user/app/a.txt"'

[[case]]
id = "correction/powershell/p14-set-acl"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Set-Acl with an object is not translated."
method = "correct"
program = "Set-Acl -Path /home/user/app/a.txt -AclObject $acl"

[case.expect.error]
code = "E_UNCORRECTABLE"

[[case]]
id = "correction/powershell/p15-where-length"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Where-Object with Length -gt is a filter on size."
method = "correct"
program = 'Get-ChildItem -Path /home/user/app -Recurse -File -Filter "*.log" | Where-Object { $_.Length -gt 1MB }'

[case.expect]
program = 'find "/home/user/app" glob: "**/*.log" type: file |> filter size > 1mb'

[[case]]
id = "correction/powershell/p15-where-name-and"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "Comparisons joined by -and are one condition."
method = "correct"
program = 'Get-ChildItem -Path /home/user/app -Recurse -File -Filter "*.log" | Where-Object { $_.Length -gt 1KB -and $_.Name -ne "keep.log" }'

[case.expect]
program = 'find "/home/user/app" glob: "**/*.log" type: file |> filter size > 1kb and name != "keep.log"'

[[case]]
id = "correction/powershell/p15-question-mark"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "The alias ? is Where-Object."
method = "correct"
program = 'Get-ChildItem -Path /home/user/app -Recurse -File -Filter "*" | ? { $_.Name -eq "main.go" }'

[case.expect]
program = 'find "/home/user/app" glob: "**/*" type: file |> filter name == "main.go"'

[[case]]
id = "correction/powershell/p15-script-block"
kind = "correction"
class = "mandatory"
language = "1.0"
summary = "A script block beyond comparisons of fields is not translated."
method = "correct"
program = 'Get-ChildItem -Path /home/user/app | Where-Object { Test-Path ($_.FullName + ".bak") }'

[case.expect.error]
code = "E_UNCORRECTABLE"

