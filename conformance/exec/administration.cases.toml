# clock

[[case]]
id = "exec/administration/clock.set/preview"
kind = "exec"
class = "optional:administration"
summary = "A preview of clock.set plans the new time of the system clock and does not set it."
fs_before = { entries = [] }
program = 'clock.set "2030-01-01T00:00:00Z"'
options = { preview = true }
expect = { report = { status = "planned", kind = "clock.set" } }

[[case]]
id = "exec/administration/clock.timezone_set/preview"
kind = "exec"
class = "optional:administration"
summary = "A preview of clock.timezone_set plans the new time zone and does not set it."
fs_before = { entries = [] }
program = 'clock.timezone_set "Europe/Warsaw"'
options = { preview = true }
expect = { report = { status = "planned", kind = "clock.timezone_set" } }

[[case]]
id = "exec/administration/clock.ntp/preview"
kind = "exec"
class = "optional:administration"
summary = "A preview of clock.ntp plans the change of the time synchronization and does not change it."
fs_before = { entries = [] }
program = "clock.ntp state: on"
options = { preview = true }
expect = { report = { status = "planned", kind = "clock.ntp" } }

[[case]]
id = "exec/administration/clock.ntp/unknown-state"
kind = "exec"
class = "optional:administration"
summary = "clock.ntp with a value other than on and off fails with E_UNKNOWN_VALUE before anything runs."
fs_before = { entries = [] }
program = "clock.ntp state: maybe"
expect = { report = { status = "failed", error = { code = "E_UNKNOWN_VALUE" } } }

# power

[[case]]
id = "exec/administration/power.shutdown/preview"
kind = "exec"
class = "optional:administration"
summary = "A preview of power.shutdown plans the shutdown and does not shut the system down."
fs_before = { entries = [] }
program = "power.shutdown delay: 5m"
options = { preview = true }
expect = { report = { status = "planned", kind = "power.shutdown" } }

[[case]]
id = "exec/administration/power.restart/preview"
kind = "exec"
class = "optional:administration"
summary = "A preview of power.restart plans the restart and does not restart the system."
fs_before = { entries = [] }
program = "power.restart delay: 5m"
options = { preview = true }
expect = { report = { status = "planned", kind = "power.restart" } }

[[case]]
id = "exec/administration/power.restart/at-and-delay"
kind = "exec"
class = "optional:administration"
summary = "power.restart with at and delay together fails with E_PARAM_CONFLICT."
fs_before = { entries = [] }
program = 'power.restart delay: 5m at: "2030-01-01T00:00:00Z"'
options = { preview = true }
expect = { report = { status = "failed", kind = "power.restart", error = { code = "E_PARAM_CONFLICT" } } }

[[case]]
id = "exec/administration/power.cancel/preview"
kind = "exec"
class = "optional:administration"
summary = "A preview of power.cancel plans the cancellation of a scheduled shutdown and cancels nothing."
fs_before = { entries = [] }
program = "power.cancel"
options = { preview = true }
expect = { report = { status = "planned", kind = "power.cancel" } }

