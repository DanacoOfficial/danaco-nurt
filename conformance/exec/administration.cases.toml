format = "nurt-conformance-cases/1"

# Group administration. The cases change nothing in the system: a call that
# the program checks before it runs ends with an error of the program, and a
# call that would change the system runs as a preview (`preview = true`) or
# names an account, a group, a mount point or a kernel parameter that does not
# exist. The cases of the commands that need a firewall, a routing table or a
# disk of the host state the rule of the parameters only.

# accounts

[[case]]
id = "exec/administration/accounts.create/preview"
kind = "exec"
class = "optional:administration"
summary = "A preview of accounts.create plans the new account and creates nothing."
fs_before = { entries = [] }
program = 'accounts.create "nurt-conformance-absent"'
options = { preview = true }
expect = { report = { status = "planned", kind = "accounts.create" } }

[[case]]
id = "exec/administration/accounts.modify/unknown-account"
kind = "exec"
class = "optional:administration"
summary = "accounts.modify of an account that does not exist fails with E_NOT_FOUND."
fs_before = { entries = [] }
program = 'accounts.modify "nurt-conformance-absent" shell: "/bin/sh"'
options = { preview = true }
expect = { report = { status = "failed", kind = "accounts.modify", error = { code = "E_NOT_FOUND" } } }

[[case]]
id = "exec/administration/accounts.password/unknown-account"
kind = "exec"
class = "optional:administration"
summary = "accounts.password of an account that does not exist fails with E_NOT_FOUND."
fs_before = { entries = [] }
program = 'accounts.password "nurt-conformance-absent" "secret"'
options = { preview = true }
expect = { report = { status = "failed", kind = "accounts.password", error = { code = "E_NOT_FOUND" } } }

[[case]]
id = "exec/administration/accounts.remove/unknown-account"
kind = "exec"
class = "optional:administration"
summary = "accounts.remove of an account that does not exist fails with E_NOT_FOUND."
fs_before = { entries = [] }
program = 'accounts.remove "nurt-conformance-absent"'
options = { preview = true }
expect = { report = { status = "failed", kind = "accounts.remove", error = { code = "E_NOT_FOUND" } } }

