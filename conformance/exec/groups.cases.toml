format = "nurt-conformance-cases/1"

# documents

[[case]]
id = "exec/documents/set/json-layout"
kind = "exec"
summary = "set changes one key of a JSON document and keeps indentation and key order."
fs_before = { entries = [{ path = "package.json", type = "file", content_utf8 = "{\n    \"name\": \"app\",\n    \"scripts\": {\n        \"test\": \"jest\"\n    }\n}\n" }] }
program = 'set "package.json" key: "scripts.test" value: "vitest"'
fs_after = { entries = [{ path = "package.json", type = "file", content_utf8 = "{\n    \"name\": \"app\",\n    \"scripts\": {\n        \"test\": \"vitest\"\n    }\n}\n" }] }
expect = { report = { status = "ok", kind = "set" } }

[[case]]
id = "exec/documents/set/toml-comments"
kind = "exec"
summary = "set changes a TOML value and keeps the comments."
fs_before = { entries = [{ path = "Cargo.toml", type = "file", content_utf8 = "[package]\n# release\nversion = \"0.3.0\" # current\n" }] }
program = 'set "Cargo.toml" key: "package.version" value: "0.4.0"'
fs_after = { entries = [{ path = "Cargo.toml", type = "file", content_utf8 = "[package]\n# release\nversion = \"0.4.0\" # current\n" }] }
expect = { report = { status = "ok" } }

[[case]]
id = "exec/documents/query/jq-filter"
kind = "exec"
summary = "query applies a jq filter to a document."
fs_before = { entries = [{ path = "p.json", type = "file", content_utf8 = "{\"name\": \"app\", \"deps\": [\"a\", \"b\"]}\n" }] }
program = 'query ".deps | length" path: "p.json"'
fs_after = "unchanged"
expect = { report = { status = "ok", kind = "query", records = { matched = 1 } } }

[[case]]
id = "exec/documents/query/invalid-filter"
kind = "exec"
summary = "query with a filter that does not compile fails with E_QUERY."
fs_before = { entries = [{ path = "p.json", type = "file", content_utf8 = "{}\n" }] }
program = 'query ".[" path: "p.json"'
expect = { report = { status = "failed", error = { code = "E_QUERY" } } }

[[case]]
id = "exec/documents/sql/create-and-select"
kind = "exec"
summary = "sql with write true changes a database; a later read-only query returns its rows."
fs_before = { entries = [] }

[[case.step]]
program = "sql \"app.db\" \"create table users(id integer, name text); insert into users values (1, 'ann')\" write: true"
expect = { report = { status = "ok" } }

[[case.step]]
program = 'sql "app.db" "select id, name from users where id = ?" params: [1]'
expect = { report = { status = "ok", kind = "sql", records = { type = "row", matched = 1 } } }

[[case]]
id = "exec/documents/sql/write-without-flag"
kind = "exec"
summary = "sql that changes data without write true fails with E_SQL and changes nothing."
fs_before = { entries = [] }

[[case.step]]
program = 'sql "app.db" "create table t(x)" write: true'

[[case.step]]
program = 'sql "app.db" "insert into t values (1)"'
expect = { report = { status = "failed", error = { code = "E_SQL" } } }

[[case]]
id = "exec/documents/sql/named-params"
kind = "exec"
summary = "sql binds a map of values to the named placeholders of a statement."
fs_before = { entries = [] }

[[case.step]]
program = "sql \"app.db\" \"create table users(id integer, name text); insert into users values (1, 'ann'), (2, 'bob')\" write: true"

[[case.step]]
program = 'sql "app.db" "select id from users where name = :name" params: {name: "bob"}'
expect = { report = { status = "ok", kind = "sql", records = { type = "row", matched = 1 } } }

[[case]]
id = "exec/documents/sql/rows-changed"
kind = "exec"
summary = "The change of a database written by sql reports the number of rows inserted."
fs_before = { entries = [] }

[[case.step]]
program = 'sql "app.db" "create table t(x integer)" write: true'

[[case.step]]
program = 'sql "app.db" "insert into t values (1), (2), (3)" write: true'
expect = { report = { status = "ok", kind = "sql", changes = [{ rows_changed = 3 }] } }

# text

[[case]]
id = "exec/text/diff/two-files"
kind = "exec"
summary = "diff returns the hunks between two files."
fs_before = { entries = [
  { path = "a.txt", type = "file", content_utf8 = "one\ntwo\n" },
  { path = "b.txt", type = "file", content_utf8 = "one\nTWO\n" },
] }
program = 'diff "a.txt" "b.txt"'
fs_after = "unchanged"
expect = { report = { status = "ok", kind = "diff", records = { type = "hunk", matched = 1 } } }

[[case]]
id = "exec/text/diff/identical"
kind = "exec"
summary = "diff of identical files returns no hunks."
fs_before = { entries = [
  { path = "a.txt", type = "file", content_utf8 = "x\n" },
  { path = "b.txt", type = "file", content_utf8 = "x\n" },
] }
program = 'diff "a.txt" "b.txt"'
expect = { report = { status = "ok", records = { matched = 0 } } }

[[case]]
id = "exec/text/patch/apply"
kind = "exec"
summary = "patch applies a unified difference under a root."
fs_before = { entries = [{ path = "a.txt", type = "file", content_utf8 = "one\ntwo\n" }] }
program = 'patch "--- a/a.txt\n+++ b/a.txt\n@@ -1,2 +1,2 @@\n one\n-two\n+TWO\n" root: "${base}" strip: 1'
fs_after = { entries = [{ path = "a.txt", type = "file", content_utf8 = "one\nTWO\n" }] }
expect = { report = { status = "ok", kind = "patch" } }

[[case]]
id = "exec/text/patch/rejected"
kind = "exec"
summary = "A hunk that does not apply fails with E_PATCH_REJECTED and changes nothing."
fs_before = { entries = [{ path = "a.txt", type = "file", content_utf8 = "one\nthree\n" }] }
program = 'patch "--- a/a.txt\n+++ b/a.txt\n@@ -1,2 +1,2 @@\n one\n-two\n+TWO\n" root: "${base}" strip: 1'
fs_after = "unchanged"
expect = { report = { status = "failed", error = { code = "E_PATCH_REJECTED" } } }

[[case]]
id = "exec/text/hash/sha256"
kind = "exec"
summary = "hash computes SHA-256 by default."
fs_before = { entries = [{ path = "h.txt", type = "file", content_utf8 = "hello\n" }] }
program = 'hash "h.txt"'
expect = { report = { status = "ok", kind = "hash", records = { rows = [
  { kind = "entry", fields = { hash = { t = "text", v = "sha256:5891b5b522d5df086d0ff0b110fbd9d21bb4fc7163af34d08286a2e846f6be03" } } },
] } } }

[[case]]
id = "exec/text/convert/crlf-to-lf"
kind = "exec"
summary = "convert changes CRLF line endings to LF and reports it."
fs_before = { entries = [{ path = "w.txt", type = "file", content_utf8 = "a\r\nb\r\n" }] }
program = 'convert "w.txt" line_ending: lf'
fs_after = { entries = [{ path = "w.txt", type = "file", content_utf8 = "a\nb\n" }] }
expect = { report = { status = "ok", kind = "convert", notable = [{ code = "line_ending_changed" }] } }

[[case]]
id = "exec/text/convert/cp1250-to-utf8"
kind = "exec"
summary = "convert changes a Windows-1250 file to UTF-8."
fs_before = { entries = [{ path = "l.txt", type = "file", content_base64 = "jmlsaW5hCg==" }] }
program = 'convert "l.txt" encoding: "utf-8"'
fs_after = { entries = [{ path = "l.txt", type = "file", content_utf8 = "Žilina\n" }] }
expect = { report = { status = "ok", notable = [{ code = "encoding_changed" }] } }

[[case]]
id = "exec/text/convert/unrepresentable"
kind = "exec"
summary = "convert to an encoding that cannot hold a character fails with E_ENCODING."
fs_before = { entries = [{ path = "u.txt", type = "file", content_utf8 = "日本\n" }] }
program = 'convert "u.txt" encoding: "windows-1250"'
fs_after = "unchanged"
expect = { report = { status = "failed", error = { code = "E_ENCODING" } } }

[[case]]
id = "exec/text/evaluate/arithmetic"
kind = "exec"
summary = "evaluate computes an expression with sizes."
fs_before = { entries = [] }
program = "evaluate 1kib + 24b"
expect = { report = { status = "ok", kind = "evaluate" } }

[[case]]
id = "exec/text/group/by-extension"
kind = "exec"
summary = "group counts records per value."
fs_before = { entries = [
  { path = "a.go", type = "file", content_utf8 = "" },
  { path = "b.go", type = "file", content_utf8 = "" },
  { path = "c.md", type = "file", content_utf8 = "" },
] }
program = 'find "." |> group extension'
expect = { report = { status = "ok", records = { type = "group", matched = 2 } } }

[[case]]
id = "exec/text/summarize/size"
kind = "exec"
summary = "summarize computes totals of a field."
fs_before = { entries = [
  { path = "a", type = "file", content_utf8 = "xx" },
  { path = "b", type = "file", content_utf8 = "xxxx" },
] }
program = 'find "." |> summarize size'
expect = { report = { status = "ok", records = { type = "summary", matched = 1 } } }

[[case]]
id = "exec/text/distinct/lines"
kind = "exec"
summary = "distinct keeps one record of each value."
fs_before = { entries = [{ path = "d.txt", type = "file", content_utf8 = "a\nb\na\n" }] }
program = 'lines "d.txt" |> distinct text'
expect = { report = { status = "ok", records = { matched = 2 } } }

[[case]]
id = "exec/text/describe/entries"
kind = "exec"
summary = "describe lists the fields of the input records."
fs_before = { entries = [{ path = "a.txt", type = "file", content_utf8 = "a" }] }
program = 'find "." |> describe'
expect = { report = { status = "ok", records = { type = "field_info" } } }

[[case]]
id = "exec/text/parse/named-groups"
kind = "exec"
summary = "parse extracts fields from named groups."
fs_before = { entries = [{ path = "a.log", type = "file", content_utf8 = "ERROR: disk full\nINFO: ok\n" }] }
program = 'lines "a.log" |> parse /(?P<level>[A-Z]+): (?P<message>.*)/ |> filter level == "ERROR"'
expect = { report = { status = "ok", records = { matched = 1 } } }

[[case]]
id = "exec/text/split/csv"
kind = "exec"
summary = "split divides lines into named columns."
fs_before = { entries = [{ path = "a.csv", type = "file", content_utf8 = "1,ann\n2,bob\n" }] }
program = 'lines "a.csv" |> split "," names: ["id", "name"] |> filter name == "bob"'
expect = { report = { status = "ok", records = { matched = 1 } } }

# code

[[case]]
id = "exec/code/code.symbols/function"
kind = "exec"
class = "optional:code"
summary = "code.symbols finds a function definition by name with syntax analysis."
fs_before = { entries = [{ path = "src/a.py", type = "file", content_utf8 = "def old_name():\n    return 1\n" }] }
program = 'code.symbols "old_name" path: ["${base}/src"] source: syntax match: exact'
expect = { report = { status = "ok", records = { type = "symbol", matched = 1 } } }

[[case]]
id = "exec/code/code.outline/python"
kind = "exec"
class = "optional:code"
summary = "code.outline lists the symbols of a file."
fs_before = { entries = [{ path = "a.py", type = "file", content_utf8 = "class A:\n    def m(self):\n        pass\n\ndef f():\n    pass\n" }] }
program = 'code.outline "a.py"'
expect = { report = { status = "ok", records = { type = "symbol" } } }

[[case]]
id = "exec/code/code.definition/by-name"
kind = "exec"
class = "optional:code"
summary = "code.definition finds the definition of a named symbol."
fs_before = { entries = [{ path = "a.py", type = "file", content_utf8 = "def f():\n    pass\n\nf()\n" }] }
program = 'code.definition "a.py" symbol: "f" root: "${base}"'
expect = { report = { status = "ok", records = { matched = 1 } } }

[[case]]
id = "exec/code/code.references/position"
kind = "exec"
class = "optional:code"
summary = "code.references lists the references of the symbol at a position."
fs_before = { entries = [{ path = "a.py", type = "file", content_utf8 = "def f():\n    pass\n\nf()\nf()\n" }] }
program = 'code.references "a.py" line: 1 column: 5 root: "${base}"'
expect = { report = { status = "ok", records = { type = "reference" } } }

[[case]]
id = "exec/code/code.hover/position"
kind = "exec"
class = "optional:code"
summary = "code.hover describes the symbol at a position."
fs_before = { entries = [{ path = "a.py", type = "file", content_utf8 = "def f(x):\n    \"\"\"Doubles x.\"\"\"\n    return 2 * x\n" }] }
program = 'code.hover "a.py" line: 1 column: 5 root: "${base}"'
expect = { report = { status = "ok" } }

[[case]]
id = "exec/code/code.diagnostics/syntax-error"
kind = "exec"
class = "optional:code"
summary = "code.diagnostics reports a syntax error."
fs_before = { entries = [{ path = "a.py", type = "file", content_utf8 = "def f(:\n" }] }
program = 'code.diagnostics "a.py" source: syntax'
expect = { report = { status = "ok", records = { type = "diagnostic", matched = 1 } } }

[[case]]
id = "exec/code/code.rename/across-files"
kind = "exec"
class = "optional:code"
summary = "code.rename renames a function and its references in one operation."
fs_before = { entries = [
  { path = "a.py", type = "file", content_utf8 = "def old_name():\n    pass\n" },
  { path = "b.py", type = "file", content_utf8 = "from a import old_name\nold_name()\n" },
] }
program = 'code.symbols "old_name" path: ["${base}"] kind: function source: syntax match: exact |> code.rename "new_name" source: syntax'
fs_after = { entries = [
  { path = "a.py", type = "file", content_utf8 = "def new_name():\n    pass\n" },
  { path = "b.py", type = "file", content_utf8 = "from a import new_name\nnew_name()\n" },
] }
expect = { report = { status = "ok", kind = "code.rename" } }

[[case]]
id = "exec/code/code.languages/list"
kind = "exec"
class = "optional:code"
summary = "code.languages lists the supported languages."
fs_before = { entries = [] }
program = "code.languages |> filter name == \"python\""
expect = { report = { status = "ok", records = { matched = 1 } } }

[[case]]
id = "exec/code/code.implementations/interface"
kind = "exec"
class = "optional:code"
summary = "code.implementations lists the types that implement an interface."
fs_before = { entries = [{ path = "a.go", type = "file", content_utf8 = "package a\n\ntype I interface{ M() }\n\ntype T struct{}\n\nfunc (T) M() {}\n" }] }
program = 'code.implementations "a.go" symbol: "I" root: "${base}"'
expect = { report = { status = "ok" } }

[[case]]
id = "exec/code/code.type_definition/variable"
kind = "exec"
class = "optional:code"
summary = "code.type_definition finds the type of a variable."
fs_before = { entries = [{ path = "a.go", type = "file", content_utf8 = "package a\n\ntype T struct{}\n\nvar v T\n" }] }
program = 'code.type_definition "a.go" symbol: "v" root: "${base}"'
expect = { report = { status = "ok" } }

[[case]]
id = "exec/code/code.call_hierarchy/callers"
kind = "exec"
class = "optional:code"
summary = "code.call_hierarchy lists the callers of a function."
fs_before = { entries = [{ path = "a.py", type = "file", content_utf8 = "def f():\n    pass\n\ndef g():\n    f()\n" }] }
program = 'code.call_hierarchy "a.py" symbol: "f" direction: incoming root: "${base}"'
expect = { report = { status = "ok" } }

[[case]]
id = "exec/code/code.actions/line"
kind = "exec"
class = "optional:code"
summary = "code.actions lists the code actions for a line."
fs_before = { entries = [{ path = "a.py", type = "file", content_utf8 = "import os\n" }] }
program = 'code.actions "a.py" line: 1 root: "${base}"'
expect = { report = { status = "ok" } }

[[case]]
id = "exec/code/code.profile/commands"
kind = "exec"
class = "optional:code"
summary = "code.profile describes the build and test commands of a repository."
fs_before = { entries = [{ path = "Makefile", type = "file", content_utf8 = "test:\n\techo test\n" }] }
program = 'code.profile "${base}" sections: [commands]'
expect = { report = { status = "ok", records = { type = "profile_entry" } } }

# notebook

[[case]]
id = "exec/notebook/notebook.cells/outline"
kind = "exec"
summary = "notebook.cells lists the cells of a notebook."
fs_before = { entries = [{ path = "a.ipynb", type = "file", content_utf8 = "{\"cells\": [{\"cell_type\": \"code\", \"id\": \"c1\", \"metadata\": {}, \"execution_count\": null, \"outputs\": [], \"source\": [\"print(1)\"]}], \"metadata\": {}, \"nbformat\": 4, \"nbformat_minor\": 5}\n" }] }
program = 'notebook.cells "a.ipynb"'
expect = { report = { status = "ok", records = { type = "cell", matched = 1 } } }

[[case]]
id = "exec/notebook/notebook.insert/code-cell"
kind = "exec"
summary = "notebook.insert adds a cell."
fs_before = { entries = [{ path = "a.ipynb", type = "file", content_utf8 = "{\"cells\": [], \"metadata\": {}, \"nbformat\": 4, \"nbformat_minor\": 5}\n" }] }

[[case.step]]
program = 'notebook.insert "a.ipynb" index: 0 cell_type: code source: "print(2)"'
expect = { report = { status = "ok", kind = "notebook.insert" } }

[[case.step]]
program = 'notebook.cells "a.ipynb"'
expect = { report = { records = { matched = 1 } } }

[[case]]
id = "exec/notebook/notebook.replace/source"
kind = "exec"
summary = "notebook.replace changes the source of a cell."
fs_before = { entries = [{ path = "a.ipynb", type = "file", content_utf8 = "{\"cells\": [{\"cell_type\": \"code\", \"id\": \"c1\", \"metadata\": {}, \"execution_count\": null, \"outputs\": [], \"source\": [\"print(1)\"]}], \"metadata\": {}, \"nbformat\": 4, \"nbformat_minor\": 5}\n" }] }

[[case.step]]
program = 'notebook.replace "a.ipynb" id: "c1" source: "print(9)"'
expect = { report = { status = "ok" } }

[[case.step]]
program = 'read "a.ipynb" cell: 0'
expect = { report = { status = "ok" } }

[[case]]
id = "exec/notebook/notebook.move/cell"
kind = "exec"
summary = "notebook.move moves a cell."
fs_before = { entries = [{ path = "a.ipynb", type = "file", content_utf8 = "{\"cells\": [{\"cell_type\": \"markdown\", \"id\": \"m\", \"metadata\": {}, \"source\": [\"# A\"]}, {\"cell_type\": \"markdown\", \"id\": \"n\", \"metadata\": {}, \"source\": [\"# B\"]}], \"metadata\": {}, \"nbformat\": 4, \"nbformat_minor\": 5}\n" }] }
program = 'notebook.move "a.ipynb" from: 1 to: 0'
expect = { report = { status = "ok" } }

[[case]]
id = "exec/notebook/notebook.move/out-of-range"
kind = "exec"
summary = "notebook.move of an index after the last cell fails with E_OUT_OF_RANGE and changes nothing."
fs_before = { entries = [{ path = "a.ipynb", type = "file", content_utf8 = "{\"cells\": [{\"cell_type\": \"markdown\", \"id\": \"m\", \"metadata\": {}, \"source\": [\"# A\"]}], \"metadata\": {}, \"nbformat\": 4, \"nbformat_minor\": 5}\n" }] }
program = 'notebook.move "a.ipynb" from: 3 to: 0'
fs_after = "unchanged"
expect = { report = { status = "failed", error = { code = "E_OUT_OF_RANGE" } } }

[[case]]
id = "exec/notebook/notebook.copy/cell"
kind = "exec"
summary = "notebook.copy duplicates a cell."
fs_before = { entries = [{ path = "a.ipynb", type = "file", content_utf8 = "{\"cells\": [{\"cell_type\": \"markdown\", \"id\": \"m\", \"metadata\": {}, \"source\": [\"# A\"]}], \"metadata\": {}, \"nbformat\": 4, \"nbformat_minor\": 5}\n" }] }

[[case.step]]
program = 'notebook.copy "a.ipynb" from: 0 to: 1'
expect = { report = { status = "ok" } }

[[case.step]]
program = 'notebook.cells "a.ipynb"'
expect = { report = { records = { matched = 2 } } }

[[case]]
id = "exec/notebook/notebook.normalize/missing-ids"
kind = "exec"
summary = "notebook.normalize adds missing cell identifiers."
fs_before = { entries = [{ path = "a.ipynb", type = "file", content_utf8 = "{\"cells\": [{\"cell_type\": \"markdown\", \"metadata\": {}, \"source\": [\"# A\"]}], \"metadata\": {}, \"nbformat\": 4, \"nbformat_minor\": 4}\n" }] }
program = 'notebook.normalize "a.ipynb"'
expect = { report = { status = "ok" } }

[[case]]
id = "exec/notebook/notebook.ops/insert-and-remove"
kind = "exec"
summary = "notebook.ops applies several cell operations in one write."
fs_before = { entries = [{ path = "a.ipynb", type = "file", content_utf8 = "{\"cells\": [{\"cell_type\": \"markdown\", \"id\": \"m\", \"metadata\": {}, \"source\": [\"# A\"]}], \"metadata\": {}, \"nbformat\": 4, \"nbformat_minor\": 5}\n" }] }
program = 'notebook.ops "a.ipynb" changes: [{op: "insert", index: 1, cell_type: "code", source: "x = 1"}, {op: "remove", index: 0}]'
expect = { report = { status = "ok" } }

[[case]]
id = "exec/notebook/notebook.remove/by-id"
kind = "exec"
summary = "notebook.remove removes a cell by identifier."
fs_before = { entries = [{ path = "a.ipynb", type = "file", content_utf8 = "{\"cells\": [{\"cell_type\": \"markdown\", \"id\": \"m\", \"metadata\": {}, \"source\": [\"# A\"]}], \"metadata\": {}, \"nbformat\": 4, \"nbformat_minor\": 5}\n" }] }

[[case.step]]
program = 'notebook.remove "a.ipynb" id: "m"'
expect = { report = { status = "ok" } }

[[case.step]]
program = 'notebook.cells "a.ipynb"'
expect = { report = { records = { matched = 0 } } }

[[case]]
id = "exec/notebook/notebook.clear_outputs/all"
kind = "exec"
summary = "notebook.clear_outputs removes the outputs of the cells."
fs_before = { entries = [{ path = "a.ipynb", type = "file", content_utf8 = "{\"cells\": [{\"cell_type\": \"code\", \"id\": \"c\", \"metadata\": {}, \"execution_count\": 1, \"outputs\": [{\"output_type\": \"stream\", \"name\": \"stdout\", \"text\": [\"1\\n\"]}], \"source\": [\"print(1)\"]}], \"metadata\": {}, \"nbformat\": 4, \"nbformat_minor\": 5}\n" }] }
program = 'notebook.clear_outputs "a.ipynb"'
expect = { report = { status = "ok" } }

[[case]]
id = "exec/notebook/notebook.export/script"
kind = "exec"
summary = "notebook.export writes the code cells to a new script."
fs_before = { entries = [{ path = "a.ipynb", type = "file", content_utf8 = "{\"cells\": [{\"cell_type\": \"code\", \"id\": \"c\", \"metadata\": {}, \"execution_count\": null, \"outputs\": [], \"source\": [\"print(1)\"]}], \"metadata\": {}, \"nbformat\": 4, \"nbformat_minor\": 5}\n" }] }
program = 'notebook.export "a.ipynb" to: "a.py" format: script'
expect = { report = { status = "ok", summary = { files_created = 1 } } }

# archive

[[case]]
id = "exec/archive/archive.create/zip"
kind = "exec"
summary = "archive.create makes a zip archive of the input entries."
fs_before = { entries = [{ path = "dist/a.txt", type = "file", content_utf8 = "a" }] }
program = 'find "dist" |> archive.create "out.zip" base: "${base}/dist"'
expect = { report = { status = "ok", kind = "archive.create", summary = { files_created = 1 } } }

[[case]]
id = "exec/archive/archive.list/after-create"
kind = "exec"
summary = "archive.list lists the entries of an archive made by archive.create."
fs_before = { entries = [
  { path = "dist/a.txt", type = "file", content_utf8 = "a" },
  { path = "dist/b/c.txt", type = "file", content_utf8 = "c" },
] }

[[case.step]]
program = 'find "dist" |> archive.create "out.tar.gz" base: "${base}/dist"'

[[case.step]]
program = 'archive.list "out.tar.gz"'
expect = { report = { status = "ok", kind = "archive.list", records = { type = "archive_entry", matched = 2 } } }

[[case]]
id = "exec/archive/archive.extract/round-trip"
kind = "exec"
summary = "archive.extract restores the content written by archive.create."
fs_before = { entries = [{ path = "dist/a.txt", type = "file", content_utf8 = "alpha\n" }] }

[[case.step]]
program = 'find "dist" |> archive.create "out.zip" base: "${base}/dist"'

[[case.step]]
program = 'archive.extract "out.zip" into: "restored"'
expect = { report = { status = "ok", kind = "archive.extract" } }
fs_after = { exhaustive = false, entries = [{ path = "restored/a.txt", type = "file", content_utf8 = "alpha\n" }] }

[[case]]
id = "exec/archive/archive.extract/damaged"
kind = "exec"
summary = "archive.extract of a damaged archive fails with E_FORMAT and creates nothing."
fs_before = { entries = [{ path = "bad.zip", type = "file", content_utf8 = "not an archive" }] }
program = 'archive.extract "bad.zip" into: "out"'
fs_after = "unchanged"
expect = { report = { status = "failed", error = { code = "E_FORMAT" } } }

[[case]]
id = "exec/archive/compress/gzip"
kind = "exec"
summary = "compress writes a gzip file next to the original, which is kept."
fs_before = { entries = [{ path = "a.log", type = "file", content_utf8 = "line\n" }] }
program = 'compress "a.log"'
expect = { report = { status = "ok", kind = "compress" } }
fs_after = { exhaustive = false, entries = [{ path = "a.log", type = "file", content_utf8 = "line\n" }] }

[[case]]
id = "exec/archive/decompress/gzip"
kind = "exec"
summary = "decompress restores the original content."
fs_before = { entries = [{ path = "a.log.gz", type = "file", content_base64 = "H4sIAAAAAAAC/8vJzEvlAgAORdhmBQAAAA==" }] }
program = 'decompress "a.log.gz"'
fs_after = { exhaustive = false, entries = [{ path = "a.log", type = "file", content_utf8 = "line\n" }] }
expect = { report = { status = "ok", kind = "decompress" } }

