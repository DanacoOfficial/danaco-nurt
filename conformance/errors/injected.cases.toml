format = "nurt-conformance-cases/1"

# Errors that depend on the state of the system, of remote hosts or of
# external programs are produced by the failpoints of the optional feature
# `testkit`: `testkit.failpoint.set` makes the named stage of the next call
# fail with the given code, so the case checks how the error is reported.

[[case]]
id = "errors/injected/internal-correction"
kind = "error"
class = "optional:testkit"
code = "E_INTERNAL_CORRECTION"
summary = "A correction that violates an invariant executes nothing."

[[case.step]]
method = "testkit.failpoint.set"
params = { stage = "parse", code = "E_INTERNAL_CORRECTION" }
expect = {}

[[case.step]]
program = "find 'src'"
expect = { report = { status = "failed", error = { code = "E_INTERNAL_CORRECTION" } } }
fs_after = "unchanged"

