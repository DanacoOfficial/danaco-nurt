# Well-formedness cases for XML 1.0 (Fifth Edition) with namespaces.
#
# Each case has an identifier, the expected classification (`wf = true` for a
# well-formed document, `false` for a document that must be rejected with
# `E_DOC_PARSE`), the document text and the section of the specification it
# exercises. Documents are UTF-8; control characters are written as TOML
# escapes in basic strings.

