apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
    tier: "frontend"
  annotations:
    deployment.kubernetes.io/revision: "3"
spec:
  replicas: 2 # scaled by the autoscaler
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: registry.example/web:1.27
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: FEATURE_FLAG
              value: "on"
          resources:
            limits: {cpu: 500m, memory: 256Mi}
          command: ["/bin/web", "--port", "8080"]
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
