# Compose project "shop2"; shared settings live in x- extension fields.
x-logging: &logging
  driver: json-file
  options:
    max-size: "18m"
    max-file: "3"

x-defaults: &defaults
  restart: unless-stopped
  logging: *logging
  networks:
  - backend

x-env: &env
  TZ: UTC
  LOG_LEVEL: info
  FEATURE_FLAG: "yes"   # quoted: plain yes is a boolean in YAML 1.1

services:
  app:
    <<: [*defaults]
    image: registry.example.com/shop2/app:1.18
    environment:
      <<: *env
      DATABASE_URL: postgres://db:5432/shop2
    ports:
    - "8018:8080"
    - "127.0.0.1:9018:9090"  # metrics, loopback only
    depends_on:
    - db
    - cache
  worker:
    <<: *defaults
    image: registry.example.com/shop2/app:1.18
    command: ["worker", "--concurrency", "3"]
    restart: on-failure   # overrides the merged value
    environment:
    - TZ=UTC
    - QUEUE=shop2-jobs
  db:
    <<: *defaults
    image: postgres:16
    volumes:
    - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop2"]
      interval: 10s
      retries: 5
  cache:
    <<: *defaults
    image: redis:7
    logging:
      <<: *logging
      driver: local

volumes:
  db-data: {}
networks:
  backend:
    driver: bridge
