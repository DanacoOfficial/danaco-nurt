# Compose project "docs"; shared settings live in x- extension fields.
x-logging: &logging
  driver: json-file
  options:
    max-size: "27m"
    max-file: "3"

x-defaults: &defaults
  restart: unless-stopped
  logging: *logging
  networks:
    - backend

x-env: &env
  TZ: UTC
  LOG_LEVEL: info
  FEATURE_FLAG: "yes"   # quoted: plain yes is a boolean in YAML 1.1

services:
  app:
    <<: [*defaults]
    image: registry.example.com/docs/app:1.27
    environment:
      <<: *env
      DATABASE_URL: postgres://db:5432/docs
    ports:
      - "8027:8080"
      - "127.0.0.1:9027:9090"  # metrics, loopback only
    depends_on:
      - db
      - cache
  worker:
    <<: *defaults
    image: registry.example.com/docs/app:1.27
    command: ["worker", "--concurrency", "4"]
    restart: on-failure   # overrides the merged value
    environment:
      - TZ=UTC
      - QUEUE=docs-jobs
  db:
    <<: *defaults
    image: postgres:16
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docs"]
      interval: 10s
      retries: 4
  cache:
    <<: *defaults
    image: redis:7
    logging:
      <<: *logging
      driver: local

volumes:
  db-data: {}
networks:
  backend:
    driver: bridge
