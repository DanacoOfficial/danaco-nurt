---
# Playbook for the metrics tier, revision 29.
- name: Configure metrics hosts
  hosts: metrics_servers
  become: true
  gather_facts: false
  vars:
    common_packages: &common_packages
      - jq
      - redis   # required by the health check
    metrics_port: 8029
    metrics_user: "svc-metrics"
    retry_policy: &retry {retries: 5, delay: 58}
  pre_tasks:
    - name: Refresh package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
  tasks:
    # Packages first, configuration second.
    - name: Install packages
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop: *common_packages
      <<: *retry
    - name: Render configuration
      ansible.builtin.template:
        src: templates/metrics.conf.j2
        dest: "/etc/metrics/metrics.conf"
        mode: "0644"
      notify:
        - Restart metrics
      tags: [config, metrics]
    - name: Create users
      ansible.builtin.user:
        name: "{{ item.name }}"
        groups: "{{ item.groups | join(',') }}"
      loop:
        - {name: alice, groups: [adm, metrics]}
        - {name: bob, groups: [metrics]}
        - name: carol
          groups:
            - metrics
  handlers:
    - name: Restart metrics
      ansible.builtin.service:
        name: metrics
        state: restarted
      listen: "restart metrics"
