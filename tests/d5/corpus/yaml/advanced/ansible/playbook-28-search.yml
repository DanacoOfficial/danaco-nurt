---
# Playbook for the search tier, revision 28.
- name: Configure search hosts
  hosts: search_servers
  become: yes
  gather_facts: false
  vars:  # play variables
    common_packages: &common_packages
    - unzip
    - postgresql   # required by the health check
    search_port: 8028
    search_user: "svc-search"
    retry_policy: &retry {retries: 4, delay: 56}
  pre_tasks:
  - name: Refresh package cache
    ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600
  tasks:
  # Packages first, configuration second.
  - name: Install packages
    ansible.builtin.package:
      name: "{{ item }}"
      state: present
    loop: *common_packages
    <<: *retry
  - name: Render configuration
    ansible.builtin.template:
      src: templates/search.conf.j2
      dest: "/etc/search/search.conf"
      mode: "0644"
    notify:
    - Restart search
    tags: [config, search]
  - name: Guarded block
    block:
    - name: Start service
      ansible.builtin.service: {name: search, state: started, enabled: true}
    rescue:
    - ansible.builtin.debug:
        msg: "start of search failed"
    when:
    - ansible_os_family == "Debian"
    - search_port | int > 1024
  handlers:
  - name: Restart search
    ansible.builtin.service:
      name: search
      state: restarted
    listen: "restart search"
