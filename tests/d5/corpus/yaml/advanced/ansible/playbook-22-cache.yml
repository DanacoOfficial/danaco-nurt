---
# Playbook for the cache tier, revision 22.
- name: Configure cache hosts
  hosts: cache_servers
  become: true
  gather_facts: false
  vars:  # play variables
    common_packages: &common_packages
    - redis
    - curl   # required by the health check
    cache_port: 8022
    cache_user: "svc-cache"
    retry_policy: &retry {retries: 3, delay: 44}
  pre_tasks:
  - name: Refresh package cache
    ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600
  tasks:
  # Packages first, configuration second.
  - name: Install packages
    ansible.builtin.package:
      name: "{{ item }}"
      state: present
    loop: *common_packages
    <<: *retry
  - name: Render configuration
    ansible.builtin.template:
      src: templates/cache.conf.j2
      dest: "/etc/cache/cache.conf"
      mode: "0644"
    notify:
    - Restart cache
    tags: [config, cache]
  - name: Guarded block
    block:
    - name: Start service
      ansible.builtin.service: {name: cache, state: started, enabled: true}
    rescue:
    - ansible.builtin.debug:
        msg: "start of cache failed"
    when:
    - ansible_os_family == "Debian"
    - cache_port | int > 1024
  handlers:
  - name: Restart cache
    ansible.builtin.service:
      name: cache
      state: restarted
    listen: "restart cache"
