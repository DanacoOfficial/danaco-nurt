---
# Playbook for the db tier, revision 1.
- name: Configure db hosts
  hosts: db_servers
  become: true
  gather_facts: false
  vars:
    common_packages: &common_packages
      - postgresql
      - git   # required by the health check
    db_port: 8001
    db_user: "svc-db"
    retry_policy: &retry {retries: 2, delay: 2}
  pre_tasks:
    - name: Refresh package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
  tasks:
    # Packages first, configuration second.
    - name: Install packages
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop: *common_packages
      <<: *retry
    - name: Render configuration
      ansible.builtin.template:
        src: templates/db.conf.j2
        dest: "/etc/db/db.conf"
        mode: "0644"
      notify:
        - Restart db
      tags: [config, db]
    - name: Guarded block
      block:
        - name: Start service
          ansible.builtin.service: {name: db, state: started, enabled: true}
      rescue:
        - ansible.builtin.debug:
            msg: "start of db failed"
      when:
        - ansible_os_family == "Debian"
        - db_port | int > 1024
  handlers:
    - name: Restart db
      ansible.builtin.service:
        name: db
        state: restarted
      listen: "restart db"
