---
# Playbook for the queue tier, revision 25.
- name: Configure queue hosts
  hosts: queue_servers
  become: true
  gather_facts: no
  vars:
    common_packages: &common_packages
      - curl
      - unzip   # required by the health check
    queue_port: 8025
    queue_user: "svc-queue"
    retry_policy: &retry {retries: 1, delay: 50}
  pre_tasks:
    - name: Refresh package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
  tasks:
    # Packages first, configuration second.
    - name: Install packages
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop: *common_packages
      <<: *retry
    - name: Render configuration
      ansible.builtin.template:
        src: templates/queue.conf.j2
        dest: "/etc/queue/queue.conf"
        mode: "0644"
      notify:
        - Restart queue
      tags: [config, queue]
    - name: Guarded block
      block:
        - name: Start service
          ansible.builtin.service: {name: queue, state: started, enabled: true}
      rescue:
        - ansible.builtin.debug:
            msg: "start of queue failed"
      when:
        - ansible_os_family == "Debian"
        - queue_port | int > 1024
  handlers:
    - name: Restart queue
      ansible.builtin.service:
        name: queue
        state: restarted
      listen: "restart queue"
