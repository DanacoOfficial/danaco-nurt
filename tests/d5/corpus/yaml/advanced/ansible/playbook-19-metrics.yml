---
# Playbook for the metrics tier, revision 19.
- name: Configure metrics hosts
  hosts: metrics_servers
  become: true
  gather_facts: false
  vars:
    common_packages: &common_packages
      - jq
      - redis   # required by the health check
    metrics_port: 8019
    metrics_user: "svc-metrics"
    retry_policy: &retry {retries: 5, delay: 38}
  pre_tasks:
    - name: Refresh package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
  tasks:
    # Packages first, configuration second.
    - name: Install packages
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop: *common_packages
      <<: *retry
    - name: Render configuration
      ansible.builtin.template:
        src: templates/metrics.conf.j2
        dest: "/etc/metrics/metrics.conf"
        mode: "0644"
      notify:
        - Restart metrics
      tags: [config, metrics]
    - name: Guarded block
      block:
        - name: Start service
          ansible.builtin.service: {name: metrics, state: started, enabled: true}
      rescue:
        - ansible.builtin.debug:
            msg: "start of metrics failed"
      when:
        - ansible_os_family == "Debian"
        - metrics_port | int > 1024
  handlers:
    - name: Restart metrics
      ansible.builtin.service:
        name: metrics
        state: restarted
      listen: "restart metrics"
...
---
# Second play: verification only.
- hosts: localhost
  connection: local
  tasks: []
