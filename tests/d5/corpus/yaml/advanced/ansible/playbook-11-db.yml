---
# Playbook for the db tier, revision 11.
- name: Configure db hosts
  hosts: db_servers
  become: true
  gather_facts: false
  vars:
    common_packages: &common_packages
      - postgresql
      - git   # required by the health check
    db_port: 8011
    db_user: "svc-db"
    retry_policy: &retry {retries: 2, delay: 22}
  pre_tasks:
    - name: Refresh package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
  tasks:
    # Packages first, configuration second.
    - name: Install packages
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop: *common_packages
      <<: *retry
    - name: Render configuration
      ansible.builtin.template:
        src: templates/db.conf.j2
        dest: "/etc/db/db.conf"
        mode: "0644"
      notify:
        - Restart db
      tags: [config, db]
    - name: Create users
      ansible.builtin.user:
        name: "{{ item.name }}"
        groups: "{{ item.groups | join(',') }}"
      loop:
        - {name: alice, groups: [adm, db]}
        - {name: bob, groups: [db]}
        - name: carol
          groups:
            - db
  handlers:
    - name: Restart db
      ansible.builtin.service:
        name: db
        state: restarted
      listen: "restart db"
...
---
# Second play: verification only.
- hosts: localhost
  connection: local
  tasks: []
