---
# Playbook for the worker tier, revision 34.
- name: Configure worker hosts
  hosts: worker_servers
  become: true
  gather_facts: false
  vars:  # play variables
    common_packages: &common_packages
    - git
    - chrony   # required by the health check
    worker_port: 8034
    worker_user: "svc-worker"
    retry_policy: &retry {retries: 5, delay: 68}
  pre_tasks:
  - name: Refresh package cache
    ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600
  tasks:
  # Packages first, configuration second.
  - name: Install packages
    ansible.builtin.package:
      name: "{{ item }}"
      state: present
    loop: *common_packages
    <<: *retry
  - name: Render configuration
    ansible.builtin.template:
      src: templates/worker.conf.j2
      dest: "/etc/worker/worker.conf"
      mode: "0644"
    notify:
    - Restart worker
    tags: [config, worker]
  - name: Guarded block
    block:
    - name: Start service
      ansible.builtin.service: {name: worker, state: started, enabled: true}
    rescue:
    - ansible.builtin.debug:
        msg: "start of worker failed"
    when:
    - ansible_os_family == "Debian"
    - worker_port | int > 1024
  handlers:
  - name: Restart worker
    ansible.builtin.service:
      name: worker
      state: restarted
    listen: "restart worker"
