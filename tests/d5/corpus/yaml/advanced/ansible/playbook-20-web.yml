---
# Playbook for the web tier, revision 20.
- name: Configure web hosts
  hosts: web_servers
  become: yes
  gather_facts: no
  vars:  # play variables
    common_packages: &common_packages
    - nginx
    - haproxy   # required by the health check
    web_port: 8020
    web_user: "svc-web"
    retry_policy: &retry {retries: 1, delay: 40}
  pre_tasks:
  - name: Refresh package cache
    ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600
  tasks:
  # Packages first, configuration second.
  - name: Install packages
    ansible.builtin.package:
      name: "{{ item }}"
      state: present
    loop: *common_packages
    <<: *retry
  - name: Render configuration
    ansible.builtin.template:
      src: templates/web.conf.j2
      dest: "/etc/web/web.conf"
      mode: "0644"
    notify:
    - Restart web
    tags: [config, web]
  - name: Create users
    ansible.builtin.user:
      name: "{{ item.name }}"
      groups: "{{ item.groups | join(',') }}"
    loop:
    - {name: alice, groups: [adm, web]}
    - {name: bob, groups: [web]}
    - name: carol
      groups:
      - web
  handlers:
  - name: Restart web
    ansible.builtin.service:
      name: web
      state: restarted
    listen: "restart web"
