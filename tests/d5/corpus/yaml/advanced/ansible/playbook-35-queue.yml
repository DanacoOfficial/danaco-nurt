---
# Playbook for the queue tier, revision 35.
- name: Configure queue hosts
  hosts: queue_servers
  become: true
  gather_facts: no
  vars:
    common_packages: &common_packages
      - curl
      - unzip   # required by the health check
    queue_port: 8035
    queue_user: "svc-queue"
    retry_policy: &retry {retries: 1, delay: 70}
  pre_tasks:
    - name: Refresh package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
  tasks:
    # Packages first, configuration second.
    - name: Install packages
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop: *common_packages
      <<: *retry
    - name: Render configuration
      ansible.builtin.template:
        src: templates/queue.conf.j2
        dest: "/etc/queue/queue.conf"
        mode: "0644"
      notify:
        - Restart queue
      tags: [config, queue]
    - name: Create users
      ansible.builtin.user:
        name: "{{ item.name }}"
        groups: "{{ item.groups | join(',') }}"
      loop:
        - {name: alice, groups: [adm, queue]}
        - {name: bob, groups: [queue]}
        - name: carol
          groups:
            - queue
  handlers:
    - name: Restart queue
      ansible.builtin.service:
        name: queue
        state: restarted
      listen: "restart queue"
...
---
# Second play: verification only.
- hosts: localhost
  connection: local
  tasks: []
