---
# Playbook for the api tier, revision 26.
- name: Configure api hosts
  hosts: api_servers
  become: true
  gather_facts: false
  vars:  # play variables
    common_packages: &common_packages
    - rsync
    - jq   # required by the health check
    api_port: 8026
    api_user: "svc-api"
    retry_policy: &retry {retries: 2, delay: 52}
  pre_tasks:
  - name: Refresh package cache
    ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600
  tasks:
  # Packages first, configuration second.
  - name: Install packages
    ansible.builtin.package:
      name: "{{ item }}"
      state: present
    loop: *common_packages
    <<: *retry
  - name: Render configuration
    ansible.builtin.template:
      src: templates/api.conf.j2
      dest: "/etc/api/api.conf"
      mode: "0644"
    notify:
    - Restart api
    tags: [config, api]
  - name: Create users
    ansible.builtin.user:
      name: "{{ item.name }}"
      groups: "{{ item.groups | join(',') }}"
    loop:
    - {name: alice, groups: [adm, api]}
    - {name: bob, groups: [api]}
    - name: carol
      groups:
      - api
  handlers:
  - name: Restart api
    ansible.builtin.service:
      name: api
      state: restarted
    listen: "restart api"
