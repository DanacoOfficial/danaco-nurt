# Lists in block and flow style, variant 14.
empty: []
empty_spaced: [ ]
flow: [one, "two", 'three', 14, 14.5, true, null]
flow_nested: [[a, b], [c], [], {k: v}]
block:
- first
- second   # inline comment
- 'third'
-
- ~
nested:
- - x14
  - y14
- - - deep
maps:
- name: alpha
  size: 14
  tags: [a]
- name: beta
  size: 15
  # comment between keys of an item
  tags:
  - b
  - c
- {name: gamma, size: 16}
scalars:
- |
  literal line one
  literal line two
- >-
  folded text
  continues here
- "double \"quoted\" text"
wide:
  - a
  - b
