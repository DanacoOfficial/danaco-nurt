# Lists in block and flow style, variant 10.
empty: []
empty_spaced: [ ]
flow: [one, "two", 'three', 10, 10.5, true, null]
flow_nested: [[a, b], [c], [], {k: v}]
block:
- first
- second   # inline comment
- 'third'
-
- ~
nested:
- - x10
  - y10
- - - deep
maps:
- name: alpha
  size: 10
  tags: [a]
- name: beta
  size: 11
  # comment between keys of an item
  tags:
  - b
  - c
- {name: gamma, size: 12}
scalars:
- |
  literal line one
  literal line two
- >-
  folded text
  continues here
- "double \"quoted\" text"
wide:
  - a
  - b
