# Lists in block and flow style, variant 17.
empty: []
empty_spaced: [ ]
flow: [one, "two", 'three', 17, 17.5, true, null]
flow_nested: [[a, b], [c], [], {k: v}]
block:
  - first
  - second   # inline comment
  - 'third'
  -
  - ~
nested:
  - - x17
    - y17
  - - - deep
maps:
  - name: alpha
    size: 17
    tags: [a]
  - name: beta
    size: 18
    # comment between keys of an item
    tags:
      - b
      - c
  - {name: gamma, size: 19}
scalars:
  - |
    literal line one
    literal line two
  - >-
    folded text
    continues here
  - "double \"quoted\" text"
wide:
  - a
  - b
