AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stack 21 provisioning a Queue with
  parameters, conditions and outputs.
# Parameters are shared by every resource below.
Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  Prefix:
    Type: String
    Default: app21
Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  Combined: !And
    - !Condition IsProduction
    - !Equals [!Ref Prefix, app21]
Mappings:
  RegionMap:
    eu-west-1: {Ami: ami-0a1021}
    us-east-1: {Ami: ami-0b2021}
Resources:
  MainQueue:
    Type: AWS::Service::Queue
    Condition: IsProduction
    Properties:
      Name: !Sub "${Prefix}-queue-${AWS::Region}"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: !Ref AWS::StackName  # pseudo parameter
      Arn: !GetAtt [HelperQueue, Arn]
      Image: !FindInMap [RegionMap, !Ref "AWS::Region", Ami]
  HelperQueue:
    Type: AWS::Service::Helper
    DependsOn: [MainQueue]
    Properties: {}
Outputs:
  QueueArn:
    Value: !GetAtt MainQueue.Arn
    Export:
      Name: !Sub '${AWS::StackName}-QueueArn'
