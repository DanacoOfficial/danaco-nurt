AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stack 3 provisioning a Table with
  parameters, conditions and outputs.
# Parameters are shared by every resource below.
Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  Prefix:
    Type: String
    Default: app3
Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  Combined: !And
    - !Condition IsProduction
    - !Equals [!Ref Prefix, app3]
Mappings:
  RegionMap:
    eu-west-1: {Ami: ami-0a1003}
    us-east-1: {Ami: ami-0b2003}
Resources:
  MainTable:
    Type: AWS::Service::Table
    Properties:
      Name: !Sub "${Prefix}-table-${AWS::Region}"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: !Ref AWS::StackName  # pseudo parameter
      Joined: !Join
        - ":"
        - - !Ref Prefix
          - !Ref Environment
          - fixed
      Imported: !ImportValue SharedVpcId
  HelperTable:
    Type: AWS::Service::Helper
    DependsOn: [MainTable]
    Properties: {}
Outputs:
  TableArn:
    Value: !GetAtt MainTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TableArn'
