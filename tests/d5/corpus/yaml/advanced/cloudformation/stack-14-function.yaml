AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stack 14 provisioning a Function with
  parameters, conditions and outputs.
# Parameters are shared by every resource below.
Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  Prefix:
    Type: String
    Default: app14
Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  NotProduction: !Not [!Condition IsProduction]
Mappings:
  RegionMap:
    eu-west-1: {Ami: ami-0a1014}
    us-east-1: {Ami: ami-0b2014}
Resources:
  MainFunction:
    Type: AWS::Service::Function
    Properties:
      Name: !Sub "${Prefix}-function-${AWS::Region}"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: !Ref AWS::StackName  # pseudo parameter
      Blocks: !Cidr ["10.14.0.0/16", 4, 8]
      Parts: !Split [",", !Ref Prefix]
      Literal: !!str 014
      Long:
        Fn::Join: ["-", [a, b, !Ref Prefix]]
  HelperFunction:
    Type: AWS::Service::Helper
    DependsOn: [MainFunction]
    Properties: {}
Outputs:
  FunctionArn:
    Value: !GetAtt MainFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FunctionArn'
