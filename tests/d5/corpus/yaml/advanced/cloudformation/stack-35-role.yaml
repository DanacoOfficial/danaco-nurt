AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stack 35 provisioning a Role with
  parameters, conditions and outputs.
# Parameters are shared by every resource below.
Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  Prefix:
    Type: String
    Default: app35
Conditions:
  IsProduction: !Equals [!Ref Environment, production]
Mappings:
  RegionMap:
    eu-west-1: {Ami: ami-0a1035}
    us-east-1: {Ami: ami-0b2035}
Resources:
  MainRole:
    Type: AWS::Service::Role
    Properties:
      Name: !Sub "${Prefix}-role-${AWS::Region}"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: !Ref AWS::StackName  # pseudo parameter
      Arn: !GetAtt HelperRole.Arn
      Size: !If [IsProduction, 100, 10]
  HelperRole:
    Type: AWS::Service::Helper
    DependsOn: [MainRole]
    Properties: {}
Outputs:
  RoleArn:
    Value: !GetAtt MainRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RoleArn'
