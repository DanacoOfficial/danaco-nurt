AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stack 28 provisioning a Cluster with
  parameters, conditions and outputs.
# Parameters are shared by every resource below.
Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  Prefix:
    Type: String
    Default: app28
Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  NotProduction: !Not [!Condition IsProduction]
Mappings:
  RegionMap:
    eu-west-1: {Ami: ami-0a1028}
    us-east-1: {Ami: ami-0b2028}
Resources:
  MainCluster:
    Type: AWS::Service::Cluster
    Properties:
      Name: !Sub "${Prefix}-cluster-${AWS::Region}"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: !Ref AWS::StackName  # pseudo parameter
      Joined: !Join
        - ":"
        - - !Ref Prefix
          - !Ref Environment
          - fixed
      Imported: !ImportValue SharedVpcId
  HelperCluster:
    Type: AWS::Service::Helper
    DependsOn: [MainCluster]
    Properties: {}
Outputs:
  ClusterArn:
    Value: !GetAtt MainCluster.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ClusterArn'
