AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stack 7 provisioning a Subnet with
  parameters, conditions and outputs.
# Parameters are shared by every resource below.
Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  Prefix:
    Type: String
    Default: app7
Conditions:
  IsProduction: !Equals [!Ref Environment, production]
Mappings:
  RegionMap:
    eu-west-1: {Ami: ami-0a1007}
    us-east-1: {Ami: ami-0b2007}
Resources:
  MainSubnet:
    Type: AWS::Service::Subnet
    Properties:
      Name: !Sub "${Prefix}-subnet-${AWS::Region}"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: !Ref AWS::StackName  # pseudo parameter
      Script: !Base64
        Fn::Sub: |
          #!/bin/sh
          echo ${Prefix} > /tmp/name
      Zone: !Select [0, !GetAZs '']
  HelperSubnet:
    Type: AWS::Service::Helper
    DependsOn: [MainSubnet]
    Properties: {}
Outputs:
  SubnetArn:
    Value: !GetAtt MainSubnet.Arn
    Export:
      Name: !Sub '${AWS::StackName}-SubnetArn'
