AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stack 9 provisioning a Stream with
  parameters, conditions and outputs.
# Parameters are shared by every resource below.
Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  Prefix:
    Type: String
    Default: app9
Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  Combined: !And
    - !Condition IsProduction
    - !Equals [!Ref Prefix, app9]
Mappings:
  RegionMap:
    eu-west-1: {Ami: ami-0a1009}
    us-east-1: {Ami: ami-0b2009}
Resources:
  MainStream:
    Type: AWS::Service::Stream
    Condition: IsProduction
    Properties:
      Name: !Sub "${Prefix}-stream-${AWS::Region}"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: !Ref AWS::StackName  # pseudo parameter
      Blocks: !Cidr ["10.9.0.0/16", 4, 8]
      Parts: !Split [",", !Ref Prefix]
      Literal: !!str 09
      Long:
        Fn::Join: ["-", [a, b, !Ref Prefix]]
  HelperStream:
    Type: AWS::Service::Helper
    DependsOn: [MainStream]
    Properties: {}
Outputs:
  StreamArn:
    Value: !GetAtt MainStream.Arn
    Export:
      Name: !Sub '${AWS::StackName}-StreamArn'
