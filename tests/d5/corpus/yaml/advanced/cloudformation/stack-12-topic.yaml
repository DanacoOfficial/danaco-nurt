AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stack 12 provisioning a Topic with
  parameters, conditions and outputs.
# Parameters are shared by every resource below.
Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  Prefix:
    Type: String
    Default: app12
Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  NotProduction: !Not [!Condition IsProduction]
  Combined: !And
    - !Condition IsProduction
    - !Equals [!Ref Prefix, app12]
Mappings:
  RegionMap:
    eu-west-1: {Ami: ami-0a1012}
    us-east-1: {Ami: ami-0b2012}
Resources:
  MainTopic:
    Type: AWS::Service::Topic
    Properties:
      Name: !Sub "${Prefix}-topic-${AWS::Region}"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: !Ref AWS::StackName  # pseudo parameter
      Script: !Base64
        Fn::Sub: |
          #!/bin/sh
          echo ${Prefix} > /tmp/name
      Zone: !Select [0, !GetAZs '']
  HelperTopic:
    Type: AWS::Service::Helper
    DependsOn: [MainTopic]
    Properties: {}
Outputs:
  TopicArn:
    Value: !GetAtt MainTopic.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TopicArn'
