AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stack 36 provisioning a Vpc with
  parameters, conditions and outputs.
# Parameters are shared by every resource below.
Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  Prefix:
    Type: String
    Default: app36
Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  NotProduction: !Not [!Condition IsProduction]
  Combined: !And
    - !Condition IsProduction
    - !Equals [!Ref Prefix, app36]
Mappings:
  RegionMap:
    eu-west-1: {Ami: ami-0a1036}
    us-east-1: {Ami: ami-0b2036}
Resources:
  MainVpc:
    Type: AWS::Service::Vpc
    Properties:
      Name: !Sub "${Prefix}-vpc-${AWS::Region}"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: !Ref AWS::StackName  # pseudo parameter
      Arn: !GetAtt [HelperVpc, Arn]
      Image: !FindInMap [RegionMap, !Ref "AWS::Region", Ami]
  HelperVpc:
    Type: AWS::Service::Helper
    DependsOn: [MainVpc]
    Properties: {}
Outputs:
  VpcArn:
    Value: !GetAtt MainVpc.Arn
    Export:
      Name: !Sub '${AWS::StackName}-VpcArn'
