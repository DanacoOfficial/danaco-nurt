# Merge keys (YAML 1.1 merge type), variant 7.
base: &base
  name: base
  port: 1007
  opts: {debug: false}
extra: &extra
  port: 2007
  region: eu-7
reversed:
  <<: [*extra, *base]   # extra wins for port
  region: local
nested: &nested
  <<: *base
  level: two
deep:
  <<: *nested
  level: three
