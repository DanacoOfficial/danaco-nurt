# Merge keys (YAML 1.1 merge type), variant 6.
base: &base
  name: base
  port: 1006
  opts: {debug: false}
extra: &extra
  port: 2006
  region: eu-6
ordered:
  <<: [*base, *extra]   # base wins for port
  local: yes
nested: &nested
  <<: *base
  level: two
deep:
  <<: *nested
  level: three
inline:
  <<: {a: 1, b: 2}
  b: 3
block_list:
  <<:
    - *base
    - *extra
  tail: end
