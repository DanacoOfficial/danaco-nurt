# Merge keys (YAML 1.1 merge type), variant 11.
base: &base
  name: base
  port: 1011
  opts: {debug: false}
extra: &extra
  port: 2011
  region: eu-11
ordered:
  <<: [*base, *extra]   # base wins for port
  local: yes
nested: &nested
  <<: *base
  level: two
deep:
  <<: *nested
  level: three
only_merge:
  <<: *extra
