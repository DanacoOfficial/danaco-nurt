# Anchors and aliases, variant 1.
defaults:
  timeout: &timeout 5
  name: &name "service-1"
  hosts: &hosts
    - a1.example.com
    - b1.example.com
  limits: &limits {cpu: 1, memory: 128}
  empty: &empty
jobs:
  build:
    timeout: *timeout
    hosts: *hosts
    limits: *limits
    label: *name
    nothing: *empty
  test:
    timeout: *timeout   # same value as build
    hosts: [*name, c1.example.com]
    matrix: {limits: *limits, retry: *timeout}
  deploy: &deploy
    stage: deploy
    needs: [build, test]
  deploy-copy: *deploy
keys:
  &k key1 : value
aliased_keys:
  *k : other
