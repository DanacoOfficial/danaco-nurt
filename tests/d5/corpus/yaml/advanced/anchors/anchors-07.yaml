# Anchors and aliases, variant 7.
defaults:
  timeout: &timeout 35
  name: &name "service-7"
  hosts: &hosts
    - a7.example.com
    - b7.example.com
  limits: &limits {cpu: 7, memory: 896}
  empty: &empty
jobs:
  build:
    timeout: *timeout
    hosts: *hosts
    limits: *limits
    label: *name
    nothing: *empty
  test:
    timeout: *timeout   # same value as build
    hosts: [*name, c7.example.com]
    matrix: {limits: *limits, retry: *timeout}
  deploy: &deploy
    stage: deploy
    needs: [build, test]
  deploy-copy: *deploy
