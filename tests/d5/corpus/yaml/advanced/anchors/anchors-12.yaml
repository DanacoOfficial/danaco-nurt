# Anchors and aliases, variant 12.
defaults:
  timeout: &timeout 60
  name: &name "service-12"
  hosts: &hosts
  - a12.example.com
  - b12.example.com
  limits: &limits {cpu: 12, memory: 1536}
  empty: &empty
jobs:
  build:
    timeout: *timeout
    hosts: *hosts
    limits: *limits
    label: *name
    nothing: *empty
  test:
    timeout: *timeout   # same value as build
    hosts: [*name, c12.example.com]
    matrix: {limits: *limits, retry: *timeout}
  deploy: &deploy
    stage: deploy
    needs: [build, test]
  deploy-copy: *deploy
redefined:
  first: &v one
  use1: *v
  second: &v two
  use2: *v
