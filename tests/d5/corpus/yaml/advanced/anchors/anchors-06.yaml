# Anchors and aliases, variant 6.
defaults:
  timeout: &timeout 30
  name: &name "service-6"
  hosts: &hosts
  - a6.example.com
  - b6.example.com
  limits: &limits {cpu: 6, memory: 768}
  empty: &empty
jobs:
  build:
    timeout: *timeout
    hosts: *hosts
    limits: *limits
    label: *name
    nothing: *empty
  test:
    timeout: *timeout   # same value as build
    hosts: [*name, c6.example.com]
    matrix: {limits: *limits, retry: *timeout}
  deploy: &deploy
    stage: deploy
    needs: [build, test]
  deploy-copy: *deploy
redefined:
  first: &v one
  use1: *v
  second: &v two
  use2: *v
anchored_list: &list
- &item {x: 1}
- *item
list_again: *list
