# Anchors and aliases, variant 10.
defaults:
  timeout: &timeout 50
  name: &name "service-10"
  hosts: &hosts
  - a10.example.com
  - b10.example.com
  limits: &limits {cpu: 10, memory: 1280}
  empty: &empty
jobs:
  build:
    timeout: *timeout
    hosts: *hosts
    limits: *limits
    label: *name
    nothing: *empty
  test:
    timeout: *timeout   # same value as build
    hosts: [*name, c10.example.com]
    matrix: {limits: *limits, retry: *timeout}
  deploy: &deploy
    stage: deploy
    needs: [build, test]
  deploy-copy: *deploy
anchored_list: &list
- &item {x: 1}
- *item
list_again: *list
