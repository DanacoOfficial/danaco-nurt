# Anchors and aliases, variant 16.
defaults:
  timeout: &timeout 80
  name: &name "service-16"
  hosts: &hosts
  - a16.example.com
  - b16.example.com
  limits: &limits {cpu: 16, memory: 2048}
  empty: &empty
jobs:
  build:
    timeout: *timeout
    hosts: *hosts
    limits: *limits
    label: *name
    nothing: *empty
  test:
    timeout: *timeout   # same value as build
    hosts: [*name, c16.example.com]
    matrix: {limits: *limits, retry: *timeout}
  deploy: &deploy
    stage: deploy
    needs: [build, test]
  deploy-copy: *deploy
