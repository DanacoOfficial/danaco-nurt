# CloudFormation short-form functions in flow and block style.
A: !Ref Name
B: !Sub "${A}-x"
C: !GetAtt [Res, Arn]
D: !Join
  - ","
  - [!Ref A, !Ref B]
E: !If [Cond, !Ref A, !Ref "AWS::NoValue"]
