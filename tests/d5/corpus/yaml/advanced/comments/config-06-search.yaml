# Configuration of the search subsystem.
#
# Every key below is documented; values are defaults.

--- # document marker with a trailing comment
# Section: connection
search:
  # Host name or address.
  host: search.internal   # resolved by the service mesh
  port: 5006  #no space after the hash
  url: "http://search.internal/#fragment"  # the hash inside quotes is not a comment
  password: 'p#ss6'

  # Timeouts in seconds.
  timeouts:
    connect: 7
    # read timeout applies per request
    read: 18
    # trailing comment of the timeouts map

  # Replicas, in priority order.
  replicas:
  # first replica is the primary
  - primary.search.internal
  - secondary.search.internal   # same zone

  # a blank line separates this comment from the item
  - tertiary.search.internal
  # comment after the last item
  flags: [  # flow sequence over several lines
    alpha,  # first
    beta,
    # standalone comment inside a flow sequence
    gamma
  ]
  limits: {
    max: 600,  # upper bound
    min: 1
  }
#   comment at column zero inside the search map
  enabled: true

# Section: observability
metrics:
  enabled: true  # toggled per environment
  labels:
  - service=search      # aligned
  - version=6      # aligned
# End of file comment.
