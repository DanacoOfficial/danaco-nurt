# Configuration of the auth subsystem.
#
# Every key below is documented; values are defaults.

--- # document marker with a trailing comment
# Section: connection
auth:
  # Host name or address.
  host: auth.internal   # resolved by the service mesh
  port: 5018  #no space after the hash
  url: "http://auth.internal/#fragment"  # the hash inside quotes is not a comment
  password: 'p#ss18'

  # Timeouts in seconds.
  timeouts:
    connect: 5
    # read timeout applies per request
    read: 54
    # trailing comment of the timeouts map

  # Replicas, in priority order.
  replicas:
  # first replica is the primary
  - primary.auth.internal
  - secondary.auth.internal   # same zone

  # a blank line separates this comment from the item
  - tertiary.auth.internal
  # comment after the last item
  flags: [  # flow sequence over several lines
    alpha,  # first
    beta,
    # standalone comment inside a flow sequence
    gamma
  ]
  limits: {
    max: 1800,  # upper bound
    min: 1
  }
#   comment at column zero inside the auth map
  enabled: true

# Section: observability
metrics:
  enabled: true  # toggled per environment
  labels:
  - service=auth      # aligned
  - version=18      # aligned
# End of file comment.
