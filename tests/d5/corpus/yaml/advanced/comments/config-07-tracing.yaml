# Configuration of the tracing subsystem.
#
# Every key below is documented; values are defaults.

# Section: connection
tracing:
  # Host name or address.
  host: tracing.internal   # resolved by the service mesh
  port: 5007  #no space after the hash
  url: "http://tracing.internal/#fragment"  # the hash inside quotes is not a comment
  password: 'p#ss7'

  # Timeouts in seconds.
  timeouts:
    connect: 1
    # read timeout applies per request
    read: 21
    # trailing comment of the timeouts map

  # Replicas, in priority order.
  replicas:
    # first replica is the primary
    - primary.tracing.internal
    - secondary.tracing.internal   # same zone

    # a blank line separates this comment from the item
    - tertiary.tracing.internal
    # comment after the last item
  flags: [  # flow sequence over several lines
    alpha,  # first
    beta,
    # standalone comment inside a flow sequence
    gamma
  ]
  limits: {
    max: 700,  # upper bound
    min: 1
  }
#   comment at column zero inside the tracing map
  enabled: true

# Section: observability
metrics:
  enabled: false  # toggled per environment
  labels:
    - service=tracing      # aligned
    - version=7      # aligned
# End of file comment.
# Second trailing line.
