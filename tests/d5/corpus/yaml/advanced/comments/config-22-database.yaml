# Configuration of the database subsystem.
#
# Every key below is documented; values are defaults.

# Section: connection
database:
  # Host name or address.
  host: database.internal   # resolved by the service mesh
  port: 5022  #no space after the hash
  url: "http://database.internal/#fragment"  # the hash inside quotes is not a comment
  password: 'p#ss22'

  # Timeouts in seconds.
  timeouts:
    connect: 2
    # read timeout applies per request
    read: 66
    # trailing comment of the timeouts map

  # Replicas, in priority order.
  replicas:
  # first replica is the primary
  - primary.database.internal
  - secondary.database.internal   # same zone

  # a blank line separates this comment from the item
  - tertiary.database.internal
  # comment after the last item
  flags: [  # flow sequence over several lines
    alpha,  # first
    beta,
    # standalone comment inside a flow sequence
    gamma
  ]
  limits: {
    max: 2200,  # upper bound
    min: 1
  }
#   comment at column zero inside the database map
  enabled: true

# Section: observability
metrics:
  enabled: true  # toggled per environment
  labels:
  - service=database      # aligned
  - version=22      # aligned
# End of file comment.
# Second trailing line.
