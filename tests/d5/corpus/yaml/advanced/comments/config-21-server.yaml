# Configuration of the server subsystem.
#
# Every key below is documented; values are defaults.

--- # document marker with a trailing comment
# Section: connection
server:
  # Host name or address.
  host: server.internal   # resolved by the service mesh
  port: 5021  #no space after the hash
  url: "http://server.internal/#fragment"  # the hash inside quotes is not a comment
  password: 'p#ss21'

  # Timeouts in seconds.
  timeouts:
    connect: 1
    # read timeout applies per request
    read: 63
    # trailing comment of the timeouts map

  # Replicas, in priority order.
  replicas:
    # first replica is the primary
    - primary.server.internal
    - secondary.server.internal   # same zone

    # a blank line separates this comment from the item
    - tertiary.server.internal
    # comment after the last item
  flags: [  # flow sequence over several lines
    alpha,  # first
    beta,
    # standalone comment inside a flow sequence
    gamma
  ]
  limits: {
    max: 2100,  # upper bound
    min: 1
  }
  script: |  # comment after a block scalar header
    # this line is content, not a comment
    run --server
#   comment at column zero inside the server map
  enabled: true

# Section: observability
metrics:
  enabled: false  # toggled per environment
  labels:
    - service=server      # aligned
    - version=21      # aligned
# End of file comment.
