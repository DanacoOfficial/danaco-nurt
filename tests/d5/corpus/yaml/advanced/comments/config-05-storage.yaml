# Configuration of the storage subsystem.
#
# Every key below is documented; values are defaults.

# Section: connection
storage:
  # Host name or address.
  host: storage.internal   # resolved by the service mesh
  port: 5005  #no space after the hash
  url: "http://storage.internal/#fragment"  # the hash inside quotes is not a comment
  password: 'p#ss5'

  # Timeouts in seconds.
  timeouts:
    connect: 6
    # read timeout applies per request
    read: 15
    # trailing comment of the timeouts map

  # Replicas, in priority order.
  replicas:
    # first replica is the primary
    - primary.storage.internal
    - secondary.storage.internal   # same zone

    # a blank line separates this comment from the item
    - tertiary.storage.internal
    # comment after the last item
  flags: [  # flow sequence over several lines
    alpha,  # first
    beta,
    # standalone comment inside a flow sequence
    gamma
  ]
  limits: {
    max: 500,  # upper bound
    min: 1
  }
  script: |  # comment after a block scalar header
    # this line is content, not a comment
    run --storage
#   comment at column zero inside the storage map
  enabled: true

# Section: observability
metrics:
  enabled: false  # toggled per environment
  labels:
    - service=storage      # aligned
    - version=5      # aligned
# End of file comment.
