# Configuration of the queue subsystem.
#
# Every key below is documented; values are defaults.

# Section: connection
queue:
  # Host name or address.
  host: queue.internal   # resolved by the service mesh
  port: 5013  #no space after the hash
  url: "http://queue.internal/#fragment"  # the hash inside quotes is not a comment
  password: 'p#ss13'

  # Timeouts in seconds.
  timeouts:
    connect: 7
    # read timeout applies per request
    read: 39
    # trailing comment of the timeouts map

  # Replicas, in priority order.
  replicas:
    # first replica is the primary
    - primary.queue.internal
    - secondary.queue.internal   # same zone

    # a blank line separates this comment from the item
    - tertiary.queue.internal
    # comment after the last item
  flags: [  # flow sequence over several lines
    alpha,  # first
    beta,
    # standalone comment inside a flow sequence
    gamma
  ]
  limits: {
    max: 1300,  # upper bound
    min: 1
  }
  script: |  # comment after a block scalar header
    # this line is content, not a comment
    run --queue
#   comment at column zero inside the queue map
  enabled: true

# Section: observability
metrics:
  enabled: false  # toggled per environment
  labels:
    - service=queue      # aligned
    - version=13      # aligned
# End of file comment.
