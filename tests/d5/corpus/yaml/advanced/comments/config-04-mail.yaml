# Configuration of the mail subsystem.
#
# Every key below is documented; values are defaults.

# Section: connection
mail:
  # Host name or address.
  host: mail.internal   # resolved by the service mesh
  port: 5004  #no space after the hash
  url: "http://mail.internal/#fragment"  # the hash inside quotes is not a comment
  password: 'p#ss4'

  # Timeouts in seconds.
  timeouts:
    connect: 5
    # read timeout applies per request
    read: 12
    # trailing comment of the timeouts map

  # Replicas, in priority order.
  replicas:
  # first replica is the primary
  - primary.mail.internal
  - secondary.mail.internal   # same zone

  # a blank line separates this comment from the item
  - tertiary.mail.internal
  # comment after the last item
  flags: [  # flow sequence over several lines
    alpha,  # first
    beta,
    # standalone comment inside a flow sequence
    gamma
  ]
  limits: {
    max: 400,  # upper bound
    min: 1
  }
#   comment at column zero inside the mail map
  enabled: true

# Section: observability
metrics:
  enabled: true  # toggled per environment
  labels:
  - service=mail      # aligned
  - version=4      # aligned
# End of file comment.
