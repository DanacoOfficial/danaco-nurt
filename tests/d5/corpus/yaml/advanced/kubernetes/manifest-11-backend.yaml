apiVersion: v1
kind: Namespace
metadata:
  name: team-backend
  labels: &labels
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: platform
---
# Deployment of the backend component.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: team-backend
  labels:
    app.kubernetes.io/name: backend
    tier: "2"
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend, version: v11}
      annotations:
        prometheus.io/scrape: "true"
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/backend:2.11.0
          args: ["--port=8080", "--log-format=json"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MODE
              value: production
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
          resources:
            limits: {cpu: "4", memory: 704Mi}
            requests: &requests {cpu: 100m, memory: 64Mi}
      tolerations: []
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: team-backend
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
