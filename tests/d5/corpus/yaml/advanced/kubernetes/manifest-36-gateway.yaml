%YAML 1.2
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-gateway
  labels: &labels
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: platform
---
# Deployment of the gateway component.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: team-gateway
  labels:
    app.kubernetes.io/name: gateway
    tier: "0"
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway, version: v36}
      annotations:
        prometheus.io/scrape: "true"
    spec:
      containers:
      - name: gateway
        image: ghcr.io/example/gateway:2.36.0
        args: ["--port=8080", "--log-format=json"]
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: MODE
          value: production
        - name: POD_IP
          valueFrom:
            fieldRef: {fieldPath: status.podIP}
        resources:
          limits: {cpu: "1", memory: 2304Mi}
          requests: &requests {cpu: 100m, memory: 64Mi}
      - name: sidecar
        image: ghcr.io/example/proxy:1.0
        resources:
          requests: *requests
      tolerations: []
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: team-gateway
spec:
  selector:
    app: gateway
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
