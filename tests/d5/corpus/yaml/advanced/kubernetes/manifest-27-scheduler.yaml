--- # Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: team-scheduler
  labels: &labels
    app.kubernetes.io/name: scheduler
    app.kubernetes.io/part-of: platform
---
# Deployment of the scheduler component.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: team-scheduler
  labels:
    app.kubernetes.io/name: scheduler
    tier: "0"
spec:
  replicas: 3
  selector:
    matchLabels: {app: scheduler}
  template:
    metadata:
      labels: {app: scheduler, version: v27}
      annotations:
        prometheus.io/scrape: "true"
    spec:
      containers:
        - name: scheduler
          image: ghcr.io/example/scheduler:2.27.0
          args: ["--port=8080", "--log-format=json"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MODE
              value: production
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
          resources:
            limits: {cpu: "4", memory: 1728Mi}
            requests: &requests {cpu: 100m, memory: 64Mi}
        - name: sidecar
          image: ghcr.io/example/proxy:1.0
          resources:
            requests: *requests
      tolerations: []
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler
  namespace: team-scheduler
spec:
  selector:
    app: scheduler
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
