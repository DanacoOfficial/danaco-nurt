apiVersion: v1
kind: Namespace
metadata:
  name: team-auth
  labels: &labels
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: platform
---
# Deployment of the auth component.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: team-auth
  labels:
    app.kubernetes.io/name: auth
    tier: "1"
spec:
  replicas: 5
  selector:
    matchLabels: {app: auth}
  template:
    metadata:
      labels: {app: auth, version: v19}
      annotations:
        prometheus.io/scrape: "true"
    spec:
      containers:
        - name: auth
          image: ghcr.io/example/auth:2.19.0
          args: ["--port=8080", "--log-format=json"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MODE
              value: production
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
          resources:
            limits: {cpu: "4", memory: 1216Mi}
            requests: &requests {cpu: 100m, memory: 64Mi}
      tolerations: []
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: team-auth
spec:
  selector:
    app: auth
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
...
