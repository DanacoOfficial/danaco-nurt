---
apiVersion: v1
kind: Namespace
metadata:
  name: team-search
  labels: &labels
    app.kubernetes.io/name: search
    app.kubernetes.io/part-of: platform
---
# Deployment of the search component.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: team-search
  labels:
    app.kubernetes.io/name: search
    tier: "1"
spec:
  replicas: 5
  selector:
    matchLabels: {app: search}
  template:
    metadata:
      labels: {app: search, version: v4}
      annotations:
        prometheus.io/scrape: "true"
    spec:
      containers:
      - name: search
        image: ghcr.io/example/search:2.4.0
        args: ["--port=8080", "--log-format=json"]
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: MODE
          value: production
        - name: POD_IP
          valueFrom:
            fieldRef: {fieldPath: status.podIP}
        resources:
          limits: {cpu: "1", memory: 256Mi}
          requests: &requests {cpu: 100m, memory: 64Mi}
      tolerations: []
---
apiVersion: v1
kind: Service
metadata:
  name: search
  namespace: team-search
spec:
  selector:
    app: search
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
...
