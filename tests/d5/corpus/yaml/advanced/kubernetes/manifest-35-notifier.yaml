apiVersion: v1
kind: Namespace
metadata:
  name: team-notifier
  labels: &labels
    app.kubernetes.io/name: notifier
    app.kubernetes.io/part-of: platform
---
# Deployment of the notifier component.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: team-notifier
  labels:
    app.kubernetes.io/name: notifier
    tier: "2"
spec:
  replicas: 1
  selector:
    matchLabels: {app: notifier}
  template:
    metadata:
      labels: {app: notifier, version: v35}
      annotations:
        prometheus.io/scrape: "true"
    spec:
      containers:
        - name: notifier
          image: ghcr.io/example/notifier:2.35.0
          args: ["--port=8080", "--log-format=json"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MODE
              value: production
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
          resources:
            limits: {cpu: "4", memory: 2240Mi}
            requests: &requests {cpu: 100m, memory: 64Mi}
      tolerations: []
---
apiVersion: v1
kind: Service
metadata:
  name: notifier
  namespace: team-notifier
spec:
  selector:
    app: notifier
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
