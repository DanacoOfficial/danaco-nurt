---
apiVersion: v1
kind: Namespace
metadata:
  name: team-gateway
  labels: &labels
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: platform
---
# Deployment of the gateway component.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: team-gateway
  labels:
    app.kubernetes.io/name: gateway
    tier: "2"
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway, version: v26}
      annotations:
        prometheus.io/scrape: "true"
    spec:
      containers:
      - name: gateway
        image: ghcr.io/example/gateway:2.26.0
        args: ["--port=8080", "--log-format=json"]
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: MODE
          value: production
        - name: POD_IP
          valueFrom:
            fieldRef: {fieldPath: status.podIP}
        resources:
          limits: {cpu: "3", memory: 1664Mi}
          requests: &requests {cpu: 100m, memory: 64Mi}
      tolerations: []
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: team-gateway
spec:
  selector:
    app: gateway
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
...
---
# Empty document follows the configuration map.
apiVersion: v1
kind: ConfigMap
metadata: {name: gateway-config, namespace: team-gateway}
data:
  settings.yaml: |
    level: debug
    targets:
      - stdout
---
