---
apiVersion: v1
kind: Namespace
metadata:
  name: team-ingest
  labels: &labels
    app.kubernetes.io/name: ingest
    app.kubernetes.io/part-of: platform
---
# Deployment of the ingest component.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  namespace: team-ingest
  labels:
    app.kubernetes.io/name: ingest
    tier: "2"
spec:
  replicas: 3
  selector:
    matchLabels: {app: ingest}
  template:
    metadata:
      labels: {app: ingest, version: v32}
      annotations:
        prometheus.io/scrape: "true"
    spec:
      containers:
      - name: ingest
        image: ghcr.io/example/ingest:2.32.0
        args: ["--port=8080", "--log-format=json"]
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: MODE
          value: production
        - name: POD_IP
          valueFrom:
            fieldRef: {fieldPath: status.podIP}
        resources:
          limits: {cpu: "1", memory: 2048Mi}
          requests: &requests {cpu: 100m, memory: 64Mi}
      tolerations: []
---
apiVersion: v1
kind: Service
metadata:
  name: ingest
  namespace: team-ingest
spec:
  selector:
    app: ingest
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
