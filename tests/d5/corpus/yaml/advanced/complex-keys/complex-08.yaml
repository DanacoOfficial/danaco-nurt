# Explicit and complex keys, variant 8.
? simple-explicit-8
: value 8
? [a8, b8]
: sequence key
? {x: 8, y: 16}
: mapping key
? |
  block key line 8
: block key value
? explicit-without-value-8
plain: after explicit keys
nested:
  ? - p8
    - q8
  : list key under a map   # comment
