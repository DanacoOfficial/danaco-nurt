# Explicit and complex keys, variant 10.
? simple-explicit-10
: value 10
? [a10, b10]
: sequence key
? {x: 10, y: 20}
: mapping key
? |
  block key line 10
: block key value
? explicit-without-value-10
plain: after explicit keys
nested:
  ? - p10
    - q10
  : list key under a map   # comment
