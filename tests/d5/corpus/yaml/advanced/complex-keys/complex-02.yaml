# Explicit and complex keys, variant 2.
? simple-explicit-2
: value 2
? [a2, b2]
: sequence key
? {x: 2, y: 4}
: mapping key
? |
  block key line 2
: block key value
? explicit-without-value-2
plain: after explicit keys
nested:
  ? - p2
    - q2
  : list key under a map   # comment
