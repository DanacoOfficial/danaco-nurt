# Explicit and complex keys, variant 7.
? simple-explicit-7
: value 7
? [a7, b7]
: sequence key
? {x: 7, y: 14}
: mapping key
? |
  block key line 7
: block key value
? explicit-without-value-7
plain: after explicit keys
