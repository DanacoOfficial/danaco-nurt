# Explicit and complex keys, variant 4.
? simple-explicit-4
: value 4
? [a4, b4]
: sequence key
? {x: 4, y: 8}
: mapping key
? |
  block key line 4
: block key value
? explicit-without-value-4
plain: after explicit keys
nested:
  ? - p4
    - q4
  : list key under a map   # comment
