# Explicit and complex keys, variant 9.
? simple-explicit-9
: value 9
? [a9, b9]
: sequence key
? {x: 9, y: 18}
: mapping key
? |
  block key line 9
: block key value
? explicit-without-value-9
plain: after explicit keys
flow: {[1, 9]: pair, ? q9 : explicit in flow}
