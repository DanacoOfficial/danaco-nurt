[core]
    bare = false
    editor = vim
[remote "origin"]
    url = https://example.org/repo1.git
    fetch = +refs/heads/*:refs/remotes/origin/*
# global settings
[pull]
    rebase = true
[remote "upstream"]
    url = https://example.org/upstream.git
    fetch = +refs/heads/*:refs/remotes/upstream/*
    fetch = +refs/tags/*:refs/tags/*
