[package]
name = "demo"
version = "0.3.1"
edition = "2024"
# Keep in sync with rust-toolchain.toml.
rust-version = "1.85"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml_edit = "0.25"

[dev-dependencies]
proptest = "1"

[features]
default = ["std"]
std = []

[profile.release]
lto = "thin"
codegen-units = 1
