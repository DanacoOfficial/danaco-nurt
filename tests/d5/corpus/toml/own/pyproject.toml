[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sample"
version = "2.1.0"
description = 'A sample package'
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "click~=8.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "coverage[toml]"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
