# Cross-system test matrix of the system, administration, package, network,
# schedule and program commands and of the background service.
#
# [[suite]]    named set of tests run by run-linux.sh, run-windows.ps1 and
#              run-macos.sh; `test_arguments` follow `--` of `cargo test`.
# [[case]]     one test of one command. `level` is `native` (synthetic data,
#              doubles, loopback servers), `system` (the running system),
#              `differential` (comparison with a system program, skipped when
#              the program is missing) or `os_only` (the command reports
#              `E_OS_ONLY`). `systems` lists the systems whose run executes
#              the case. `requires` describes the precondition that a test
#              marked `#[ignore]` checks before it runs.
# [[scenario]] end-to-end scenario with the tests that implement it; `gap`
#              describes the part that no test covers yet.
#
# The static test `matrix_covers_all_36_commands` checks that every command
# has a case on every system that runs it and an `os_only` case on every
# other system, and that every named test exists.

[[suite]]
name = "container"
test_arguments = ""
description = "tests that need neither the running system nor privileges"

[[suite]]
name = "system"
test_arguments = "--include-ignored"
description = "all tests, including the tests of the running system"

[[suite]]
name = "scenarios"
test_arguments = "--ignored"
description = "only the tests of the running system"

