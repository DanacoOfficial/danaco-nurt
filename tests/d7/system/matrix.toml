# Scenarios

[[scenario]]
name = "e2e_linux_cron_restart"
systems = ["linux"]
tests = [{ crate = "nurt-sys", test = "it_systemd_restart_cron_running_after" }]

[[scenario]]
name = "e2e_linux_schedule_every_30s_10min_with_service_restart"
systems = ["linux"]
tests = [
  { crate = "nurt-service", test = "e2e_linux_schedule_every_30s_10min_with_service_restart" },
]

[[scenario]]
name = "e2e_linux_logs_unit_matches_journalctl_json"
systems = ["linux"]
tests = [
  { crate = "nurt-syslog", test = "reader_matches_journalctl_on_the_local_journal" },
  { crate = "nurt-syslog", test = "reader_matches_journalctl_on_writer_files" },
]
gap = "the comparison reads the journal files directly; the logs stage with unit cron.service is compared once the stage is registered"

[[scenario]]
name = "e2e_linux_user_mode_linger_survives_logout"
systems = ["linux"]
tests = [
  { crate = "nurt-service", test = "e2e_linux_user_mode_linger_survives_logout" },
]

[[scenario]]
name = "e2e_windows_test_service_lifecycle"
systems = ["windows"]
tests = [
  { crate = "nurt-sys", test = "it_scm_lists_spooler" },
  { crate = "nurt-sys", test = "restart_stops_waits_and_starts" },
]
gap = "start, restart and disable of a test service installed through the service control manager need a test service program"

[[scenario]]
