[[scenario]]
name = "parity_ty_01_04"
systems = ["linux"]
tests = [
  { crate = "nurt-sys", test = "it_host_matches_uname_id_differential" },
  { crate = "nurt-sys", test = "it_processes_cpu_percent_busy_loop" },
  { crate = "nurt-sys", test = "sleep_cancel_returns_cancelled_within_100ms" },
  { crate = "nurt-sys", test = "it_apt_list_matches_dpkg_query" },
]
gap = "the outdated packages are not compared with apt list --upgradable"

[[scenario]]
name = "e2e_os_only_on_foreign_systems"
systems = ["linux", "macos"]
tests = [
  { crate = "nurt-sys", test = "cim_non_windows_os_only" },
  { crate = "nurt-sys", test = "registry_path_on_linux_os_only" },
  { crate = "nurt-sys", test = "environment_scope_user_on_linux_os_only" },
]

[[scenario]]
name = "service_system_mode_on_three_systems"
systems = ["linux", "windows", "macos"]
tests = [
  { crate = "nurt-service", test = "e2e_linux_system_mode_service_runs" },
  { crate = "nurt-service", test = "e2e_windows_system_mode_service_runs" },
]
gap = "a restart of the operating system with the service installed in mode system runs only on a virtual machine; macOS mode system is not tested"

[[scenario]]
name = "windows_user_mode_task_scheduler"
systems = ["windows"]
tests = [
  { crate = "nurt-service", test = "it_windows_user_mode_task_scheduler" },
]

