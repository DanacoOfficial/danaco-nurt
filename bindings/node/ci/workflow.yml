name: node-binding

on:
  push:
    branches: [main]
    paths:
      - "bindings/node/**"
      - "spec/schemas/**"
  pull_request:
    paths:
      - "bindings/node/**"
      - "spec/schemas/**"
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag whose executables are packed, for example v0.1.0"
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: bindings/node

jobs:
  test:
    name: test (${{ matrix.os }}, Node.js ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        node: ["18", "20", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install development dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run build
      - name: Test with coverage
        run: node scripts/run-tests.mjs --experimental-test-coverage

  runtimes:
    name: runtime (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run build
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - if: matrix.runtime == 'bun'
        name: Smoke test in Bun
        run: bun test/runtime-smoke.mjs
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'deno'
        name: Smoke test in Deno
        run: deno run --allow-read --allow-env --allow-run --allow-sys=uid,gid test/runtime-smoke.mjs

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the Rust toolchain of rust-toolchain.toml
        working-directory: .
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build nurt-conformance
        working-directory: .
        run: cargo build --locked -p nurt-conformance
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run build
      - name: Run the conformance cases of the bindings
        env:
          NURT_CONFORMANCE_EXECUTABLE: ${{ github.workspace }}/target/debug/nurt-conformance
        run: node --test test/conformance.test.mjs

  addon:
    name: addon (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the Rust toolchain of rust-toolchain.toml
        working-directory: .
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the addon
        working-directory: .
        run: cargo build --locked --release -p nurt-node
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run build
      - name: Test the library backend with the built addon
        env:
          ADDON_DIRECTORY: ${{ github.workspace }}/target/release
        run: |
          case "$RUNNER_OS" in
            Windows) built="$ADDON_DIRECTORY/nurt_node.dll" ;;
            macOS) built="$ADDON_DIRECTORY/libnurt_node.dylib" ;;
            *) built="$ADDON_DIRECTORY/libnurt_node.so" ;;
          esac
          cp "$built" "$RUNNER_TEMP/nurt.node"
          NURT_LIBRARY="$RUNNER_TEMP/nurt.node" node test/addon-smoke.mjs

  serve:
    name: serve (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the Rust toolchain of rust-toolchain.toml
        working-directory: .
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build nurt
        working-directory: .
        run: cargo build --locked -p nurt-cli
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run build
      - name: Test the process backend against nurt serve
        env:
          NURT_BIN_DIRECTORY: ${{ github.workspace }}/target/debug
        run: |
          case "$RUNNER_OS" in
            Windows) built="$NURT_BIN_DIRECTORY/nurt.exe" ;;
            *) built="$NURT_BIN_DIRECTORY/nurt" ;;
          esac
          NURT_BIN="$built" node test/serve-smoke.mjs

  pack:
    needs: [test, runtimes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run build
      - name: Download and verify the release executables
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          version="${RELEASE#v}"
          assets="$RUNNER_TEMP/release"
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --dir "$assets" \
            --pattern "nurt-${version}-*" --pattern checksums.txt
          node scripts/set-version.mjs "$version"
          node scripts/stage-binaries.mjs --assets "$assets" --version "$version"
      - name: Pack the packages
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          node scripts/prepare-pack.mjs
          npm pack --pack-destination "$RUNNER_TEMP/packages"
          if [ -n "$RELEASE" ]; then
            for directory in npm/*/; do
              npm pack "./$directory" --pack-destination "$RUNNER_TEMP/packages"
            done
          fi
      - name: Check the contents of the packages
        run: |
          status=0
          for tarball in "$RUNNER_TEMP"/packages/*.tgz; do
            listing="$(tar -tzf "$tarball")"
            required="package/package.json package/README.md package/LICENSE package/NOTICE"
            case "$(basename "$tarball")" in
              nurt-[0-9]*) required="$required package/bin/nurt.js package/dist/index.js package/dist/index.d.ts package/esm/index.mjs package/esm/index.d.mts" ;;
              nurt-win32-*) required="$required package/bin/nurt.exe" ;;
              *) required="$required package/bin/nurt" ;;
            esac
            for file in $required; do
              if ! grep -qx "$file" <<<"$listing"; then
                echo "::error::$(basename "$tarball") does not contain $file"
                status=1
              fi
            done
            if grep -q '^package/\(src\|test\|scripts\|ci\)/' <<<"$listing"; then
              echo "::error::$(basename "$tarball") contains sources or tests"
              status=1
            fi
          done
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-packages
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error

