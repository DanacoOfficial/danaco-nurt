name: python-binding

on:
  push:
    paths:
      - "bindings/python/**"
      - "crates/nurt-ffi/include/nurt.h"
      - "spec/schemas/**"
      - "conformance/bindings/**"
  pull_request:
    paths:
      - "bindings/python/**"
      - "crates/nurt-ffi/include/nurt.h"
      - "spec/schemas/**"
      - "conformance/bindings/**"
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    working-directory: bindings/python

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Build the conformance server
        working-directory: .
        run: cargo build -p nurt-conformance
      - name: Compile
        run: python -m compileall -q src tools tests
      - name: Test
        run: python -m unittest discover -s tests -v

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install checkers
        run: python -m pip install mypy ruff
      - name: Types are up to date
        run: python tools/gen_types.py --check
      - name: mypy
        run: python -m mypy
      - name: ruff
        run: python -m ruff check src tools tests

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Build source distribution
        run: |
          python -m pip install build twine
          python -m build --sdist --outdir dist .
          python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-sdist
          path: bindings/python/dist/*.tar.gz

  wheels:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Download and verify release artifacts
        run: |
          mkdir -p downloads
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloads \
            --pattern 'nurt-*.tar.gz' --pattern 'nurt-*.zip' --pattern 'checksums.txt'
          (cd downloads && for archive in nurt-*; do grep -qE "^[0-9a-f]{64} [ *]${archive}$" checksums.txt || { echo "${archive} is not listed in checksums.txt" >&2; exit 1; }; done && sha256sum --check --ignore-missing --strict checksums.txt)
      - name: Arrange artifacts by target
        run: |
          version="${TAG#v}"
          for archive in downloads/nurt-"$version"-*; do
            name="$(basename "$archive")"
            target="${name#nurt-$version-}"
            target="${target%.tar.gz}"
            target="${target%.zip}"
            mkdir -p "unpacked/$target" "artifacts/$target"
            case "$archive" in
              *.zip) unzip -q "$archive" -d "unpacked/$target" ;;
              *) tar -xzf "$archive" -C "unpacked/$target" ;;
            esac
            find "unpacked/$target" -type f \( -name nurt -o -name nurt.exe -o -name libnurt.so.1 \
              -o -name libnurt.1.dylib -o -name nurt.dll \) -exec cp {} "artifacts/$target/" \;
          done
          for archive in downloads/nurt-lib-"$version"-*; do
            name="$(basename "$archive")"
            target="${name#nurt-lib-$version-}"
            target="${target%.tar.gz}"
            target="${target%.zip}"
            mkdir -p "unpacked-lib/$target" "artifacts/$target"
            case "$archive" in
              *.zip) unzip -q "$archive" -d "unpacked-lib/$target" ;;
              *) tar -xzf "$archive" -C "unpacked-lib/$target" ;;
            esac
            find "unpacked-lib/$target" -type f \( -name libnurt.so.1 -o -name libnurt.1.dylib -o -name nurt.dll \) \
              -exec cp {} "artifacts/$target/" \;
          done
      - name: Version matches the release
        run: test "v$(python -c 'import re;print(re.search(r"\"(.+)\"", open("src/nurt/_version.py").read())[1])')" = "$TAG"
      - name: Build wheels
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python tools/build_wheels.py --artifacts artifacts --out dist
          python -m pip install twine
          python -m twine check dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-wheels
          path: bindings/python/dist/*.whl
