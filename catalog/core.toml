default = "both"
values = ["both", "stdout", "stderr"]
summary = "Output stream to read."

[[command.param]]
name = "since"
type = "text"
summary = "Cursor of an earlier read; only newer output is returned."

[[command.param]]
name = "wait"
type = "duration"
default = "0s"
waits = true
summary = "Time to wait for the job to finish."

[[command.param]]
name = "view"
type = "enum(status|output|result)"
default = "status"
values = ["status", "output", "result"]
summary = "State, output, or final result of the job."

[[command.param]]
name = "filter"
type = "regex"
summary = "Return only output lines that match."

[[command.param]]
name = "context"
type = "int"
default = "0"
summary = "Lines of context around lines matching filter."

[[command.param]]
name = "dedupe"
type = "bool"
default = "false"
summary = "Collapse repeated identical output lines."

[[command]]
