[[command.param]]
name = "validate"
type = "enum(off|warn|reject)"
default = "reject"
values = ["off", "warn", "reject"]
summary = "Roll back a change that adds a new syntax error to a known format."

[[command.param]]
name = "if_match"
type = "text"
summary = "Expected etag of the file."

[[command.form]]
