values = ["command", "group", "error", "skill", "syntax", "corrections"]
summary = "Kind of the topic."

[[command.param]]
name = "group"
type = "text"
exclusive_group = "subject"
summary = "Group to describe, the same as kind: group."

[[command.param]]
name = "skill"
type = "text"
exclusive_group = "subject"
summary = "Guide to show, the same as kind: skill."

[[command.param]]
name = "search"
type = "text"
