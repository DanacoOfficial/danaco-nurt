[[command]]
name = "help"
category = "help"
reversibility = "read"
effect = "read"
implementation = "builtin"
input = ["none"]
output = ["text"]
summary = "Describe commands, groups, errors, guides, the syntax and corrections."

[[command.param]]
name = "topic"
type = "text"
position = 1
exclusive_group = "subject"
