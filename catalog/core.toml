# Programs, jobs, the journal and help.

[[command]]
name = "run"
category = "run"
reversibility = "reversible_if_preserved"
effect = "process"
implementation = "user_program"
input = ["none", "entry", "match"]
output = ["exec", "job"]
summary = "Run a program without a shell; after wait it continues as a background job."
reversibility_note = "Changes of files under watch are reversible when their previous content was kept; effects outside the file system are irreversible."

[[command.param]]
name = "command"
type = "list<text>"
position = 1
required = true
per_record = true
summary = "Program and arguments; the first element is the program."

[[command.param]]
name = "cwd"
type = "path"
required = true
default_from = "base"
summary = "Working directory of the program."

[[command.param]]
name = "env"
type = "map<text>"
summary = "Environment variables to set."

[[command.param]]
name = "inherit_env"
type = "enum(all|none)"
default = "all"
values = ["all", "none"]
summary = "Inherit the environment of the console or start with an empty one."

[[command.param]]
name = "stdin"
type = "text | path"
summary = "Text or file given on standard input; the input is empty otherwise."

[[command.param]]
name = "timeout"
type = "duration"
default = "120s"
summary = "Time limit of the program."

[[command.param]]
name = "idle_timeout"
type = "duration"
default = "60s"
summary = "Time limit without output."

[[command.param]]
name = "wait"
type = "duration | enum(forever)"
default = "3s"
values = ["forever"]
waits = true
summary = "Time to wait for the program before it continues as a job; forever waits until timeout."

[[command.param]]
name = "background"
type = "bool"
default = "false"
summary = "Start as a job at once, the same as wait: 0s."

[[command.param]]
name = "merge_stderr"
type = "bool"
default = "false"
summary = "Merge standard error into standard output."

[[command.param]]
name = "show"
type = "enum(auto|both|stdout|stderr|errors|summary|none)"
default = "auto"
values = ["auto", "both", "stdout", "stderr", "errors", "summary", "none"]
summary = "Output returned in the result; the full output is always kept in a file."

[[command.param]]
name = "head"
type = "int"
default = "20"
summary = "Number of first output lines returned."

[[command.param]]
name = "tail"
type = "int"
default = "40"
summary = "Number of last output lines returned."

[[command.param]]
name = "filter"
type = "regex"
summary = "Return only output lines that match."

[[command.param]]
name = "context"
type = "int"
default = "0"
summary = "Lines of context around lines matching filter."

[[command.param]]
name = "dedupe"
type = "bool"
default = "false"
summary = "Collapse repeated identical output lines."

[[command.param]]
name = "quiet_on_success"
type = "bool"
default = "false"
summary = "Return no output when the exit code is 0."

[[command.param]]
name = "output_encoding"
type = "text"
default = '"auto"'
summary = "Encoding of the program output; auto detects it."

[[command.param]]
name = "watch"
type = "list<path>"
default_from = "cwd"
summary = "Directories in which changes made by the program are detected."

[[command.param]]
name = "track_changes"
type = "enum(auto|scan|events|none)"
default = "auto"
values = ["auto", "scan", "events", "none"]
summary = "Method of detecting changes made by the program."

[[command.param]]
name = "max_cpu"
type = "duration"
summary = "Limit of processor time."

[[command.param]]
name = "max_memory"
type = "size"
summary = "Limit of memory."

[[command.param]]
name = "priority"
type = "enum(low|normal|high)"
default = "normal"
values = ["low", "normal", "high"]
summary = "Scheduling priority."

[[command.param]]
name = "label"
type = "text"
summary = "Short name of the job."

[[command.param]]
name = "description"
type = "text"
summary = "Description of the job."

[[command.param]]
name = "progress"
type = "regex"
summary = "Pattern of output lines that report progress."

[[command.param]]
name = "summary"
type = "list<regex>"
summary = "Patterns whose latest matches form the status line."

[[command.param]]
name = "batch"
type = "int"
summary = "Run the program once per batch of this many input arguments."

[[command.param]]
name = "parallel"
type = "int"
default = "1"
summary = "Number of batches run at the same time; results keep the batch order."

[[command.param]]
name = "bail"
type = "bool"
default = "false"
summary = "Stop starting batches after the first failed batch."

[[command]]
name = "jobs"
category = "source"
reversibility = "read"
effect = "read"
implementation = "builtin"
input = ["none"]
output = ["job"]
summary = "Read the state, output or result of background jobs."

[[command.param]]
