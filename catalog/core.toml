format = "nurt-catalog/1"
group = "core"
summary = "Core commands for files, text, records, programs, the journal and help."

# Sources of files and content.

[[command]]
name = "list"
category = "source"
reversibility = "read"
effect = "read"
implementation = "builtin"
input = ["none"]
output = ["entry", "registry_value"]
summary = "List the entries of a directory."

[[command.param]]
name = "path"
type = "path"
position = 1
required = true
summary = "Directory to list."

[[command.param]]
name = "depth"
type = "int"
default = "1"
summary = "Number of directory levels to list."

[[command.param]]
name = "type"
type = "enum(file|directory|link|any)"
default = "any"
values = ["file", "directory", "link", "any"]
summary = "Kind of entries to list."

[[command.param]]
name = "hidden"
type = "bool"
default = "true"
summary = "Include hidden entries."

[[command.param]]
name = "sort"
type = "enum(name|modified|size|type)"
default = "name"
values = ["name", "modified", "size", "type"]
summary = "Sort key of the entries."

[[command.param]]
name = "order"
type = "enum(asc|desc)"
default = "asc"
values = ["asc", "desc"]
summary = "Sort order."

[[command.param]]
name = "view"
type = "enum(flat|tree|sizes)"
default = "flat"
values = ["flat", "tree", "sizes"]
summary = "Flat list, tree, or tree with directory size totals."

[[command]]
name = "find"
category = "source"
reversibility = "read"
effect = "read"
implementation = "builtin"
input = ["none"]
output = ["entry", "registry_value"]
summary = "Find entries under a directory by name pattern and attributes."

[[command.param]]
name = "path"
type = "path"
position = 1
required = true
summary = "Directory to search."

[[command.param]]
name = "glob"
type = "glob | list<glob>"
position = 2
default = '"**"'
summary = "Name patterns relative to the directory."

[[command.param]]
name = "type"
type = "enum(file|directory|link|any)"
default = "file"
values = ["file", "directory", "link", "any"]
summary = "Kind of entries to find."

[[command.param]]
name = "depth"
type = "int"
unbounded_default = true
summary = "Maximum number of directory levels to descend."

[[command.param]]
name = "hidden"
type = "bool"
default = "true"
summary = "Include hidden entries."

[[command.param]]
name = "follow_links"
type = "bool"
default = "false"
summary = "Descend into linked directories."

[[command.param]]
name = "gitignore"
type = "bool"
default = "false"
summary = "Apply the rules of .gitignore files."

[[command.param]]
name = "exclude"
type = "list<glob>"
default = "[]"
summary = "Patterns to exclude, in gitignore syntax; a leading ! restores a match."

[[command.param]]
name = "exclude_preset"
type = "list<enum(vcs|deps|build|cache)>"
default = "[]"
values = ["vcs", "deps", "build", "cache"]
summary = "Predefined exclusions: version control, dependencies, build output, caches."

[[command.param]]
name = "file_type"
type = "list<text>"
default = "[]"
summary = "File types by extension, such as go or ts."

[[command.param]]
name = "fuzzy"
type = "text"
summary = "Rank entries by similarity of their name to this text."

[[command.param]]
name = "case_sensitive"
type = "bool"
default = "true"
summary = "Match name patterns with case sensitivity."

[[command.param]]
name = "sort"
type = "enum(path|modified|size|rank)"
default = "path"
values = ["path", "modified", "size", "rank"]
summary = "Sort key; rank orders by fuzzy similarity."

[[command.param]]
name = "order"
type = "enum(asc|desc)"
default = "asc"
values = ["asc", "desc"]
summary = "Sort order."

[[command.param]]
name = "view"
type = "enum(flat|tree|sizes)"
default = "flat"
values = ["flat", "tree", "sizes"]
summary = "Flat list, tree, or tree with directory size totals."

[[command]]
name = "info"
category = "source"
reversibility = "read"
effect = "read"
implementation = "builtin"
input = ["none"]
output = ["entry", "registry_value"]
summary = "Describe paths, including paths that do not exist."

[[command.param]]
name = "path"
type = "list<path>"
position = 1
required = true
repeated = true
summary = "Paths to describe; a missing path gives exists: false."

[[command.param]]
name = "hash"
type = "enum(none|sha256|sha512|sha1|md5|blake3|crc32)"
default = "none"
values = ["none", "sha256", "sha512", "sha1", "md5", "blake3", "crc32"]
summary = "Hash algorithm of the content."

[[command.param]]
name = "details"
type = "list<enum(text|exif|pdf|media|git|symbols)>"
default = "[]"
values = ["text", "exif", "pdf", "media", "git", "symbols"]
summary = "Additional groups of metadata."

[[command.param]]
name = "known"
type = "map<text>"
summary = "Map from path to etag; unchanged paths are reported without details."

[[command]]
name = "read"
category = "source"
reversibility = "read"
effect = "read"
implementation = "builtin"
input = ["none", "entry"]
output = ["content", "item"]
summary = "Read text, images, PDF pages, notebooks or document keys."
required_groups = ["target"]

[[command.param]]
name = "path"
type = "list<path>"
position = 1
repeated = true
exclusive_group = "target"
summary = "Files to read."

[[command.param]]
name = "lines"
type = "range | list<range>"
summary = "Line ranges to read."

[[command.param]]
name = "last"
type = "int"
summary = "Number of last lines to read."

[[command.param]]
name = "around"
type = "text | regex"
summary = "Read the lines around matches of this pattern."

[[command.param]]
name = "context"
type = "int"
default = "3"
summary = "Lines of context around matches of around."

[[command.param]]
name = "symbol"
type = "text"
summary = "Read the definition of this code symbol."

[[command.param]]
name = "section"
type = "text"
summary = "Read the Markdown section with this heading."

[[command.param]]
name = "cell"
type = "int | text"
summary = "Notebook cell by index or identifier."

[[command.param]]
name = "targets"
type = "list<map<any>>"
exclusive_group = "target"
summary = "Selectors per target: path, lines, around, symbol, key, section, cell."

[[command.param]]
name = "key"
type = "key"
summary = "Key path in a structured document; the result is item records."

[[command.param]]
name = "depth"
type = "int"
summary = "Depth of nested values read at key."

[[command.param]]
name = "view"
type = "enum(full|outline|outline_first|symbols|header|hex)"
default = "full"
values = ["full", "outline", "outline_first", "symbols", "header", "hex"]
summary = "Full content, outline, symbols, header or hexadecimal dump."

[[command.param]]
name = "pages"
type = "range | list<range>"
summary = "PDF pages to read."

[[command.param]]
name = "mode"
type = "enum(text|layout|images)"
default = "text"
values = ["text", "layout", "images"]
summary = "Extraction mode of PDF pages."

[[command.param]]
name = "encoding"
type = "text"
default = '"auto"'
summary = "Text encoding; auto detects it."

[[command.param]]
name = "decompress"
type = "enum(auto|none)"
default = "auto"
values = ["auto", "none"]
summary = "Read compressed files after decompressing them on the fly."

[[command.param]]
name = "unchanged_since"
type = "text"
summary = "Etag; an unchanged file is returned without text."

[[command.param]]
name = "since"
type = "text"
summary = "Etag of an earlier read; the result holds the differences since then."

[[command.param]]
name = "known"
type = "map<text>"
summary = "Map from path to etag; unchanged files are skipped."

[[command.param]]
name = "line_numbers"
type = "bool"
default = "false"
summary = "Prefix lines with their numbers."

[[command.param]]
name = "max_line"
type = "int"
unbounded_default = true
summary = "Maximum length of a returned line in characters; longer lines are cut and marked."

[[command.form]]
name = "source"
input = ["none"]
positional = ["path"]
required = ["target"]
summary = "Read the given files or targets."

[[command.form]]
name = "stage"
input = ["entry"]
params = ["lines", "last", "around", "context", "symbol", "section", "cell", "key", "depth", "view", "pages", "mode", "encoding", "decompress", "unchanged_since", "since", "known", "line_numbers", "max_line"]
summary = "Read the files of the input entries."

[[command]]
name = "lines"
category = "source"
reversibility = "read"
effect = "read"
implementation = "builtin"
input = ["none", "entry", "content"]
output = ["line"]
summary = "Produce the lines of a file or of the input content."

[[command.param]]
name = "path"
type = "path"
position = 1
required = true
summary = "File to read in the source form."

[[command.param]]
name = "range"
type = "range"
position = 2
default = "all"
summary = "Line range."

[[command.form]]
name = "source"
input = ["none"]
positional = ["path", "range"]
required = ["path"]
summary = "Produce lines of the given file."

[[command.form]]
name = "stage"
input = ["entry", "content"]
positional = ["range"]
params = ["range"]
summary = "Produce lines of the input files or content."

[[command]]
name = "search"
category = "source"
reversibility = "read"
effect = "read"
implementation = "builtin"
input = ["none", "entry", "content", "line"]
output = ["match", "entry"]
summary = "Search file content for text, regular expressions or syntax patterns."

[[command.param]]
name = "pattern"
type = "text | regex | list<text | regex>"
position = 1
required = true
summary = "Pattern; with a list, counts are given per pattern."

[[command.param]]
name = "path"
type = "list<path>"
position = 2
required = true
repeated = true
summary = "Files or directories to search in the source form."

[[command.param]]
name = "glob"
type = "glob | list<glob>"
default = '"**"'
summary = "Name patterns of the files to search."

[[command.param]]
name = "mode"
type = "enum(auto|literal|regex|syntax)"
default = "auto"
values = ["auto", "literal", "regex", "syntax"]
summary = "Pattern mode; auto treats text as literal and /…/ as a regular expression."

[[command.param]]
name = "case_sensitive"
type = "bool"
default = "true"
summary = "Match with case sensitivity."

[[command.param]]
name = "whole_word"
type = "bool"
default = "false"
summary = "Match whole words only."

[[command.param]]
name = "multiline"
type = "bool"
default = "false"
summary = "Allow matches across lines."

[[command.param]]
name = "invert"
type = "bool"
default = "false"
summary = "Produce the lines that do not match."

[[command.param]]
name = "only_matching"
type = "bool"
default = "false"
summary = "Give only the matched text instead of the whole line."

[[command.param]]
name = "trim"
type = "bool"
default = "false"
summary = "Trim leading and trailing whitespace of lines."

[[command.param]]
name = "dedupe"
type = "bool"
default = "false"
summary = "Drop repeated identical lines."

[[command.param]]
name = "scope"
type = "enum(any|code|comments|strings)"
default = "any"
values = ["any", "code", "comments", "strings"]
summary = "Part of source code in which matches count."

[[command.param]]
name = "enclosing"
type = "bool"
default = "false"
summary = "Add the enclosing code element of each match."

[[command.param]]
name = "max_line"
type = "int"
default = "500"
summary = "Maximum length of a reported line in characters."

[[command.param]]
name = "exclude"
type = "list<glob>"
default = "[]"
summary = "Patterns to exclude, in gitignore syntax."

[[command.param]]
name = "exclude_preset"
type = "list<enum(vcs|deps|build|cache)>"
default = "[]"
values = ["vcs", "deps", "build", "cache"]
summary = "Predefined exclusions: version control, dependencies, build output, caches."

[[command.param]]
name = "context"
type = "int"
default = "0"
summary = "Lines of context before and after each match."

[[command.param]]
name = "before"
type = "int"
summary = "Lines of context before each match."

[[command.param]]
name = "after"
type = "int"
summary = "Lines of context after each match."

[[command.param]]
name = "output"
type = "enum(matches|files|counts|unmatched)"
default = "matches"
values = ["matches", "files", "counts", "unmatched"]
summary = "Matches, matching files, counts per file, or files without matches."

[[command.param]]
name = "max_per_file"
type = "int"
summary = "Maximum number of matches per file; `0` and no value mean no limit."

[[command.param]]
name = "binary"
type = "enum(skip|text)"
default = "skip"
values = ["skip", "text"]
summary = "Skip binary files or search them as text."

[[command.param]]
name = "whitespace"
type = "enum(exact|trailing|indent|normalize)"
default = "exact"
values = ["exact", "trailing", "indent", "normalize"]
summary = "Tolerance of whitespace differences for literal patterns."

[[command.param]]
name = "hidden"
type = "bool"
default = "true"
summary = "Include hidden files."

[[command.param]]
name = "gitignore"
type = "bool"
default = "false"
summary = "Apply the rules of .gitignore files."

[[command.param]]
name = "language"
type = "text"
summary = "Programming language of syntax patterns."

[[command.param]]
name = "file_type"
type = "list<text>"
default = "[]"
summary = "File types by extension, such as go or ts; applies in every output mode."

[[command.param]]
name = "exclude_file_type"
type = "list<text>"
default = "[]"
summary = "File types by extension to leave out."

[[command.param]]
name = "sort"
type = "enum(path|modified|count|rank)"
default = "path"
values = ["path", "modified", "count", "rank"]
summary = "Sort key of the results; rank orders by relevance."

[[command.param]]
name = "adaptive"
type = "bool"
default = "false"
summary = "Fit the result to the limit: full matches for files with most matches, counts for the rest."

[[command.form]]
name = "source"
input = ["none"]
positional = ["pattern", "path"]
required = ["pattern", "path"]
summary = "Search the given files and directories."

[[command.form]]
name = "stage"
input = ["entry", "content", "line"]
positional = ["pattern"]
required = ["pattern"]
params = ["pattern", "glob", "mode", "case_sensitive", "whole_word", "multiline", "invert", "only_matching", "trim", "dedupe", "scope", "enclosing", "max_line", "exclude", "exclude_preset", "context", "before", "after", "output", "max_per_file", "binary", "whitespace", "hidden", "gitignore", "language", "file_type", "exclude_file_type", "sort", "adaptive"]
summary = "Search the input files, content or lines."

# Transformations and checks.

[[command]]
name = "filter"
category = "transform"
reversibility = "read"
effect = "read"
implementation = "builtin"
input = ["any"]
output = ["same"]
summary = "Keep the records that meet a condition."

[[command.param]]
name = "condition"
type = "expression"
position = 1
required = true
summary = "Condition evaluated on each record."

[[command]]
name = "select"
category = "transform"
reversibility = "read"
effect = "read"
implementation = "builtin"
input = ["any"]
output = ["any"]
summary = "Keep the given fields of each record and add computed fields."

[[command.param]]
name = "fields"
type = "list<field | named_expression>"
position = 1
required = true
repeated = true
summary = "Fields to keep and name: expression pairs to compute."

[[command]]
name = "sort"
category = "transform"
reversibility = "read"
effect = "read"
implementation = "builtin"
input = ["any"]
output = ["same"]
summary = "Sort the records by fields."

[[command.param]]
name = "by"
type = "list<field>"
position = 1
required = true
repeated = true
summary = "Fields to sort by, in order of priority."

[[command.param]]
name = "order"
type = "enum(asc|desc)"
default = "asc"
values = ["asc", "desc"]
summary = "Sort order."

[[command]]
name = "first"
category = "transform"
reversibility = "read"
effect = "read"
implementation = "builtin"
input = ["any"]
output = ["same"]
summary = "Keep the first records."

[[command.param]]
name = "count"
type = "int"
position = 1
required = true
summary = "Number of records to keep."

[[command]]
name = "last"
category = "transform"
reversibility = "read"
effect = "read"
implementation = "builtin"
input = ["any"]
output = ["same"]
summary = "Keep the last records."

[[command.param]]
name = "count"
type = "int"
position = 1
required = true
summary = "Number of records to keep."

[[command]]
name = "skip"
category = "transform"
reversibility = "read"
effect = "read"
implementation = "builtin"
input = ["any"]
output = ["same"]
summary = "Drop the first records."

[[command.param]]
name = "count"
type = "int"
position = 1
required = true
summary = "Number of records to drop."

[[command]]
name = "count"
category = "transform"
reversibility = "read"
effect = "read"
implementation = "builtin"
input = ["any"]
output = ["int"]
summary = "Count the records."

[[command]]
name = "assert"
category = "check"
reversibility = "read"
effect = "read"
implementation = "builtin"
input = ["any"]
output = ["same"]
summary = "Stop the program with E_ASSERT unless the records meet one condition."
required_groups = ["condition"]

[[command.param]]
name = "count"
type = "range"
exclusive_group = "condition"
summary = "Expected number of records."

[[command.param]]
name = "paths"
type = "range"
exclusive_group = "condition"
summary = "Expected number of distinct paths."

[[command.param]]
name = "exit_code"
type = "range"
exclusive_group = "condition"
summary = "Expected exit code of the programs run."

[[command.param]]
name = "all"
type = "expression"
exclusive_group = "condition"
summary = "Condition that every record meets."

[[command.param]]
name = "any"
type = "expression"
exclusive_group = "condition"
summary = "Condition that at least one record meets."

[[command.param]]
name = "empty"
type = "bool"
exclusive_group = "condition"
summary = "Whether there are no records."

[[command.param]]
name = "contains"
type = "text"
exclusive_group = "condition"
summary = "Text that the records contain."

[[command.param]]
name = "if_match"
type = "text"
exclusive_group = "condition"
summary = "Expected etag of the input file."

[[command]]
name = "verify"
category = "check"
reversibility = "reversible"
effect = "read"
implementation = "builtin"
input = ["effect"]
output = ["effect"]
summary = "Check a change with a pipeline and roll the change back when the check fails."
reversibility_note = "A failed check rolls back the preceding change from the journal."

[[command.param]]
name = "check"
type = "pipeline"
position = 1
required = true
summary = "Pipeline that checks the result of the change."

# Changes of files and content.

[[command]]
name = "write"
category = "change"
reversibility = "reversible"
effect = "local"
implementation = "builtin"
input = ["none", "any"]
output = ["effect"]
summary = "Write text, bytes or records to a file."
required_groups = ["target"]

[[command.param]]
name = "path"
type = "path"
position = 1
exclusive_group = "target"
summary = "File to write."

[[command.param]]
name = "text"
type = "text"
position = 2
exclusive_group = "content"
summary = "Text to write."

[[command.param]]
name = "mode"
type = "enum(create|overwrite|append|prepend)"
required = true
values = ["create", "overwrite", "append", "prepend"]
summary = "Write mode; there is no default."

[[command.param]]
name = "from"
type = "pipeline | stream<any> | path"
exclusive_group = "content"
summary = "Pipeline, named result or file whose content is written."

[[command.param]]
name = "encoding"
type = "text"
default = '"auto"'
summary = "Text encoding; auto keeps the encoding of an existing file."

[[command.param]]
name = "line_ending"
type = "enum(lf|crlf|cr|keep)"
default = "keep"
values = ["lf", "crlf", "cr", "keep"]
summary = "Line endings of the written text."

[[command.param]]
name = "bom"
type = "bool"
default_note = "as in the existing file"
summary = "Write a byte order mark."

[[command.param]]
name = "parents"
type = "bool"
default = "true"
summary = "Create missing parent directories."

[[command.param]]
name = "ensure_newline"
type = "bool"
default = "false"
summary = "End the file with a line ending."

[[command.param]]
name = "format"
type = "enum(auto|json|yaml|toml|csv|tsv|text)"
default = "auto"
values = ["auto", "json", "yaml", "toml", "csv", "tsv", "text"]
summary = "Serialization of written records; auto follows the file extension."

[[command.param]]
name = "files"
type = "list<map<any>>"
exclusive_group = "target"
summary = "Batch of files written in one transaction, each with path, text and optional mode."

[[command.param]]
name = "value_type"
type = "enum(string|dword|qword|multi_string|expand_string|binary)"
values = ["string", "dword", "qword", "multi_string", "expand_string", "binary"]
summary = "Type of a registry value; only for registry: paths."

[[command.param]]
name = "file_mode"
type = "text"
summary = "Permissions of a new file, such as \"0644\"."

[[command.param]]
name = "size"
type = "size"
exclusive_group = "content"
summary = "Truncate or extend the file to this size."

[[command.param]]
name = "data"
type = "bytes"
exclusive_group = "content"
summary = "Bytes to write."

[[command.param]]
name = "offset"
type = "int"
summary = "Byte offset at which data is written."

[[command.param]]
name = "validate"
type = "enum(off|warn|reject)"
default = "reject"
values = ["off", "warn", "reject"]
summary = "Roll back a write that adds a new syntax error to a known format."

[[command.param]]
name = "if_match"
type = "text | map<text>"
summary = "Expected etag of the file, or a map from path to etag for files."

[[command]]
name = "replace"
category = "change"
reversibility = "reversible"
effect = "local"
implementation = "builtin"
input = ["none", "match", "node", "item", "line", "content"]
output = ["effect"]
summary = "Replace text in files or in the found text."

[[command.param]]
name = "pattern"
type = "text | regex"
position = 1
required = true
summary = "Text or regular expression to replace."

[[command.param]]
name = "with"
type = "text"
position = 2
required = true
summary = "Replacement; $1, ${name} and $$ refer to groups unless template is false."

[[command.param]]
name = "in"
type = "list<path>"
required = true
summary = "Files or directories in the source form."

[[command.param]]
name = "glob"
type = "glob | list<glob>"
default = '"**"'
summary = "Name patterns of the files in directories."

[[command.param]]
name = "mode"
type = "enum(auto|literal|regex|syntax)"
default = "auto"
values = ["auto", "literal", "regex", "syntax"]
summary = "Pattern mode; auto treats text as literal and /…/ as a regular expression."

[[command.param]]
name = "occurrence"
type = "int"
default_note = "every occurrence"
summary = "Replace only this occurrence, counted from 1."

[[command.param]]
name = "case_sensitive"
type = "bool"
default = "true"
summary = "Match with case sensitivity."

[[command.param]]
name = "whole_word"
type = "bool"
default = "false"
summary = "Match whole words only."

[[command.param]]
name = "multiline"
type = "bool"
default = "false"
summary = "Allow matches across lines."

[[command.param]]
name = "whitespace"
type = "enum(exact|trailing|indent|normalize)"
default = "normalize"
values = ["exact", "trailing", "indent", "normalize"]
summary = "Tolerance of whitespace differences; normalize also adapts the replacement to the file style."

[[command.param]]
name = "scope"
type = "enum(any|code|comments|strings)"
default = "any"
values = ["any", "code", "comments", "strings"]
summary = "Part of source code in which matches are replaced."

[[command.param]]
name = "check_references"
type = "bool"
default = "false"
summary = "Report references to the replaced text left after the change."

[[command.param]]
name = "template"
