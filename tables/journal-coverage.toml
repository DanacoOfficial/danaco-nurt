[[row]]
command = "git.stash"
action = "drop"
group = "git"
changes = "A stash entry and the stash log."
preserve = ["ref", "exchange", "replace_backup", "hardlink", "clone", "copy"]
coverage = "full"

[[row]]
command = "git.stash"
action = "clear"
group = "git"
changes = "All stash entries and the stash log."
preserve = ["ref", "moved"]
coverage = "full"

[[row]]
command = "git.pull"
group = "git"
changes = "Remote-tracking references, then the working tree, index and references of the merge."
preserve = ["ref", "append", "exchange", "replace_backup", "hardlink", "clone", "copy", "moved", "created", "meta"]
coverage = "partial"
irreversible = ["remote_ref_updated"]
exception = "The local part is preserved exactly as for a fetch and a merge, in one entry; the network transfer cannot be undone."

[[row]]
command = "git.push"
