changes = "Working tree, index, the stash reference and its log."
preserve = ["ref", "append", "exchange", "replace_backup", "hardlink", "clone", "copy", "moved", "created", "meta"]
coverage = "full"
note = "The changes removed from the working tree are also kept in the journal entry."

[[row]]
command = "git.stash"
action = "pop"
group = "git"
changes = "Working tree, index, the stash reference and its log."
preserve = ["ref", "append", "exchange", "replace_backup", "hardlink", "clone", "copy", "moved", "created", "meta"]
coverage = "full"

[[row]]
