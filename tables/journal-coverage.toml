# Journal coverage table. Every command and every catalog action of the
# categories change and run, and every journal command with an effect, has a
# row that states how the previous content is preserved or why it is not.
# Commands and actions that only read have a row with the coverage no_effect;
# a row without an action covers the default form of the command and every
# form without a row of its own.
# Fields and rules: spec/journal.md, section 13.
#
# The overwrite modes exchange, replace_backup and hardlink keep the old
# content without copying; when they are not possible the journal falls back
# to clone, then copy, then none with an irreversible marker.

format = "nurt-journal-coverage/1"

# These reasons may degrade any row: the journal is inactive on the volume,
# the volume is a network or removable volume, there is no space for the
# copy, the operation exceeds the size limits, or the journal fails while
# recording. The operation is then performed and the target is marked
# irreversible.
generic_irreversible = [
  "journal_inactive",
  "network_volume",
  "removable_volume",
  "no_space_for_copy",
  "too_large_for_journal",
  "journal_error",
]

