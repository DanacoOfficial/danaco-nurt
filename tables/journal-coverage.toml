# Group git. Every write of the repository goes through the transaction:
# references are recorded with their previous value, reference logs as
# appends, the index and other files with their exact previous content.
# Objects are added to the object store outside the journal and stay in the
# repository.

[[row]]
command = "git.branch"
action = "create"
group = "git"
changes = "A new branch reference."
preserve = ["ref"]
coverage = "full"

[[row]]
command = "git.branch"
action = "rename"
group = "git"
changes = "Name of a branch reference, its reference log and configuration."
preserve = ["ref", "rename", "exchange", "replace_backup", "hardlink", "clone", "copy"]
coverage = "full"

[[row]]
command = "git.branch"
action = "delete"
group = "git"
changes = "A branch reference, its reference log and configuration."
preserve = ["ref", "moved", "exchange", "replace_backup", "hardlink", "clone", "copy"]
coverage = "full"

[[row]]
command = "git.branch"
action = "switch"
group = "git"
changes = "A new branch and the working tree, index and HEAD switched to it."
preserve = ["ref", "append", "exchange", "replace_backup", "hardlink", "clone", "copy", "moved", "created", "meta"]
coverage = "full"

[[row]]
command = "git.stage"
action = "add"
group = "git"
changes = "Index of the repository."
preserve = ["exchange", "replace_backup", "hardlink", "clone", "copy"]
coverage = "full"
note = "The index file is preserved as a file."

[[row]]
command = "git.stage"
action = "unstage"
group = "git"
changes = "Index of the repository."
preserve = ["exchange", "replace_backup", "hardlink", "clone", "copy"]
coverage = "full"

[[row]]
command = "git.checkpoint"
action = "create"
group = "git"
changes = "A checkpoint reference outside the branches."
preserve = ["ref"]
coverage = "full"

[[row]]
command = "git.checkpoint"
action = "restore"
group = "git"
changes = "Working tree and optionally the index, restored from a checkpoint."
preserve = ["ref", "append", "exchange", "replace_backup", "hardlink", "clone", "copy", "moved", "created", "meta"]
coverage = "full"
note = "Every file the restore changes or removes is preserved exactly before the change."

[[row]]
command = "git.checkpoint"
action = "delete"
group = "git"
changes = "A checkpoint reference."
preserve = ["ref"]
coverage = "full"

[[row]]
command = "git.worktree"
action = "add"
group = "git"
changes = "A new worktree directory, its registration and branch."
preserve = ["created", "ref"]
coverage = "full"
note = "The new directory is one target created as a tree."

[[row]]
command = "git.worktree"
action = "remove"
group = "git"
changes = "A worktree directory and its registration."
preserve = ["moved"]
coverage = "full"
note = "Both directories are moved into the journal of their own volumes before the registration is removed."

[[row]]
command = "git.commit"
group = "git"
changes = "Branch reference, reference log and index."
preserve = ["ref", "append", "exchange", "replace_backup", "hardlink", "clone", "copy"]
coverage = "full"
note = "Undo moves the reference back; working tree files are not changed and objects stay in the repository."

[[row]]
command = "git.commit"
action = "hooks"
group = "git"
changes = "Files changed by client hooks run before the commit."
preserve = ["clone", "copy", "none"]
coverage = "partial"
irreversible = ["previous_content_not_kept", "external_effect"]
exception = "Client hooks are user programs and are covered as run, with the working tree as the watched scope."

[[row]]
command = "git.tag"
action = "create"
group = "git"
changes = "A new tag reference."
preserve = ["ref"]
coverage = "full"

[[row]]
command = "git.tag"
action = "delete"
group = "git"
changes = "A tag reference."
preserve = ["ref"]
coverage = "full"

[[row]]
command = "git.fetch"
