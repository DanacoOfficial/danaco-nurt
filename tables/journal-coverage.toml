changes = "Remote-tracking references, FETCH_HEAD and objects transferred over the network."
preserve = ["ref", "created", "exchange", "replace_backup", "hardlink", "clone", "copy"]
coverage = "partial"
irreversible = ["remote_ref_updated"]
exception = "Local references and files are preserved; the network transfer cannot be undone."

[[row]]
command = "git.clone"
group = "git"
changes = "A new repository directory."
preserve = ["created"]
coverage = "partial"
irreversible = ["remote_ref_updated"]
exception = "The new directory is recorded as created and undo moves it into the journal; the network transfer cannot be undone."

[[row]]
command = "git.switch"
