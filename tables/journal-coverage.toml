changes = "Working tree, index, HEAD and, when created, a branch reference."
preserve = ["ref", "append", "exchange", "replace_backup", "hardlink", "clone", "copy", "moved", "created", "meta"]
coverage = "full"
note = "Every file the operation changes or removes is preserved exactly; no scanning is needed."

[[row]]
command = "git.restore"
