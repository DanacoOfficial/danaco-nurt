# This file is the source of the journal coverage table. Every command and
# every catalog action of the categories change and run, and every journal
# command with an effect, has a row that states how the previous content is
# preserved or why it is not. The test suite checks the table against the
# catalog.
#
# Row fields:
#   command      Catalog command name.
#   action       Optional action, mode or target variant; a row without an
#                action covers the whole command.
#   group        Catalog group of the command.
#   changes      What the operation changes.
#   preserve     Preservation modes of the journal entry.
#   coverage     The value full, partial, none or no_effect.
#   irreversible Reasons reported for this row in addition to the generic ones.
#   exception    Description of the exception; required for partial and none.
#   note         Optional clarification.
#
# The overwrite modes exchange, replace_backup and hardlink keep the old
# content without copying; when they are not possible the journal falls back
# to clone, then copy, then none with an irreversible marker.

format = "nurt-journal-coverage/1"

# These reasons may degrade any row: the journal is inactive on the volume,
# the volume is a network or removable volume, there is no space for the
# copy, or the operation exceeds the size limits. The operation is then
# performed and the target is marked irreversible.
generic_irreversible = [
  "journal_inactive",
  "network_volume",
  "removable_volume",
  "no_space_for_copy",
  "too_large_for_journal",
]

# Core commands.

[[row]]
command = "verify"
group = "core"
changes = "Targets of the checked operation, restored when the check fails."
preserve = ["moved", "exchange", "replace_backup", "hardlink", "clone", "copy", "created", "meta", "ref", "value", "append", "rename"]
coverage = "full"
note = "A failed check after commit undoes the operation as an undo entry; the current content of the targets is kept in that entry."

[[row]]
command = "write"
action = "create"
group = "core"
changes = "A new file."
preserve = ["created"]
coverage = "full"

[[row]]
command = "write"
action = "overwrite"
group = "core"
changes = "Content of an existing file."
preserve = ["exchange", "replace_backup", "hardlink", "clone", "copy"]
coverage = "full"
note = "A file with several hard links is written in place and its previous content is kept by clone or copy."

[[row]]
command = "write"
action = "append"
group = "core"
changes = "Content appended to the end of a file."
preserve = ["append"]
coverage = "full"
note = "The previous length and the hash of the prefix are recorded; undo truncates."

[[row]]
command = "write"
action = "prepend"
group = "core"
changes = "Content inserted at the start of a file."
preserve = ["exchange", "replace_backup", "hardlink", "clone", "copy"]
coverage = "full"

[[row]]
command = "write"
action = "files"
group = "core"
changes = "Several files written in one transaction."
preserve = ["created", "append", "exchange", "replace_backup", "hardlink", "clone", "copy"]
coverage = "full"
note = "One operation; every file is preserved as for its mode."

[[row]]
command = "write"
action = "size"
group = "core"
changes = "Length of a file, truncated or extended."
preserve = ["exchange", "replace_backup", "hardlink", "clone", "copy", "append"]
coverage = "full"
note = "Truncation is preserved as an overwrite; extension is recorded as an append."

[[row]]
command = "write"
action = "data"
group = "core"
changes = "Bytes written at an offset of a file."
preserve = ["exchange", "replace_backup", "hardlink", "clone", "copy"]
coverage = "full"

[[row]]
command = "write"
action = "registry"
group = "core"
changes = "Keys and values of the registry provider."
preserve = ["value", "created"]
coverage = "full"
note = "The previous type and data of a value, or the subtree of a key, are recorded; a new value is recorded as created."

[[row]]
command = "write"
action = "special_file"
group = "core"
changes = "Data written to a device, FIFO, socket or kernel interface."
preserve = ["external"]
coverage = "none"
irreversible = ["special_file"]
exception = "Writing to a special file is not a change of file content and cannot be preserved; the report also shows the notable effect special_file."

[[row]]
command = "replace"
group = "core"
changes = "Content of files."
preserve = ["exchange", "replace_backup", "hardlink", "clone", "copy"]
coverage = "full"

[[row]]
command = "insert"
group = "core"
changes = "Content of files."
preserve = ["exchange", "replace_backup", "hardlink", "clone", "copy", "append"]
coverage = "full"
note = "Insertion at the end of a file is recorded as an append."

[[row]]
command = "edit"
group = "core"
changes = "Content of a file, all changes or none."
preserve = ["exchange", "replace_backup", "hardlink", "clone", "copy"]
coverage = "full"

[[row]]
command = "copy"
group = "core"
changes = "New entries and overwritten destinations."
preserve = ["created", "exchange", "replace_backup", "hardlink", "clone", "copy"]
coverage = "full"
note = "New entries are recorded as created; overwritten destinations are preserved as for an overwrite."

[[row]]
command = "copy"
action = "registry"
group = "core"
changes = "Keys and values of the registry provider."
preserve = ["value", "created"]
coverage = "full"

[[row]]
command = "move"
group = "core"
changes = "Name and location of entries within one volume; an existing destination may be overwritten."
preserve = ["rename", "moved"]
coverage = "full"
note = "Source and destination are recorded; an overwritten destination is moved into the journal."

[[row]]
command = "move"
action = "cross_volume"
group = "core"
changes = "Entries copied to another volume and removed from the source."
preserve = ["created", "moved", "copy"]
coverage = "full"
note = "The destination is recorded as created and the source is moved into the journal of its own volume; a directory of a lower overlay layer is copied before removal."

[[row]]
command = "move"
action = "registry"
group = "core"
changes = "Keys and values of the registry provider."
preserve = ["value"]
coverage = "full"

[[row]]
command = "remove"
group = "core"
changes = "Files and directories, recursively, as one operation."
preserve = ["moved", "copy"]
coverage = "full"
note = "One rename into the journal per target, also for a directory with millions of files; a directory of a lower overlay layer is copied before removal."

[[row]]
command = "remove"
action = "records"
group = "core"
changes = "Lines, matches, syntax nodes or document keys removed from files."
preserve = ["exchange", "replace_backup", "hardlink", "clone", "copy"]
coverage = "full"

[[row]]
command = "remove"
action = "registry"
group = "core"
changes = "Keys and values of the registry provider."
preserve = ["value"]
coverage = "full"

[[row]]
command = "remove"
action = "job"
group = "core"
changes = "Record and output files of a finished background job."
preserve = ["none"]
coverage = "none"
exception = "Job records and their output files are state of the console, not user data, and are not journaled."

[[row]]
command = "rename"
group = "core"
changes = "Names of entries."
preserve = ["rename", "moved"]
coverage = "full"
note = "An overwritten destination is moved into the journal."

[[row]]
command = "create"
action = "file"
group = "core"
changes = "A new file."
preserve = ["created"]
coverage = "full"

[[row]]
command = "create"
action = "directory"
group = "core"
changes = "A new directory."
preserve = ["created"]
coverage = "full"

[[row]]
command = "create"
action = "link"
group = "core"
changes = "A new symbolic or hard link."
preserve = ["created"]
coverage = "full"

[[row]]
command = "create"
action = "junction"
group = "core"
changes = "A new junction."
preserve = ["created"]
coverage = "full"

[[row]]
command = "create"
action = "temporary"
group = "core"
changes = "A new temporary file or directory."
preserve = ["created"]
coverage = "full"
note = "Temporary directories are often on memory-backed volumes, where the journal is inactive."

[[row]]
command = "create"
action = "touch"
group = "core"
changes = "Timestamps of an existing entry."
preserve = ["meta"]
coverage = "full"

[[row]]
command = "attributes"
group = "core"
changes = "Metadata: mode, account and group of the file, ACL, extended attributes, timestamps, read-only and hidden flags."
preserve = ["meta"]
coverage = "full"
note = "The complete previous metadata is recorded."

[[row]]
command = "run"
group = "core"
changes = "Any files inside and outside the watched scope, and effects outside the file system."
preserve = ["clone", "copy", "none", "external"]
coverage = "partial"
irreversible = ["previous_content_not_kept", "external_effect", "network", "database"]
exception = "Changes are detected by scanning the watched scope; files in that scope are cloned or copied before the start within the configured limits and time budget. Files changed without a preserved copy, changes outside the watched scope and effects outside the file system are marked irreversible."

[[row]]
command = "stop"
group = "core"
changes = "State of processes, jobs and services."
preserve = ["external"]
coverage = "none"
irreversible = ["process_stopped", "service_changed"]
exception = "Stopping a process, job or service has an effect outside the file system."

[[row]]
command = "retry"
group = "core"
changes = "As the command that is run again."
preserve = ["clone", "copy", "none", "external"]
coverage = "partial"
irreversible = ["previous_content_not_kept", "external_effect"]
exception = "Covered as run."

[[row]]
command = "undo"
group = "core"
changes = "Items restored from journal entries."
preserve = ["moved", "exchange", "replace_backup", "hardlink", "clone", "copy", "created", "meta", "ref", "value", "append", "rename"]
coverage = "full"
note = "The current state of every restored item is kept in the undo entry, so the undo can be redone; items of partial entries released for space are reported with released_for_space."

[[row]]
command = "redo"
group = "core"
changes = "Items changed again from an undo entry."
preserve = ["moved", "exchange", "replace_backup", "hardlink", "clone", "copy", "created", "meta", "ref", "value", "append", "rename"]
coverage = "full"

# Group documents.

[[row]]
command = "set"
group = "documents"
changes = "Values at key paths of structured documents, layout preserved."
