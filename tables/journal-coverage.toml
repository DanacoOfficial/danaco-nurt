exception = "A request with side effects changes a remote system."

[[row]]
command = "http.request"
action = "delete"
group = "network"
changes = "State of a remote service."
preserve = ["external"]
coverage = "none"
irreversible = ["network"]
exception = "A request with side effects changes a remote system."

[[row]]
command = "http.request"
action = "options"
group = "network"
changes = "State of a remote service, when the service treats the request as a change."
preserve = ["external"]
coverage = "none"
irreversible = ["network"]
exception = "Only get and head are treated as reads; any other method may change a remote system."

[[row]]
command = "http.download"
group = "network"
changes = "A downloaded file."
preserve = ["created", "append", "exchange", "replace_backup", "hardlink", "clone", "copy"]
coverage = "full"
note = "The file is streamed to a staged file and switched in atomically; a resumed download is recorded as an append."

# Group schedule. Schedule definitions are records of the schedule store in
# the state directory of the user; each change records the previous record.

[[row]]
command = "schedule.create"
group = "schedule"
changes = "A new schedule record."
preserve = ["value"]
coverage = "full"
note = "Undo removes the record; with run_now the action is covered by the rows of its commands."

[[row]]
command = "schedule.remove"
group = "schedule"
changes = "Schedule records."
preserve = ["value"]
coverage = "full"

[[row]]
command = "schedule.pause"
group = "schedule"
changes = "State of schedule records."
preserve = ["value"]
coverage = "full"

[[row]]
command = "schedule.resume"
group = "schedule"
changes = "State of schedule records."
preserve = ["value"]
coverage = "full"

[[row]]
command = "schedule.run"
group = "schedule"
changes = "As the commands of the schedule action."
preserve = ["clone", "copy", "none", "external"]
coverage = "partial"
irreversible = ["previous_content_not_kept", "external_effect"]
exception = "The action runs as an ordinary program; each of its commands is covered by its own row, launched programs as run."

# Group journal. These commands change the state of the journal, not user
# data.

[[row]]
command = "journal.pin"
group = "journal"
changes = "Pin marker of journal entries."
preserve = ["meta"]
coverage = "full"
note = "The previous pin state is recorded; pinning does not protect entries from reclaim for space, and entries that expire after a release are not restored."

[[row]]
command = "journal.limits"
group = "journal"
changes = "Retention limits of the session or of the user configuration file."
preserve = ["meta", "created", "exchange", "replace_backup", "hardlink", "clone", "copy"]
coverage = "partial"
exception = "A changed limit is reversed by setting it again; entries expired by lowered limits are not restored when the limits are raised. With user scope the configuration file is preserved as for an overwrite."

[[row]]
command = "journal.purge"
group = "journal"
changes = "Journal entries released immediately."
preserve = ["none"]
coverage = "none"
irreversible = ["purged"]
exception = "Released entries can no longer be undone; a tombstone remains for history."

# Group verify.

[[row]]
command = "test.run"
group = "verify"
changes = "Files generated by test frameworks (reports, coverage)."
preserve = ["clone", "copy", "none"]
coverage = "partial"
irreversible = ["previous_content_not_kept", "external_effect"]
exception = "The framework is a user program and is covered as run, with the project directory as the watched scope."

[[row]]
command = "test.failed"
group = "verify"
changes = "Files generated by test frameworks (reports, coverage)."
preserve = ["clone", "copy", "none"]
coverage = "partial"
irreversible = ["previous_content_not_kept", "external_effect"]
exception = "The framework is a user program and is covered as run."

[[row]]
command = "analyze.check"
group = "verify"
changes = "Files generated by analyzers (reports, caches)."
preserve = ["clone", "copy", "none"]
coverage = "partial"
irreversible = ["previous_content_not_kept", "external_effect"]
exception = "The analyzers are user programs and are covered as run."

[[row]]
command = "analyze.format"
group = "verify"
changes = "Source files rewritten by formatters."
preserve = ["exchange", "replace_backup", "hardlink", "clone", "copy"]
coverage = "full"
note = "The formatter reads the source and writes the result to its output; the console writes each changed file through the transaction."

[[row]]
command = "analyze.format"
action = "in_place"
group = "verify"
changes = "Source files rewritten in place by formatters without a stream mode."
preserve = ["clone", "copy", "none"]
coverage = "partial"
irreversible = ["previous_content_not_kept"]
exception = "The files to format are known before the formatter runs and are cloned or copied within the configured limits; files beyond the limits are marked irreversible."
