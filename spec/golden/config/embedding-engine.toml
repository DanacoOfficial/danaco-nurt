# Configuration given by an embedding application when it opens the engine
# (the same level as the file named by NURT_CONFIG): protection floors,
# external program catalogs, network volumes and a fixed number of threads.

[journal.floor]
max_ops = 10
max_age = "5m"

[journal.volumes]
network = true

[programs]
catalogs = [
  "/opt/catalogs/tools.json",
  { path = "/opt/catalogs/internal", priority = 10 },
]
help_timeout = "5s"
sources_disabled = ["man"]

[limits]
threads = 8

[session]
ttl = "12h"
