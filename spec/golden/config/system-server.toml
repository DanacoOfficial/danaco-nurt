# System configuration of a server: a size budget of 10 % per volume,
# protection floors that other levels cannot go below, the system service and
# one trusted project. The data volume keeps a longer history.

[scope]
trusted_projects = ["/srv/app"]

[journal]
max_size = "10%"
max_size_min = "2gib"
max_size_max = "50gib"
oversize = "skip"

[journal.floor]
max_ops = 20
max_age = "1h"

[journal.volume."/srv/data"]
enabled = true
max_ops = 100
max_age = "1d"
reserve = "10%"

[space]
reserve = "10%"
reserve_max = "100gib"

[service]
mode = "system"

[log]
level = "info"
