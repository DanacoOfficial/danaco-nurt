# Configuration of OpenHands that adds the nurt tool through the Model Context
# Protocol. Merge the section into the config.toml of the OpenHands installation.

[mcp]
stdio_servers = [
  { name = "nurt", command = "nurt", args = ["mcp", "--stdio"] },
]
