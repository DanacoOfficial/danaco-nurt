# The tests that read inputs which once made correction run without end have
# no time limit of their own, because a limit measured in the test depends on
# the load of the machine. The runner stops such a test after two minutes.
[[profile.default.overrides]]
filter = "package(nurt-correct) & (binary(lexical_regressions) | binary(lexical_front) | binary(powershell_translate))"
slow-timeout = { period = "30s", terminate-after = 4 }

# The nurt-proc tests start the `proc_fixture` example from the `examples`
# directory next to the test binaries. `cargo test --no-run` builds it, but an
# archive carries test binaries only, so the example travels as an included
# path for the native and the cross-compiled targets.
[profile.default.archive]
include = [
    { path = "debug/examples", relative-to = "target", depth = 1, on-missing = "ignore" },
    { path = "aarch64-unknown-linux-gnu/debug/examples", relative-to = "target", depth = 1, on-missing = "ignore" },
    { path = "x86_64-unknown-linux-gnu/debug/examples", relative-to = "target", depth = 1, on-missing = "ignore" },
]
