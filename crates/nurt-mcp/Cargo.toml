[package]
name = "nurt-mcp"
description = "Model Context Protocol server of Danaco Nurt."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
http = ["dep:axum"]

[dependencies]
nurt-contracts = { workspace = true }
nurt-core = { workspace = true }
nurt-tooldef = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
tracing = { workspace = true }
axum = { workspace = true, optional = true }

[dev-dependencies]
nurt-core = { workspace = true, features = ["fixtures"] }
nurt-testkit = { workspace = true }
tempfile = { workspace = true }

