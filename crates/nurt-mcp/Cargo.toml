[package]
name = "nurt-mcp"
description = "Model Context Protocol server of Danaco Nurt."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
http = ["dep:axum", "dep:uuid"]

[dependencies]
nurt-contracts = { workspace = true }
nurt-tooldef = { path = "../nurt-tooldef", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
tracing = { workspace = true }
axum = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
