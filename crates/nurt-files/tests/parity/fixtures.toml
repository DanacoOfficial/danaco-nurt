# Named file trees shared by scenarios.
# A file holds either literal `content` or a `generate` directive. Directives:
#   big_source:N     TypeScript file with N functions, 5 lines each, after a one-line header
#   png:WxH          PNG header of the given size
#   pdf:TEXT         one-page PDF with the given text
#   notebook:cells4  Jupyter notebook with the cells intro, load, use and tail

