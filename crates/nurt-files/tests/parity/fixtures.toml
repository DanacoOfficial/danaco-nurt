[[fixture.file]]
path = "src/app.ts"
content = """// Modu\u0142 przyk\u0142adowy.
import { helper } from "./util";



const LIMIT = 10;

/** Liczy sum\u0119. */
export function total(values: number[]): number {
  // total w komentarzu
  const label = "total w napisie";
  return values.reduce((sum, value) => sum + value, 0) + label.length;
}

export class Basket {
  items: number[] = [];

  add(value: number): void {
    this.items.push(value);
  }

  sum(): number {
    return total(this.items);
  }
}
"""

