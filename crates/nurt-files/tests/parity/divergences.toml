# Known differences between the stages of the crate and the parity scenarios.
# Each entry names a scenario that runs and does not agree, the command and the
# observed difference. The run of the scenarios fails when a listed scenario
# agrees or an unlisted scenario differs.

[[divergence]]
name = "BOM and CRLF endings survive replace, line range, regular expression and append"
command = "write"
detail = "append to a file without a final line ending joins its last line with the text: expected the lines a, b, c, d each ended by CRLF, found b and c in one line"

[[divergence]]
name = "ambiguous fragment is refused with a list of candidates and symbols, file stays unchanged"
command = "replace"
detail = "E_ASSERT carries a sample of the matches and no candidates; expected 2 candidates"

[[divergence]]
name = "protected file, binary file, directory and file over the Operator limit are rejected"
command = "replace"
detail = "a binary target ends with notable binary_target and nothing_matched; expected E_BINARY"

[[divergence]]
name = "attached read ledger requires a file read or a matching expect_sha256"
command = "replace"
detail = "if_match `sha256:00000000` fails with E_INVALID_VALUE: a content hash in the form of the change records is not accepted as an etag; expected E_STALE"

[[divergence]]
name = "plan without reading the files is rejected with a single error listing the files and no plan is created"
command = "replace"
detail = "if_match `sha256:00000000` fails with E_INVALID_VALUE: a content hash in the form of the change records is not accepted as an etag; expected E_STALE"

[[divergence]]
name = "known and expect_sha256 replace a read; a mismatched hash rejects the plan"
command = "replace"
detail = "if_match `sha256:00000000` fails with E_INVALID_VALUE: a content hash in the form of the change records is not accepted as an etag; expected E_STALE"

[[divergence]]
name = "overwrite requires a file read in the session when the read ledger is attached"
