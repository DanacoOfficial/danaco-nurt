[[divergence]]
name = "numbers=false returns the literal content with an interval separator"
command = "read"
detail = "the text of selected lines ends with a line ending; expected the lines joined without a final line ending"

[[divergence]]
name = "dedupe_lines collapses identical lines with an occurrence count"
command = "search"
detail = "dedupe keeps one match without an occurrence count; expected repeat = 80"

[[divergence]]
name = "new file: single-line result with line count, hash and operation identifier"
command = "write"
detail = "the change of a created file has no added line count; expected added = 2"

[[divergence]]
name = "ranges merges intervals, tail returns the end, around returns the surroundings of matches"
command = "read"
detail = 'content.range: expected Value "1..3,15..15", found null; observed: {"status":"failed","error":"E_OUT_OF_RANGE","notable":[],"change":null,"records":[{"error":"E_OUT_OF_RANGE"}]}; program ended with "E_OUT_OF_RANGE": "lines 90..95 are beyond the end of the file, which has 25 lines: select lines up to 25, or use `last`"'

[[divergence]]
name = "file other than a notebook, missing file and invalid notebook"
command = "notebook.cells"
detail = 'error.code: expected Value "E_SYNTAX", found "E_FORMAT" ("notebook is not valid JSON at line 1 column 1: EOF while parsing an object; repair the file or restore it from the journal"); observed: {"status":"failed","error":"E_FORMAT","notable":[],"change":null,"records":[]}'
