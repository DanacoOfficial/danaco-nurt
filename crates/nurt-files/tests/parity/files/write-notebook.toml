source = "write/tests/notebook.test.ts"
cases = 21

[[scenario]]
name = "domyślny zarys: jeden wiersz na komórkę z numerem, typem, identyfikatorem, liczbą wierszy i znacznikiem wyjść"
class = "direct"
parity_rows = ["NB-01", "NB-07", "NB-33"]
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "read", file_path: "n.ipynb" }'
nurt_program = 'notebook.cells "{root}/n.ipynb"'
expect = { fs_unchanged = true, fields = [{ field = "cells[*].index", value = [0, 1, 2, 3] }, { field = "cells[1].cell_type", value = "code" }] }

[[scenario]]
name = "wskazana komórka daje pełne źródło i wyjścia w wybranym trybie"
class = "direct"
parity_rows = ["NB-03", "NB-07", "NB-08"]
open_gap = "LP-25"
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "read", file_path: "n.ipynb", index: 1, outputs: "text" }'
nurt_program = 'notebook.cells "{root}/n.ipynb" index: 1..1 view: full outputs: true'
expect = { fs_unchanged = true, fields = [{ field = "cells[0].outputs[0].text", value = "wczytano\n" }] }

[[scenario]]
name = "find w źródłach i w wyjściach, zakres, lista identyfikatorów, json i unchanged_since"
class = "direct"
parity_rows = ["NB-04", "NB-05", "NB-09", "NB-12"]
open_gap = "LP-25"
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "read", file_path: "n.ipynb", find: "wczytano", scope: "outputs", view: "outline" }'
nurt_program = 'notebook.cells "{root}/n.ipynb" find: "wczytano" scope: outputs'
expect = { fs_unchanged = true, fields = [{ field = "cells[*].index", value = [1] }] }

[[scenario]]
name = "plik inny niż notebook, brak pliku i niepoprawny notebook"
class = "direct"
parity_rows = ["NB-01"]
fs_before = [{ path = "zly.ipynb", content = "{" }]
native_call = 'NotebookEdit { action: "read", file_path: "zly.ipynb" }'
nurt_program = 'notebook.cells "{root}/zly.ipynb"'
expect = { fs_unchanged = true, fields = [{ field = "error.code", value = "E_SYNTAX" }] }

[[scenario]]
name = "replace zmienia wyłącznie wskazaną komórkę, wyjścia zostają, reszta pliku znak w znak"
class = "direct"
parity_rows = ["NB-13", "NB-15", "NB-29"]
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "replace", file_path: "n.ipynb", cell_id: "use", source: "rows = load(4)\nprint(rows)" }'
nurt_program = 'notebook.replace "{root}/n.ipynb" id: "use" source: "rows = load(4)\nprint(rows)"'
expect = { fs_after = [{ path = "n.ipynb", contains = "rows = load(4)" }, { path = "n.ipynb", contains = "\"version\": 1.0" }] }

[[scenario]]
name = "reset_outputs czyści wyjścia zmienianej komórki, cell_type zmienia typ"
class = "direct"
parity_rows = ["NB-17", "NB-14"]
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "replace", file_path: "n.ipynb", index: 1, source: "def load(id):\n    return id\n", reset_outputs: true }'
nurt_program = 'notebook.replace "{root}/n.ipynb" index: 1 source: "def load(id):\n    return id\n" reset_outputs: true'
expect = { fs_after = [{ path = "n.ipynb", excludes = "wczytano 3" }] }

[[scenario]]
name = "rozbieżność cell_id i index wstrzymuje zapis alarmem; potwierdzenie zmienia komórkę o podanym identyfikatorze"
class = "notable"
parity_rows = ["NB-13"]
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "replace", file_path: "n.ipynb", cell_id: "load", index: 2, source: "def load(id):\n    return 0\n" }'
nurt_program = 'notebook.replace "{root}/n.ipynb" id: "load" index: 2 source: "def load(id):\n    return 0\n"'
expect = { fs_unchanged = true, fields = [{ field = "error.code", value = "E_ARGUMENT" }] }

[[scenario]]
name = "błąd składni Pythona w zmienionej komórce odrzuca zmianę; magie IPython nie są błędem"
class = "direct"
parity_rows = ["NB-15"]
open_gap = "LP-26"
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "replace", file_path: "n.ipynb", index: 1, source: "def load(id:\n    return 1\n" }'
nurt_program = 'notebook.replace "{root}/n.ipynb" index: 1 source: "def load(id:\n    return 1\n" validate: reject'
expect = { fs_unchanged = true, fields = [{ field = "effect.status", value = "rolled_back" }] }

[[scenario]]
name = "insert, move i copy nadają unikalne identyfikatory i nie zmieniają treści pozostałych komórek"
class = "direct"
parity_rows = ["NB-23", "NB-24", "NB-25", "NB-26", "NB-27"]
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "move", file_path: "n.ipynb", cell_id: "tail", new_index: 0 }'
nurt_program = 'notebook.move "{root}/n.ipynb" id: "tail" to: 0'
expect = { fs_after = [{ path = "n.ipynb", contains = "\"id\": \"tail\"" }], fields = [{ field = "effect.status", value = "applied" }] }

[[scenario]]
name = "dry_run pokazuje różnicę bez zapisu, a treść bez zmian nie tworzy operacji"
class = "direct"
parity_rows = ["NB-22", "WR-15"]
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "replace", file_path: "n.ipynb", index: 0, source: "# Inny tytuł", dry_run: true }'
nurt_program = 'notebook.replace "{root}/n.ipynb" index: 0 source: "# Inny tytuł" preview: true'
expect = { fs_unchanged = true, fields = [{ field = "preview", value = true }] }

[[scenario]]
name = "normalize nadaje brakujące i powtórzone identyfikatory oraz pola nbformat"
class = "direct"
parity_rows = ["NB-32"]
fs_before = [{ path = "m.ipynb", generate = "notebook:missing_ids" }]
native_call = 'NotebookEdit { action: "normalize", file_path: "m.ipynb" }'
nurt_program = 'notebook.normalize "{root}/m.ipynb"'
expect = { fs_after = [{ path = "m.ipynb", contains = "\"nbformat\": 4" }], fields = [{ field = "effect.status", value = "applied" }] }

[[scenario]]
name = "notebook bez komórek i w zapisie zwartym przyjmuje nową komórkę"
class = "direct"
parity_rows = ["NB-24", "NB-25", "NB-26", "NB-29"]
fs_before = [{ path = "e.ipynb", generate = "notebook:empty" }]
native_call = 'NotebookEdit { action: "insert", file_path: "e.ipynb", source: "x = 1" }'
nurt_program = 'notebook.insert "{root}/e.ipynb" cell_type: code source: "x = 1"'
expect = { fs_after = [{ path = "e.ipynb", contains = "x = 1" }] }

[[scenario]]
name = "delete zwraca plan z wykazem komórek i pozostałymi użyciami nazw; apply usuwa dokładnie te komórki"
class = "preview"
parity_rows = ["NB-22", "NB-13"]
open_gap = "LP-26"
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "delete", file_path: "n.ipynb", cell_id: "load" } then apply'
nurt_program = 'notebook.delete "{root}/n.ipynb" id: "load" preview: true; the same program with if_match from the preview'
expect = { fs_after = [{ path = "n.ipynb", excludes = "def load():" }] }

[[scenario]]
name = "delete wielu komórek zakresem i listą; plan traci ważność po zmianie pliku"
class = "preview"
parity_rows = ["NB-03", "NB-05", "NB-13"]
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "delete", file_path: "n.ipynb", index_range: [2, 9], cell_ids: ["intro"] } then external change then apply'
nurt_program = 'notebook.delete "{root}/n.ipynb" index: 2..3 preview: true; the same program with if_match after n.ipynb changed'
expect = { fs_unchanged = false, fields = [{ field = "error.code", value = "E_STALE" }] }

[[scenario]]
name = "usunięcie wszystkich komórek zostawia poprawny notebook"
class = "preview"
parity_rows = ["NB-05"]
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "delete", file_path: "n.ipynb", index_range: [0, 3] } then apply'
nurt_program = 'notebook.delete "{root}/n.ipynb" index: 0..3'
expect = { fs_after = [{ path = "n.ipynb", contains = "\"cells\": []" }] }

[[scenario]]
name = "clear_outputs jednej komórki działa od razu, wszystkich komórek wymaga planu"
class = "preview"
parity_rows = ["NB-17", "NB-22"]
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "clear_outputs", file_path: "n.ipynb", cell_id: "use" }'
nurt_program = 'notebook.clear_outputs "{root}/n.ipynb" id: "use"'
expect = { fs_after = [{ path = "n.ipynb", contains = "wczytano" }] }

[[scenario]]
name = "ops wykonuje listę operacji jednym zapisem po podglądzie i wskazuje błędną pozycję"
class = "preview"
parity_rows = ["NB-13", "NB-15", "NB-22"]
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "ops", file_path: "n.ipynb", ops: [{ action: "replace", index: 0, source: "# Raport" }, { action: "insert", index: 1, cell_type: "raw", source: "surowa" }, { action: "delete", cell_id: "tail" }] } then apply'
nurt_program = 'notebook.replace "{root}/n.ipynb" index: 0 source: "# Raport"; notebook.insert "{root}/n.ipynb" index: 1 cell_type: raw source: "surowa"; notebook.delete "{root}/n.ipynb" id: "tail"'
expect = { fs_after = [{ path = "n.ipynb", contains = "# Raport" }, { path = "n.ipynb", contains = "surowa" }, { path = "n.ipynb", excludes = "total = 1.0" }] }

[[scenario]]
name = "zamiana find w źródłach wielu komórek jest świadoma składni i wymaga planu"
class = "preview"
parity_rows = ["NB-16", "NB-22"]
open_gap = "LP-26"
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "replace", file_path: "n.ipynb", find: "id", source: "key" } then apply'
nurt_program = 'notebook.replace "{root}/n.ipynb" find: "id" with: "key" preview: true; the same program with if_match from the preview'
expect = { fs_after = [{ path = "n.ipynb", contains = "def load(key):" }] }

[[scenario]]
name = "odczyt rejestruje plik w rejestrze odczytów, bez odczytu zmiana jest odrzucona"
class = "freshness"
parity_rows = ["NB-34", "WR-20"]
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "replace", file_path: "n.ipynb", index: 0, source: "# Tytuł" } with the read ledger attached and no earlier read'
nurt_program = 'notebook.replace "{root}/n.ipynb" index: 0 source: "# Tytuł" if_match: "sha256:00000000"'
expect = { fs_unchanged = true, fields = [{ field = "error.code", value = "E_STALE" }] }
