fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "replace", file_path: "n.ipynb", cell_id: "load", index: 2, source: "x = 1" }'
nurt_program = 'notebook.replace "{root}/n.ipynb" id: "load" index: 2 source: "x = 1"'
expect = { fs_unchanged = true, fields = [{ field = "error.code", value = "E_ARGUMENT" }] }

[[scenario]]
name = "delete: podgląd i wynik wymieniają pozostałe użycia; usunięta zostaje wyłącznie wskazana komórka"
class = "preview"
parity_rows = ["NB-22", "NB-29"]
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "delete", file_path: "n.ipynb", cell_id: "load" } then apply'
nurt_program = 'notebook.delete "{root}/n.ipynb" id: "load" preview: true; the same program with if_match from the preview'
expect = { fs_after = [{ path = "n.ipynb", excludes = "def load():" }, { path = "n.ipynb", contains = "rows = load()" }] }

[[scenario]]
name = "ops: błędna pozycja listy nie zapisuje żadnej operacji z listy"
class = "direct"
parity_rows = ["NB-13", "NB-15"]
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "ops", file_path: "n.ipynb", ops: [{ action: "replace", index: 0, source: "x" }, { action: "move", index: 0 }] }'
nurt_program = 'notebook.replace "{root}/n.ipynb" index: 0 source: "x"; notebook.move "{root}/n.ipynb" index: 0'
expect = { fs_unchanged = true, fields = [{ field = "error.code", value = "E_ARGUMENT" }] }

[[scenario]]
name = "ops i zamiana find w wielu komórkach: podgląd niczego nie zapisuje, wykonanie zmienia wyłącznie komórki z podglądu"
class = "preview"
parity_rows = ["NB-16", "NB-22"]
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "replace", file_path: "n.ipynb", find: "load", source: "fetch" } then apply'
nurt_program = 'notebook.replace "{root}/n.ipynb" find: "load" with: "fetch" preview: true; the same program with if_match from the preview'
expect = { fs_after = [{ path = "n.ipynb", contains = "def fetch():" }] }

[[scenario]]
name = "normalize nie zmienia źródeł ani wyjść komórek"
class = "direct"
parity_rows = ["NB-32", "NB-29"]
fs_before = [{ fixture = "notebook_four_cells" }]
native_call = 'NotebookEdit { action: "normalize", file_path: "n.ipynb" }'
nurt_program = 'notebook.normalize "{root}/n.ipynb"'
expect = { fs_after = [{ path = "n.ipynb", contains = "wczytano" }, { path = "n.ipynb", contains = "def load():" }] }
