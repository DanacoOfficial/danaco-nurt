source = "delete/tests/sidecontent.test.ts"
cases = 5

[[scenario]]
name = "katalog: odwołanie do pliku z wnętrza usuwanego katalogu jest w podglądzie, wstrzymuje wykonanie i wraca w wyniku"
class = "notable"
parity_rows = ["DL-18", "DL-15", "DL-02"]
fs_before = [{ path = "lib/inner/util.ts", content = "export const util = 1;\n" }, { path = "src/app.ts", content = "import { util } from \"../lib/inner/util\";\nconsole.log(util);\n" }]
native_call = 'Delete { paths: ["lib"], recursive: true } then Delete { action: "apply", plan_id, intended: [...] }'
nurt_program = 'remove "{root}/lib" check_references: true'
expect = { fs_after = [{ path = "src/app.ts", contains = "../lib/inner/util" }], fields = [{ field = "notable", value = "references_left" }] }

[[scenario]]
name = "wzorzec nazw usuwa wyłącznie pasujące pliki; sąsiedzi o podobnych nazwach znak w znak"
class = "direct"
parity_rows = ["DL-01", "DL-03"]
fs_before = [{ path = "logs/app.log", content = "a\n" }, { path = "logs/app.log.bak", content = "b\n" }, { path = "logs/app.logx", content = "c\n" }]
native_call = 'Delete { paths: ["logs/*.log"], check_references: false } then apply'
nurt_program = 'find "{root}/logs" glob: "*.log" |> remove'
expect = { fs_after = [{ path = "logs/app.log.bak", content = "b\n" }, { path = "logs/app.logx", content = "c\n" }] }

[[scenario]]
name = "plik dopisany do katalogu po podglądzie unieważnia plan; nic nie jest usuwane"
class = "preview"
parity_rows = ["DL-17", "DL-02"]
fs_before = [{ path = "dir/a.txt", content = "a\n" }, { path = "dir/late.txt", content = "późno\n" }]
native_call = 'Delete { paths: ["dir"], recursive: true } then creation of dir/late.txt then Delete { action: "apply", plan_id }'
nurt_program = 'remove "{root}/dir" if_match: "<etag of the preview>" after dir/late.txt was created'
expect = { fs_after = [{ path = "dir/a.txt", content = "a\n" }, { path = "dir/late.txt", content = "późno\n" }], fields = [{ field = "error.code", value = "E_STALE" }] }

[[scenario]]
name = "restore wybranej pozycji nie zmienia plików zmienionych po usunięciu"
class = "direct"
parity_rows = ["DL-09", "DL-10", "UN-04"]
fs_before = [{ path = "a.txt", content = "a\n" }, { path = "b.txt", content = "zmieniony po usunięciu\n" }]
native_call = 'Delete { paths: ["a.txt", "b.txt"] } then apply then recreation of b.txt then Delete { action: "restore", paths: ["a.txt"] }'
nurt_program = 'remove "{root}/a.txt" "{root}/b.txt"; undo 1 paths: ["{root}/a.txt"]'
expect = { fs_after = [{ path = "a.txt", content = "a\n" }, { path = "b.txt", content = "zmieniony po usunięciu\n" }] }
