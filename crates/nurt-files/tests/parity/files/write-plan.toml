source = "write/tests/plan.test.ts"
cases = 14

[[scenario]]
name = "preview reports the plan, files, change count, difference sample and remaining references; writes nothing"
class = "preview"
parity_rows = ["ED-28", "ED-30", "ED-34", "WR-14"]
fs_before = [{ fixture = "rename_tree" }]
native_call = 'Edit { action: "plan", glob: "src/**/*.ts", old_string: "user", new_string: "account" }'
nurt_program = 'replace "user" with: "account" in: [] glob: "{root}/src/**/*.ts" whole_word: true preview: true'
expect = { fs_unchanged = true, fields = [{ field = "preview", value = true }, { field = "targets", value = 3 }, { field = "notable", value = "references_left" }] }

[[scenario]]
name = "apply with a plan applies exactly the changes from the preview in one operation that undo reverts"
class = "preview"
parity_rows = ["ED-28", "ED-43", "ED-26", "UN-05"]
fs_before = [{ fixture = "rename_tree" }]
native_call = 'Edit { action: "plan", ... } then Edit { action: "apply", plan_id: "plan-1" } then Edit { undo: "op-1" }'
nurt_program = 'replace "user" with: "account" glob: "{root}/src/**/*.ts" whole_word: true preview: true; the same program with if_match from the preview; undo'
expect = { fs_after = [{ path = "src/a.ts", same_as = "rename_tree" }, { path = "src/b.ts", same_as = "rename_tree" }, { path = "src/c.ts", same_as = "rename_tree" }], fields = [{ field = "effect.status", value = "reverted" }] }

[[scenario]]
name = "apply without a plan is rejected, and the plan becomes stale after a file change"
class = "preview"
parity_rows = ["ED-43"]
fs_before = [{ fixture = "rename_tree" }]
native_call = 'Edit { action: "plan", files: ["src/a.ts", "src/c.ts"], ... } then external change of src/c.ts then Edit { action: "apply", plan_id }'
nurt_program = 'replace "user" with: "account" in: ["{root}/src/a.ts", "{root}/src/c.ts"] if_match: "<etag of the preview>" after src/c.ts changed'
expect = { fs_after = [{ path = "src/a.ts", same_as = "rename_tree" }], fields = [{ field = "error.code", value = "E_STALE" }] }

[[scenario]]
name = "all or nothing: an error detected in the third file restores the first two"
class = "preview"
parity_rows = ["ED-37", "WR-25"]
fs_before = [{ fixture = "rename_tree" }]
native_call = 'Edit { action: "apply", plan_id } with a language server reporting a new diagnostic in src/c.ts after the write'
nurt_program = 'replace "user" with: "account" glob: "{root}/src/*.ts" validate: reject'
expect = { fs_unchanged = true, fields = [{ field = "effect.status", value = "rolled_back" }] }

[[scenario]]
name = "plan introducing a syntax error is not created"
class = "preview"
parity_rows = ["ED-37", "ED-14"]
fs_before = [{ fixture = "rename_tree" }]
native_call = 'Edit { action: "plan", glob: "src/*.ts", old_string: "return (\\w+) \\+ 1;", new_string: "return $1 + ;", regex: true }'
nurt_program = 'replace /return (\w+) \+ 1;/ with: "return $1 + ;" glob: "{root}/src/*.ts" preview: true validate: reject'
expect = { fs_unchanged = true, fields = [{ field = "effect.status", value = "rolled_back" }] }

[[scenario]]
name = "no matches, mismatched change count, missing scope and Operator file limit"
class = "direct"
parity_rows = ["ED-07", "ED-30", "ED-44"]
fs_before = [{ fixture = "rename_tree" }]
native_call = 'Edit { action: "plan", glob: "src/*.ts", old_string: "user", new_string: "account", expected_count: 9 }'
nurt_program = 'replace "user" with: "account" glob: "{root}/src/*.ts" expect: 9'
expect = { fs_unchanged = true, fields = [{ field = "error.code", value = "E_EXPECT" }] }

[[scenario]]
name = "binary files within the pattern scope are skipped with a note"
class = "direct"
parity_rows = ["ED-28", "SC-26"]
fs_before = [{ fixture = "rename_tree" }, { path = "src/blob.ts", content = "user\u0000" }]
native_call = 'Edit { action: "plan", glob: "src/*.ts", old_string: "user", new_string: "account" }'
nurt_program = 'replace "user" with: "account" glob: "{root}/src/*.ts" preview: true'
expect = { fs_unchanged = true, fields = [{ field = "skipped.binary", value = 1 }] }

[[scenario]]
name = "changes with their own file_path form a single transaction"
class = "preview"
parity_rows = ["ED-19", "ED-30"]
fs_before = [{ fixture = "rename_tree" }]
native_call = 'Edit { action: "plan", edits: [{ file_path: "src/a.ts", old_string: "return user + 1;", new_string: "return user + 2;" }, { file_path: "src/c.ts", old_string: "limit = 10", new_string: "limit = 20" }] } then apply'
nurt_program = 'edit "{root}/src/a.ts" changes: [{ replace: "return user + 1;", with: "return user + 2;" }]; edit "{root}/src/c.ts" changes: [{ replace: "limit = 10", with: "limit = 20" }]'
expect = { fs_after = [{ path = "src/a.ts", contains = "return user + 2;" }, { path = "src/c.ts", contains = "limit = 20" }, { path = "src/b.ts", same_as = "rename_tree" }] }

[[scenario]]
name = "change reaching beyond the target holds the plan with an alert; the plan is created after confirmation"
class = "notable"
parity_rows = ["ED-32", "ED-09"]
fs_before = [{ fixture = "rename_tree" }]
native_call = 'Edit { action: "plan", edits: [{ file_path: "src/a.ts", line_range: [2, 6], new_string: "..." }] }'
nurt_program = 'edit "{root}/src/a.ts" changes: [{ delete_lines: 2..6 }, { insert: "  return 0;\n}\n\nexport function label() {\n  return \"u\";\n", line: 2 }]'
expect = { fs_after = [{ path = "src/a.ts", contains = "return \"u\";" }], fields = [{ field = "notable", value = "scope_exceeded" }] }

[[scenario]]
name = "function removal: preview and result list the remaining import, the adjacent function stays untouched"
class = "notable"
parity_rows = ["ED-33", "ED-34"]
fs_before = [{ fixture = "rename_tree" }]
native_call = 'Edit { action: "plan", file_path: "src/a.ts", target: { symbol: "total" }, new_string: "" } then apply'
nurt_program = 'read "{root}/src/a.ts" symbol: "total" |> remove'
expect = { fs_after = [{ path = "src/a.ts", content = "export function label() {\n  return \"user\"; // user\n}\n" }], fields = [{ field = "notable", value = "references_left" }] }

[[scenario]]
name = "JSON key removal keeps valid syntax for a middle and a last key"
class = "direct"
parity_rows = ["ED-15", "ED-33"]
fs_before = [{ path = "conf.json", content = "{\n  \"a\": 1,\n  \"b\": 2,\n  \"c\": 3\n}\n" }]
native_call = 'Edit { action: "plan", file_path: "conf.json", target: { key: "b" }, new_string: "" } then apply'
nurt_program = 'read "{root}/conf.json" key: "b" |> remove'
expect = { fs_after = [{ path = "conf.json", content = "{\n  \"a\": 1,\n  \"c\": 3\n}\n" }] }

[[scenario]]
name = "file named in a change is missing and excess edits entries"
class = "direct"
parity_rows = ["ED-19", "ED-44"]
fs_before = [{ fixture = "rename_tree" }]
native_call = 'Edit { action: "plan", edits: [{ file_path: "src/brak.ts", old_string: "a", new_string: "b" }] }'
nurt_program = 'edit "{root}/src/brak.ts" changes: [{ replace: "a", with: "b" }]'
expect = { fs_unchanged = true, fields = [{ field = "error.code", value = "E_NOT_FOUND" }] }
