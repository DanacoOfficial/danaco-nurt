[[scenario]]
name = "wynik zaczyna się wierszem rozstrzygającym, a operacja ma migawkę i wpis dziennika w katalogu sesji"
class = "direct"
parity_rows = ["ED-01", "ED-02", "ED-03", "WR-27", "WR-29"]
fs_before = [{ fixture = "code_two_functions" }]
native_call = 'Edit { file_path: "a.ts", old_string: "return width;", new_string: "return width + 1;" }'
nurt_program = 'edit "{root}/a.ts" changes: [{ replace: "return width;", with: "return width + 1;" }]'
expect = { fs_after = [{ path = "a.ts", replace_in = "code_two_functions", from = "return width;", to = "return width + 1;" }], fields = [{ field = "effect.status", value = "applied" }, { field = "effect.change.added", value = 1 }, { field = "effect.change.removed", value = 1 }] }

