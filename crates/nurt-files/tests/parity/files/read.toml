nurt_program = 'read "{root}/src/app.ts" lines: 99..100'
expect = { fs_unchanged = true, fields = [{ field = "error.code", value = "E_RANGE" }] }

[[scenario]]
name = "ranges łączy przedziały, tail zwraca koniec, around okolice trafień"
class = "direct"
parity_rows = ["RD-04", "RD-05", "RD-06", "RD-07"]
fs_before = [{ fixture = "standard" }]
native_call = 'Read { file_path: "src/app.ts", ranges: [[1,2],[2,3],[15,15],[90,95]] } | { tail: 2 } | { around: { pattern: "sum\\(\\)", context: 1 } }'
nurt_program = 'read "{root}/src/app.ts" lines: [1..2, 2..3, 15..15, 90..95]'
expect = { fs_unchanged = true, fields = [{ field = "content.range", value = "1..3,15..15" }] }

