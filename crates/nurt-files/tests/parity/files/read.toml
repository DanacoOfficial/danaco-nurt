source = "tests/read.test.ts"
cases = 33

[[scenario]]
name = "zwraca nagłówek ze skrótem i zakresem oraz numerowane wiersze"
class = "direct"
parity_rows = ["RD-01", "RD-25", "RD-26"]
fs_before = [{ fixture = "standard" }]
native_call = 'Read { file_path: "src/app.ts" }'
nurt_program = 'read "{root}/src/app.ts" line_numbers: true'
expect = { fs_unchanged = true, fields = [{ field = "content.range", value = "1..25" }, { field = "content.lines", value = 25 }] }

[[scenario]]
name = "offset i limit podają next_offset"
class = "direct"
parity_rows = ["RD-02", "RD-03"]
fs_before = [{ fixture = "standard" }]
native_call = 'Read { file_path: "src/app.ts", offset: 9, limit: 2 }'
nurt_program = 'read "{root}/src/app.ts" lines: 9..10'
expect = { fs_unchanged = true, fields = [{ field = "content.range", value = "9..10" }] }

[[scenario]]
name = "offset poza plikiem jest błędem"
