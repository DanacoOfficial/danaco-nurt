source = "tests/read.test.ts"
cases = 33

[[scenario]]
name = "returns a header with hash and range and numbered lines"
class = "direct"
parity_rows = ["RD-01", "RD-25", "RD-26"]
fs_before = [{ fixture = "standard" }]
native_call = 'Read { file_path: "src/app.ts" }'
nurt_program = 'read "{root}/src/app.ts" line_numbers: true'
expect = { fs_unchanged = true, fields = [{ field = "content.range", value = "1..25" }, { field = "content.lines", value = 25 }] }

[[scenario]]
name = "offset and limit report next_offset"
class = "direct"
parity_rows = ["RD-02", "RD-03"]
fs_before = [{ fixture = "standard" }]
native_call = 'Read { file_path: "src/app.ts", offset: 9, limit: 2 }'
nurt_program = 'read "{root}/src/app.ts" lines: 9..10'
expect = { fs_unchanged = true, fields = [{ field = "content.range", value = "9..10" }] }

[[scenario]]
name = "offset beyond the file is an error"
class = "direct"
parity_rows = ["RD-02"]
fs_before = [{ fixture = "standard" }]
native_call = 'Read { file_path: "src/app.ts", offset: 99 }'
nurt_program = 'read "{root}/src/app.ts" lines: 99..100'
expect = { fs_unchanged = true, fields = [{ field = "error.code", value = "E_RANGE" }] }

[[scenario]]
name = "ranges merges intervals, tail returns the end, around returns the surroundings of matches"
class = "direct"
parity_rows = ["RD-04", "RD-05", "RD-06", "RD-07"]
fs_before = [{ fixture = "standard" }]
native_call = 'Read { file_path: "src/app.ts", ranges: [[1,2],[2,3],[15,15],[90,95]] } | { tail: 2 } | { around: { pattern: "sum\\(\\)", context: 1 } }'
nurt_program = 'read "{root}/src/app.ts" lines: [1..2, 2..3, 15..15]'
expect = { fs_unchanged = true, fields = [{ field = "content.range", value = "1..3,15..15" }] }

[[scenario]]
name = "numbers=false returns the literal content with an interval separator"
class = "direct"
parity_rows = ["RD-19"]
fs_before = [{ fixture = "standard" }]
native_call = 'Read { file_path: "src/app.ts", ranges: [[1,1],[6,6]], numbers: false }'
