[[scenario]]
name = "paths z known zwraca wiersz = dla pliku bez zmian, błąd celu nie przerywa pozostałych"
class = "direct"
parity_rows = ["RD-14", "RD-21", "RD-38"]
fs_before = [{ fixture = "standard" }]
native_call = 'Read { file_path: "config.yaml", paths: ["config.toml", "brak.txt"], known: { "config.yaml": "<sha>" } }'
nurt_program = 'read "{root}/config.yaml" "{root}/config.toml" "{root}/brak.txt" known: { "{root}/config.yaml": "<sha>" }'
expect = { fs_unchanged = true, fields = [{ field = "content[0].unchanged", value = true }, { field = "content[2].error.code", value = "E_NOT_FOUND" }] }

