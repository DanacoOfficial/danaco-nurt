expect = { fs_unchanged = true, fields = [{ field = "content.text", value = "// Modu\u0142 przyk\u0142adowy.\nconst LIMIT = 10;\n" }] }

[[scenario]]
name = "verbosity quiet omits the header, verbose adds metadata"
class = "direct"
parity_rows = ["W-01", "RD-18"]
fs_before = [{ fixture = "standard" }]
native_call = 'Read { file_path: "notes.txt", verbosity: "verbose" }'
nurt_program = 'read "{root}/notes.txt" verbosity: detailed'
expect = { fs_unchanged = true, fields = [{ field = "content.line_ending", value = "crlf" }, { field = "content.encoding", value = "utf-8" }] }

[[scenario]]
name = "long line is truncated with the number of omitted characters"
