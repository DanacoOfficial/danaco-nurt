native_call = 'Read {} | { targets: [{ symbol: "x" }] }'
nurt_program = 'read'
expect = { fs_unchanged = true, fields = [{ field = "error.code", value = "E_ARGUMENT" }] }

[[scenario]]
name = "unchanged_since confirms no change without content, and after a change returns the content"
class = "direct"
parity_rows = ["RD-24"]
fs_before = [{ path = "state.txt", content = "a\nb\n" }]
native_call = 'Read { file_path: "state.txt", unchanged_since: "<sha>" }'
nurt_program = 'read "{root}/state.txt" unchanged_since: "<etag>"'
expect = { fs_unchanged = true, fields = [{ field = "content.unchanged", value = true }] }

[[scenario]]
name = "unchanged_since also works without an earlier read in the session"
class = "direct"
parity_rows = ["RD-24"]
fs_before = [{ path = "fresh.txt", content = "x\n" }]
native_call = 'Read { file_path: "fresh.txt", unchanged_since: "<sha of x>" }'
nurt_program = 'read "{root}/fresh.txt" unchanged_since: "<etag of x>"'
expect = { fs_unchanged = true, fields = [{ field = "content.unchanged", value = true }] }

[[scenario]]
