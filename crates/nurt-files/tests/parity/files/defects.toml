source = "write/tests/defects.test.ts"
cases = 26

[[scenario]]
name = "replacement for an unindented method receives the element indentation on every line"
class = "direct"
parity_rows = ["ED-15", "ED-38"]
fs_before = [{ fixture = "ts_box" }]
native_call = 'Edit { file_path: "a.ts", target: { symbol: "Box.size" }, new_string: "size(): number {\n  return 2;\n}" }'
nurt_program = 'read "{root}/a.ts" symbol: "Box.size" |> replace_all "size(): number {\n  return 2;\n}"'
expect = { fs_after = [{ path = "a.ts", replace_in = "ts_box", from = "return 1;", to = "return 2;" }] }

[[scenario]]
name = "replacement with file indentation on later lines receives the indentation on the first line only"
class = "direct"
parity_rows = ["ED-15", "ED-38"]
fs_before = [{ fixture = "ts_box" }]
native_call = 'Edit { file_path: "a.ts", target: { symbol: "Box.size" }, new_string: "size(): number {\n    return 2;\n  }" }'
nurt_program = 'read "{root}/a.ts" symbol: "Box.size" |> replace_all "size(): number {\n    return 2;\n  }"'
expect = { fs_after = [{ path = "a.ts", replace_in = "ts_box", from = "return 1;", to = "return 2;" }] }

[[scenario]]
name = "replacement with full file indentation stays unchanged"
class = "direct"
parity_rows = ["ED-15", "ED-38"]
fs_before = [{ fixture = "ts_box" }]
native_call = 'Edit { file_path: "a.ts", target: { symbol: "Box.size" }, new_string: "  size(): number {\n    return 2;\n  }\n" }'
nurt_program = 'read "{root}/a.ts" symbol: "Box.size" |> replace_all "  size(): number {\n    return 2;\n  }\n"'
expect = { fs_after = [{ path = "a.ts", replace_in = "ts_box", from = "return 1;", to = "return 2;" }] }

[[scenario]]
name = "unindented Python method raises no alert and keeps the adjacent method"
class = "direct"
parity_rows = ["ED-15", "ED-32"]
fs_before = [{ path = "a.py", content = "class Box:\n    def size(self):\n        return 1\n\n    def name(self):\n        return \"a\"\n" }]
native_call = 'Edit { file_path: "a.py", target: { symbol: "Box.size" }, new_string: "def size(self):\n    return 2" }'
nurt_program = 'read "{root}/a.py" symbol: "Box.size" |> replace_all "def size(self):\n    return 2"'
expect = { fs_after = [{ path = "a.py", content = "class Box:\n    def size(self):\n        return 2\n\n    def name(self):\n        return \"a\"\n" }] }

[[scenario]]
name = "space indentation converts to the file tabs, also in the Write tool"
class = "direct"
parity_rows = ["ED-38", "WR-17"]
fs_before = [{ path = "a.go", content = "package main\n\nfunc alpha() int {\n\tif true {\n\t\treturn 1\n\t}\n\treturn 2\n}\n" }]
native_call = 'Edit { file_path: "a.go", target: { symbol: "alpha" }, new_string: "func alpha() int {\n    if true {\n        return 9\n    }\n    return 2\n}" }'
nurt_program = 'read "{root}/a.go" symbol: "alpha" |> replace_all "func alpha() int {\n    if true {\n        return 9\n    }\n    return 2\n}"'
expect = { fs_after = [{ path = "a.go", content = "package main\n\nfunc alpha() int {\n\tif true {\n\t\treturn 9\n\t}\n\treturn 2\n}\n" }] }

[[scenario]]
name = "CRLF file keeps line endings and indentation"
class = "direct"
parity_rows = ["ED-38", "WR-17"]
fs_before = [{ path = "a.ts", content = "class Box {\r\n  size(): number {\r\n    return 1;\r\n  }\r\n}\r\n" }]
native_call = 'Edit { file_path: "a.ts", target: { symbol: "Box.size" }, new_string: "size(): number {\n  return 2;\n}" }'
nurt_program = 'read "{root}/a.ts" symbol: "Box.size" |> replace_all "size(): number {\n  return 2;\n}"'
expect = { fs_after = [{ path = "a.ts", content = "class Box {\r\n  size(): number {\r\n    return 2;\r\n  }\r\n}\r\n" }] }

[[scenario]]
name = "leading comment stays when the replacement has no comment, and a replacement with a comment supersedes it"
class = "direct"
parity_rows = ["ED-15"]
fs_before = [{ fixture = "ts_box" }]
native_call = 'Edit { file_path: "a.ts", target: { symbol: "alpha" }, new_string: "// nowy opis\nfunction alpha(id: number) {\n  return id;\n}" }'
nurt_program = 'read "{root}/a.ts" symbol: "alpha" |> replace_all "// nowy opis\nfunction alpha(id: number) {\n  return id;\n}"'
expect = { fs_after = [{ path = "a.ts", replace_in = "ts_box", from = "// opis alpha", to = "// nowy opis" }] }

[[scenario]]
name = "Markdown section keeps the blank line before the next heading"
class = "direct"
parity_rows = ["ED-15", "ED-38"]
fs_before = [{ path = "a.md", content = "# T\r\n\r\nwst\u0119p\r\n\r\n## A\r\n\r\ntre\u015B\u0107 a\r\n\r\n## B\r\n\r\ntre\u015B\u0107 b\r\n" }]
native_call = 'Edit { file_path: "a.md", target: { section: "A" }, new_string: "## A\n\nnowa" }'
nurt_program = 'read "{root}/a.md" section: "A" |> replace_all "## A\n\nnowa"'
expect = { fs_after = [{ path = "a.md", content = "# T\r\n\r\nwst\u0119p\r\n\r\n## A\r\n\r\nnowa\r\n\r\n## B\r\n\r\ntre\u015B\u0107 b\r\n" }] }

[[scenario]]
name = "last element of a file without a final newline stays without it"
class = "direct"
parity_rows = ["ED-39", "ED-38"]
fs_before = [{ path = "a.go", content = "package main\n\nfunc alpha() int {\n\treturn 2\n}" }]
native_call = 'Edit { file_path: "a.go", target: { symbol: "alpha" }, new_string: "func alpha() int {\n\treturn 7\n}\n" }'
nurt_program = 'read "{root}/a.go" symbol: "alpha" |> replace_all "func alpha() int {\n\treturn 7\n}\n"'
expect = { fs_after = [{ path = "a.go", content = "package main\n\nfunc alpha() int {\n\treturn 7\n}" }] }

[[scenario]]
name = "multi-line JSON key value receives the indentation of the key line"
class = "direct"
parity_rows = ["ED-15", "ED-38"]
fs_before = [{ path = "b.json", content = "{\n  \"a\": {\n    \"b\": [1, 2]\n  },\n  \"c\": 1.0\n}\n" }]
native_call = 'Edit { file_path: "b.json", target: { key: "a.b" }, new_string: "[\n      3\n    ]" }'
nurt_program = 'set "{root}/b.json" key: "a.b" value: [3]'
expect = { fs_after = [{ path = "b.json", content = "{\n  \"a\": {\n    \"b\": [\n      3\n    ]\n  },\n  \"c\": 1.0\n}\n" }] }

[[scenario]]
name = "YAML key value with a trailing comment keeps the comment and line endings"
class = "direct"
parity_rows = ["ED-15", "ED-38"]
fs_before = [{ path = "a.yaml", content = "server:\r\n  port: 80 # port\r\nname: x\r\n" }]
native_call = 'Edit { file_path: "a.yaml", target: { key: "server.port" }, new_string: "8080" }'
nurt_program = 'set "{root}/a.yaml" key: "server.port" value: 8080'
expect = { fs_after = [{ path = "a.yaml", content = "server:\r\n  port: 8080 # port\r\nname: x\r\n" }] }

[[scenario]]
name = "line inserted before the leading comment of a function raises no alert"
class = "direct"
parity_rows = ["ED-11", "ED-32"]
fs_before = [{ fixture = "ts_box" }]
native_call = 'Edit { file_path: "a.ts", insert_before: "// opis alpha", new_string: "// pierwszy" }'
nurt_program = 'search "// opis alpha" "{root}/a.ts" |> insert "// pierwszy" position: before'
expect = { fs_after = [{ path = "a.ts", contains = "// pierwszy\n// opis alpha" }] }

[[scenario]]
name = "insertion in an element other than the named target still holds the write with an alert"
class = "notable"
parity_rows = ["ED-32"]
fs_before = [{ fixture = "ts_box" }]
native_call = 'Edit { file_path: "a.ts", target: { symbol: "alpha" }, insert_before: "    return 1;", new_string: "    log();" }'
nurt_program = 'read "{root}/a.ts" symbol: "alpha" |> insert "    log();" position: before line: 8'
expect = { fs_after = [{ path = "a.ts", contains = "log();" }], fields = [{ field = "notable", value = "scope_exceeded" }] }

[[scenario]]
name = "insertion at the end of a file without a final newline does not append one"
class = "direct"
parity_rows = ["ED-39", "ED-10"]
fs_before = [{ path = "a.txt", content = "a\nb" }]
native_call = 'Edit { file_path: "a.txt", insert_after: "b", new_string: "c" }'
nurt_program = 'search "b" "{root}/a.txt" |> insert "c" position: after ensure_newline: false'
expect = { fs_after = [{ path = "a.txt", content = "a\nb\nc" }] }

[[scenario]]
name = "BOM and CRLF endings survive replace, line range, regular expression and append"
class = "direct"
parity_rows = ["WR-17", "ED-38", "WR-32"]
fs_before = [{ path = "d.txt", content = "\uFEFFa\r\nb\r\n" }]
native_call = 'Write { file_path: "d.txt", mode: "append", content: "c\nd\n" }'
nurt_program = 'write "{root}/d.txt" "c\nd\n" mode: append'
expect = { fs_after = [{ path = "d.txt", content = "\uFEFFa\r\nb\r\nc\r\nd\r\n" }] }

[[scenario]]
name = "undo restores a file with BOM and CRLF endings byte for byte"
class = "direct"
parity_rows = ["ED-26", "UN-05", "WR-17"]
fs_before = [{ path = "a.ts", content = "\uFEFFclass Box {\r\n  size(): number {\r\n    return 1;\r\n  }\r\n}\r\n" }]
native_call = 'Edit { file_path: "a.ts", target: { symbol: "Box.size" }, new_string: "..." } then Edit { file_path: "a.ts", undo: "last" }'
nurt_program = 'read "{root}/a.ts" symbol: "Box.size" |> replace "1" "2"; undo'
expect = { fs_after = [{ path = "a.ts", content = "\uFEFFclass Box {\r\n  size(): number {\r\n    return 1;\r\n  }\r\n}\r\n" }] }

[[scenario]]
name = "file with mixed line endings keeps its line endings untouched"
class = "direct"
parity_rows = ["ED-38", "WR-17"]
fs_before = [{ path = "a.txt", content = "a\r\nb\nc\r\nd\r\n" }]
native_call = 'Edit { file_path: "a.txt", old_string: "b", new_string: "B" }'
nurt_program = 'replace "b" with: "B" in: ["{root}/a.txt"]'
expect = { fs_after = [{ path = "a.txt", content = "a\r\nB\nc\r\nd\r\n" }] }

[[scenario]]
name = "replace at the start of a BOM file, line insertion, replace all and prepend keep the BOM and CRLF"
class = "direct"
parity_rows = ["WR-17", "ED-38", "WR-04"]
fs_before = [{ path = "d.txt", content = "\uFEFFa\r\n" }]
native_call = 'Write { file_path: "d.txt", mode: "prepend", content: "z\n" }'
nurt_program = 'write "{root}/d.txt" "z\n" mode: prepend'
expect = { fs_after = [{ path = "d.txt", content = "\uFEFFz\r\na\r\n" }] }

[[scenario]]
name = "file in an encoding other than UTF-8 is rejected without changing bytes"
class = "direct"
parity_rows = ["RD-31", "WR-32"]
fs_before = [{ path = "l.txt", content = "z\u00F3\n", encoding = "latin-1" }]
native_call = 'Edit { file_path: "l.txt", old_string: "z", new_string: "y" }'
nurt_program = 'replace "z" with: "y" in: ["{root}/l.txt"]'
expect = { fs_after = [{ path = "l.txt", content = "y\u00F3\n", encoding = "latin-1" }], fields = [{ field = "effect.encoding", value = "iso-8859-2" }] }

[[scenario]]
name = "clear_outputs on a single-line cell raises no alert and changes only the output fields"
class = "direct"
parity_rows = ["NB-29", "NB-17"]
fs_before = [{ path = "n.ipynb", generate = "notebook:flat" }]
native_call = 'NotebookEdit { file_path: "n.ipynb", action: "clear_outputs", cell_id: "load" }'
nurt_program = 'notebook.clear_outputs "{root}/n.ipynb" id: ["load"]'
expect = { fs_after = [{ path = "n.ipynb", excludes = "wczytano" }, { path = "n.ipynb", excludes = "\"execution_count\": 1," }, { path = "n.ipynb", contains = "\"source\": \"data = load()\"" }] }

[[scenario]]
name = "replace on a single-line cell changes only the source"
class = "direct"
parity_rows = ["NB-13", "NB-15", "NB-29"]
fs_before = [{ path = "n.ipynb", generate = "notebook:flat" }]
native_call = 'NotebookEdit { file_path: "n.ipynb", action: "replace", cell_id: "one", source: "c = 2\n" }'
nurt_program = 'notebook.replace "{root}/n.ipynb" id: "one" source: "c = 2\n"'
expect = { fs_after = [{ path = "n.ipynb", replace_in = "notebook:flat", from = "[\"a = 1.0\\n\", \"b\"]", to = "[\"c = 2\\n\"]" }] }

[[scenario]]
name = "cell type change on a single-line cell writes it on one line and leaves other cells character for character"
class = "direct"
parity_rows = ["NB-14", "NB-29"]
fs_before = [{ path = "n.ipynb", generate = "notebook:flat" }]
native_call = 'NotebookEdit { file_path: "n.ipynb", action: "replace", cell_id: "tail", source: "y", cell_type: "code" }'
nurt_program = 'notebook.replace "{root}/n.ipynb" id: "tail" source: "y" cell_type: code'
expect = { fs_after = [{ path = "n.ipynb", contains = "\"y\"" }, { path = "n.ipynb", excludes = "End of the analysis." }, { path = "n.ipynb", contains = "\"source\": \"data = load()\"" }] }

[[scenario]]
name = "cell in the standard layout keeps fields untouched character for character, CRLF endings and BOM"
class = "direct"
parity_rows = ["NB-29", "NB-15"]
fs_before = [{ path = "n.ipynb", generate = "notebook:standard_crlf_bom" }]
native_call = 'NotebookEdit { file_path: "n.ipynb", action: "replace", cell_id: "load", source: "print(2)\nprint(3)" }'
nurt_program = 'notebook.replace "{root}/n.ipynb" id: "load" source: "print(2)\nprint(3)"'
expect = { fs_after = [{ path = "n.ipynb", contains = "\"print(2)\\n\",\r\n        \"print(3)\"" }] }

[[scenario]]
name = "new cell and copy in a notebook with single-line cells keep the layout and file separators"
class = "direct"
parity_rows = ["NB-23", "NB-25", "NB-26", "NB-29"]
fs_before = [{ path = "n.ipynb", generate = "notebook:flat" }]
native_call = 'NotebookEdit { file_path: "n.ipynb", action: "insert", cell_id: "load", source: "q", cell_type: "markdown" }'
nurt_program = 'notebook.insert "{root}/n.ipynb" after_id: "load" cell_type: markdown source: "q"'
expect = { fs_after = [{ path = "n.ipynb", contains = "\"q\"" }, { path = "n.ipynb", contains = "\"source\": \"data = load()\"" }] }

[[scenario]]
name = "multi-element source replacement in a single-line cell applies the file separators"
class = "direct"
parity_rows = ["NB-15", "NB-29"]
fs_before = [{ path = "n.ipynb", generate = "notebook:flat" }]
native_call = 'NotebookEdit { file_path: "n.ipynb", action: "replace", cell_id: "one", source: "c = 2\nd = 3" }'
nurt_program = 'notebook.replace "{root}/n.ipynb" id: "one" source: "c = 2\nd = 3"'
expect = { fs_after = [{ path = "n.ipynb", replace_in = "notebook:flat", from = "[\"a = 1.0\\n\", \"b\"]", to = "[\"c = 2\\n\", \"d = 3\"]" }] }
