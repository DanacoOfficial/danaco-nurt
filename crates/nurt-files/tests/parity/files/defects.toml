[[scenario]]
name = "metoda Pythona bez wcięcia nie wywołuje alarmu i zachowuje sąsiednią metodę"
class = "direct"
parity_rows = ["ED-15", "ED-32"]
fs_before = [{ path = "a.py", content = "class Box:\n    def size(self):\n        return 1\n\n    def name(self):\n        return \"a\"\n" }]
native_call = 'Edit { file_path: "a.py", target: { symbol: "Box.size" }, new_string: "def size(self):\n    return 2" }'
nurt_program = 'read "{root}/a.py" symbol: "Box.size" |> replace_all "def size(self):\n    return 2"'
expect = { fs_after = [{ path = "a.py", content = "class Box:\n    def size(self):\n        return 2\n\n    def name(self):\n        return \"a\"\n" }] }

[[scenario]]
name = "wcięcie spacjami przechodzi w tabulatory pliku, także w narzędziu Write"
class = "direct"
parity_rows = ["ED-38", "WR-17"]
fs_before = [{ path = "a.go", content = "package main\n\nfunc alpha() int {\n\tif true {\n\t\treturn 1\n\t}\n\treturn 2\n}\n" }]
native_call = 'Edit { file_path: "a.go", target: { symbol: "alpha" }, new_string: "func alpha() int {\n    if true {\n        return 9\n    }\n    return 2\n}" }'
nurt_program = 'read "{root}/a.go" symbol: "alpha" |> replace_all "func alpha() int {\n    if true {\n        return 9\n    }\n    return 2\n}"'
expect = { fs_after = [{ path = "a.go", content = "package main\n\nfunc alpha() int {\n\tif true {\n\t\treturn 9\n\t}\n\treturn 2\n}\n" }] }

[[scenario]]
name = "plik CRLF zachowuje końce wierszy i wcięcie"
class = "direct"
parity_rows = ["ED-38", "WR-17"]
fs_before = [{ path = "a.ts", content = "class Box {\r\n  size(): number {\r\n    return 1;\r\n  }\r\n}\r\n" }]
native_call = 'Edit { file_path: "a.ts", target: { symbol: "Box.size" }, new_string: "size(): number {\n  return 2;\n}" }'
nurt_program = 'read "{root}/a.ts" symbol: "Box.size" |> replace_all "size(): number {\n  return 2;\n}"'
expect = { fs_after = [{ path = "a.ts", content = "class Box {\r\n  size(): number {\r\n    return 2;\r\n  }\r\n}\r\n" }] }

[[scenario]]
name = "komentarz wiodący zostaje, gdy zamiennik nie zaczyna się komentarzem, a zamiennik z komentarzem go zastępuje"
class = "direct"
parity_rows = ["ED-15"]
fs_before = [{ fixture = "ts_box" }]
native_call = 'Edit { file_path: "a.ts", target: { symbol: "alpha" }, new_string: "// nowy opis\nfunction alpha(id: number) {\n  return id;\n}" }'
nurt_program = 'read "{root}/a.ts" symbol: "alpha" |> replace_all "// nowy opis\nfunction alpha(id: number) {\n  return id;\n}"'
expect = { fs_after = [{ path = "a.ts", replace_in = "ts_box", from = "// opis alpha", to = "// nowy opis" }] }

[[scenario]]
name = "sekcja Markdown zachowuje pusty wiersz przed następnym nagłówkiem"
class = "direct"
parity_rows = ["ED-15", "ED-38"]
fs_before = [{ path = "a.md", content = "# T\r\n\r\nwstęp\r\n\r\n## A\r\n\r\ntreść a\r\n\r\n## B\r\n\r\ntreść b\r\n" }]
native_call = 'Edit { file_path: "a.md", target: { section: "A" }, new_string: "## A\n\nnowa" }'
nurt_program = 'read "{root}/a.md" section: "A" |> replace_all "## A\n\nnowa"'
expect = { fs_after = [{ path = "a.md", content = "# T\r\n\r\nwstęp\r\n\r\n## A\r\n\r\nnowa\r\n\r\n## B\r\n\r\ntreść b\r\n" }] }

[[scenario]]
name = "ostatni element pliku bez końcowego znaku nowego wiersza pozostaje bez niego"
