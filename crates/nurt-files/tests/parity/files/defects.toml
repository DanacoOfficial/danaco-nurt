[[scenario]]
name = "komórka w układzie standardowym zachowuje pola nietknięte znak w znak, końce CRLF i znacznik BOM"
class = "direct"
parity_rows = ["NB-29", "NB-15"]
fs_before = [{ path = "n.ipynb", generate = "notebook:standard_crlf_bom" }]
native_call = 'NotebookEdit { file_path: "n.ipynb", action: "replace", cell_id: "one", source: "print(2)\nprint(3)" }'
nurt_program = 'notebook.replace "{root}/n.ipynb" id: "one" source: "print(2)\nprint(3)"'
expect = { fs_after = [{ path = "n.ipynb", contains = "\"print(2)\\n\",\r\n    \"print(3)\"" }] }

[[scenario]]
name = "nowa komórka i kopia w notebooku o komórkach jednowierszowych zachowują układ i separatory pliku"
class = "direct"
parity_rows = ["NB-23", "NB-25", "NB-26", "NB-29"]
fs_before = [{ path = "n.ipynb", generate = "notebook:flat" }]
native_call = 'NotebookEdit { file_path: "n.ipynb", action: "insert", cell_id: "one", source: "q", cell_type: "markdown" }'
