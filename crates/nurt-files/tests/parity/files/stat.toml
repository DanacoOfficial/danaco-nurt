source = "tests/stat.test.ts"
cases = 7

[[scenario]]
name = "jedna ścieżka to jeden wiersz bez podsumowania"
class = "direct"
parity_rows = ["ST-01", "ST-04", "ST-05", "ST-06"]
fs_before = [{ fixture = "standard" }]
native_call = 'Stat { paths: ["src/app.ts"] }'
nurt_program = 'info "{root}/src/app.ts"'
expect = { fs_unchanged = true, fields = [{ field = "entry.type", value = "file" }, { field = "entry.size", value = 445 }] }

[[scenario]]
name = "wiele ścieżek: podsumowanie, brakujące i chronione"
class = "direct"
parity_rows = ["ST-01", "ST-19", "ST-20"]
fs_before = [{ fixture = "standard" }]
native_call = 'Stat { paths: ["src/app.ts", "docs", "nope.txt"] }'
nurt_program = 'info "{root}/src/app.ts" "{root}/docs" "{root}/nope.txt"'
expect = { fs_unchanged = true, fields = [{ field = "entries[1].type", value = "directory" }, { field = "entries[2].exists", value = false }] }

[[scenario]]
name = "wzorce glob w paths rozwijają się do plików"
class = "direct"
parity_rows = ["ST-01", "ST-02"]
fs_before = [{ fixture = "standard" }]
native_call = 'Stat { paths: ["src/*.ts", "config.*"], columns: ["size"] }'
nurt_program = 'find "{root}" glob: ["src/*.ts", "config.*"] |> select path size'
expect = { fs_unchanged = true, fields = [{ field = "entries[*].path", value = ["config.toml", "config.yaml", "src/app.ts", "src/big.ts"] }] }

[[scenario]]
name = "kolumny treści, hash i known"
class = "direct"
parity_rows = ["ST-03", "ST-07", "ST-08", "ST-10", "ST-11", "ST-12", "ST-13", "ST-16", "ST-17"]
fs_before = [{ fixture = "standard" }]
native_call = 'Stat { paths: ["src/app.ts", "notes.txt", "logo.png"], columns: ["exists", "lines", "encoding", "eol", "symbols", "mode", "account", "protected"], hash: true }'
nurt_program = 'info "{root}/src/app.ts" "{root}/notes.txt" "{root}/logo.png" details: [text, symbols] hash: sha256'
expect = { fs_unchanged = true, fields = [{ field = "entries[0].lines", value = 25 }, { field = "entries[0].encoding", value = "utf-8" }, { field = "entries[0].line_ending", value = "lf" }, { field = "entries[1].line_ending", value = "crlf" }, { field = "entries[2].binary", value = true }] }

[[scenario]]
name = "dowiązanie i plik ponad limit odczytu"
class = "direct"
parity_rows = ["ST-09", "ST-04"]
fs_before = [{ fixture = "standard" }, { path = "alias.txt", symlink_to = "notes.txt" }]
native_call = 'Stat { paths: ["alias.txt"], columns: ["type", "symlink"] }'
nurt_program = 'info "{root}/alias.txt"'
expect = { fs_unchanged = true, fields = [{ field = "entry.type", value = "link" }, { field = "entry.link_target", value = "notes.txt" }] }

[[scenario]]
name = "kolumna git podaje stan plików w repozytorium"
class = "direct"
parity_rows = ["ST-15", "ST-21"]
fs_before = [{ fixture = "standard" }, { path = ".gitignore", content = "*.log\n" }, { path = "build.log", content = "x\n" }]
native_call = 'Stat { paths: ["config.toml", "config.yaml", "notes.txt", "build.log", "nope"], columns: ["git"] } after git init, add and commit of config files'
nurt_program = 'info "{root}/config.toml" "{root}/config.yaml" "{root}/notes.txt" "{root}/build.log" details: [git]'
expect = { fs_unchanged = true, fields = [{ field = "entries[*].git", value = ["clean", "modified", "untracked", "ignored", ""] }] }

[[scenario]]
name = "nieznana kolumna jest odrzucana, format json zwraca pełny skrót"
class = "direct"
parity_rows = ["ST-02", "ST-10", "ST-22"]
fs_before = [{ fixture = "standard" }]
native_call = 'Stat { paths: ["notes.txt"], hash: true, format: "json", fields: ["paths"] }'
nurt_program = 'info "{root}/notes.txt" hash: sha256 format: json'
expect = { fs_unchanged = true, fields = [{ field = "entry.hash.algorithm", value = "sha256" }] }
