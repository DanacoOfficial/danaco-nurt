[package]
name = "nurt-correct-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

# The fuzz crate is built by `cargo fuzz` with a nightly toolchain and is not a
# member of the product workspace.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4.13"
nurt-contracts = { path = "../../nurt-contracts" }
nurt-correct = { path = ".." }
nurt-syntax = { path = "../../nurt-syntax" }

[[bin]]
name = "correct"
path = "fuzz_targets/correct.rs"
test = false
doc = false
bench = false

