# Commands of the catalog that change the world or run programs.
[effects]
change = [
  "analyze.format", "archive.create", "archive.extract", "attributes", "code.rename", "compress",
  "convert", "copy", "create", "decompress", "disable", "edit", "enable", "git.branch",
  "git.checkpoint", "git.clone", "git.commit", "git.fetch", "git.merge", "git.pull", "git.push",
  "git.rebase", "git.reset", "git.restore", "git.stage", "git.stash", "git.switch", "git.tag",
  "git.worktree", "http.download", "http.request", "insert", "move", "notebook.clear_outputs",
  "notebook.copy", "notebook.export", "notebook.insert", "notebook.move", "notebook.normalize",
  "notebook.ops", "notebook.remove", "notebook.replace", "package.install", "package.remove",
  "package.upgrade", "patch", "remove", "rename", "replace", "schedule.create", "schedule.pause",
  "schedule.remove", "schedule.resume", "set", "sql", "write",
  "accounts.create", "accounts.modify", "accounts.remove", "accounts.password", "clock.ntp",
  "clock.set", "clock.timezone_set", "disks.format", "disks.partition", "firewall.allow",
  "firewall.deny", "firewall.remove", "groups.add_member", "groups.create", "groups.remove",
  "groups.remove_member", "modules.load", "modules.unload", "mount", "network.dns_set",
