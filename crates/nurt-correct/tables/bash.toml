output = "effect"

[[entry]]
name = "brew uninstall"
rule = "B40"
class = "C"
help = "package.remove"
min = 1
template = "package.remove [$all:text] manager: brew"
output = "effect"

[[entry]]
name = "date"
rule = "B40"
class = "C"
help = "evaluate"
max = 0
template = "evaluate now()"
output = "other"
option = [
  { flags = ["-u", "--utc"] },
  { flags = ["-s", "--set"], id = "s", value = "text" },
]
form = [{ when = { options = ["s"] }, template = "clock.set $s:text", output = "effect" }]

[[entry]]
name = "sleep"
rule = "B40"
class = "C"
help = "sleep"
min = 1
max = 1
template = "sleep $1:duration"
output = "exec"


