format = "nurt-correction-table/1"
table = "powershell"
summary = "Translation of PowerShell cmdlets, parameters, object properties and operators into Nurt programs."

# Nurt commands whose stages change the world or run programs.
effect_commands = [
  "write", "copy", "move", "remove", "rename", "create", "attributes", "run", "stop", "start",
  "restart", "enable", "disable", "http.download", "archive.extract", "archive.create",
  "schedule.create",
]

# Rule of the notation change of a Windows path or registry path.
path_rule = "L19"

[syntax]
assignment = "P32"
environment = "P31"
call = "P42"
output = "P36"
output_command = "evaluate"
environment_command = "environment"
environment_param = "name"

[registry]
scheme = "registry:"
provider = "Registry::"
drives = { HKLM = "HKLM", HKCU = "HKCU", HKCR = "HKCR", HKU = "HKU", HKCC = "HKCC", HKEY_LOCAL_MACHINE = "HKLM", HKEY_CURRENT_USER = "HKCU", HKEY_CLASSES_ROOT = "HKCR", HKEY_USERS = "HKU", HKEY_CURRENT_CONFIG = "HKCC" }

[dates]
cmdlet = "Get-Date"
now = "now"
ago = "ago"
methods = { AddDays = "d", AddHours = "h", AddMinutes = "m", AddSeconds = "s", AddMilliseconds = "ms" }

# Expansion of a path with a wildcard, `Remove-Item C:\logs\*.tmp`, into a
# selecting stage before the command.
[wildcard]
command = "find"
glob_arg = "glob"
set = [{ arg = "depth", int = 1 }, { arg = "type", ident = "any" }]
absent = [{ params = ["Force"], arg = "hidden", bool = false }]

# Comparison operators of script blocks and of the simplified Where-Object
# syntax. `fold` describes string comparisons, which ignore case in
# PowerShell: `lower` compares lower-case texts, `flag` adds the regex flag
# `i`, `assume` keeps the case-sensitive comparison of Nurt as an assumption.

[[operator]]
names = ["eq", "ieq"]
op = "=="
fold = "lower"

[[operator]]
names = ["ceq"]
op = "=="

[[operator]]
names = ["ne", "ine"]
op = "!="
fold = "lower"

[[operator]]
names = ["cne"]
op = "!="

[[operator]]
names = ["gt", "igt"]
op = ">"
fold = "assume"

[[operator]]
names = ["cgt"]
op = ">"

[[operator]]
names = ["ge", "ige"]
op = ">="
fold = "assume"

[[operator]]
names = ["cge"]
op = ">="

[[operator]]
names = ["lt", "ilt"]
op = "<"
fold = "assume"

[[operator]]
names = ["clt"]
op = "<"

[[operator]]
names = ["le", "ile"]
op = "<="
fold = "assume"

[[operator]]
names = ["cle"]
op = "<="

[[operator]]
names = ["like", "ilike"]
op = "~"
pattern = "wildcard"
fold = "flag"

[[operator]]
names = ["clike"]
op = "~"
pattern = "wildcard"

[[operator]]
names = ["notlike", "inotlike"]
op = "!~"
pattern = "wildcard"
fold = "flag"

[[operator]]
names = ["cnotlike"]
op = "!~"
pattern = "wildcard"

[[operator]]
names = ["match", "imatch"]
op = "~"
pattern = "regex"
fold = "flag"

[[operator]]
names = ["cmatch"]
op = "~"
pattern = "regex"

[[operator]]
names = ["notmatch", "inotmatch"]
op = "!~"
pattern = "regex"
fold = "flag"

[[operator]]
names = ["cnotmatch"]
op = "!~"
pattern = "regex"

[[operator]]
names = ["contains", "icontains"]
op = "in"
swap = true
fold = "assume"

[[operator]]
names = ["ccontains"]
op = "in"
swap = true

[[operator]]
names = ["notcontains", "inotcontains"]
op = "in"
swap = true
negate = true
fold = "assume"

[[operator]]
names = ["in", "iin"]
op = "in"
fold = "assume"

[[operator]]
names = ["cin"]
op = "in"

[[operator]]
names = ["notin", "inotin"]
op = "in"
negate = true
fold = "assume"

[comparison]
text_assumption = "text is compared with case in Nurt; PowerShell ignores case"
order_assumption = "text is ordered by code point in Nurt; PowerShell orders it ignoring case"
prefix_assumption = "the Nurt field has no leading period"

# Properties of PowerShell objects and the fields of the Nurt records that
# replace them. `self` is the field that `$_` alone stands for.

[[record]]
name = "entry"
fields = [
  { property = "Length", field = "size", type = "size" },
  { property = "LastWriteTime", field = "modified", type = "instant" },
  { property = "LastWriteTimeUtc", field = "modified", type = "instant" },
  { property = "CreationTime", field = "created", type = "instant" },
  { property = "LastAccessTime", field = "accessed", type = "instant" },
  { property = "Name", field = "name", type = "text" },
  { property = "FullName", field = "path", type = "text" },
  { property = "BaseName", field = "stem", type = "text" },
  { property = "Extension", field = "extension", type = "text", prefix = "." },
  { property = "DirectoryName", field = "parent", type = "text" },
  { property = "IsReadOnly", field = "readonly", type = "bool" },
  { property = "PSIsContainer", field = "type", equals = "directory" },
]

[[record]]
name = "line"
self = "text"
fields = [
  { property = "Length", field = "text", type = "int", function = "len" },
  { property = "ReadCount", field = "no", type = "int" },
  { property = "PSPath", field = "path", type = "text" },
]

[[record]]
name = "match"
fields = [
  { property = "Path", field = "path", type = "text" },
  { property = "LineNumber", field = "no", type = "int" },
  { property = "Line", field = "line", type = "text" },
]

[[record]]
name = "process"
fields = [
  { property = "Id", field = "pid", type = "int" },
  { property = "Name", field = "name", type = "text" },
  { property = "ProcessName", field = "name", type = "text" },
  { property = "WorkingSet", field = "memory", type = "size" },
  { property = "WorkingSet64", field = "memory", type = "size" },
  { property = "WS", field = "memory", type = "size" },
  { property = "StartTime", field = "started", type = "instant" },
  { property = "Path", field = "executable", type = "text" },
  { property = "UserName", field = "user", type = "text" },
]

[[record]]
name = "service"
fields = [
  { property = "Name", field = "name", type = "text" },
  { property = "ServiceName", field = "name", type = "text" },
  { property = "DisplayName", field = "display_name", type = "text" },
  { property = "Status", field = "state", type = "enum", values = { Running = "running", Stopped = "stopped", StartPending = "starting", StopPending = "stopping", Paused = "paused" } },
  { property = "StartType", field = "start_type", type = "enum", values = { Automatic = "automatic", Manual = "manual", Disabled = "disabled" } },
]

[[record]]
name = "log_event"
fields = [
  { property = "TimeCreated", field = "time", type = "instant" },
  { property = "TimeGenerated", field = "time", type = "instant" },
  { property = "ProviderName", field = "source", type = "text" },
  { property = "Source", field = "source", type = "text" },
  { property = "Message", field = "message", type = "text" },
  { property = "MachineName", field = "host", type = "text" },
  { property = "ProcessId", field = "pid", type = "int" },
  { property = "LevelDisplayName", field = "level", type = "enum", values = { Critical = "critical", Error = "error", Warning = "warning", Information = "info", Verbose = "debug" } },
  { property = "EntryType", field = "level", type = "enum", values = { Error = "error", Warning = "warning", Information = "info" } },
]

# Parameters every cmdlet accepts.

[[common]]
name = "WhatIf"
aliases = ["wi"]
switch = true
role = "preview"
rule = "P33"

[[common]]
name = "Confirm"
aliases = ["cf"]
switch = true
rule = "P34"
drop = "the parameter does not exist; Nurt does not ask for confirmation"

[[common]]
name = "ErrorAction"
aliases = ["ea"]
rule = "P35"
role = "error_action"
values = { SilentlyContinue = "skip", Ignore = "skip", Stop = "", Continue = "" }
arg = "on_missing"
stage = "remove"
drop = "the parameter does not exist; a missing target is reported as an error"

[[common]]
name = "Verbose"
aliases = ["vb"]
switch = true
rule = "P35"
drop = "the parameter does not exist; the report lists every change"

[[common]]
name = "Debug"
aliases = ["db"]
switch = true
rule = "P35"
drop = "the parameter does not exist"

# Cmdlets. `from` holds the cmdlet name and its aliases; `shared` names the
# aliases that are also commands of bash, cmd or Nurt and are read as
# PowerShell only with a PowerShell parameter or PowerShell syntax.

[[entry]]
rule = "P01"
class = "C"
kind = "cmdlet"
from = ["Get-ChildItem", "gci", "ls", "dir"]
shared = ["ls", "dir"]
output = "entry"

[[entry.param]]
name = "Path"
aliases = ["PSPath"]
position = 0
type = "path"
role = "path"
wildcards = true
positional = true

[[entry.param]]
name = "LiteralPath"
aliases = ["LP"]
type = "path"
role = "path"
positional = true

[[entry.param]]
name = "Filter"
position = 1
type = "name_glob"
arg = "glob"

[[entry.param]]
name = "Include"
type = "texts"
role = "include"

[[entry.param]]
name = "Exclude"
type = "texts"
role = "exclude"

[[entry.param]]
name = "Recurse"
aliases = ["s"]
switch = true

[[entry.param]]
name = "Depth"
type = "depth"
arg = "depth"

[[entry.param]]
name = "Force"
switch = true
arg = "hidden"
set = true

[[entry.param]]
name = "File"
aliases = ["af"]
switch = true
arg = "type"
set = "file"

[[entry.param]]
name = "Directory"
aliases = ["ad", "d"]
switch = true
arg = "type"
set = "directory"

[[entry.param]]
name = "FollowSymlink"
switch = true
arg = "follow_links"
set = true

[[entry.param]]
name = "Name"
switch = true
emit = "select"
set = "name"

[[entry.variant]]
rule = "P02"
class = "C"
when_any = ["Recurse", "Depth"]
stages = ["find"]
recursive = true
wildcard_arg = "glob"
absent = [{ params = ["File", "Directory"], arg = "type", ident = "any" }, { params = ["Force"], arg = "hidden", bool = false }]

[[entry.variant]]
rule = "P02"
class = "C"
when_any = ["Filter", "Include", "Exclude"]
stages = ["find"]
wildcard_arg = "glob"
set = [{ arg = "depth", int = 1 }]
absent = [{ params = ["File", "Directory"], arg = "type", ident = "any" }, { params = ["Force"], arg = "hidden", bool = false }]

[[entry.variant]]
rule = "P02"
class = "C"
wildcard = true
stages = ["find"]
wildcard_arg = "glob"
set = [{ arg = "depth", int = 1 }]
absent = [{ params = ["File", "Directory"], arg = "type", ident = "any" }, { params = ["Force"], arg = "hidden", bool = false }]

[[entry.variant]]
rule = "P01"
class = "C"
unless = ["Filter", "Include", "Exclude"]
stages = ["list"]
absent = [{ params = ["Force"], arg = "hidden", bool = false }]
drop = { FollowSymlink = "links are followed only by a recursive search" }

[[entry]]
rule = "P03"
class = "C"
kind = "cmdlet"
from = ["Get-Content", "gc", "cat", "type"]
shared = ["cat", "type"]
output = "content"

[[entry.param]]
name = "Path"
aliases = ["PSPath"]
position = 0
type = "path"
role = "path"
wildcards = true
positional = true

[[entry.param]]
name = "LiteralPath"
aliases = ["LP"]
type = "path"
role = "path"
positional = true

[[entry.param]]
name = "Tail"
aliases = ["Last"]
type = "int"
arg = "last"

[[entry.param]]
name = "TotalCount"
aliases = ["First", "Head"]
type = "upto"
arg = "lines"

[[entry.param]]
name = "Raw"
switch = true
drop = "the whole content is read by default"

[[entry.param]]
name = "Encoding"
type = "enum_text"
arg = "encoding"
values = { UTF8 = "utf-8", UTF8BOM = "utf-8", UTF8NoBOM = "utf-8", ASCII = "ascii", Unicode = "utf-16le", BigEndianUnicode = "utf-16be", UTF32 = "utf-32le", BigEndianUTF32 = "utf-32be", Latin1 = "iso-8859-1" }

[[entry.variant]]
rule = "P03"
class = "C"
continued = true
unless = ["Tail", "TotalCount", "Raw", "Encoding"]
stages = ["lines"]
output = "line"

[[entry.variant]]
rule = "P03"
class = "C"
stages = ["read"]

[[entry]]
rule = "P04"
class = "C"
kind = "cmdlet"
from = ["Set-Content"]

[[entry.param]]
name = "Path"
aliases = ["PSPath"]
position = 0
type = "path"
role = "path"
positional = true

[[entry.param]]
name = "LiteralPath"
aliases = ["LP"]
type = "path"
role = "path"
positional = true

[[entry.param]]
name = "Value"
position = 1
type = "line_text"
from_pipeline = true
positional = true

[[entry.param]]
name = "NoNewline"
switch = true
role = "no_newline"

[[entry.param]]
name = "Encoding"
type = "enum_text"
arg = "encoding"
values = { UTF8 = "utf-8", UTF8BOM = "utf-8", UTF8NoBOM = "utf-8", ASCII = "ascii", Unicode = "utf-16le", BigEndianUnicode = "utf-16be", UTF32 = "utf-32le", BigEndianUTF32 = "utf-32be", Latin1 = "iso-8859-1" }

[[entry.param]]
name = "Force"
switch = true
drop = "read-only files are written without the parameter"

[[entry.variant]]
rule = "P04"
class = "C"
stages = ["write"]
set = [{ arg = "mode", ident = "overwrite" }]

[[entry]]
rule = "P04"
class = "C"
kind = "cmdlet"
from = ["Add-Content", "ac"]

[[entry.param]]
name = "Path"
aliases = ["PSPath"]
position = 0
type = "path"
role = "path"
positional = true

[[entry.param]]
name = "LiteralPath"
aliases = ["LP"]
type = "path"
role = "path"
positional = true

[[entry.param]]
name = "Value"
position = 1
type = "line_text"
from_pipeline = true
positional = true

[[entry.param]]
name = "NoNewline"
switch = true
role = "no_newline"

[[entry.param]]
name = "Encoding"
type = "enum_text"
arg = "encoding"
values = { UTF8 = "utf-8", UTF8BOM = "utf-8", UTF8NoBOM = "utf-8", ASCII = "ascii", Unicode = "utf-16le", BigEndianUnicode = "utf-16be", UTF32 = "utf-32le", BigEndianUTF32 = "utf-32be", Latin1 = "iso-8859-1" }

[[entry.variant]]
rule = "P04"
class = "C"
stages = ["write"]
set = [{ arg = "mode", ident = "append" }]

[[entry]]
rule = "P04"
class = "C"
kind = "cmdlet"
from = ["Out-File"]

[[entry.param]]
name = "FilePath"
aliases = ["Path"]
position = 0
type = "path"
role = "path"
positional = true

[[entry.param]]
name = "LiteralPath"
aliases = ["LP"]
type = "path"
role = "path"
positional = true

[[entry.param]]
name = "InputObject"
type = "line_text"
from_pipeline = true
positional = true

[[entry.param]]
name = "Append"
switch = true
arg = "mode"
set = "append"

[[entry.param]]
name = "NoNewline"
switch = true
role = "no_newline"

[[entry.param]]
name = "Encoding"
type = "enum_text"
arg = "encoding"
values = { UTF8 = "utf-8", UTF8BOM = "utf-8", UTF8NoBOM = "utf-8", ASCII = "ascii", Unicode = "utf-16le", BigEndianUnicode = "utf-16be", UTF32 = "utf-32le", BigEndianUTF32 = "utf-32be", Latin1 = "iso-8859-1" }

[[entry.variant]]
rule = "P04"
class = "C"
stages = ["write"]
absent = [{ params = ["Append"], arg = "mode", ident = "overwrite" }]

[[entry]]
rule = "P05"
class = "C"
kind = "cmdlet"
from = ["Select-String", "sls"]
output = "match"

[[entry.param]]
name = "Pattern"
position = 0
type = "regex"
literal_when = "SimpleMatch"
positional = true

[[entry.param]]
name = "Path"
position = 1
type = "path"
role = "path"
wildcards = true
positional = true

[[entry.param]]
name = "LiteralPath"
aliases = ["LP"]
type = "path"
role = "path"
positional = true

[[entry.param]]
name = "SimpleMatch"
switch = true
arg = "mode"
set = "literal"

[[entry.param]]
name = "CaseSensitive"
switch = true
arg = "case_sensitive"
set = true

[[entry.param]]
name = "Context"
type = "context"

[[entry.param]]
name = "NotMatch"
switch = true
arg = "invert"
set = true

[[entry.param]]
name = "List"
switch = true
arg = "output"
set = "files"

[[entry.param]]
name = "AllMatches"
switch = true
drop = "every match of a line is reported by default"

[[entry.param]]
name = "Encoding"
type = "enum_text"
drop = "the encoding of every file is detected"

[[entry.variant]]
rule = "P05"
class = "C"
stages = ["search"]
wildcard_arg = "glob"
absent = [{ params = ["CaseSensitive"], arg = "case_sensitive", bool = false }]

[[entry]]
rule = "P06"
class = "C"
kind = "cmdlet"
from = ["Copy-Item", "cpi", "cp", "copy"]
shared = ["cp", "copy"]

[[entry.param]]
name = "Path"
aliases = ["PSPath"]
position = 0
type = "path"
role = "path"
wildcards = true
positional = true

[[entry.param]]
name = "LiteralPath"
aliases = ["LP"]
type = "path"
role = "path"
positional = true

[[entry.param]]
name = "Destination"
position = 1
type = "path"
arg = "to"

[[entry.param]]
name = "Recurse"
switch = true

[[entry.param]]
name = "Force"
switch = true
drop = "read-only destinations are replaced without the parameter"

[[entry.variant]]
rule = "P06"
class = "C"
piped = true
stages = ["copy"]
args = { Destination = "into" }

[[entry.variant]]
rule = "P06"
class = "C"
when = ["Recurse"]
stages = ["copy"]

[[entry.variant]]
rule = "P06"
class = "P"
stages = ["copy"]
assumption = "the source is a file; without -Recurse PowerShell copies a directory without its content"

[[entry]]
rule = "P07"
class = "C"
kind = "cmdlet"
from = ["Move-Item", "mi", "mv", "move"]
shared = ["mv", "move"]

[[entry.param]]
name = "Path"
aliases = ["PSPath"]
position = 0
type = "path"
role = "path"
wildcards = true
positional = true

[[entry.param]]
name = "LiteralPath"
aliases = ["LP"]
type = "path"
role = "path"
positional = true

[[entry.param]]
name = "Destination"
position = 1
type = "path"
arg = "to"

[[entry.param]]
name = "Force"
switch = true
arg = "on_conflict"
set = "overwrite"

[[entry.variant]]
rule = "P07"
class = "C"
piped = true
stages = ["move"]
args = { Destination = "into" }
absent = [{ params = ["Force"], arg = "on_conflict", ident = "error" }]

[[entry.variant]]
rule = "P07"
class = "C"
stages = ["move"]
absent = [{ params = ["Force"], arg = "on_conflict", ident = "error" }]

[[entry]]
rule = "P08"
class = "C"
kind = "cmdlet"
from = ["Remove-Item", "ri", "rm", "del", "rd", "erase", "rmdir"]
shared = ["rm", "del", "rd", "erase", "rmdir"]

[[entry.param]]
name = "Path"
aliases = ["PSPath"]
position = 0
type = "path"
role = "path"
wildcards = true
positional = true

[[entry.param]]
name = "LiteralPath"
aliases = ["LP"]
type = "path"
role = "path"
positional = true

[[entry.param]]
name = "Recurse"
aliases = ["r"]
switch = true
drop = "remove deletes directories with their content"

[[entry.param]]
name = "Force"
switch = true

[[entry.variant]]
rule = "P08"
class = "C"
stages = ["remove"]

[[entry]]
rule = "P09"
class = "C"
kind = "cmdlet"
from = ["New-Item", "ni", "mkdir", "md"]
shared = ["mkdir", "md"]
presets = { mkdir = { ItemType = "Directory" }, md = { ItemType = "Directory" } }

[[entry.param]]
name = "Path"
aliases = ["PSPath"]
position = 0
type = "path"
role = "path"
positional = true

[[entry.param]]
name = "Name"
type = "text"
role = "child_name"

[[entry.param]]
name = "ItemType"
aliases = ["Type"]
type = "enum"
arg = "type"
values = { Directory = "directory", File = "file", SymbolicLink = "link", Junction = "junction", HardLink = "link" }

[[entry.param]]
name = "Value"
position = 1
type = "text"
positional = true
stage = "write"

[[entry.param]]
name = "Target"
type = "text"
arg = "target"

[[entry.param]]
name = "Force"
switch = true

[[entry.variant]]
rule = "P09"
error = "E_UNCORRECTABLE"
when_value = { ItemType = "File" }
when = ["Force"]
problem = "replaces_file"
message = "-Force replaces an existing file; write the empty content explicitly"
fix = ["write {Path} \"\" mode: overwrite"]
help = "help write"

[[entry.variant]]
rule = "P09"
class = "C"
when = ["Value"]
unless = ["Target"]
stages = ["write"]
set = [{ arg = "mode", ident = "create" }]
drop = { ItemType = "write creates a file" }

[[entry.variant]]
rule = "P09"
class = "C"
when_value = { ItemType = "HardLink" }
stages = ["create"]
set = [{ arg = "hard", bool = true }]

[[entry.variant]]
rule = "P09"
class = "C"
stages = ["create"]
absent = [{ params = ["ItemType"], arg = "type", ident = "file" }]
drop = { Force = "an existing directory is kept" }

[[entry]]
rule = "P10"
class = "C"
kind = "cmdlet"
from = ["Rename-Item", "rni", "ren"]
shared = ["ren"]

[[entry.param]]
name = "Path"
aliases = ["PSPath"]
position = 0
type = "path"
role = "path"
arg = "path"

[[entry.param]]
name = "LiteralPath"
aliases = ["LP"]
type = "path"
role = "path"
arg = "path"

[[entry.param]]
name = "NewName"
position = 1
type = "new_name"
arg = "to"

[[entry.param]]
name = "Force"
switch = true
drop = "hidden and read-only entries are renamed without the parameter"

[[entry.variant]]
rule = "P10"
class = "C"
stages = ["rename"]

[[entry]]
rule = "P11"
class = "C"
kind = "cmdlet"
from = ["Test-Path"]

[[entry.param]]
name = "Path"
aliases = ["PSPath"]
position = 0
type = "path"
role = "path"
positional = true

[[entry.param]]
name = "LiteralPath"
aliases = ["LP"]
type = "path"
role = "path"
positional = true

[[entry.param]]
name = "PathType"
aliases = ["Type"]
type = "type_check"
emit = "assert"
arg = "all"
