format = "nurt-correction-table/1"
table = "habits_powershell"
summary = "PowerShell cmdlet names and aliases that start a PowerShell habit, and the approved cmdlet verbs."

# Names and aliases of every cmdlet and Windows program of the translation
# table. Aliases that are also Nurt command names (copy, move, sort, select,
# group, diff, sleep, help, start, write) are not habit words: they stay
# names of the language.
words = [
  "Get-ChildItem", "gci", "ls", "dir",
  "Get-Content", "gc", "cat", "type",
  "Set-Content", "Add-Content", "ac", "Out-File",
  "Select-String", "sls",
  "Copy-Item", "cpi", "cp",
  "Move-Item", "mi", "mv",
  "Remove-Item", "ri", "rm", "del", "rd", "erase", "rmdir",
  "New-Item", "ni", "mkdir", "md",
  "Rename-Item", "rni", "ren",
  "Test-Path",
  "Get-Item", "gi", "Get-ItemProperty", "gp", "Get-ItemPropertyValue", "gpv",
  "Set-ItemProperty", "sp", "New-ItemProperty",
  "Get-Acl", "Set-Acl", "icacls", "attrib",
  "Where-Object", "where", "?",
  "Select-Object",
  "Sort-Object",
  "Group-Object", "Measure-Object", "measure",
  "ForEach-Object", "foreach", "%",
  "Compare-Object", "compare",
  "Get-FileHash",
  "Get-Process", "gps", "ps", "Stop-Process", "spps", "kill",
