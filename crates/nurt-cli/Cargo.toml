[package]
name = "nurt-cli"
description = "Command shell and language where every change can be undone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["mcp", "lsp", "migrate", "service", "journal"]
# Components of other command groups. Each feature links the crate that
# implements one subcommand; without it the subcommand is not available.
mcp = ["dep:nurt-mcp"]
mcp-http = ["mcp", "nurt-mcp/http"]
lsp = ["dep:nurt-langserver", "dep:nurt-bind", "dep:nurt-catalog", "dep:nurt-help"]
migrate = ["dep:nurt-migrate", "dep:nurt-bind", "dep:nurt-catalog"]
service = ["dep:nurt-service"]
journal = ["dep:nurt-journal", "dep:nurt-fs"]
# Answers of the protocol server and of the C interface from recorded cases.
stub = ["dep:nurt-ffi", "nurt-ffi/stub"]
testkit = ["nurt-core/fixtures"]

[[bin]]
name = "nurt"
path = "src/main.rs"

[dependencies]
nurt-contracts = { workspace = true }
nurt-core = { workspace = true }
nurt-ffi = { workspace = true, optional = true }
nurt-mcp = { workspace = true, optional = true }
nurt-langserver = { workspace = true, optional = true }
nurt-migrate = { workspace = true, optional = true }
nurt-service = { workspace = true, optional = true }
nurt-journal = { workspace = true, optional = true }
nurt-fs = { workspace = true, optional = true }
nurt-bind = { workspace = true, optional = true }
nurt-catalog = { workspace = true, optional = true }
nurt-help = { workspace = true, optional = true }
nurt-ext = { workspace = true }
ciborium = { workspace = true }
comfy-table = { workspace = true }
ctrlc = { workspace = true }
reedline = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
nurt-core = { workspace = true, features = ["fixtures"] }
nurt-testkit = { workspace = true }
nurt-ffi = { workspace = true, features = ["e2e"] }
jsonschema = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
