[package]
name = "nurt-sys"
description = "System inspection and administration for Danaco Nurt."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
rustix = { workspace = true, features = ["param"] }
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Wmi",
    "Win32_System_Variant",
    "Win32_System_Ole",
] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }

[dependencies]
nurt-contracts = { workspace = true }
nurt-types = { workspace = true }
nurt-syslog = { workspace = true }
nurt-programs = { workspace = true }
sysinfo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
plist = { workspace = true }
quick-xml = { workspace = true }
flate2 = { workspace = true }
zstd = { workspace = true }
liblzma = { workspace = true }
bzip2 = { workspace = true }
lz4_flex = { workspace = true }
tar = { workspace = true }
rusqlite = { workspace = true }
jiff = { workspace = true }
regex = { workspace = true }
globset = { workspace = true }
thiserror = { workspace = true }
which = { workspace = true }
indexmap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
toml = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { workspace = true, features = ["p2p"] }

[[test]]
name = "docs_groups"
path = "../../tests/d7/u15/docs_groups.rs"
