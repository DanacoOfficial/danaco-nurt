[package]
name = "nurt-ffi"
description = "C ABI of the Danaco Nurt library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
# Test double of the engine that answers from a directory of recorded cases.
# Used by the interface tests of embedding applications; never enabled in a
# release build.
stub = ["dep:serde_json_canonicalizer", "dep:sha2"]

[dependencies]
nurt-contracts = { workspace = true }
nurt-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
