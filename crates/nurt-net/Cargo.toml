[package]
name = "nurt-net"
description = "HTTP, downloads, DNS and network diagnostics for Danaco Nurt."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nurt-contracts = { workspace = true }
nurt-types = { workspace = true }
ureq = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
hickory-resolver = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-html = { workspace = true }
flate2 = { workspace = true }
encoding_rs = { workspace = true }
chardetng = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
ciborium = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
jiff = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }

[dev-dependencies]
nurt-testkit = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
toml = { workspace = true }

# The NEON C code of blake3 does not compile against the arm64 intrinsics
# headers of MSVC with clang-cl; the Rust implementation is used there.
[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
blake3 = { workspace = true, features = ["no_neon"] }

