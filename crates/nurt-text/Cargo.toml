[package]
name = "nurt-text"
description = "Text encodings, line endings, search, differences, patches and hashes for Danaco Nurt."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nurt-contracts = { workspace = true }
nurt-types = { workspace = true }
encoding_rs = { workspace = true }
chardetng = { workspace = true }
oem_cp = { workspace = true }
codepage = { workspace = true }
regex = { workspace = true }
fancy-regex = { workspace = true }
grep-searcher = { workspace = true }
grep-regex = { workspace = true }
similar = { workspace = true }
bstr = { workspace = true }
memchr = { workspace = true }
aho-corasick = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
md-5 = { workspace = true }
blake3 = { workspace = true }
crc32fast = { workspace = true }
unicode-normalization = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

# The NEON C code of blake3 does not compile against the arm64 intrinsics
# headers of MSVC with clang-cl; the Rust implementation is used there.
[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
blake3 = { workspace = true, features = ["no_neon"] }

