id = "fetch/all-tags"
description = "The tags option fetches every tag."
corpus = "empty"
transport = "file"
setup = [
  { write = "../upstream/a.txt", content = "a\n" },
  { git = ["init", "-q", "-b", "main"], cwd = "../upstream" },
  { git = ["add", "-A"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "init"], cwd = "../upstream" },
  { write = "../upstream/a.txt", content = "a\nx\n" },
  { git = ["add", "-A"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "c2"], cwd = "../upstream" },
  ["remote", "add", "origin", "../upstream"],
  ["fetch", "-q", "origin"],
  { git = ["switch", "-q", "-c", "side"], cwd = "../upstream" },
  { write = "../upstream/s.txt", content = "s\n" },
  { git = ["add", "-A"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "side"], cwd = "../upstream" },
  { git = ["tag", "side-tag"], cwd = "../upstream" },
  { git = ["switch", "-q", "main"], cwd = "../upstream" },
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["fetch", "--tags", "origin"]
expect_exit = 0

[nurt]
command = "git.fetch"
params = { tags = true, remote = "origin" }
expect = "ok"

[compare]
state = ["refs", "reflog", "state_files", "config", "fsck"]
undo = true
ignore = []
