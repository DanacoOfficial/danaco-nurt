id = "fetch/first-fetch"
description = "First fetch stores branches and tags and writes FETCH_HEAD."
corpus = "empty"
transport = "file"
setup = [
  { write = "../upstream/a.txt", content = "a\n" },
  { git = ["init", "-q", "-b", "main"], cwd = "../upstream" },
  { git = ["add", "-A"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "init"], cwd = "../upstream" },
  { write = "../upstream/a.txt", content = "a\nx\n" },
  { git = ["add", "-A"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "c2"], cwd = "../upstream" },
  { git = ["branch", "topic"], cwd = "../upstream" },
  { git = ["tag", "-a", "-m", "r", "v1"], cwd = "../upstream" },
  ["remote", "add", "origin", "../upstream"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["fetch", "origin"]
expect_exit = 0

[nurt]
command = "git.fetch"
params = { remote = "origin" }
expect = "ok"

[compare]
state = ["refs", "reflog", "state_files", "config", "fsck"]
undo = true
ignore = []
