id = "fetch/checked-out-branch-untouched"
description = "The checked out local branch is not changed by a fetch."
corpus = "empty"
transport = "file"
setup = [
  { write = "../upstream/a.txt", content = "a\n" },
  { git = ["init", "-q", "-b", "main"], cwd = "../upstream" },
  { git = ["add", "-A"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "init"], cwd = "../upstream" },
  { write = "../upstream/a.txt", content = "a\nx\n" },
  { git = ["add", "-A"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "c2"], cwd = "../upstream" },
  ["remote", "add", "origin", "../upstream"],
  ["fetch", "-q", "origin"],
  ["reset", "-q", "--hard", "origin/main"],
  ["branch", "-q", "--set-upstream-to=origin/main", "main"],
  { write = "../upstream/a.txt", content = "a\nnew\n" },
  { git = ["add", "-A"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "more"], cwd = "../upstream" },
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["fetch", "origin"]
expect_exit = 0

[nurt]
command = "git.fetch"
params = { remote = "origin" }
expect = "ok"

[compare]
state = ["refs", "reflog", "state_files", "config", "worktree", "fsck"]
undo = true
ignore = []
