id = "apply/executable-bit-local-change-refused"
description = "A local change of the executable bit refuses an update that changes the file."
corpus = "empty"
setup = [
  { write = "tool", content = "echo\n" },
  { write = "top.txt", content = "t\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  { write = "tool", content = "echo two\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
]
files = { "tool" = { content = "echo\n", executable = true } }
platforms = ["linux", "macos"]

[git]
args = ["switch", "side"]
expect_exit = 1

[nurt]
command = "git.switch"
params = { branch = "side" }
expect = "error:E_GIT_DIRTY"
