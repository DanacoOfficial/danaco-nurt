id = "apply/eol-attribute-crlf"
description = "Files of the target are written with CRLF line endings by the text and eol attributes."
corpus = "empty"
setup = [
  { write = "a.txt", content = "one\ntwo\n" },
  { write = "keep.txt", content = "k\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  { write = ".gitattributes", content = "*.txt text eol=crlf\n" },
  { write = "a.txt", content = "one\ntwo\nthree\n" },
  { write = "new.txt", content = "n\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
]

[git]
args = ["switch", "side"]

[nurt]
command = "git.switch"
params = { branch = "side" }
