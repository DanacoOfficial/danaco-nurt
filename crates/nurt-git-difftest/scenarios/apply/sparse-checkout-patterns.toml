id = "apply/sparse-checkout-patterns"
description = "With non-cone patterns, only selected paths of the target are written."
corpus = "empty"
setup = [
  { write = "keep/k.txt", content = "k\n" },
  { write = "other/o.txt", content = "o\n" },
  { write = "root.txt", content = "r\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  { write = "other/o.txt", content = "o2\n" },
  { write = "other/new.txt", content = "n\n" },
  { write = "keep/k2.txt", content = "k2\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
  ["sparse-checkout", "set", "--no-cone", "/keep/", "/root.txt"],
]

[git]
args = ["switch", "side"]

[nurt]
command = "git.switch"
params = { branch = "side" }
