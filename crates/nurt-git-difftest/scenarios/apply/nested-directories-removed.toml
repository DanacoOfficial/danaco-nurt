id = "apply/nested-directories-removed"
description = "Directories emptied by the update are removed, deepest first."
corpus = "empty"
setup = [
  { write = "deep/a/b/c.txt", content = "c\n" },
  { write = "keep.txt", content = "k\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  ["rm", "-q", "-r", "--", "deep"],
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
]

[git]
args = ["switch", "side"]

[nurt]
command = "git.switch"
params = { branch = "side" }
