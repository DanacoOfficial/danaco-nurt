id = "apply/file-to-directory"
description = "A file replaced by a directory tree in the target."
corpus = "empty"
setup = [
  { write = "p", content = "file\n" },
  { write = "top.txt", content = "t\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  ["rm", "-q", "-r", "--", "p"],
  { write = "p/inner.txt", content = "inner\n" },
  { write = "p/sub/deep.txt", content = "deep\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
]

[git]
args = ["switch", "side"]

[nurt]
command = "git.switch"
params = { branch = "side" }
