id = "apply/untracked-directory-where-file-goes-refused"
description = "An untracked directory with files where the target adds a file refuses the update."
corpus = "empty"
setup = [
  { write = "top.txt", content = "t\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  { write = "n.txt", content = "n\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
]
files = { "n.txt/inner.txt" = "x\n" }

[git]
args = ["switch", "side"]
expect_exit = 1

[nurt]
command = "git.switch"
params = { branch = "side" }
expect = "error:E_GIT_DIRTY"
