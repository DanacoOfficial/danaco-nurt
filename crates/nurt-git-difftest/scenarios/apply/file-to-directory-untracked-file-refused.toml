id = "apply/file-to-directory-untracked-file-refused"
description = "An untracked file where the target needs a directory refuses the update."
corpus = "empty"
setup = [
  { write = "top.txt", content = "t\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  { write = "p/x.txt", content = "x\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
]
files = { "p" = "mine\n" }

[git]
args = ["switch", "side"]
expect_exit = 1

[nurt]
command = "git.switch"
params = { branch = "side" }
expect = "error:E_GIT_DIRTY"
