id = "apply/executable-bit-set"
description = "Only the executable bit changes between the commits; the file content stays."
corpus = "empty"
setup = [
  { write = "tool", content = "echo\n" },
  { write = "top.txt", content = "t\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  { write = "tool", content = "echo\n", executable = true },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
]
platforms = ["linux", "macos"]

[git]
args = ["switch", "side"]

[nurt]
command = "git.switch"
params = { branch = "side" }
