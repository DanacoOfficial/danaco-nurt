id = "apply/symlink-to-file"
description = "A symbolic link replaced by a regular file in the target."
corpus = "empty"
setup = [
  { write = "target.txt", content = "t\n" },
  { write = "link", symlink = "target.txt" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  ["rm", "-q", "-r", "--", "link"],
  { write = "link", content = "regular\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
]
platforms = ["linux", "macos"]

[git]
args = ["switch", "side"]

[nurt]
command = "git.switch"
params = { branch = "side" }
