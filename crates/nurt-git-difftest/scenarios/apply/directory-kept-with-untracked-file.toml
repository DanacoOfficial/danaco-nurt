id = "apply/directory-kept-with-untracked-file"
description = "A directory emptied of tracked files stays when it holds an untracked file."
corpus = "empty"
setup = [
  { write = "d/x.txt", content = "x\n" },
  { write = "keep.txt", content = "k\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  ["rm", "-q", "-r", "--", "d"],
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
]
files = { "d/untracked.txt" = "u\n" }

[git]
args = ["switch", "side"]

[nurt]
command = "git.switch"
params = { branch = "side" }
