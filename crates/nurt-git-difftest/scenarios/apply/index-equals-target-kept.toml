id = "apply/index-equals-target-kept"
description = "A staged change equal to the target keeps the index entry and the file."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "same.txt", content = "s\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  ["rm", "-q", "-r", "--", "b.txt"],
  { write = "a.txt", content = "side\n" },
  { write = "new.txt", content = "n\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
  { write = "a.txt", content = "side\n" },
  ["add", "a.txt"],
]

[git]
args = ["switch", "side"]

[nurt]
command = "git.switch"
params = { branch = "side" }
