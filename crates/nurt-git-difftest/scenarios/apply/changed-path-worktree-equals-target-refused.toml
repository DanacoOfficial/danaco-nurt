id = "apply/changed-path-worktree-equals-target-refused"
description = "An unstaged working tree file equal to the target still refuses the update."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "same.txt", content = "s\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  ["rm", "-q", "-r", "--", "b.txt"],
  { write = "a.txt", content = "side\n" },
  { write = "new.txt", content = "n\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
]
files = { "a.txt" = "side\n" }

[git]
args = ["switch", "side"]
expect_exit = 1

[nurt]
command = "git.switch"
params = { branch = "side" }
expect = "error:E_GIT_DIRTY"
