id = "apply/submodule-gitlink-added"
description = "A gitlink added by the target is checked out as an empty directory without updating the submodule."
corpus = "empty"
setup = [
  { write = "top.txt", content = "t\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  { write = "top.txt", content = "t2\n" },
  ["add", "-A"],
  ["update-index", "--add", "--cacheinfo", "160000,1111111111111111111111111111111111111111,sub"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
]

[git]
args = ["switch", "side"]

[nurt]
command = "git.switch"
params = { branch = "side" }
