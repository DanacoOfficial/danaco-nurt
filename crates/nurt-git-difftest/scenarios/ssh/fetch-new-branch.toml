id = "ssh/fetch-new-branch"
description = "Fetch over SSH creates the remote-tracking reference of a branch created upstream."
corpus = "empty"
transport = "ssh"
setup = [
  { write = "../upstream/a.txt", content = "a\n" },
  { git = ["init", "-q", "-b", "main"], cwd = "../upstream" },
  { git = ["add", "a.txt"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "init"], cwd = "../upstream" },
  ["remote", "add", "origin", "$SERVER/upstream"],
  ["fetch", "-q", "origin"],
  ["reset", "-q", "--hard", "origin/main"],
  ["branch", "-q", "--set-upstream-to=origin/main", "main"],
  { git = ["branch", "topic"], cwd = "../upstream" },
  { write = "../upstream/t.txt", content = "t\n" },
  { git = ["switch", "-q", "topic"], cwd = "../upstream" },
  { git = ["add", "t.txt"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "topic"], cwd = "../upstream" },
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["fetch", "origin"]
expect_exit = 0

[nurt]
command = "git.fetch"
params = { remote = "origin" }
expect = "ok"

[compare]
state = ["refs", "reflog", "state_files", "config", "fsck"]
undo = true
ignore = []
