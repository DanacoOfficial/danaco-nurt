id = "ssh/push-fast-forward"
description = "Push over SSH of a new commit fast-forwards the remote branch."
corpus = "empty"
transport = "ssh"
setup = [
  { git = ["init", "-q", "--bare", "-b", "main", "upstream"], cwd = ".." },
  ["remote", "add", "origin", "$SERVER/upstream"],
  { write = "a.txt", content = "a\n" },
  ["add", "a.txt"],
  ["commit", "-q", "-m", "init"],
  ["push", "-q", "origin", "main"],
  { write = "a.txt", content = "a\nb\n" },
  ["commit", "-q", "-a", "-m", "second"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["push", "origin", "main"]
expect_exit = 0

[nurt]
command = "git.push"
params = { branch = "main" }
expect = "ok"

[compare]
state = ["refs", "reflog", "config", "refs@../upstream", "objects@../upstream", "fsck@../upstream"]
undo = false
ignore = []
