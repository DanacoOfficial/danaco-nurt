id = "ssh/fetch-missing-remote-repository"
description = "Fetch over SSH from a path without a repository fails; the server reports the missing repository and nothing changes locally. The git program empties FETCH_HEAD before it connects; a failed Nurt operation is rolled back as a whole and keeps the previous content."
corpus = "empty"
transport = "ssh"
setup = [
  { write = "../upstream/a.txt", content = "a\n" },
  { git = ["init", "-q", "-b", "main"], cwd = "../upstream" },
  { git = ["add", "a.txt"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "init"], cwd = "../upstream" },
  ["remote", "add", "origin", "$SERVER/upstream"],
  ["fetch", "-q", "origin"],
  ["reset", "-q", "--hard", "origin/main"],
  ["branch", "-q", "--set-upstream-to=origin/main", "main"],
  ["remote", "set-url", "origin", "$SERVER/missing"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["fetch", "origin"]
expect_exit = 128

[nurt]
command = "git.fetch"
params = { remote = "origin" }
expect = "error:E_GIT_PROTOCOL"

[compare]
state = ["refs", "reflog", "state_files", "config", "fsck"]
undo = true
ignore = ["state_files FETCH_HEAD"]
