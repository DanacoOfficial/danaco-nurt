id = "ssh/fetch-new-commits"
description = "Fetch over SSH with protocol version 2 updates the remote-tracking branch with a new upstream commit and writes FETCH_HEAD."
corpus = "empty"
transport = "ssh"
setup = [
  { write = "../upstream/a.txt", content = "a\n" },
  { git = ["init", "-q", "-b", "main"], cwd = "../upstream" },
  { git = ["add", "a.txt"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "init"], cwd = "../upstream" },
  ["remote", "add", "origin", "$SERVER/upstream"],
  ["fetch", "-q", "origin"],
  ["reset", "-q", "--hard", "origin/main"],
  ["branch", "-q", "--set-upstream-to=origin/main", "main"],
  { write = "../upstream/a.txt", content = "a\nb\n" },
  { git = ["commit", "-q", "-a", "-m", "second"], cwd = "../upstream" },
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["fetch", "origin"]
expect_exit = 0

[nurt]
command = "git.fetch"
params = { remote = "origin" }
expect = "ok"

[compare]
state = ["refs", "reflog", "state_files", "config", "fsck"]
undo = true
ignore = []
