id = "worktree/remove-main-refused"
description = "Remove refuses the main working tree."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  { write = ".gitignore", content = "*.log\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
]

[git]
args = ["worktree", "remove", "."]
expect_exit = 128

[nurt]
command = "git.worktree"
params = { "action" = "remove", "path" = "." }
expect = "error:E_GIT_WORKTREE"

[compare]
state = ["refs", "state_files"]
undo = true
ignore = []
