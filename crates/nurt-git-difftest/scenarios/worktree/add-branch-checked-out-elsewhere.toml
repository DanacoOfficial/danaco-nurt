id = "worktree/add-branch-checked-out-elsewhere"
description = "Add refuses a branch checked out in another working tree."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  { write = ".gitignore", content = "*.log\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
]

[git]
args = ["worktree", "add", "../wt", "main"]
expect_exit = 128

[nurt]
command = "git.worktree"
params = { "action" = "add", "path" = "../wt", "branch" = "main" }
expect = "error:E_GIT_REF"

[compare]
state = ["refs", "state_files"]
undo = true
ignore = []
