id = "worktree/add-existing-branch"
description = "Add checks out an existing branch."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  { write = ".gitignore", content = "*.log\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  { write = "a.txt", content = "a2\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "second"],
  ["branch", "side"],
]

[git]
args = ["worktree", "add", "-q", "../wt", "side"]

[nurt]
command = "git.worktree"
params = { "action" = "add", "path" = "../wt", "branch" = "side" }

[compare]
state = ["refs", "reflog", "state_files"]
undo = true
ignore = []
