id = "clone/merge-history"
description = "Clone of a history with a merge commit."
corpus = "empty"
transport = "file"
setup = [
  { write = "../upstream/a.txt", content = "a\n" },
  { git = ["init", "-q", "-b", "main"], cwd = "../upstream" },
  { git = ["add", "-A"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "init"], cwd = "../upstream" },
  { write = "../upstream/a.txt", content = "a\nx\n" },
  { git = ["add", "-A"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "c2"], cwd = "../upstream" },
  { git = ["switch", "-q", "-c", "side"], cwd = "../upstream" },
  { write = "../upstream/s.txt", content = "s\n" },
  { git = ["add", "-A"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "side"], cwd = "../upstream" },
  { git = ["switch", "-q", "main"], cwd = "../upstream" },
  { write = "../upstream/m.txt", content = "m\n" },
  { git = ["add", "-A"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "main"], cwd = "../upstream" },
  { git = ["merge", "-q", "--no-ff", "-m", "merge", "side"], cwd = "../upstream" },
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["clone", "-q", "$SERVER/upstream", "../cloned"]
expect_exit = 0

[nurt]
command = "git.clone"
params = { url = "$SERVER/upstream", to = "../cloned" }
expect = "ok"

[compare]
state = ["refs@../cloned", "reflog@../cloned", "config@../cloned", "state_files@../cloned", "fsck@../cloned", "worktree@../cloned", "index@../cloned"]
undo = false
ignore = []
