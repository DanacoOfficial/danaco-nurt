id = "clone/nested-directories"
description = "Checkout creates nested directories."
corpus = "empty"
transport = "file"
setup = [
  { write = "../upstream/src/lib/deep/mod.txt", content = "m\n" },
  { write = "../upstream/src/main.txt", content = "x\n" },
  { write = "../upstream/docs/readme.txt", content = "r\n" },
  { git = ["init", "-q", "-b", "main"], cwd = "../upstream" },
  { git = ["add", "-A"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "tree"], cwd = "../upstream" },
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["clone", "-q", "$SERVER/upstream", "../cloned"]
expect_exit = 0

[nurt]
command = "git.clone"
params = { url = "$SERVER/upstream", to = "../cloned" }
expect = "ok"

[compare]
state = ["refs@../cloned", "reflog@../cloned", "config@../cloned", "state_files@../cloned", "fsck@../cloned", "worktree@../cloned", "index@../cloned"]
undo = false
ignore = []
