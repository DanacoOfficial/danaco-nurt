id = "clone/remote-head-detached"
description = "Remote with a detached HEAD gives a detached clone."
corpus = "empty"
transport = "file"
setup = [
  { write = "../upstream/a.txt", content = "a\n" },
  { git = ["init", "-q", "-b", "main"], cwd = "../upstream" },
  { git = ["add", "-A"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "init"], cwd = "../upstream" },
  { write = "../upstream/a.txt", content = "a\nx\n" },
  { git = ["add", "-A"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "c2"], cwd = "../upstream" },
  { write = "../upstream/a.txt", content = "a\nx\nx\n" },
  { git = ["add", "-A"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "c3"], cwd = "../upstream" },
  { git = ["checkout", "-q", "--detach", "HEAD~1"], cwd = "../upstream" },
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["clone", "-q", "$SERVER/upstream", "../cloned"]
expect_exit = 0

[nurt]
command = "git.clone"
params = { url = "$SERVER/upstream", to = "../cloned" }
expect = "ok"

[compare]
state = ["refs@../cloned", "reflog@../cloned", "config@../cloned", "state_files@../cloned", "fsck@../cloned", "worktree@../cloned", "index@../cloned"]
undo = false
ignore = []
