id = "checkpoint/create-records-worktree"
description = "Create leaves HEAD, index and working tree unchanged and records one checkpoint."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  { write = ".gitignore", content = "*.log\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
]
files = { "a.txt" = "a-work\n", "new.txt" = "new\n", "debug.log" = "ignored\n" }

[git]
args = ["rev-parse", "--git-dir"]

[nurt]
command = "git.checkpoint"
params = { "action" = "create", "label" = "first" }
record_count = 1

[compare]
state = ["index", "worktree"]
undo = true
ignore = []
