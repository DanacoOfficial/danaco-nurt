id = "checkpoint/create-second-number"
description = "Create numbers a new checkpoint after the existing one."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  { write = ".gitignore", content = "*.log\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["switch", "-q", "-c", "cptmp"],
  { write = "a.txt", content = "a-old\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "nurt checkpoint cp-1: saved"],
  ["update-ref", "refs/nurt/checkpoints/cp-1", "cptmp"],
  ["switch", "-q", "main"],
  ["branch", "-q", "-D", "cptmp"],
]

[git]
args = ["rev-parse", "--git-dir"]

[nurt]
command = "git.checkpoint"
params = { "action" = "create", "label" = "second" }
record_count = 1

[compare]
state = ["index", "worktree"]
undo = true
ignore = []
