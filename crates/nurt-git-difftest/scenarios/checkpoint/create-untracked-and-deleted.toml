id = "checkpoint/create-untracked-and-deleted"
description = "Create records untracked files and files deleted from the working tree."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  { write = ".gitignore", content = "*.log\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
]
files = { "b.txt" = { delete = true }, "dir/n.txt" = "n\n" }

[git]
args = ["rev-parse", "--git-dir"]

[nurt]
command = "git.checkpoint"
params = { "action" = "create" }
record_count = 1

[compare]
state = ["index", "worktree"]
undo = true
ignore = []
