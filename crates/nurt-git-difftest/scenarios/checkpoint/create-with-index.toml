id = "checkpoint/create-with-index"
description = "Create with the index records the staged state as a second commit."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  { write = ".gitignore", content = "*.log\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  { write = "s.txt", content = "staged\n" },
  ["add", "s.txt"],
]
files = { "a.txt" = "a-work\n" }

[git]
args = ["rev-parse", "--git-dir"]

[nurt]
command = "git.checkpoint"
params = { "action" = "create", "index" = true }
record_count = 1

[compare]
state = ["index", "worktree"]
undo = true
ignore = []
