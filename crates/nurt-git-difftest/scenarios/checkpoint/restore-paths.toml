id = "checkpoint/restore-paths"
description = "Restore limited to a directory leaves other files unchanged."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  { write = ".gitignore", content = "*.log\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["switch", "-q", "-c", "cptmp"],
  { write = "dir/c.txt", content = "c-cp\n" },
  { write = "a.txt", content = "a-cp\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "nurt checkpoint cp-1: saved"],
  ["update-ref", "refs/nurt/checkpoints/cp-1", "cptmp"],
  ["switch", "-q", "main"],
  ["branch", "-q", "-D", "cptmp"],
]
files = { "dir/c.txt" = "c-later\n", "a.txt" = "a-later\n" }

[git]
steps = [["restore", "--source=refs/nurt/checkpoints/cp-1", "--worktree", "--", "dir"]]

[nurt]
command = "git.checkpoint"
params = { "action" = "restore", "checkpoint_id" = "cp-1", "save_current" = false, "paths" = ["dir"] }

[compare]
state = ["index", "worktree", "refs", "reflog"]
undo = true
ignore = []
