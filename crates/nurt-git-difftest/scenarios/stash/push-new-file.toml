id = "stash/push-new-file"
description = "Push saves a newly added file and removes it."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
  { write = "added.txt", content = "new\n" },
  ["add", "added.txt"],
]

[git]
args = ["stash", "push", "-q"]

[nurt]
command = "git.stash"
params = { action = "push" }


[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:refs/stash"]
undo = true
ignore = []
