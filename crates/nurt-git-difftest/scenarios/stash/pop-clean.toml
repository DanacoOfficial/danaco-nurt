id = "stash/pop-clean"
description = "Pop of a clean entry restores the changes and removes the entry."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
  { write = "a.txt", content = "a-work\n" },
  { write = "b.txt", content = "b-staged\n" },
  ["add", "b.txt"],
  ["stash", "push", "-q"],
]

[git]
args = ["stash", "pop", "-q"]

[nurt]
command = "git.stash"
params = { action = "pop" }


