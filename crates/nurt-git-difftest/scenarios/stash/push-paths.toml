id = "stash/push-paths"
description = "Push of one directory saves and resets only that directory."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
  { write = "a.txt", content = "a-work\n" },
  { write = "dir/c.txt", content = "c-work\n" },
]

[git]
args = ["stash", "push", "-q", "--", "dir"]

[nurt]
command = "git.stash"
params = { action = "push", paths = ["dir"] }


[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:refs/stash"]
undo = true
ignore = []
