id = "stash/push-nothing"
description = "Push without changes creates no entry."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
]

[git]
args = ["stash", "push", "-q"]

[nurt]
command = "git.stash"
params = { action = "push" }


