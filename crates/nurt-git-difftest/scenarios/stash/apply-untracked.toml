id = "stash/apply-untracked"
description = "Apply writes back the untracked files of the entry."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
  { write = "u/new.txt", content = "u\n" },
  ["stash", "push", "-q", "--include-untracked"],
]

[git]
args = ["stash", "apply", "-q"]

[nurt]
command = "git.stash"
params = { action = "apply" }


