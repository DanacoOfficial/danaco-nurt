id = "stash/push-message"
description = "Push with a message names the entry On <branch>: <message>."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
  { write = "a.txt", content = "a-work\n" },
]

[git]
args = ["stash", "push", "-q", "-m", "work in progress"]

[nurt]
command = "git.stash"
params = { action = "push", message = "work in progress" }


[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:refs/stash"]
undo = true
ignore = []
