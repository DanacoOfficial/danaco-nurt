id = "stash/push-exclude"
description = "Push leaves out an excluded file."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
  { write = "a.txt", content = "a-work\n" },
  { write = "dir/c.txt", content = "c-work\n" },
]

[git]
args = ["stash", "push", "-q", "--", ".", ":(exclude)dir/c.txt"]

[nurt]
command = "git.stash"
params = { action = "push", exclude = ["c.txt"] }


[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:refs/stash"]
undo = true
ignore = []
