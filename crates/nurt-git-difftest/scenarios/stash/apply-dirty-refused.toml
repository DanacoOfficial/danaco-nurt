id = "stash/apply-dirty-refused"
description = "Apply refuses to overwrite a local change of a stashed path."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
  { write = "a.txt", content = "stashed\n" },
  ["stash", "push", "-q"],
  { write = "a.txt", content = "unsaved\n" },
]

[git]
args = ["stash", "apply", "-q"]
expect_exit = 1
[nurt]
command = "git.stash"
params = { action = "apply" }
expect = "error:E_GIT_DIRTY"

