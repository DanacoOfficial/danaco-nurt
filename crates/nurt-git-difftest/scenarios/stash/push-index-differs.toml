id = "stash/push-index-differs"
description = "Push saves a staged version and a different working tree version."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
  { write = "b.txt", content = "b-staged\n" },
  ["add", "b.txt"],
  { write = "b.txt", content = "b-work\n" },
]

[git]
args = ["stash", "push", "-q"]

[nurt]
command = "git.stash"
params = { action = "push" }


[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:refs/stash"]
undo = true
ignore = []
