id = "rebase/start-while-stopped-refused"
description = "a new rebase while one is stopped is refused."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "f.txt", content = "1\n2\n3\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["switch", "-q", "-c", "topic"],
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "t1"],
  { write = "f.txt", content = "1\ntopic\n3\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "t2"],
  { write = "c.txt", content = "c\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "t3"],
  ["switch", "-q", "main"],
  { write = "a.txt", content = "a main\n" },
  { write = "f.txt", content = "1\nmain\n3\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "m1"],
  ["switch", "-q", "topic"],
  ["-c", "alias.rbstop=!git rebase main || true", "rbstop"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["rebase", "main"]
expect_exit = 128

[nurt]
command = "git.rebase"
params = { onto = "main" }
expect = "error:E_GIT_IN_PROGRESS"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD"]
undo = true
ignore = []
