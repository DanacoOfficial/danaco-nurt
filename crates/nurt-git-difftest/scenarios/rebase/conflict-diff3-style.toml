id = "rebase/conflict-diff3-style"
description = "merge.conflictStyle diff3 labels the base as the parent of the picked commit."
corpus = "empty"
setup = [
  ["config", "merge.conflictStyle", "diff3"],
  { write = "a.txt", content = "a\n" },
  { write = "f.txt", content = "1\n2\n3\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["switch", "-q", "-c", "topic"],
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "t1"],
  { write = "f.txt", content = "1\ntopic\n3\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "t2"],
  { write = "c.txt", content = "c\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "t3"],
  ["switch", "-q", "main"],
  { write = "a.txt", content = "a main\n" },
  { write = "f.txt", content = "1\nmain\n3\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "m1"],
  ["switch", "-q", "topic"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["rebase", "main"]
expect_exit = 1

[nurt]
command = "git.rebase"
params = { onto = "main" }
expect = "error:E_GIT_CONFLICT"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD"]
undo = true
ignore = []
