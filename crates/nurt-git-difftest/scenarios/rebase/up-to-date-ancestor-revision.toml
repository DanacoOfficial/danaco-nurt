id = "rebase/up-to-date-ancestor-revision"
description = "rebasing onto an ancestor on a linear history changes nothing."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "f.txt", content = "1\n2\n3\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["switch", "-q", "-c", "topic"],
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "t1"],
  { write = "c.txt", content = "c\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "t2"],
  ["switch", "-q", "main"],
  { write = "a.txt", content = "a main\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "m1"],
  ["switch", "-q", "topic"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["rebase", "topic~1"]
expect_exit = 0

[nurt]
command = "git.rebase"
params = { onto = "topic~1" }
expect = "ok"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD"]
undo = true
ignore = []
