id = "rebase/rename-in-base"
description = "a change of a file renamed on main follows the rename."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "f.txt", content = "1\n2\n3\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["switch", "-q", "-c", "topic"],
  { write = "f.txt", content = "1\ntopic\n3\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "t1"],
  ["switch", "-q", "main"],
  ["mv", "f.txt", "g.txt"],
  ["commit", "-q", "-m", "rename"],
  ["switch", "-q", "topic"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["rebase", "main"]
expect_exit = 0

[nurt]
command = "git.rebase"
params = { onto = "main" }
expect = "ok"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD"]
undo = true
ignore = []
