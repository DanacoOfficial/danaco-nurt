id = "rebase/cherry-picked-commit-skipped"
description = "a commit cherry-picked to main is recognised by its patch identifier."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "f.txt", content = "1\n2\n3\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["switch", "-q", "-c", "topic"],
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "t1"],
  { write = "c.txt", content = "c\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "t2"],
  ["switch", "-q", "main"],
  ["cherry-pick", "topic~1"],
  ["switch", "-q", "topic"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["rebase", "main"]
expect_exit = 0

[nurt]
command = "git.rebase"
params = { onto = "main" }
expect = "ok"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD"]
undo = true
ignore = []
