id = "rebase/continue-after-resolution"
description = "continue commits the resolved file and replays the rest."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "f.txt", content = "1\n2\n3\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["switch", "-q", "-c", "topic"],
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "t1"],
  { write = "f.txt", content = "1\ntopic\n3\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "t2"],
  { write = "c.txt", content = "c\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "t3"],
  ["switch", "-q", "main"],
  { write = "a.txt", content = "a main\n" },
  { write = "f.txt", content = "1\nmain\n3\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "m1"],
  ["switch", "-q", "topic"],
  ["-c", "alias.rbstop=!git rebase main || true", "rbstop"],
  { write = "f.txt", content = "1\nresolved\n3\n" },
  ["add", "f.txt"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["rebase", "--continue"]
expect_exit = 0

[nurt]
command = "git.rebase"
params = { action = "continue" }
expect = "ok"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD"]
undo = true
ignore = ["state_files COMMIT_EDITMSG"]
