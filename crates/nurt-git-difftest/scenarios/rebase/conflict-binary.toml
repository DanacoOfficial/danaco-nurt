id = "rebase/conflict-binary"
description = "a binary file changed on both sides keeps the current side."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "f.txt", content = "1\n2\n3\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  { write = "bin.dat", content = "x\u0000\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "bin"],
  ["switch", "-q", "-c", "topic"],
  { write = "bin.dat", content = "topic\u0000\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "t1"],
  ["switch", "-q", "main"],
  { write = "bin.dat", content = "main\u0000\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "m1"],
  ["switch", "-q", "topic"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["rebase", "main"]
expect_exit = 1

[nurt]
command = "git.rebase"
params = { onto = "main" }
expect = "error:E_GIT_CONFLICT"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD"]
undo = true
ignore = []
