id = "pull/rebase-fork-point"
description = "Pull with mode rebase after the upstream rewrote a commit replays only the commits after the fork point."
corpus = "empty"
setup = [
  { write = "../upstream/a.txt", content = "a\n" },
  { git = ["init", "-q", "-b", "main"], cwd = "../upstream" },
  { git = ["add", "a.txt"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "init"], cwd = "../upstream" },
  ["remote", "add", "origin", "../upstream"],
  ["fetch", "-q", "origin"],
  ["reset", "-q", "--hard", "origin/main"],
  ["branch", "-q", "--set-upstream-to=origin/main", "main"],
  { write = "../upstream/a.txt", content = "a\nb\n" },
  { git = ["commit", "-q", "-a", "-m", "second"], cwd = "../upstream" },
  ["pull", "-q", "--ff-only"],
  { write = "l.txt", content = "l\n" },
  ["add", "l.txt"],
  ["commit", "-q", "-m", "local"],
  { git = ["reset", "-q", "--hard", "HEAD~1"], cwd = "../upstream" },
  { write = "../upstream/a.txt", content = "a\nB\n" },
  { git = ["commit", "-q", "-a", "-m", "second rewritten"], cwd = "../upstream" },
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["pull", "--rebase"]
expect_exit = 0

[nurt]
command = "git.pull"
params = { mode = "rebase" }
expect = "ok"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD", "config"]
undo = true
ignore = []
