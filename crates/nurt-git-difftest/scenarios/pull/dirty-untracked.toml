id = "pull/dirty-untracked"
description = "Pull fetches but refuses to fast-forward over an untracked file the update would create."
corpus = "empty"
setup = [
  { write = "../upstream/a.txt", content = "a\n" },
  { git = ["init", "-q", "-b", "main"], cwd = "../upstream" },
  { git = ["add", "a.txt"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "init"], cwd = "../upstream" },
  ["remote", "add", "origin", "../upstream"],
  ["fetch", "-q", "origin"],
  ["reset", "-q", "--hard", "origin/main"],
  ["branch", "-q", "--set-upstream-to=origin/main", "main"],
  { write = "../upstream/n.txt", content = "new\n" },
  { git = ["add", "n.txt"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "add n"], cwd = "../upstream" },
]
files = { "n.txt" = "mine\n" }
platforms = ["linux", "macos", "windows"]

[git]
args = ["pull"]
expect_exit = 1

[nurt]
command = "git.pull"
params = {  }
expect = "error:E_GIT_DIRTY"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD", "config"]
undo = true
ignore = []
