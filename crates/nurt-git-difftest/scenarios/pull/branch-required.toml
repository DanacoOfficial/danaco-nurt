id = "pull/branch-required"
description = "Pull from a remote other than the upstream remote without a branch fetches, then refuses."
corpus = "empty"
setup = [
  { write = "../upstream/a.txt", content = "a\n" },
  { git = ["init", "-q", "-b", "main"], cwd = "../upstream" },
  { git = ["add", "a.txt"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "init"], cwd = "../upstream" },
  ["remote", "add", "origin", "../upstream"],
  ["fetch", "-q", "origin"],
  ["reset", "-q", "--hard", "origin/main"],
  ["branch", "-q", "--set-upstream-to=origin/main", "main"],
  ["remote", "add", "other", "../upstream"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["pull", "other"]
expect_exit = 1

[nurt]
command = "git.pull"
params = { remote = "other" }
expect = "error:E_GIT_REF"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD", "config"]
undo = true
ignore = []
