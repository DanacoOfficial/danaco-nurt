id = "pull/merge-conflict"
description = "Pull with mode merge stops with conflict markers, MERGE_HEAD, MERGE_MSG and stage entries."
corpus = "empty"
setup = [
  { write = "../upstream/a.txt", content = "a\n" },
  { git = ["init", "-q", "-b", "main"], cwd = "../upstream" },
  { git = ["add", "a.txt"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "init"], cwd = "../upstream" },
  ["remote", "add", "origin", "../upstream"],
  ["fetch", "-q", "origin"],
  ["reset", "-q", "--hard", "origin/main"],
  ["branch", "-q", "--set-upstream-to=origin/main", "main"],
  { write = "../upstream/a.txt", content = "a\nupstream\n" },
  { git = ["commit", "-q", "-a", "-m", "upstream change"], cwd = "../upstream" },
  { write = "a.txt", content = "a\nlocal\n" },
  ["commit", "-q", "-a", "-m", "local change"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["pull", "--no-rebase"]
expect_exit = 1

[nurt]
command = "git.pull"
params = { mode = "merge" }
expect = "error:E_GIT_CONFLICT"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD", "config"]
undo = true
ignore = []
