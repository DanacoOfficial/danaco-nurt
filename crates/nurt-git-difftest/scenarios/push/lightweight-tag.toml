id = "push/lightweight-tag"
description = "Push of a lightweight tag creates it on the remote."
corpus = "empty"
transport = "file"
setup = [
  ["init", "-q", "--bare", "-b", "main", ".git/remote.git"],
  ["remote", "add", "origin", ".git/remote.git"],
  { write = "a.txt", content = "a\n" },
  ["add", "a.txt"],
  ["commit", "-q", "-m", "init"],
  ["tag", "v1"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["push", "origin", "v1"]
expect_exit = 0

[nurt]
command = "git.push"
params = { branch = "v1" }
expect = "ok"

[compare]
state = ["refs", "reflog", "config", "refs@.git/remote.git", "objects@.git/remote.git", "fsck@.git/remote.git"]
undo = true
ignore = []
