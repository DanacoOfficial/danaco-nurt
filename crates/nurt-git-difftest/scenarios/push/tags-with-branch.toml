id = "push/tags-with-branch"
description = "Push with tags sends the branch and every local tag."
corpus = "empty"
transport = "file"
setup = [
  ["init", "-q", "--bare", "-b", "main", ".git/remote.git"],
  ["remote", "add", "origin", ".git/remote.git"],
  { write = "a.txt", content = "a\n" },
  ["add", "a.txt"],
  ["commit", "-q", "-m", "init"],
  ["tag", "v1"],
  ["tag", "-a", "-m", "release", "v2"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["push", "--tags", "origin", "main"]
expect_exit = 0

[nurt]
command = "git.push"
params = { branch = "main", tags = true }
expect = "ok"

[compare]
state = ["refs", "reflog", "config", "refs@.git/remote.git", "objects@.git/remote.git", "fsck@.git/remote.git"]
undo = true
ignore = []
