id = "push/non-bare-other-branch"
description = "Push to a branch that is not checked out in the remote working tree succeeds."
corpus = "empty"
transport = "file"
setup = [
  ["init", "-q", "-b", "main", "../target"],
  { write = "../target/t.txt", content = "t\n" },
  { git = ["add", "t.txt"], cwd = "../target" },
  { git = ["commit", "-q", "-m", "target"], cwd = "../target" },
  ["remote", "add", "origin", "../target"],
  ["fetch", "-q", "origin"],
  ["reset", "-q", "--hard", "origin/main"],
  { write = "a.txt", content = "a\n" },
  ["add", "a.txt"],
  ["commit", "-q", "-m", "local"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["push", "origin", "main:topic"]
expect_exit = 0

[nurt]
command = "git.push"
params = { branch = "main:topic" }
expect = "ok"

[compare]
state = ["refs", "reflog", "config", "refs@../target", "objects@../target", "fsck@../target", "reflog@../target", "worktree@../target"]
undo = true
ignore = []
