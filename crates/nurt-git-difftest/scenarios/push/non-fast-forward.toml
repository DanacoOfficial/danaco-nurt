id = "push/non-fast-forward"
description = "Push of a rewritten branch is rejected as non-fast-forward."
corpus = "empty"
transport = "file"
setup = [
  ["init", "-q", "--bare", "-b", "main", ".git/remote.git"],
  ["remote", "add", "origin", ".git/remote.git"],
  { write = "a.txt", content = "a\n" },
  ["add", "a.txt"],
  ["commit", "-q", "-m", "init"],
  ["push", "-q", "origin", "main"],
  ["commit", "-q", "--amend", "-m", "rewritten"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["push", "origin", "main"]
expect_exit = 1

[nurt]
command = "git.push"
params = { branch = "main" }
expect = "error:E_GIT_PUSH_REJECTED"

[compare]
state = ["refs", "reflog", "config", "refs@.git/remote.git", "objects@.git/remote.git", "fsck@.git/remote.git"]
undo = false
ignore = []
