id = "push/tag-already-exists"
description = "Push of a moved tag is rejected because the tag exists on the remote."
corpus = "empty"
transport = "file"
setup = [
  ["init", "-q", "--bare", "-b", "main", ".git/remote.git"],
  ["remote", "add", "origin", ".git/remote.git"],
  { write = "a.txt", content = "a\n" },
  ["add", "a.txt"],
  ["commit", "-q", "-m", "init"],
  ["tag", "v1"],
  ["push", "-q", "origin", "main", "v1"],
  { write = "a.txt", content = "a\nb\n" },
  ["commit", "-q", "-a", "-m", "second"],
  ["tag", "-f", "v1"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["push", "origin", "v1"]
expect_exit = 1

[nurt]
command = "git.push"
params = { branch = "v1" }
expect = "error:E_GIT_PUSH_REJECTED"

[compare]
state = ["refs", "reflog", "config", "refs@.git/remote.git", "objects@.git/remote.git", "fsck@.git/remote.git"]
undo = false
ignore = []
