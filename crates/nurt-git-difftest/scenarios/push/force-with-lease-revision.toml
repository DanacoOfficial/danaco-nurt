id = "push/force-with-lease-revision"
description = "An explicit lease that matches the remote branch allows the forced push."
corpus = "empty"
transport = "file"
setup = [
  ["init", "-q", "--bare", "-b", "main", ".git/remote.git"],
  ["remote", "add", "origin", ".git/remote.git"],
  { write = "a.txt", content = "a\n" },
  ["add", "a.txt"],
  ["commit", "-q", "-m", "init"],
  ["push", "-q", "origin", "main"],
  ["commit", "-q", "--amend", "-m", "rewritten"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["push", "--force-with-lease=main:origin/main", "origin", "main"]
expect_exit = 0

[nurt]
command = "git.push"
params = { branch = "main", force_with_lease = "origin/main" }
expect = "ok"

[compare]
state = ["refs", "reflog", "config", "refs@.git/remote.git", "objects@.git/remote.git", "fsck@.git/remote.git"]
undo = true
ignore = []
