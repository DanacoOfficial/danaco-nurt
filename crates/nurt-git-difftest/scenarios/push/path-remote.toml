id = "push/path-remote"
description = "Push to a path that is not a configured remote updates no remote-tracking reference."
corpus = "empty"
transport = "file"
setup = [
  ["init", "-q", "--bare", "-b", "main", ".git/remote.git"],
  ["remote", "add", "origin", ".git/remote.git"],
  { write = "a.txt", content = "a\n" },
  ["add", "a.txt"],
  ["commit", "-q", "-m", "init"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["push", ".git/remote.git", "main"]
expect_exit = 0

[nurt]
command = "git.push"
params = { remote = ".git/remote.git", branch = "main" }
expect = "ok"

[compare]
state = ["refs", "reflog", "config", "refs@.git/remote.git", "objects@.git/remote.git", "fsck@.git/remote.git"]
undo = true
ignore = []
