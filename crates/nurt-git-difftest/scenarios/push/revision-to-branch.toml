id = "push/revision-to-branch"
description = "Push of a revision requires and uses the destination of the refspec."
corpus = "empty"
transport = "file"
setup = [
  ["init", "-q", "--bare", "-b", "main", ".git/remote.git"],
  ["remote", "add", "origin", ".git/remote.git"],
  { write = "a.txt", content = "a\n" },
  ["add", "a.txt"],
  ["commit", "-q", "-m", "init"],
  { write = "a.txt", content = "a\nb\n" },
  ["commit", "-q", "-a", "-m", "second"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["push", "origin", "HEAD~1:refs/heads/old"]
expect_exit = 0

[nurt]
command = "git.push"
params = { branch = "HEAD~1:refs/heads/old" }
expect = "ok"

[compare]
state = ["refs", "reflog", "config", "refs@.git/remote.git", "objects@.git/remote.git", "fsck@.git/remote.git"]
undo = true
ignore = []
