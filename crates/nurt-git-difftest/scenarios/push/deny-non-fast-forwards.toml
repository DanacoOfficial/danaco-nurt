id = "push/deny-non-fast-forwards"
description = "receive.denyNonFastForwards rejects a forced push on the remote side."
corpus = "empty"
transport = "file"
setup = [
  ["init", "-q", "--bare", "-b", "main", ".git/remote.git"],
  ["remote", "add", "origin", ".git/remote.git"],
  { write = "a.txt", content = "a\n" },
  ["add", "a.txt"],
  ["commit", "-q", "-m", "init"],
  { git = ["config", "receive.denyNonFastForwards", "true"], cwd = ".git/remote.git" },
  ["push", "-q", "origin", "main"],
  ["commit", "-q", "--amend", "-m", "rewritten"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["push", "--force", "origin", "main"]
expect_exit = 1

[nurt]
command = "git.push"
params = { branch = "main", force = "yes" }
expect = "error:E_GIT_PUSH_REJECTED"

[compare]
state = ["refs", "reflog", "config", "refs@.git/remote.git", "objects@.git/remote.git", "fsck@.git/remote.git"]
undo = false
ignore = []
