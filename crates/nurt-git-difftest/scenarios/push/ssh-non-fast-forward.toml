id = "push/ssh-non-fast-forward"
description = "Push over SSH of a rewritten branch is rejected as not a fast-forward; nothing changes on either side."
corpus = "empty"
transport = "ssh"
setup = [
  { git = ["init", "-q", "--bare", "-b", "main", "upstream"], cwd = ".." },
  ["remote", "add", "origin", "$SERVER/upstream"],
  { write = "a.txt", content = "a\n" },
  ["add", "a.txt"],
  ["commit", "-q", "-m", "init"],
  ["push", "-q", "origin", "main"],
  ["commit", "-q", "--amend", "-m", "rewritten"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["push", "origin", "main"]
expect_exit = 1

[nurt]
command = "git.push"
params = { branch = "main" }
expect = "error:E_GIT_PUSH_REJECTED"

[compare]
state = ["refs", "reflog", "config", "refs@../upstream", "objects@../upstream", "fsck@../upstream"]
undo = false
ignore = []
