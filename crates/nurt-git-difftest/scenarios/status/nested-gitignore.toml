id = "status/nested-gitignore"
description = "A nested ignore file excludes files below its directory."
corpus = "empty"
setup = [
  { write = "a.txt", content = "one\ntwo\nthree\n" },
  { write = "dir/b.txt", content = "b\n" },
  { write = ".gitignore", content = "*.log\nbuild/\n" },
  ["add", "a.txt", "dir/b.txt", ".gitignore"],
  ["commit", "-q", "-m", "init"],
  { write = "dir/.gitignore", content = "*.tmp\n" }, { write = "dir/x.tmp", content = "t\n" }, { write = "dir/keep.txt", content = "k\n" },
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["status", "--porcelain=v2"]
expect_exit = 0

[nurt]
command = "git.status"
params = {  }
expect = "ok"

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
ignore = []
