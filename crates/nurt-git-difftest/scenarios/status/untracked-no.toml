id = "status/untracked-no"
description = "No untracked file is listed with untracked no."
corpus = "empty"
setup = [
  { write = "a.txt", content = "one\ntwo\nthree\n" },
  { write = "dir/b.txt", content = "b\n" },
  { write = ".gitignore", content = "*.log\nbuild/\n" },
  ["add", "a.txt", "dir/b.txt", ".gitignore"],
  ["commit", "-q", "-m", "init"],
  { write = "new/x.txt", content = "x\n" },
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["status", "--porcelain=v2", "--untracked-files=no"]
expect_exit = 0

[nurt]
command = "git.status"
params = { untracked = "no" }
expect = "ok"

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
ignore = []
