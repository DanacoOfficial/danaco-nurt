id = "status/type-change"
description = "A file replaced by a symbolic link is a type change."
corpus = "empty"
setup = [
  { write = "a.txt", content = "one\ntwo\nthree\n" },
  { write = "dir/b.txt", content = "b\n" },
  { write = ".gitignore", content = "*.log\nbuild/\n" },
  ["add", "a.txt", "dir/b.txt", ".gitignore"],
  ["commit", "-q", "-m", "init"],
  { write = "dir/b.txt", symlink = "../a.txt" },
]
platforms = ["linux", "macos"]

[git]
args = ["status", "--porcelain=v2"]
expect_exit = 0

[nurt]
command = "git.status"
params = {  }
expect = "ok"

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
ignore = []
