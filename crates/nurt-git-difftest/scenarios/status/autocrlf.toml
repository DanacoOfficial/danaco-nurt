id = "status/autocrlf"
description = "A file written with converted line endings is not a modification."
corpus = "empty"
setup = [
  ["config", "core.autocrlf", "true"],
  { write = "a.txt", content = "one\ntwo\nthree\n" },
  ["add", "a.txt"],
  ["commit", "-q", "-m", "init"],
  { write = "a.txt", content = "changed\n" },
  ["checkout", "--", "a.txt"],
]
platforms = ["linux", "macos"]

[git]
args = ["status", "--porcelain=v2"]
expect_exit = 0

[nurt]
command = "git.status"
params = {  }
expect = "ok"
record_count = 0

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
ignore = []
