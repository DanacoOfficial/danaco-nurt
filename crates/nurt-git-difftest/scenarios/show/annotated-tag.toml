id = "show/annotated-tag"
description = "An annotated tag is shown before the commit it tags."
corpus = "empty"
setup = [
  ["@clock", "2026-01-01T10:00:00Z"],
  { write = "a.txt", content = "one\ntwo\nthree\n" }, ["add", "a.txt"], ["commit", "-q", "-m", "feat: add a"],
  ["@clock", "2026-01-02T10:00:00Z"],
  { write = "b.txt", content = "b\n" }, ["add", "b.txt"], ["commit", "-q", "-m", "fix(core): add b"],
  ["@clock", "2026-01-03T10:00:00Z"],
  { write = "a.txt", content = "one\nTWO\nthree\n" }, ["commit", "-q", "-a", "-m", "docs: change a"],
  ["tag", "-a", "v1", "-m", "release one"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["show", "v1"]
expect_exit = 0

[nurt]
command = "git.show"
params = { revision = "v1" }
expect = "ok"
record_count = 3
records = [{ kind = "git_tag", name = "v1", message = "release one", tagger = "Nurt Test <test@nurt.invalid>" }, { kind = "commit", subject = "docs: change a" }, { kind = "hunk", path = "a.txt" }]

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
