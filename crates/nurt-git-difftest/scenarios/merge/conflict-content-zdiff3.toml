id = "merge/conflict-content-zdiff3"
description = "merge.conflictStyle zdiff3 moves common lines out of the conflict."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "f.txt", content = "1\n2\n3\n4\n5\n" },
  { write = "u.txt", content = "u\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["switch", "-q", "-c", "topic"],
  { write = "f.txt", content = "1\nx\ntopic\n4\n5\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "topic"],
  ["switch", "-q", "main"],
  { write = "f.txt", content = "1\nx\nmain\n4\n5\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "main"],
  ["config", "merge.conflictStyle", "zdiff3"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["merge", "--no-edit", "topic"]
expect_exit = 1

[nurt]
command = "git.merge"
params = { branch = "topic" }
expect = "error:E_GIT_CONFLICT"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD"]
undo = true
ignore = []
