id = "merge/ff-never-no-commit-stops"
description = "fast_forward never with no_commit stops before the merge commit with MERGE_MODE no-ff."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "f.txt", content = "1\n2\n3\n4\n5\n" },
  { write = "u.txt", content = "u\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["switch", "-q", "-c", "topic"],
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "topic"],
  ["switch", "-q", "main"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["merge", "--no-edit", "--no-ff", "--no-commit", "topic"]
expect_exit = 0

[nurt]
command = "git.merge"
params = { branch = "topic", fast_forward = "never", no_commit = true }
expect = "ok"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD"]
undo = true
ignore = []
