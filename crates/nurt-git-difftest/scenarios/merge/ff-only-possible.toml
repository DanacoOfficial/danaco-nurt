id = "merge/ff-only-possible"
description = "fast_forward only succeeds when the branch can be fast-forwarded."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "f.txt", content = "1\n2\n3\n4\n5\n" },
  { write = "u.txt", content = "u\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["switch", "-q", "-c", "topic"],
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "topic"],
  ["switch", "-q", "main"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["merge", "--no-edit", "--ff-only", "topic"]
expect_exit = 0

[nurt]
command = "git.merge"
params = { branch = "topic", fast_forward = "only" }
expect = "ok"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD"]
undo = true
ignore = []
