id = "merge/staged-change-refused"
description = "A staged change blocks a three-way merge; git appends an empty entry to the HEAD reflog on refusal, which is not compared."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "f.txt", content = "1\n2\n3\n4\n5\n" },
  { write = "u.txt", content = "u\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["switch", "-q", "-c", "topic"],
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "topic"],
  ["switch", "-q", "main"],
  { write = "a.txt", content = "a main\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "main"],
  { write = "s.txt", content = "s\n" },
  ["add", "s.txt"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["merge", "--no-edit", "topic"]
expect_exit = 2

[nurt]
command = "git.merge"
params = { branch = "topic" }
expect = "error:E_GIT_DIRTY"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD"]
undo = true
ignore = ["state_files ORIG_HEAD", "state_files AUTO_MERGE", "reflog logs/HEAD"]
