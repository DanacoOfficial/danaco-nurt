id = "merge/continue-with-staged-edit"
description = "action continue commits the staged resolution."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "f.txt", content = "1\n2\n3\n4\n5\n" },
  { write = "u.txt", content = "u\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["switch", "-q", "-c", "topic"],
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "topic"],
  ["switch", "-q", "main"],
  { write = "a.txt", content = "a main\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "main"],
  ["merge", "-q", "--no-edit", "--no-commit", "topic"],
  { write = "b.txt", content = "edited\n" },
  ["add", "b.txt"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["merge", "--continue"]
expect_exit = 0

[nurt]
command = "git.merge"
params = { action = "continue" }
expect = "ok"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD"]
undo = true
ignore = ["state_files COMMIT_EDITMSG"]
