id = "merge/abort-refuses-edited-merged-file"
description = "action abort is refused when a file changed by the merge was edited."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "f.txt", content = "1\n2\n3\n4\n5\n" },
  { write = "u.txt", content = "u\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["switch", "-q", "-c", "topic"],
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "topic"],
  ["switch", "-q", "main"],
  { write = "a.txt", content = "a main\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "main"],
  ["merge", "-q", "--no-edit", "--no-commit", "topic"],
]
files = { "b.txt" = "edited\n" }
platforms = ["linux", "macos", "windows"]

[git]
args = ["merge", "--abort"]
expect_exit = 128

[nurt]
command = "git.merge"
params = { action = "abort" }
expect = "error:E_GIT_DIRTY"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD"]
undo = true
ignore = []
