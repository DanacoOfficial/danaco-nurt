id = "merge/unrelated-histories-refused"
description = "Histories without a common ancestor are not merged by default."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "f.txt", content = "1\n2\n3\n4\n5\n" },
  { write = "u.txt", content = "u\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["switch", "-q", "-c", "topic"],
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "topic"],
  ["switch", "-q", "main"],
  ["switch", "-q", "--orphan", "other"],
  { write = "o.txt", content = "o\n" },
  ["add", "o.txt"],
  ["commit", "-q", "-m", "other"],
  ["switch", "-q", "main"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["merge", "--no-edit", "other"]
expect_exit = 128

[nurt]
command = "git.merge"
params = { branch = "other" }
expect = "error:E_GIT_NON_FAST_FORWARD"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD"]
undo = true
ignore = ["state_files ORIG_HEAD", "state_files AUTO_MERGE"]
