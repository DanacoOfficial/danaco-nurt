id = "merge/conflict-criss-cross"
description = "A conflict over a virtual base is reported against the merged ancestors."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "f.txt", content = "1\n2\n3\n4\n5\n" },
  { write = "u.txt", content = "u\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["switch", "-q", "-c", "topic"],
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "topic"],
  ["switch", "-q", "main"],
  { write = "a.txt", content = "a main\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "main"],
  ["merge", "-q", "--no-edit", "topic"],
  ["switch", "-q", "topic"],
  ["merge", "-q", "--no-edit", "main~1"],
  { write = "f.txt", content = "1\ntopic\n3\n4\n5\n" },
  ["commit", "-q", "-am", "more"],
  ["switch", "-q", "main"],
  { write = "f.txt", content = "1\nmain\n3\n4\n5\n" },
  ["commit", "-q", "-am", "more-main"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["merge", "--no-edit", "topic"]
expect_exit = 1

[nurt]
command = "git.merge"
params = { branch = "topic" }
expect = "error:E_GIT_CONFLICT"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD"]
undo = true
ignore = []
