id = "merge/continue-with-message"
description = "message replaces the prepared message when the merge is concluded."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "f.txt", content = "1\n2\n3\n4\n5\n" },
  { write = "u.txt", content = "u\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["switch", "-q", "-c", "topic"],
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "topic"],
  ["switch", "-q", "main"],
  { write = "a.txt", content = "a main\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "main"],
  ["merge", "-q", "--no-edit", "--no-commit", "topic"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["commit", "-q", "-m", "Own message"]
expect_exit = 0

[nurt]
command = "git.merge"
params = { action = "continue", message = "Own message" }
expect = "ok"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD"]
undo = true
ignore = ["state_files COMMIT_EDITMSG"]
