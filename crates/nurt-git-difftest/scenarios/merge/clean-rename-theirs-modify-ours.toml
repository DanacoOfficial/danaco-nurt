id = "merge/clean-rename-theirs-modify-ours"
description = "A change of a file renamed on the merged side follows the rename."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "f.txt", content = "1\n2\n3\n4\n5\n" },
  { write = "u.txt", content = "u\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["switch", "-q", "-c", "topic"],
  ["mv", "f.txt", "g.txt"],
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "topic"],
  ["switch", "-q", "main"],
  { write = "f.txt", content = "one\n2\n3\n4\n5\n" },
  ["add", "-A"],
  ["commit", "-q", "--allow-empty", "-m", "main"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["merge", "--no-edit", "topic"]
expect_exit = 0

[nurt]
command = "git.merge"
params = { branch = "topic" }
expect = "ok"

[compare]
state = ["index", "worktree", "refs", "reflog", "state_files", "objects:HEAD"]
undo = true
ignore = []
