id = "conflicts/matrix-merge-rename-delete"
description = "Merge of side with a rename-delete conflict: the side renames src/lib.txt that main deletes."
corpus = "linear-small"
setup = [
  { write = "binary.bin", hex = "00010203" },
  ["add", "-A"],
  ["commit", "-q", "-m", "add binary.bin"],
  ["switch", "-q", "-c", "side"],
  ["mv", "src/lib.txt", "src/moved.txt"],
  ["add", "-A"],
  ["commit", "-q", "-m", "side change"],
  ["switch", "-q", "main"],
  ["rm", "-q", "src/lib.txt"],
  ["add", "-A"],
  ["commit", "-q", "-m", "main change"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["merge", "--no-edit", "side"]
expect_exit = 1

[nurt]
command = "git.merge"
params = { branch = "side" }
expect = "error:E_GIT_CONFLICT"
