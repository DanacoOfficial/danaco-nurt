id = "conflicts/matrix-rebase-rename-rename"
description = "Rebase of main onto side stops with a rename-rename conflict: both sides rename src/lib.txt to different names."
corpus = "linear-small"
setup = [
  { write = "binary.bin", hex = "00010203" },
  ["add", "-A"],
  ["commit", "-q", "-m", "add binary.bin"],
  ["switch", "-q", "-c", "side"],
  ["mv", "src/lib.txt", "src/left.txt"],
  ["add", "-A"],
  ["commit", "-q", "-m", "side change"],
  ["switch", "-q", "main"],
  ["mv", "src/lib.txt", "src/right.txt"],
  ["add", "-A"],
  ["commit", "-q", "-m", "main change"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["rebase", "side"]
expect_exit = 1

[nurt]
command = "git.rebase"
params = { onto = "side" }
expect = "error:E_GIT_CONFLICT"
