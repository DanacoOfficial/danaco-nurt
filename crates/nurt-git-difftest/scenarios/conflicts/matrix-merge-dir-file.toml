id = "conflicts/matrix-merge-dir-file"
description = "Merge of side with a directory-file conflict: the side adds the file thing, main adds thing/inner.txt."
corpus = "linear-small"
setup = [
  { write = "binary.bin", hex = "00010203" },
  ["add", "-A"],
  ["commit", "-q", "-m", "add binary.bin"],
  ["switch", "-q", "-c", "side"],
  { write = "thing", content = "a file\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side change"],
  ["switch", "-q", "main"],
  { write = "thing/inner.txt", content = "inside\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "main change"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["merge", "--no-edit", "side"]
expect_exit = 1

[nurt]
command = "git.merge"
params = { branch = "side" }
expect = "error:E_GIT_CONFLICT"
