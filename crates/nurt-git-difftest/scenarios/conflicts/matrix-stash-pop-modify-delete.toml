id = "conflicts/matrix-stash-pop-modify-delete"
description = "Pop of a stash that conflicts with a later commit, modify-delete: the side deletes docs/guide.md that main modifies."
corpus = "linear-small"
setup = [
  { write = "binary.bin", hex = "00010203" },
  ["add", "-A"],
  ["commit", "-q", "-m", "add binary.bin"],
  ["rm", "-q", "docs/guide.md"],
  ["add", "-A"],
  ["stash", "push", "-q"],
  { write = "docs/guide.md", content = "Guide\n=====\n\nrewritten on main\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "main change"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["stash", "pop"]
expect_exit = 1

[nurt]
command = "git.stash"
params = { action = "pop" }
expect = "error:E_GIT_CONFLICT"
