id = "conflicts/matrix-stash-pop-binary"
description = "Pop of a stash that conflicts with a later commit, binary: both sides change binary.bin to different bytes."
corpus = "linear-small"
setup = [
  { write = "binary.bin", hex = "00010203" },
  ["add", "-A"],
  ["commit", "-q", "-m", "add binary.bin"],
  { write = "binary.bin", hex = "00ff00ff" },
  ["add", "-A"],
  ["stash", "push", "-q"],
  { write = "binary.bin", hex = "00aa00aa" },
  ["add", "-A"],
  ["commit", "-q", "-m", "main change"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["stash", "pop"]
expect_exit = 1

[nurt]
command = "git.stash"
params = { action = "pop" }
expect = "error:E_GIT_CONFLICT"
