id = "conflicts/matrix-stash-pop-add-add"
description = "Pop of a stash that conflicts with a later commit, add-add: both sides add new.txt with different content."
corpus = "linear-small"
setup = [
  { write = "binary.bin", hex = "00010203" },
  ["add", "-A"],
  ["commit", "-q", "-m", "add binary.bin"],
  { write = "new.txt", content = "side\n" },
  ["add", "-A"],
  ["stash", "push", "-q"],
  { write = "new.txt", content = "main\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "main change"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["stash", "pop"]
expect_exit = 1

[nurt]
command = "git.stash"
params = { action = "pop" }
expect = "error:E_GIT_CONFLICT"
