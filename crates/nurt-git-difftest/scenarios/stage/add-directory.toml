id = "stage/add-directory"
description = "Staging a directory stages changed, new and deleted files below it and nothing outside it."
corpus = "empty"
setup = [
  { write = "dir/a.txt", content = "a\n" },
  { write = "dir/gone.txt", content = "g\n" },
  { write = "top.txt", content = "t\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
]
files = { "dir/a.txt" = "A\n", "dir/sub/new.txt" = "n\n", "dir/gone.txt" = { delete = true }, "top.txt" = "T\n" }

[git]
args = ["add", "dir"]

[nurt]
command = "git.stage"
params = { action = "add", paths = ["dir"] }
