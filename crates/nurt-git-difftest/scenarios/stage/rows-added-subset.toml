id = "stage/rows-added-subset"
description = "Stage one of two added rows; the unselected added row is dropped."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\nb\nc\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
]
files = { "a.txt" = "a\nx\ny\nb\nc\n", "sel.patch" = "diff --git a/a.txt b/a.txt\n--- a/a.txt\n+++ b/a.txt\n@@ -1,3 +1,4 @@\n a\n+y\n b\n c\n" }

[git]
args = ["apply", "--cached", "sel.patch"]

[nurt]
command = "git.stage"
params = { action = "add", hunks = ["a.txt#1@3"] }
