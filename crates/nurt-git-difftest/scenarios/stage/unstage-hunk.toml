id = "stage/unstage-hunk"
description = "Unstage the first of two staged hunks; equal to git apply --cached -R with the patch of that hunk."
corpus = "empty"
setup = [
  { write = "a.txt", content = "l1\nl2\nl3\nl4\nl5\nl6\nl7\nl8\nl9\nl10\nl11\nl12\nl13\nl14\nl15\nl16\nl17\nl18\nl19\nl20\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
  { write = "a.txt", content = "l1\nL2\nl3\nl4\nl5\nl6\nl7\nl8\nl9\nl10\nl11\nl12\nl13\nl14\nl15\nl16\nl17\nL18\nl19\nl20\n" },
  ["add", "a.txt"],
]
files = { "sel.patch" = "diff --git a/a.txt b/a.txt\n--- a/a.txt\n+++ b/a.txt\n@@ -1,5 +1,5 @@\n l1\n-l2\n+L2\n l3\n l4\n l5\n" }

[git]
args = ["apply", "--cached", "-R", "sel.patch"]

[nurt]
command = "git.stage"
params = { action = "unstage", hunks = ["a.txt#1"] }
