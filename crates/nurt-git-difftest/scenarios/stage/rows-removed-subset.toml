id = "stage/rows-removed-subset"
description = "Stage one of two removed rows; the unselected removed row stays."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\nb\nc\nd\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
]
files = { "a.txt" = "a\nd\n", "sel.patch" = "diff --git a/a.txt b/a.txt\n--- a/a.txt\n+++ b/a.txt\n@@ -1,4 +1,3 @@\n a\n-b\n c\n d\n" }

[git]
args = ["apply", "--cached", "sel.patch"]

[nurt]
command = "git.stage"
params = { action = "add", hunks = ["a.txt#1@2"] }
