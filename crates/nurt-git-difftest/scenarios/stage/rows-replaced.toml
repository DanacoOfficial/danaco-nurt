id = "stage/rows-replaced"
description = "Stage the removed and the added row of a replaced line; the appended line stays unstaged."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\nb\nc\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
]
files = { "a.txt" = "a\nB\nc\nd\n", "sel.patch" = "diff --git a/a.txt b/a.txt\n--- a/a.txt\n+++ b/a.txt\n@@ -1,3 +1,3 @@\n a\n-b\n+B\n c\n" }

[git]
args = ["apply", "--cached", "sel.patch"]

[nurt]
command = "git.stage"
params = { action = "add", hunks = ["a.txt#1@2-3"] }
