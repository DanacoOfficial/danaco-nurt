id = "open/restore-ident"
description = "The ident attribute expands the identifier on checkout."
corpus = "empty"
setup = [
  { write = "x.c", content = "/* $Id$ */\n" },
  ["add", "x.c"],
  ["commit", "-q", "-m", "content"],
  { write = ".gitattributes", content = "*.c ident\n" },

  ["add", ".gitattributes"],
  ["commit", "-q", "-m", "attributes"],
  ["rm", "-q", "x.c"],
  ["reset", "-q"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["restore", "x.c"]
expect_exit = 0

[nurt]
command = "git.restore"
params = { paths = ["x.c"] }
expect = "ok"

[compare]
state = ["index", "worktree", "refs", "objects:HEAD"]
undo = true
ignore = []
