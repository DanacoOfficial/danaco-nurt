id = "open/restore-autocrlf-true"
description = "Checkout with core.autocrlf=true writes CRLF line endings."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\nb\n" },
  ["add", "a.txt"],
  ["commit", "-q", "-m", "content"],
  { write = ".gitattributes", content = "" },
  ["config", "core.autocrlf", "true"],
  ["add", ".gitattributes"],
  ["commit", "-q", "-m", "attributes"],
  ["rm", "-q", "a.txt"],
  ["reset", "-q"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["restore", "a.txt"]
expect_exit = 0

[nurt]
command = "git.restore"
params = { paths = ["a.txt"] }
expect = "ok"

[compare]
state = ["index", "worktree", "refs", "objects:HEAD"]
undo = true
ignore = []
