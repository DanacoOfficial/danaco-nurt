id = "open/stage-text-auto"
description = "The attribute text=auto converts CRLF in a text file when staging."
corpus = "empty"
setup = [
  { write = ".gitattributes", content = "* text=auto\n" },

  ["add", ".gitattributes"],
  ["commit", "-q", "-m", "attributes"],
]
files = { "x.md" = "x\r\ny\r\n" }
platforms = ["linux", "macos", "windows"]

[git]
args = ["add", "x.md"]
expect_exit = 0

[nurt]
command = "git.stage"
params = { action = "add", paths = ["x.md"] }
expect = "ok"

[compare]
state = ["index", "worktree", "refs", "objects:HEAD"]
undo = true
ignore = []
