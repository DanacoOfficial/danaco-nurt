id = "open/stage-ident"
description = "The ident attribute collapses an expanded identifier when staging."
corpus = "empty"
setup = [
  { write = ".gitattributes", content = "*.c ident\n" },

  ["add", ".gitattributes"],
  ["commit", "-q", "-m", "attributes"],
]
files = { "x.c" = "/* $Id: 0000000000000000000000000000000000000000 $ */\n" }
platforms = ["linux", "macos", "windows"]

[git]
args = ["add", "x.c"]
expect_exit = 0

[nurt]
command = "git.stage"
params = { action = "add", paths = ["x.c"] }
expect = "ok"

[compare]
state = ["index", "worktree", "refs", "objects:HEAD"]
undo = true
ignore = []
