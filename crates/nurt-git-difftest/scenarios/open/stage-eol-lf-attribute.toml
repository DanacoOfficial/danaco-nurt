id = "open/stage-eol-lf-attribute"
description = "The attribute text eol=lf converts CRLF to LF when staging without configuration."
corpus = "empty"
setup = [
  { write = ".gitattributes", content = "*.txt text eol=lf\n" },

  ["add", ".gitattributes"],
  ["commit", "-q", "-m", "attributes"],
]
files = { "a.txt" = "a\r\nb\r\n" }
platforms = ["linux", "macos", "windows"]

[git]
args = ["add", "a.txt"]
expect_exit = 0

[nurt]
command = "git.stage"
params = { action = "add", paths = ["a.txt"] }
expect = "ok"

[compare]
state = ["index", "worktree", "refs", "objects:HEAD"]
undo = true
ignore = []
