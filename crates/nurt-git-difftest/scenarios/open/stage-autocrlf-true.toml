id = "open/stage-autocrlf-true"
description = "Staging with core.autocrlf=true stores LF line endings."
corpus = "empty"
setup = [
  { write = ".gitattributes", content = "" },
  ["config", "core.autocrlf", "true"],
  ["add", ".gitattributes"],
  ["commit", "-q", "-m", "attributes"],
]
files = { "a.txt" = "a\r\nb\r\n" }
platforms = ["linux", "macos", "windows"]

[git]
args = ["add", "a.txt"]
expect_exit = 0

[nurt]
command = "git.stage"
params = { action = "add", paths = ["a.txt"] }
expect = "ok"

[compare]
state = ["index", "worktree", "refs", "objects:HEAD"]
undo = true
ignore = []
