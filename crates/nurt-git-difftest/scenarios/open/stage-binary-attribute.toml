id = "open/stage-binary-attribute"
description = "The binary attribute stores CRLF bytes unchanged."
corpus = "empty"
setup = [
  { write = ".gitattributes", content = "*.bin binary\n" },
  ["config", "core.autocrlf", "true"],
  ["add", ".gitattributes"],
  ["commit", "-q", "-m", "attributes"],
]
files = { "a.bin" = "a\r\nb\r\n" }
platforms = ["linux", "macos", "windows"]

[git]
args = ["add", "a.bin"]
expect_exit = 0

[nurt]
command = "git.stage"
params = { action = "add", paths = ["a.bin"] }
expect = "ok"

[compare]
state = ["index", "worktree", "refs", "objects:HEAD"]
undo = true
ignore = []
