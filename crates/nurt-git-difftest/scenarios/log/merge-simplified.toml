id = "log/merge-simplified"
description = "A merge equal to one parent within the path is followed through that parent only."
corpus = "empty"
setup = [
  ["@clock", "2026-01-01T10:00:00Z"],
  { write = "f", content = "a\nb\nc\n" }, { write = "other", content = "o\n" }, ["add", "."], ["commit", "-q", "-m", "base"],
  ["@clock", "2026-01-02T10:00:00Z"],
  ["checkout", "-q", "-b", "topic"], { write = "f", content = "a\nT\nc\n" }, ["commit", "-q", "-a", "-m", "topic f"],
  ["@clock", "2026-01-03T10:00:00Z"],
  ["checkout", "-q", "main"], { write = "other", content = "o\nm\n" }, ["commit", "-q", "-a", "-m", "main other"],
  ["@clock", "2026-01-04T10:00:00Z"],
  ["merge", "-q", "--no-ff", "-m", "merge topic", "topic"],

]
platforms = ["linux", "macos", "windows"]

[git]
args = ["log", "--", "f"]
expect_exit = 0

[nurt]
command = "git.log"
params = { path = ["f"] }
expect = "ok"
record_count = 2
records = [{ kind = "commit", subject = "topic f" }, { kind = "commit", subject = "base" }]

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
