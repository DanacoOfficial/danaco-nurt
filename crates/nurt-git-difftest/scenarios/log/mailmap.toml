id = "log/mailmap"
description = "Identities are mapped through .mailmap."
corpus = "empty"
setup = [
  ["@clock", "2026-01-01T10:00:00Z"],
  { write = "a.txt", content = "one\ntwo\nthree\n" }, ["add", "a.txt"], ["commit", "-q", "-m", "feat: add a"],
  ["@clock", "2026-01-02T10:00:00Z"],
  { write = "b.txt", content = "b\n" }, ["add", "b.txt"], ["commit", "-q", "-m", "fix(core): add b"],
  ["@clock", "2026-01-03T10:00:00Z"],
  { write = "a.txt", content = "one\nTWO\nthree\n" }, ["commit", "-q", "-a", "-m", "docs: change a"],
  ["@clock", "2026-01-04T10:00:00Z"],
  { write = ".mailmap", content = "Proper Name <proper@example.com> <test@nurt.invalid>\n" }, ["add", ".mailmap"], ["commit", "-q", "-m", "add mailmap"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["log", "-n", "1", "--use-mailmap"]
expect_exit = 0

[nurt]
command = "git.log"
params = { count = 1 }
expect = "ok"
record_count = 1
records = [{ kind = "commit", subject = "add mailmap", author = "Proper Name", author_email = "proper@example.com" }]

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
