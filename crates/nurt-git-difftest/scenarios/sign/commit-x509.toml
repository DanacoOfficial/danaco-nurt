id = "sign/commit-x509"
description = "The x509 signature format is not supported; the commit is refused. `git` leaves COMMIT_EDITMSG behind after refusing, which Nurt does not write."
corpus = "empty"
platforms = ["linux"]
setup = [
  ["config", "gpg.format", "x509"],
  ["config", "gpg.x509.program", "false"],
  { write = "a.txt", content = '''
signed content
''' },
  ["add", "-A"],
]

[git]
args = ["commit", "-q", "-S", "-m", "x"]
expect_exit = 128

[nurt]
command = "git.commit"
params = { staged = true, message = "x", sign = true }
expect = "error:E_GIT_SIGN"

[compare]
ignore = ["state_files COMMIT_EDITMSG"]
