id = "sign/tag-ssh-missing-key"
description = "A signed tag with gpg.format ssh and no user.signingKey is refused."
corpus = "empty"
platforms = ["linux"]
setup = [
  ["config", "gpg.format", "ssh"],
  ["config", "gpg.ssh.program", "false"],
  { write = "a.txt", content = '''
one
''' },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
]

[git]
args = ["tag", "-s", "v1", "-m", "x", "HEAD"]
expect_exit = 128

[nurt]
command = "git.tag"
params = { name = "v1", message = "x", sign = true }
expect = "error:E_GIT_SIGN"
