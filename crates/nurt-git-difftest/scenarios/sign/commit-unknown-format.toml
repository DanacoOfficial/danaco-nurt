id = "sign/commit-unknown-format"
description = "An unknown gpg.format value is refused when the commit is to be signed. `git` leaves COMMIT_EDITMSG behind after refusing, which Nurt does not write."
corpus = "empty"
platforms = ["linux"]
setup = [
  ["config", "gpg.format", "foo"],
  { write = "a.txt", content = '''
signed content
''' },
  ["add", "-A"],
]

[git]
args = ["commit", "-q", "-S", "-m", "x"]
expect_exit = 128

[nurt]
command = "git.commit"
params = { staged = true, message = "x", sign = true }
expect = "error:E_GIT_SIGN"

[compare]
ignore = ["state_files COMMIT_EDITMSG"]
