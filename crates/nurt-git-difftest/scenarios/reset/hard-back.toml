id = "reset/hard-back"
description = "A hard reset to the parent restores, adds and removes working tree files."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
  { write = "a.txt", content = "a2\n" },
  ["rm", "-q", "b.txt"],
  { write = "new.txt", content = "n2\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "second"],
]

[git]
args = ["reset", "-q", "--hard", "HEAD~1"]

[nurt]
command = "git.reset"
params = { revision = "HEAD~1", mode = "hard" }

