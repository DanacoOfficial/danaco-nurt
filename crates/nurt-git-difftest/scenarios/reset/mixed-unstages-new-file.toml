id = "reset/mixed-unstages-new-file"
description = "A mixed reset removes a newly added file from the index only."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
  { write = "a.txt", content = "a2\n" },
  ["rm", "-q", "b.txt"],
  { write = "new.txt", content = "n2\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "second"],
  { write = "added.txt", content = "new\n" },
  ["add", "added.txt"],
]

[git]
args = ["reset", "-q", "HEAD"]

[nurt]
command = "git.reset"
params = { revision = "HEAD" }

