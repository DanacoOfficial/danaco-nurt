id = "reset/orig-head"
description = "A second reset to ORIG_HEAD returns to the commit before the first reset."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
  { write = "a.txt", content = "a2\n" },
  ["rm", "-q", "b.txt"],
  { write = "new.txt", content = "n2\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "second"],
  ["reset", "-q", "--hard", "HEAD~1"],
]

[git]
args = ["reset", "-q", "--hard", "ORIG_HEAD"]

[nurt]
command = "git.reset"
params = { revision = "ORIG_HEAD", mode = "hard" }

