id = "reset/merge-state-hard"
description = "A hard reset during a merge removes MERGE_HEAD and the merged files."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
  ["switch", "-q", "-c", "side"],
  { write = "x.txt", content = "x\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
  { write = "a.txt", content = "a2\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "second"],
  ["merge", "--no-commit", "--no-ff", "-q", "side"],
]

[git]
args = ["reset", "-q", "--hard", "HEAD"]

[nurt]
command = "git.reset"
params = { revision = "HEAD", mode = "hard" }

