id = "reset/soft-forward"
description = "A soft reset to a later commit moves the branch forward."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
  { write = "a.txt", content = "a2\n" },
  ["rm", "-q", "b.txt"],
  { write = "new.txt", content = "n2\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "second"],
  ["tag", "later"],
  ["reset", "-q", "--hard", "HEAD~1"],
]

[git]
args = ["reset", "-q", "--soft", "later"]

[nurt]
command = "git.reset"
params = { revision = "later", mode = "soft" }

