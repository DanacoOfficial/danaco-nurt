id = "reset/annotated-tag"
description = "A reset to an annotated tag moves to the tagged commit."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
  { write = "a.txt", content = "a2\n" },
  ["rm", "-q", "b.txt"],
  { write = "new.txt", content = "n2\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "second"],
  ["tag", "-a", "-m", "release", "v1", "HEAD~1"],
]

[git]
args = ["reset", "-q", "--hard", "v1"]

[nurt]
command = "git.reset"
params = { revision = "v1", mode = "hard" }

