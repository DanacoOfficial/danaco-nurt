id = "reset/merge-state-soft-refused"
description = "A soft reset during a merge is refused."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
  ["switch", "-q", "-c", "side"],
  { write = "x.txt", content = "x\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
  { write = "a.txt", content = "a2\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "second"],
  ["merge", "--no-commit", "--no-ff", "-q", "side"],
]

[git]
args = ["reset", "-q", "--soft", "HEAD~1"]
expect_exit = 128
[nurt]
command = "git.reset"
params = { revision = "HEAD~1", mode = "soft" }
expect = "error:E_GIT_IN_PROGRESS"
