id = "reset/hard-removes-new-file"
description = "A hard reset deletes a newly added file from the working tree."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a1\n" },
  { write = "b.txt", content = "b1\n" },
  { write = "dir/c.txt", content = "c1\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "first"],
  { write = "a.txt", content = "a2\n" },
  ["rm", "-q", "b.txt"],
  { write = "new.txt", content = "n2\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "second"],
  { write = "added/deep.txt", content = "new\n" },
  ["add", "added/deep.txt"],
]

[git]
args = ["reset", "-q", "--hard", "HEAD"]

[nurt]
command = "git.reset"
params = { revision = "HEAD", mode = "hard" }

