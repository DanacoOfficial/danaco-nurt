id = "commit/exclude-removes-path-from-index"
description = "exclude leaves a staged path out of the commit."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  { write = "a.txt", content = "a2\n" },
  { write = "b.txt", content = "b2\n" },
]
platforms = ["linux", "macos", "windows"]

[git]
steps = [
  ["add", "a.txt"],
  ["commit", "-q", "-m", "excluded"],
]
expect_exit = 0

[nurt]
command = "git.commit"
params = { message = "excluded", all = true, exclude = ["b.txt"] }
expect = "ok"

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config", "objects:HEAD"]
undo = true
ignore = []
