id = "commit/all-executable-bit"
description = "all records a changed executable bit."
corpus = "empty"
files = { "a.txt" = { content = "a\n", executable = true } }
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
]
platforms = ["linux", "macos"]

[git]
args = ["commit", "-q", "-a", "-m", "mode"]
expect_exit = 0

[nurt]
command = "git.commit"
params = { message = "mode", all = true }
expect = "ok"

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config", "objects:HEAD"]
undo = true
ignore = []
