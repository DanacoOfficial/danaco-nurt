id = "commit/paths-records-deletion"
description = "paths records the deletion of a tracked file."
corpus = "empty"
files = { "b.txt" = { delete = true } }
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["commit", "-q", "-m", "drop", "--only", "--", "b.txt"]
expect_exit = 0

[nurt]
command = "git.commit"
params = { message = "drop", paths = ["b.txt"] }
expect = "ok"

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config", "objects:HEAD"]
undo = true
ignore = []
