id = "commit/all-and-paths-conflict"
description = "all with paths is refused."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  { write = "a.txt", content = "a2\n" },
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["commit", "-q", "-a", "-m", "x", "--", "a.txt"]
expect_exit = 128

[nurt]
command = "git.commit"
params = { message = "x", all = true, paths = ["a.txt"] }
expect = "error:E_PARAM_CONFLICT"

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config", "objects:HEAD"]
undo = false
ignore = []
