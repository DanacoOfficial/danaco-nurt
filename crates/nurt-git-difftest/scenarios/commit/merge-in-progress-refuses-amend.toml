id = "commit/merge-in-progress-refuses-amend"
description = "amend during a merge is refused."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["switch", "-q", "-c", "topic"],
  { write = "t.txt", content = "t\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "topic"],
  ["switch", "-q", "main"],
  { write = "m.txt", content = "m\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "main"],
  ["merge", "-q", "--no-commit", "--no-ff", "topic"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["commit", "-q", "--amend", "-m", "x"]
expect_exit = 128

[nurt]
command = "git.commit"
params = { message = "x", amend = true }
expect = "error:E_PARAM_CONFLICT"

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config", "objects:HEAD"]
undo = false
ignore = []
