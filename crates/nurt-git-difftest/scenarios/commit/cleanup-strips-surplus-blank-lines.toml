id = "commit/cleanup-strips-surplus-blank-lines"
description = "The default cleanup removes trailing blanks and collapses blank runs."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  { write = "a.txt", content = "a2\n" },
  ["add", "a.txt"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["commit", "-q", "-m", "subject\n\n\n\nbody   \n\n\n"]
expect_exit = 0

[nurt]
command = "git.commit"
params = { message = "subject\n\n\n\nbody   \n\n\n", staged = true }
expect = "ok"

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config", "objects:HEAD"]
undo = true
ignore = []
strict = true
