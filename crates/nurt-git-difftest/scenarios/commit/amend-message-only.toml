id = "commit/amend-message-only"
description = "amend alone replaces the message and keeps the tree."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  { write = "a.txt", content = "a2\n" },
  ["add", "a.txt"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["commit", "-q", "--amend", "--only", "-m", "reworded"]
expect_exit = 0

[nurt]
command = "git.commit"
params = { message = "reworded", amend = true }
expect = "ok"

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config", "objects:HEAD"]
undo = true
ignore = []
strict = true
