id = "common/hook-pre-commit-accepts"
description = "A pre-commit hook that exits 0 lets the commit through."
corpus = "linear-small"
setup = [
  { write = "new.txt", content = "new\n" },
  ["add", "new.txt"],
  { write = ".git/hooks/pre-commit", content = "#!/bin/sh\nexit 0\n", executable = true },
]
platforms = ["linux", "macos"]

[git]
args = ["commit", "-q", "-m", "hooked commit"]
expect_exit = 0

[nurt]
command = "git.commit"
params = { message = "hooked commit", staged = true, hooks = true }
expect = "ok"
