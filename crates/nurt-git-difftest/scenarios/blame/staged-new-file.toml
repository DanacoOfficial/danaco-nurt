id = "blame/staged-new-file"
description = "A staged file that is not in HEAD has only uncommitted lines."
corpus = "empty"
setup = [
  ["@clock", "2026-01-01T10:00:00Z"],
  { write = "a.txt", content = "one\ntwo\nthree\n" }, ["add", "a.txt"], ["commit", "-q", "-m", "feat: add a"],
  ["@clock", "2026-01-02T10:00:00Z"],
  { write = "b.txt", content = "b\n" }, ["add", "b.txt"], ["commit", "-q", "-m", "fix(core): add b"],
  ["@clock", "2026-01-03T10:00:00Z"],
  { write = "a.txt", content = "one\nTWO\nthree\n" }, ["commit", "-q", "-a", "-m", "docs: change a"],
  { write = "n.txt", content = "x\ny\n" }, ["add", "n.txt"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["blame", "--porcelain", "--", "n.txt"]
expect_exit = 0

[nurt]
command = "git.blame"
params = { path = "n.txt" }
expect = "ok"
record_count = 2
records = [{ kind = "blame_line", no = 1, author = "Not Committed Yet" }, { kind = "blame_line", no = 2, author = "Not Committed Yet" }]

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
