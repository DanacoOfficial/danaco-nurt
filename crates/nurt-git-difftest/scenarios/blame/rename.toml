id = "blame/rename"
description = "Lines are followed through a rename of the whole file."
corpus = "empty"
setup = [
  ["@clock", "2026-01-01T10:00:00Z"],
  { write = "a.txt", content = "one\ntwo\nthree\n" }, ["add", "a.txt"], ["commit", "-q", "-m", "feat: add a"],
  ["@clock", "2026-01-02T10:00:00Z"],
  { write = "b.txt", content = "b\n" }, ["add", "b.txt"], ["commit", "-q", "-m", "fix(core): add b"],
  ["@clock", "2026-01-03T10:00:00Z"],
  { write = "a.txt", content = "one\nTWO\nthree\n" }, ["commit", "-q", "-a", "-m", "docs: change a"],
  ["@clock", "2026-01-04T10:00:00Z"],
  ["mv", "a.txt", "z.txt"], ["commit", "-q", "-m", "rename a to z"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["blame", "--porcelain", "HEAD", "--", "z.txt"]
expect_exit = 0

[nurt]
command = "git.blame"
params = { path = "z.txt", revision = "HEAD" }
expect = "ok"
record_count = 3
records = [{ kind = "blame_line", no = 1, original_path = "a.txt", path = "z.txt" }, { kind = "blame_line", no = 2, original_path = "a.txt" }, { kind = "blame_line", no = 3, original_path = "a.txt" }]

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
