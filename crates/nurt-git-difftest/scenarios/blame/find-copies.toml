id = "blame/find-copies"
description = "With find_copies, lines copied from a file changed by the same commit belong to the commit that wrote them."
corpus = "empty"
setup = [
  ["@clock", "2026-01-01T10:00:00Z"],
  { write = "src.txt", content = "alpha line of the original file\nbeta line of the original file\ngamma line of the original file\ndelta line of the original file\n" }, ["add", "src.txt"], ["commit", "-q", "-m", "feat: add src"],
  ["@clock", "2026-01-02T10:00:00Z"],
  { write = "src.txt", content = "alpha line of the original file\nbeta line of the original file\ngamma line of the original file\ndelta line of the original file\nextra\n" },
  { write = "dst.txt", content = "alpha line of the original file\nbeta line of the original file\ngamma line of the original file\ndelta line of the original file\n" },
  ["add", "dst.txt"], ["commit", "-q", "-a", "-m", "feat: copy lines into dst"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["blame", "-C", "--porcelain", "HEAD", "--", "dst.txt"]
expect_exit = 0

[nurt]
command = "git.blame"
params = { path = "dst.txt", revision = "HEAD", find_copies = true }
expect = "ok"
record_count = 4
records = [{ kind = "blame_line", no = 1, original_path = "src.txt", original_no = 1, boundary = true }, { kind = "blame_line", no = 4, original_path = "src.txt", original_no = 4 }]

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
