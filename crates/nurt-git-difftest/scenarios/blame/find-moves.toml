id = "blame/find-moves"
description = "With find_moves, lines moved within a file belong to the commit that wrote them."
corpus = "empty"
setup = [
  ["@clock", "2026-01-01T10:00:00Z"],
  { write = "a.txt", content = "first block line with text\nsecond block line with text\nthird block line with text\nmiddle\nfiller one\nfiller two\n" }, ["add", "a.txt"], ["commit", "-q", "-m", "feat: add a"],
  ["@clock", "2026-01-02T10:00:00Z"],
  { write = "a.txt", content = "middle\nfiller one\nfiller two\nfirst block line with text\nsecond block line with text\nthird block line with text\n" }, ["commit", "-q", "-a", "-m", "refactor: move block"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["blame", "-M", "--porcelain", "HEAD", "--", "a.txt"]
expect_exit = 0

[nurt]
command = "git.blame"
params = { path = "a.txt", revision = "HEAD", find_moves = true }
expect = "ok"
record_count = 6
records = [{ kind = "blame_line", no = 1, boundary = true }, { kind = "blame_line", no = 4, boundary = true, original_no = 1 }, { kind = "blame_line", no = 6, boundary = true, original_no = 3 }]

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
