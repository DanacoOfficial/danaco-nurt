id = "blame/worktree-change"
description = "Changed lines of the working tree are not committed yet."
corpus = "empty"
setup = [
  ["@clock", "2026-01-01T10:00:00Z"],
  { write = "a.txt", content = "one\ntwo\nthree\n" }, ["add", "a.txt"], ["commit", "-q", "-m", "feat: add a"],
  ["@clock", "2026-01-02T10:00:00Z"],
  { write = "b.txt", content = "b\n" }, ["add", "b.txt"], ["commit", "-q", "-m", "fix(core): add b"],
  ["@clock", "2026-01-03T10:00:00Z"],
  { write = "a.txt", content = "one\nTWO\nthree\n" }, ["commit", "-q", "-a", "-m", "docs: change a"],
  { write = "a.txt", content = "one\nchanged\nthree\n" },
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["blame", "--porcelain", "--", "a.txt"]
expect_exit = 0

[nurt]
command = "git.blame"
params = { path = "a.txt" }
expect = "ok"
record_count = 3
records = [{ kind = "blame_line", no = 2, text = "changed", author = "Not Committed Yet", commit = "0000000000000000000000000000000000000000" }]

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
