id = "switch/unknown-branch-refused"
description = "An unknown branch name fails without changes."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "same.txt", content = "s\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  ["rm", "-q", "-r", "--", "b.txt"],
  { write = "a.txt", content = "side\n" },
  { write = "new.txt", content = "n\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
]

[git]
args = ["switch", "nope"]
expect_exit = 128

[nurt]
command = "git.switch"
params = { branch = "nope" }
expect = "error:E_GIT_REVISION"
