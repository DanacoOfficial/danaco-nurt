id = "switch/discard-changes"
description = "Local changes of tracked files are overwritten with discard_changes."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "same.txt", content = "s\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  ["rm", "-q", "-r", "--", "b.txt"],
  { write = "a.txt", content = "side\n" },
  { write = "new.txt", content = "n\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
]
files = { "a.txt" = "local\n", "b.txt" = "local\n" }

[git]
args = ["switch", "--discard-changes", "side"]

[nurt]
command = "git.switch"
params = { branch = "side", discard_changes = true }
