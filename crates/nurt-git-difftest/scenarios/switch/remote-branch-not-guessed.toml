id = "switch/remote-branch-not-guessed"
description = "Without guess a remote-tracking branch does not create a local branch."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "same.txt", content = "s\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  ["rm", "-q", "-r", "--", "b.txt"],
  { write = "a.txt", content = "side\n" },
  { write = "new.txt", content = "n\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
  { write = "../upstream/f.txt", content = "f\n" },
  { git = ["init", "-q", "-b", "main"], cwd = "../upstream" },
  { git = ["add", "f.txt"], cwd = "../upstream" },
  { git = ["commit", "-q", "-m", "upstream"], cwd = "../upstream" },
  { git = ["branch", "feature"], cwd = "../upstream" },
  ["remote", "add", "origin", "../upstream"],
  ["fetch", "-q", "origin"],
]

[git]
args = ["switch", "--no-guess", "feature"]
expect_exit = 128

[nurt]
command = "git.switch"
params = { branch = "feature" }
expect = "error:E_GIT_REVISION"
