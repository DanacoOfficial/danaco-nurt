id = "switch/staged-and-unstaged-changes-carried"
description = "Staged and unstaged changes of paths equal in both commits are carried over."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "same.txt", content = "s\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  ["rm", "-q", "-r", "--", "b.txt"],
  { write = "a.txt", content = "side\n" },
  { write = "new.txt", content = "n\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
  { write = "same.txt", content = "staged\n" },
  ["add", "same.txt"],
]
files = { "same.txt" = "unstaged\n", "extra.txt" = "untracked\n" }

[git]
args = ["switch", "side"]

[nurt]
command = "git.switch"
params = { branch = "side" }
