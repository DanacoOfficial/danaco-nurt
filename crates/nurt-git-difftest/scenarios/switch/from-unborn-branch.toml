id = "switch/from-unborn-branch"
description = "Switching from an unborn branch checks out the target into the empty working tree."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "same.txt", content = "s\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  ["rm", "-q", "-r", "--", "b.txt"],
  { write = "a.txt", content = "side\n" },
  { write = "new.txt", content = "n\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
  ["switch", "-q", "--orphan", "fresh"],
]

[git]
args = ["switch", "main"]

[nurt]
command = "git.switch"
params = { branch = "main" }
