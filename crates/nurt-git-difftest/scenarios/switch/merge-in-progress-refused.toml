id = "switch/merge-in-progress-refused"
description = "Switching during a merge is refused."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "same.txt", content = "s\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  ["rm", "-q", "-r", "--", "b.txt"],
  { write = "a.txt", content = "side\n" },
  { write = "new.txt", content = "n\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
  ["switch", "-q", "-c", "topic", "base"],
  { write = "z.txt", content = "z\n" },
  ["add", "z.txt"],
  ["commit", "-q", "-m", "z"],
  ["switch", "-q", "main"],
  ["merge", "-q", "--no-commit", "--no-ff", "topic"],
]

[git]
args = ["switch", "side"]
expect_exit = 128

[nurt]
command = "git.switch"
params = { branch = "side" }
expect = "error:E_GIT_IN_PROGRESS"
