id = "switch/discard-changes-drops-staged-new-file"
description = "A staged new file absent from the target is removed with discard_changes."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "same.txt", content = "s\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  ["rm", "-q", "-r", "--", "b.txt"],
  { write = "a.txt", content = "side\n" },
  { write = "new.txt", content = "n\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
  { write = "extra.txt", content = "x\n" },
  ["add", "extra.txt"],
]

[git]
args = ["switch", "--discard-changes", "side"]

[nurt]
command = "git.switch"
params = { branch = "side", discard_changes = true }
