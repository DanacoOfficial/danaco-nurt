id = "review/subject-trailing-period"
description = "A trailing period of the subject is reported."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["status", "--short"]
expect_exit = 0

[nurt]
command = "git.review"
params = { scope = "staged", checks = ["subject"], message = "Add parser." }
expect = "ok"
records = [
  { kind = "finding", rule = "subject_period" },
]

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
ignore = []
