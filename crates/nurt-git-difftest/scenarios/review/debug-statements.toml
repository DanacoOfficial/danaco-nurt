id = "review/debug-statements"
description = "Debugging calls in source files are reported."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  { write = "src.js", content = "let a = 1;\nconsole.log(a);\n" },
  ["add", "--", "src.js"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["diff", "--cached", "--stat"]
expect_exit = 0

[nurt]
command = "git.review"
params = { scope = "staged", checks = ["debug_statements"] }
expect = "ok"
records = [
  { kind = "finding", rule = "debug_statements", path = "src.js", line = 2, severity = "warning" },
]
record_count = 1

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
ignore = []
