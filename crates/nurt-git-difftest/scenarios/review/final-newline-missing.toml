id = "review/final-newline-missing"
description = "A file without a final line feed is reported."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  { write = "n.txt", content = "no newline" },
  ["add", "--", "n.txt"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["diff", "--cached", "--stat"]
expect_exit = 0

[nurt]
command = "git.review"
params = { scope = "staged", checks = ["final_newline"] }
expect = "ok"
records = [
  { kind = "finding", rule = "final_newline", path = "n.txt", line = 1, severity = "warning" },
]
record_count = 1

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
ignore = []
