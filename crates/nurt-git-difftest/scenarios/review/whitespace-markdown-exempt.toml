id = "review/whitespace-markdown-exempt"
description = "Trailing white space in Markdown files is not reported."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  { write = "r.md", content = "title  \n" },
  ["add", "--", "r.md"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["diff", "--cached", "--stat"]
expect_exit = 0

[nurt]
command = "git.review"
params = { scope = "staged", checks = ["whitespace"] }
expect = "ok"
record_count = 0

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
ignore = []
