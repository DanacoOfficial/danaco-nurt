id = "review/binary-file"
description = "A binary file is reported."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  { write = "bin.dat", hex = "00010203" },
  ["add", "bin.dat"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["diff", "--cached", "--stat"]
expect_exit = 0

[nurt]
command = "git.review"
params = { scope = "staged", checks = ["binary"] }
expect = "ok"
records = [
  { kind = "finding", rule = "binary", path = "bin.dat" },
]
record_count = 1

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
ignore = []
