id = "review/range-base-target"
description = "A revision range reviews the difference of two revisions."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  { write = "r.txt", content = "<<<<<<< HEAD\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "second"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["diff", "--check", "HEAD~1", "HEAD"]
expect_exit = 2

[nurt]
command = "git.review"
params = { base = "HEAD~1", target = "HEAD", checks = ["conflict_markers"] }
expect = "ok"
records = [
  { kind = "finding", path = "r.txt", line = 1 },
]
record_count = 1

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
ignore = []
