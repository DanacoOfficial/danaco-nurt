id = "review/secrets-without-provider"
description = "Without a rule service the secrets check reports nothing."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  { write = "k.txt", content = "token=abc\n" },
  ["add", "--", "k.txt"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["status", "--short"]
expect_exit = 0

[nurt]
command = "git.review"
params = { scope = "staged", checks = ["secrets"] }
expect = "ok"
record_count = 0

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
ignore = []
