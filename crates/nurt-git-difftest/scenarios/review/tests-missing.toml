id = "review/tests-missing"
description = "A changed source file without a test is reported."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  { write = "src/lib.rs", content = "fn f() {}\n" },
  ["add", "-A"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["status", "--short"]
expect_exit = 0

[nurt]
command = "git.review"
params = { scope = "staged", checks = ["tests"] }
expect = "ok"
records = [
  { kind = "finding", rule = "tests_missing", path = "src/lib.rs" },
]
record_count = 1

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
ignore = []
