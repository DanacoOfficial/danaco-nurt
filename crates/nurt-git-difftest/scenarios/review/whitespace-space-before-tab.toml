id = "review/whitespace-space-before-tab"
description = "A space before a tab in the indentation is reported."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "b.txt", content = "b\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  { write = "t.txt", content = "ok\n \tindent\n" },
  ["add", "--", "t.txt"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["diff", "--cached", "--check"]
expect_exit = 2

[nurt]
command = "git.review"
params = { scope = "staged", checks = ["whitespace"] }
expect = "ok"
records = [
  { kind = "finding", rule = "space_before_tab", path = "t.txt", line = 2 },
]
record_count = 1

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
ignore = []
