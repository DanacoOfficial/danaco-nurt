id = "diff/path-filter"
description = "Only the selected directory is compared."
corpus = "empty"
setup = [
  { write = "a.txt", content = "one\ntwo\nthree\n" },
  { write = "dir/b.txt", content = "b\n" },
  { write = ".gitignore", content = "*.log\nbuild/\n" },
  ["add", "a.txt", "dir/b.txt", ".gitignore"],
  ["commit", "-q", "-m", "init"],
  { write = "a.txt", content = "x\n" }, { write = "dir/b.txt", content = "y\n" },
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["diff", "--", "dir"]
expect_exit = 0

[nurt]
command = "git.diff"
params = { path = ["dir"] }
expect = "ok"

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
ignore = []
