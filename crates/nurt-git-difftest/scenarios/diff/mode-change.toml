id = "diff/mode-change"
description = "A change of the executable bit yields a record without lines."
corpus = "empty"
setup = [
  { write = "a.txt", content = "one\ntwo\nthree\n" },
  { write = "dir/b.txt", content = "b\n" },
  { write = ".gitignore", content = "*.log\nbuild/\n" },
  ["add", "a.txt", "dir/b.txt", ".gitignore"],
  ["commit", "-q", "-m", "init"],
  ["update-index", "--chmod=+x", "a.txt"],
]
platforms = ["linux", "macos", "windows"]

[git]
args = ["diff", "--cached"]
expect_exit = 0

[nurt]
command = "git.diff"
params = { staged = true }
expect = "ok"

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
ignore = []
