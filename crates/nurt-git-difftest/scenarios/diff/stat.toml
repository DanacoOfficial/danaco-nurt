id = "diff/stat"
description = "Statistics of the changed files."
corpus = "empty"
setup = [
  { write = "a.txt", content = "one\ntwo\nthree\n" },
  { write = "dir/b.txt", content = "b\n" },
  { write = ".gitignore", content = "*.log\nbuild/\n" },
  ["add", "a.txt", "dir/b.txt", ".gitignore"],
  ["commit", "-q", "-m", "init"],
  { write = "a.txt", content = "one\n2\nthree\nfour\n" },
]
files = { "dir/b.txt" = { delete = true } }
platforms = ["linux", "macos", "windows"]

[git]
args = ["diff", "--numstat"]
expect_exit = 0

[nurt]
command = "git.diff"
params = { stat = true }
expect = "ok"

[compare]
state = ["index", "worktree", "status", "refs", "reflog", "state_files", "config"]
undo = false
ignore = []
