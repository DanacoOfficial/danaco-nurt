id = "restore/symlink"
description = "A deleted symbolic link is restored as a link."
corpus = "empty"
setup = [
  { write = "target.txt", content = "t\n" },
  { write = "link", symlink = "target.txt" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  { write = "target.txt", content = "t2\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
]
files = { "link" = { delete = true } }
platforms = ["linux", "macos"]

[git]
args = ["restore", "link"]

[nurt]
command = "git.restore"
params = { paths = ["link"] }
