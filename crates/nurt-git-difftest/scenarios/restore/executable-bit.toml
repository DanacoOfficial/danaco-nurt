id = "restore/executable-bit"
description = "A changed executable bit is restored from the index."
corpus = "empty"
setup = [
  { write = "tool", content = "echo\n" },
  { write = "top.txt", content = "t\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  { write = "top.txt", content = "t2\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
]
files = { "tool" = { content = "echo\n", executable = true } }
platforms = ["linux", "macos"]

[git]
args = ["restore", "tool"]

[nurt]
command = "git.restore"
params = { paths = ["tool"] }
