id = "restore/source-into-index-only"
description = "A file of an older commit is staged while the working tree keeps the current content."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "same.txt", content = "s\n" },
  { write = "d/x.txt", content = "x\n" },
  { write = "d/y.txt", content = "y\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  { write = "a.txt", content = "side\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
  { write = "a.txt", content = "main\n" },
  { write = "b2.txt", content = "b2\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "second"],
]

[git]
args = ["restore", "--source=HEAD~1", "--staged", "a.txt"]

[nurt]
command = "git.restore"
params = { paths = ["a.txt"], source = "HEAD~1", staged = true, worktree = false }
