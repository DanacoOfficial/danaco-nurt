id = "restore/untracked-file-not-matched"
description = "A pathspec that names only an untracked file fails like git."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "same.txt", content = "s\n" },
  { write = "d/x.txt", content = "x\n" },
  { write = "d/y.txt", content = "y\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  { write = "a.txt", content = "side\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
  { write = "a.txt", content = "main\n" },
  { write = "b2.txt", content = "b2\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "second"],
]
files = { "notes.txt" = "untracked\n" }

[git]
args = ["restore", "notes.txt"]
expect_exit = 1

[nurt]
command = "git.restore"
params = { paths = ["notes.txt"] }
expect = "error:E_NO_MATCH"
