id = "restore/staged-and-worktree-from-head"
description = "The index and the working tree are both restored from HEAD."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "same.txt", content = "s\n" },
  { write = "d/x.txt", content = "x\n" },
  { write = "d/y.txt", content = "y\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  { write = "a.txt", content = "side\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
  { write = "a.txt", content = "main\n" },
  { write = "b2.txt", content = "b2\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "second"],
  { write = "a.txt", content = "staged\n" },
  ["add", "a.txt"],
]
files = { "a.txt" = "unstaged\n" }

[git]
args = ["restore", "--staged", "--worktree", "a.txt"]

[nurt]
command = "git.restore"
params = { paths = ["a.txt"], staged = true, worktree = true }
