id = "restore/unknown-source-refused"
description = "An unknown source revision fails without changes."
corpus = "empty"
setup = [
  { write = "a.txt", content = "a\n" },
  { write = "same.txt", content = "s\n" },
  { write = "d/x.txt", content = "x\n" },
  { write = "d/y.txt", content = "y\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "base"],
  ["tag", "base"],
  ["switch", "-q", "-c", "side"],
  { write = "a.txt", content = "side\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "side"],
  ["switch", "-q", "main"],
  { write = "a.txt", content = "main\n" },
  { write = "b2.txt", content = "b2\n" },
  ["add", "-A"],
  ["commit", "-q", "-m", "second"],
]

[git]
args = ["restore", "--source=nope", "a.txt"]
expect_exit = 128

[nurt]
command = "git.restore"
params = { paths = ["a.txt"], source = "nope" }
expect = "error:E_GIT_REVISION"
