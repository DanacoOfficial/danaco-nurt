[package]
name = "nurt-git-difftest"
description = "Differential tests of the Danaco Nurt Git commands against the git program."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
nurt-contracts = { workspace = true }
nurt-types = { workspace = true }
nurt-testkit = { workspace = true }
nurt-git = { workspace = true, features = ["testutil"] }
nurt-git-ops = { workspace = true }
nurt-git-transport = { workspace = true }
gix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
indexmap = { workspace = true }
russh = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "process", "io-util", "sync", "macros"] }

[[test]]
name = "scenarios"
harness = false
