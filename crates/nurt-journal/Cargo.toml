[package]
name = "nurt-journal"
description = "Operation journal of Danaco Nurt: recording, recovery, undo, redo and retention."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
failpoints = ["nurt-fs/failpoints"]
# Setup of the performance tests in tests/perf.rs.
testing = ["nurt-fs/conformance"]

[dependencies]
nurt-contracts = { workspace = true }
nurt-types = { workspace = true }
nurt-fs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
zstd = { workspace = true }
crc32fast = { workspace = true }
serde_json_canonicalizer = { workspace = true }
uuid = { workspace = true }
toml_edit = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
nurt-journal = { path = ".", features = ["testing"] }
nurt-fs = { workspace = true, features = ["conformance", "failpoints", "mutation-audit"] }
