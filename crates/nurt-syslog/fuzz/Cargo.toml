[package]
name = "nurt-syslog-fuzz"
description = "Fuzz targets of the systemd journal file reader."
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
nurt-syslog = { path = ".." }
nurt-contracts = { path = "../../nurt-contracts" }
zstd = "0.14.4"
lz4_flex = "0.14.2"
lzma-rust2 = "0.25.0"

[[bin]]
name = "journal_file"
path = "fuzz_targets/journal_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_object"
path = "fuzz_targets/journal_object.rs"
test = false
doc = false
bench = false
