[[rule]]
pattern = "glab mr merge|create|close|approve|note"

[[rule]]
pattern = "glab release create|delete|upload"

[[rule]]
pattern = "systemctl start|stop|restart|reload|try-restart|reload-or-restart|enable|disable|mask|unmask|kill|isolate|daemon-reload|poweroff|reboot|halt|suspend|hibernate"

[[rule]]
pattern = "service * start|stop|restart|reload|force-reload"

[[rule]]
pattern = "launchctl load|unload|bootstrap|bootout|kickstart|start|stop|enable|disable"

[[rule]]
pattern = "sc|sc.exe start|stop|config|delete|create|pause|continue"

[[rule]]
pattern = "shutdown|reboot|poweroff|halt"

[[rule]]
pattern = "kill|pkill|killall|taskkill"

[[rule]]
pattern = "apt|apt-get|aptitude install|remove|purge|upgrade|dist-upgrade|full-upgrade|autoremove|reinstall"

[[rule]]
