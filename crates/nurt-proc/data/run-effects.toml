[[rule]]
pattern = "port install|uninstall|upgrade"

[[rule]]
pattern = "choco|scoop|winget install|uninstall|upgrade|update"

[[rule]]
pattern = "snap|flatpak install|remove|uninstall|refresh|update"

[[rule]]
pattern = "ansible-playbook"

[[rule]]
pattern = "ansible"

[[rule]]
pattern = "vercel|netlify|firebase|wrangler|fly|flyctl|serverless|sls|cdk|sam|eb deploy|publish|destroy|remove|terminate|delete"

[[rule]]
