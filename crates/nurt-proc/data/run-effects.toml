pattern = "rsync ** *:*|rsync://*"

[[rule]]
pattern = "rclone copy|copyto|sync|move|moveto|delete|deletefile|purge|mkdir|rmdir|rmdirs"

[[rule]]
pattern = "gsutil cp|mv|rm|rsync|mb|rb|setmeta|acl"

[[rule]]
pattern = "azcopy copy|sync|remove|make"

[[rule]]
pattern = "s3cmd put|del|rm|sync|mb|rb|mv|cp|setacl"

[[rule]]
pattern = "mc cp|mv|rm|mirror|mb|rb"

[[rule]]
pattern = "gh pr merge|create|close|comment|edit|review|ready|reopen"

[[rule]]
pattern = "gh release create|delete|upload|edit"

[[rule]]
pattern = "gh repo create|delete|edit|archive|rename|fork|sync"

[[rule]]
pattern = "gh issue create|close|comment|edit|delete|reopen|transfer|lock"

[[rule]]
