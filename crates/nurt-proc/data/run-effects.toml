unless = ["--version", "--help", "-v", "-h"]

[[rule]]
pattern = "heroku create|destroy|restart|rollback|promote|*:set|*:unset|*:destroy|*:create|*:scale|*:restart|*:promote|*:rollback|*:add|*:remove|*:deploy"

[[rule]]
pattern = "argocd app sync|delete|create|set|rollback"

[[rule]]
pattern = "nomad job run|stop|dispatch|revert"

[[rule]]
pattern = "consul kv put|delete"

[[rule]]
pattern = "vault write|delete"

[[rule]]
pattern = "vault kv put|patch|delete|destroy|rollback|undelete"

[[rule]]
pattern = "sendmail|msmtp|swaks"

[[rule]]
pattern = "mail|mailx|mutt -s"
