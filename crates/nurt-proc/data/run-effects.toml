[[rule]]
pattern = "terraform|tofu apply|destroy|import|taint|untaint"

[[rule]]
pattern = "terraform|tofu state rm|mv|push|replace-provider"

[[rule]]
pattern = "pulumi up|update|destroy|import|refresh|cancel"

[[rule]]
pattern = "pulumi stack rm"

[[rule]]
pattern = "aws * create*|delete*|put-*|update-*|run-*|terminate-*|start-*|stop-*|reboot-*|modify-*|attach-*|detach-*|associate-*|disassociate-*|register-*|deregister-*|deploy|invoke|publish|send-*|tag-*|untag-*|remove-*|add-*|set-*|import-*|restore-*|reset-*|enable-*|disable-*|cancel-*|copy-*|upload-*|replace-*|revoke-*|authorize-*|change-*|apply-*"

[[rule]]
pattern = "aws s3 cp|mv|rm|sync|mb|rb|website"

[[rule]]
pattern = "gcloud ** create|delete|update|deploy|patch|start|stop|reset|resize|import|submit|add-*|remove-*|set-iam-policy|enable|disable|publish|undelete|restore|rollback"

[[rule]]
pattern = "az ** create|delete|update|set|start|stop|restart|deploy|add|remove|import|purge|upload|upload-batch|delete-batch|swap|scale|resize|assign|grant|revoke"

[[rule]]
pattern = "curl -X|--request=POST|PUT|DELETE|PATCH"

[[rule]]
pattern = "curl -d|--data*|--json|-F|--form*|-T|--upload-file"

[[rule]]
pattern = "wget --post-data*|--post-file*|--body-data*|--body-file*"

[[rule]]
pattern = "wget --method=POST|PUT|DELETE|PATCH"

[[rule]]
pattern = "http|https|xh|xhs POST|PUT|DELETE|PATCH"

[[rule]]
pattern = "psql|pgcli"

[[rule]]
pattern = "mysql|mariadb|mycli"

[[rule]]
pattern = "mongosh|mongo"

[[rule]]
pattern = "redis-cli|valkey-cli"

[[rule]]
pattern = "sqlcmd|cqlsh|clickhouse-client"

[[rule]]
