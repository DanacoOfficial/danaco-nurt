# Programs whose command line has an effect outside the local file system.
#
# Format `nurt-argv-rules/1`:
#
# * `[[wrapper]]` names a program that starts another program (`sudo`, `env`,
#   `npx`). `program` lists names, `command` the subcommand that must follow
#   (`pnpm exec`), `value_options` the options followed by a value,
#   `assignments` whether `NAME=VALUE` words are skipped, `skip` the number of
#   positional arguments before the started program (`timeout 10 make`) and
#   `module_option` the option that names a module run as the program
#   (`python -m twine`).
# * `[[program]]` lists the options of a program that are followed by a value,
#   so that their values are not taken for subcommands (`git -C dir push`).
# * `[[rule]]` is a pattern of the command line. The first token names the
#   program by its base name without an executable extension; further tokens
#   that do not start with `-` match the positional arguments from the first
#   one on; tokens that start with `-` name options that must be present
#   anywhere; `NAME=V1|V2` requires an option value. `*` matches any text
#   within a token, `**` any number of positional arguments, and `a|b`
#   matches alternatives. A single-letter option such as `-f` also matches
#   within a group of short options (`-xf`). `unless` lists patterns without a
#   program that exclude the rule, `max_positionals` limits the positional
#   arguments. Letter case is ignored except in single-letter options.
#
# Rules are checked against the program and against every program started
# through wrappers. Patterns of the key `run.irreversible_patterns` use the
# same syntax.

format = "nurt-argv-rules/1"

[[wrapper]]
program = "sudo|doas"
value_options = ["-u", "-g", "-C", "-D", "-h", "-p", "-r", "-t", "-T", "-U", "--user", "--group", "--chdir", "--prompt", "--host", "--role", "--type", "--close-from", "--other-user", "--command-timeout"]

[[wrapper]]
program = "env"
value_options = ["-u", "-C", "-S", "--unset", "--chdir", "--split-string"]
assignments = true

[[wrapper]]
program = "nice"
value_options = ["-n", "--adjustment"]

[[wrapper]]
program = "ionice"
value_options = ["-c", "-n", "-p", "-P", "-u", "--class", "--classdata"]

[[wrapper]]
program = "time"
value_options = ["-f", "-o", "--format", "--output"]

[[wrapper]]
program = "nohup|stdbuf|setsid|caffeinate"
value_options = ["-i", "-o", "-e"]

[[wrapper]]
program = "timeout"
value_options = ["-k", "-s", "--kill-after", "--signal"]
skip = 1

[[wrapper]]
program = "taskset"
skip = 1

[[wrapper]]
program = "xargs"
value_options = ["-a", "-d", "-E", "-I", "-L", "-n", "-P", "-s", "--arg-file", "--delimiter", "--max-args", "--max-lines", "--max-procs", "--max-chars"]

[[wrapper]]
program = "watch"
value_options = ["-n", "-d", "-g", "-q", "--interval", "--differences"]

[[wrapper]]
program = "npx|bunx|pnpx|uvx"
value_options = ["-p", "--package", "--from", "--with", "--python", "-c", "--call"]

[[wrapper]]
program = "pnpm"
command = "exec|dlx"
value_options = ["-C", "--dir", "--filter", "-F"]

[[wrapper]]
program = "npm"
command = "exec|x"
value_options = ["-p", "--package", "-w", "--workspace", "--prefix"]

[[wrapper]]
program = "yarn"
command = "dlx|exec"
value_options = ["-p", "--package"]

[[wrapper]]
program = "bun"
command = "x"

[[wrapper]]
program = "uv|poetry|pipx|pdm|hatch|rye|pixi"
command = "run"
value_options = ["--with", "--python", "-p", "--directory", "--project", "--env", "-e", "--spec"]

[[wrapper]]
program = "uv"
command = "tool run"
value_options = ["--with", "--python", "--from"]

[[wrapper]]
program = "python|python2|python3|python3.*|py|pypy|pypy3"
module_option = "-m"
value_options = ["-W", "-X", "-c"]

[[program]]
name = "git"
value_options = ["-C", "-c", "--git-dir", "--work-tree", "--namespace", "--config-env", "--super-prefix", "--exec-path"]

[[program]]
name = "docker|podman|nerdctl"
value_options = ["-H", "-c", "-l", "--host", "--context", "--config", "--log-level", "--tlscacert", "--tlscert", "--tlskey", "--url", "--connection", "--root", "--runroot", "--storage-driver"]

[[program]]
name = "kubectl|oc"
value_options = ["-n", "-s", "--namespace", "--context", "--cluster", "--kubeconfig", "--server", "--user", "--token", "--as", "--as-group", "--request-timeout", "--certificate-authority"]

[[program]]
name = "helm"
value_options = ["-n", "--namespace", "--kube-context", "--kubeconfig", "--kube-token", "--kube-apiserver", "--registry-config", "--repository-config"]

[[program]]
name = "aws"
value_options = ["--profile", "--region", "--output", "--endpoint-url", "--query", "--ca-bundle", "--cli-read-timeout", "--cli-connect-timeout"]

[[program]]
name = "gcloud"
value_options = ["--project", "--account", "--configuration", "--format", "--region", "--zone", "--verbosity", "--impersonate-service-account", "--billing-project"]

[[program]]
name = "az"
value_options = ["--subscription", "--output", "-o", "--query", "--resource-group", "-g"]

[[program]]
name = "gh|glab"
value_options = ["-R", "--repo", "--hostname"]

[[program]]
name = "systemctl"
value_options = ["-H", "-M", "--host", "--machine", "-t", "--type", "-s", "--signal", "--state", "-p", "--property"]

[[program]]
name = "npm|pnpm"
value_options = ["--prefix", "-w", "--workspace", "--registry", "--otp", "--tag", "--access", "-C", "--dir", "--filter"]

[[program]]
name = "cargo"
value_options = ["--manifest-path", "--config", "-Z", "--color", "--registry", "--index", "--token", "-p", "--package", "--target-dir"]

[[program]]
name = "mvn|mvnw"
value_options = ["-s", "-gs", "-f", "-P", "-pl", "-rf", "-T", "-l", "-D", "--settings", "--file", "--projects", "--threads", "--activate-profiles"]

[[program]]
name = "terraform|tofu"
value_options = ["-chdir"]

[[program]]
name = "pulumi"
value_options = ["-C", "--cwd", "-s", "--stack"]

[[program]]
name = "vault|consul|nomad"
value_options = ["-address", "-namespace", "-token", "-region"]

[[program]]
name = "dotnet"
value_options = ["-s", "--source", "-k", "--api-key"]

[[program]]
name = "ssh"
value_options = ["-B", "-b", "-c", "-D", "-E", "-e", "-F", "-I", "-i", "-J", "-L", "-l", "-m", "-O", "-o", "-P", "-p", "-Q", "-R", "-S", "-W", "-w"]

[[program]]
name = "scp|sftp"
value_options = ["-c", "-D", "-F", "-i", "-J", "-l", "-o", "-P", "-S", "-X"]

[[program]]
name = "rsync"
value_options = ["-e", "--rsh", "--exclude", "--include", "--exclude-from", "--include-from", "--files-from", "--filter", "-f", "--chmod", "--chown", "--rsync-path", "--partial-dir", "--temp-dir", "-T", "--log-file", "--password-file", "--port", "--timeout", "--bwlimit", "--backup-dir", "--suffix", "--compare-dest", "--copy-dest", "--link-dest"]

[[program]]
name = "rclone|gsutil|azcopy|s3cmd|mc"
value_options = ["--config", "--transfers", "--checkers", "--include", "--exclude", "--filter", "-o", "-h"]

[[program]]
name = "ansible|ansible-playbook"
value_options = ["-i", "-m", "-a", "-u", "-e", "-l", "--inventory", "--module-name", "--args", "--user", "--extra-vars", "--limit"]

[[rule]]
pattern = "git push"

[[rule]]
pattern = "git send-email|request-pull"

[[rule]]
pattern = "git svn dcommit"

[[rule]]
pattern = "git p4 submit"

[[rule]]
pattern = "git lfs push|lock|unlock"

[[rule]]
pattern = "docker|podman|nerdctl push"

[[rule]]
pattern = "docker|podman|nerdctl image|manifest push"

[[rule]]
pattern = "docker|podman buildx build --push"

[[rule]]
pattern = "docker|podman build --push"

[[rule]]
pattern = "docker stack deploy|rm"

[[rule]]
pattern = "docker service create|update|rm|scale|rollback"

[[rule]]
pattern = "docker secret|config create|rm"

[[rule]]
pattern = "npm|pnpm publish|unpublish|deprecate"

[[rule]]
pattern = "npm|pnpm dist-tag|owner|access|team add|rm|set|grant|revoke"

[[rule]]
