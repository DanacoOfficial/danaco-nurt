# Vendored from jaq-json 2.0.3 (https://github.com/01mf02/jaq), MIT license; see
# LICENSE and NOTICE in this directory. The only change to the upstream
# source is the limit on the length of a repeated string (`"x" * n`), see
# `src/limit.rs`. The dependencies are those of the published manifest.

[package]
name = "jaq-json"
version = "2.0.3"
authors = ["Michael Färber <michael.faerber@gedenkt.at>"]
edition = "2021"
license = "MIT"
description = "JSON values for jaq, with a limit on the length of a repeated string."
repository = "https://github.com/01mf02/jaq"
keywords = ["json", "query", "jq"]
categories = ["data-structures"]
rust-version = "1.70"

[features]
default = ["std"]
sync = []
std = ["hifijson/std", "jaq-core/std", "jaq-std/std"]
serde = ["serde_core"]

[dependencies]
jaq-core = { version = "3.1.1", default-features = false }
jaq-std = { version = "3.0.3", default-features = false }

bstr = { version = "1", default-features = false }
bytes = { version = "1", default-features = false }
foldhash = { version = "0.1", default-features = false }
hifijson = { version = "0.5.0", default-features = false, features = ["alloc"] }
indexmap = { version = "2.0", default-features = false }
num-bigint = { version = "0.5.1", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
ryu = "1.0.20"
self_cell = "1.2.0"
serde_core = { version = "1.0.81", default-features = false, features = ["alloc"], optional = true }
