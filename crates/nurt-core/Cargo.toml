[package]
name = "nurt-core"
description = "Engine facade of Danaco Nurt: configuration, sessions, cursors and request handling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Language front end answering from `nurt-bound/1` files, for tests of the
# interfaces built on the engine.
fixtures = []
# Stages of the structured commands (`nurt-doc`, `nurt-code`). Enabled by the
# default set once both crates provide `register` (after the merge of the
# structured area into the integration branch).
structured = ["dep:nurt-doc", "dep:nurt-code"]

[dependencies]
nurt-contracts = { workspace = true }
nurt-catalog = { workspace = true }
nurt-exec = { workspace = true }
nurt-doc = { workspace = true, optional = true }
nurt-code = { workspace = true, optional = true }
nurt-plan = { workspace = true }
nurt-report = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
nurt-testkit = { workspace = true }
tempfile = { workspace = true }
