[package]
name = "nurt-git"
description = "Git repository operations for Danaco Nurt."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
testutil = ["dep:tempfile"]

[dependencies]
nurt-contracts = { workspace = true }
nurt-types = { workspace = true }
nurt-git-transport = { workspace = true }
gix = { workspace = true, features = ["blocking-network-client", "sha256"] }
gix-actor = "0.44.1"
gix-attributes = "0.37.1"
gix-blame = "0.20.0"
gix-config = "0.62.2"
gix-date = "0.18.1"
gix-diff = "0.70.0"
gix-dir = "0.32.0"
gix-filter = "0.36.1"
gix-hash = "0.28.1"
gix-imara-diff = "0.3.3"
gix-index = "0.58.0"
gix-object = "0.66.1"
gix-odb = "0.87.0"
gix-path = "0.14.1"
gix-pathspec = "0.22.1"
gix-ref = "0.69.1"
gix-revision = "0.52.0"
gix-revwalk = "0.38.0"
gix-status = "0.37.0"
gix-traverse = "0.64.0"
gix-worktree = "0.59.0"
bstr = { workspace = true }
regex = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
smallvec = { workspace = true }
indexmap = { workspace = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
nurt-testkit = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
