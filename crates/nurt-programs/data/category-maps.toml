# Mappings of system classifications to taxonomy ids.
#
# debian_section: section of a Debian package, without the archive area
#   prefix (`contrib/`, `non-free/`).
# debian_weak: sections too general to decide alone; the keyword classifier
#   is consulted first.
# freedesktop: `Categories=` values; the first mapped additional category
#   wins over main categories listed in freedesktop_main.
# macos_category: `LSApplicationCategoryType` without `public.app-category.`.
# rpm_group: prefixes of `Group` values, matched case-insensitively, longest
#   prefix first.
# man_section: section of the manual page with the command.
# keywords: words matched against the command name, package name, tags and
#   keywords; the category with most matches wins, ties go to the smaller id.

