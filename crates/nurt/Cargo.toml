[package]
name = "nurt"
description = "Command shell and language where every change can be undone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["nurt", "shell", "console", "json-rpc", "agent"]
categories = ["command-line-utilities", "api-bindings"]

[lints]
workspace = true

[features]
default = ["embedded", "process"]
embedded = ["dep:nurt-core", "dep:nurt-contracts", "dep:serde"]
process = []
cli = ["dep:nurt-cli"]

[dependencies]
serde_json = { workspace = true }
nurt-core = { workspace = true, optional = true }
nurt-contracts = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
nurt-cli = { workspace = true, optional = true }

[dev-dependencies]
nurt-contracts = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "nurt"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli_binary"
required-features = ["cli", "process"]

[[test]]
name = "process_backend"
required-features = ["process"]

[[test]]
name = "embedded_engine"
required-features = ["embedded"]

[package.metadata.docs.rs]
all-features = true

