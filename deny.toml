# Dependency policy checked by cargo-deny (`cargo deny --locked check`).
# The policy is described in docs/conventions/licensing.md. Every exception
# below names the crate it applies to and the reason for it.

[graph]
# The dependency graph is evaluated for every supported target with all
# features enabled, so that optional and platform-specific dependencies are
# checked as well.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
all-features = true

[advisories]
# Security advisories from the RustSec advisory database. Vulnerable, unsound
# and unmaintained crates are reported as errors. An ignored advisory must be
# listed with its identifier and a reason. Each exception is reviewed again
# with every release of the affected crate.
ignore = [
  # Marvin attack: timing side channel in RSA decryption of the rsa crate. The
  # fixed release 0.10 is used by russh and ssh-key (SSH signatures), but the
  # newest release of the pgp crate (0.21.1, and its main branch) still
  # requires rsa 0.9 and no other OpenPGP implementation under an allowed
  # license exists (sequoia-openpgp is banned below). RSA keys are required for
  # compatibility with existing OpenPGP certificates used to sign commits and
  # tags. Private keys are used on the local machine only, where no remote
  # party can time decryption; Ed25519 keys are preferred whenever a key is
  # selected.
  { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 is required by the newest pgp release; private-key operations run locally and Ed25519 is preferred" },
  # Timing variability in crypto-bigint 0.5, used by the elliptic curve crates
  # 0.13 and by cx448 of the pgp crate. The fixed release 0.7.6 belongs to the
  # elliptic curve generation 0.14 that the newest pgp release does not use
  # yet. Secret-key arithmetic runs on the local machine only, for signing
  # commits and tags.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 is required by the newest pgp release; secret-key arithmetic runs locally for signing only" },
  # Unmaintained crates without a reported vulnerability and without a
  # replacement that can be adopted. chrono is a required dependency of
  # macos-unifiedlogs (parser of macOS log archives) and of russh-util (target
  # wasm32 only, still recorded in Cargo.lock); ttf-parser is required by
  # lopdf 0.42, which the newest release of pdf-extract (PDF text extraction)
  # pins. They are dropped when these crates move to a maintained alternative.
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, has no reported vulnerability and is required by macos-unifiedlogs and russh-util" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained, has no reported vulnerability and is required by lopdf 0.42 through pdf-extract" },
]
yanked = "deny"

[licenses]
# Permissive licenses compatible with the Apache License 2.0. Any license that
# is not listed here, including GPL, LGPL and AGPL in every version, is
# rejected. An expression with alternatives (`A OR B`) is accepted when one of
# the alternatives is allowed.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

# Licenses accepted for one crate only, after an individual review.
exceptions = [
  # Mozilla root certificates as data; used only as a fallback when the
  # certificate store of the operating system is not available.
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
  # Pure Rust port of bzip2 under the permissive bzip2 license.
  { allow = ["bzip2-1.0.6"], crate = "libbz2-rs-sys" },
  # File-level copyleft (MPL-2.0) of unmodified transitive dependencies: the
  # object cache of the Git library (gix-pack) and the directory lookup of the
  # WebAssembly runtime cache (dirs-sys). The source of these crates is
  # available from crates.io and is not modified.
  { allow = ["MPL-2.0"], crate = "uluru" },
  { allow = ["MPL-2.0"], crate = "option-ext" },
  # LLVM libFuzzer runtime (University of Illinois/NCSA license); linked only
  # into fuzzing targets, never into distributed artifacts.
  { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[licenses.private]
# Crates of this workspace are not published and are licensed by the
# workspace manifest.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
  { crate = "sequoia-openpgp", reason = "LGPL-2.0-or-later; OpenPGP signatures use the pgp crate" },
  { crate = "openssl", reason = "depends on the system OpenSSL library; TLS uses rustls" },
  { crate = "openssl-sys", reason = "depends on the system OpenSSL library; TLS uses rustls" },
  { crate = "git2", reason = "binds libgit2 (GPL-2.0 with a linking exception); Git support uses gix" },
  { crate = "libgit2-sys", reason = "bundles libgit2 (GPL-2.0 with a linking exception); Git support uses gix" },
  { crate = "curl-sys", reason = "binds the system libcurl library; HTTP uses ureq with rustls" },
  { crate = "serde_yaml", reason = "deprecated and unmaintained; YAML support uses yaml-edit and saphyr" },
  { crate = "ini", reason = "dual licensed with LGPL-3.0-or-later; INI support uses rust-ini and an own parser" },
  { crate = "libsystemd-sys", reason = "binds libsystemd (LGPL-2.1); D-Bus uses zbus and journal files are read natively" },
  { crate = "unrar", reason = "the UnRAR license forbids creating a RAR compressor" },
  { crate = "unrar_sys", reason = "the UnRAR license forbids creating a RAR compressor" },
]

[sources]
# Dependencies are taken from crates.io only.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
