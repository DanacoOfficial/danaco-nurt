name: java-binding

on:
  push:
    branches: [main]
    paths:
      - "bindings/java/**"
      - "crates/nurt-ffi/**"
      - "crates/nurt-conformance/**"
      - "conformance/bindings/**"
      - "spec/schemas/**"
  pull_request:
    paths:
      - "bindings/java/**"
      - "crates/nurt-ffi/**"
      - "crates/nurt-conformance/**"
      - "conformance/bindings/**"
      - "spec/schemas/**"
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    working-directory: bindings/java
    shell: bash

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Project version matches the workspace version
        run: |
          workspace=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' ../../Cargo.toml)
          project=$(sed -n 's:^  <version>\(.*\)</version>$:\1:p' pom.xml | head -n 1)
          client=$(sed -n 's/.*CLIENT_VERSION = "\(.*\)";/\1/p' nurt/src/main/java/pl/danacogroup/nurt/internal/ProcessBackend.java)
          test -n "$workspace" && test "$workspace" = "$project" && test "$workspace" = "$client"

  process:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        java: ["17", "21"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build fake-serve
        working-directory: .
        run: cargo build --locked --release -p nurt-conformance
      - name: Test
        run: |
          export NURT_CONFORMANCE="$GITHUB_WORKSPACE/target/release/nurt-conformance"
          if [ "$RUNNER_OS" = "Windows" ]; then NURT_CONFORMANCE="$NURT_CONFORMANCE.exe"; fi
          mvn -B -ntp verify

  library:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        java: ["22", "25"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build libnurt stub and fake-serve
        working-directory: .
        run: |
          cargo build --locked --release -p nurt-ffi --features stub
          cargo build --locked --release -p nurt-conformance
      - name: Test both backends
        run: |
          release="$GITHUB_WORKSPACE/target/release"
          for candidate in "$release"/libnurt_ffi.so "$release"/libnurt_ffi.dylib "$release"/nurt_ffi.dll; do
            if [ -f "$candidate" ]; then export NURT_LIBRARY="$candidate"; fi
          done
          test -n "${NURT_LIBRARY:-}"
          export NURT_CONFORMANCE="$release/nurt-conformance"
          if [ "$RUNNER_OS" = "Windows" ]; then NURT_CONFORMANCE="$NURT_CONFORMANCE.exe"; fi
          mvn -B -ntp verify

  package:
    if: github.event_name == 'release'
    needs: [metadata, process, library]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "22"
          cache: maven
      - name: Download and verify release artifacts
        run: |
          mkdir -p downloads
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloads \
            --pattern 'nurt-*.tar.gz' --pattern 'nurt-*.zip' --pattern 'checksums.txt'
          (cd downloads && for archive in nurt-*; do grep -qE "^[0-9a-f]{64} [ *]${archive}$" checksums.txt || { echo "${archive} is not listed in checksums.txt" >&2; exit 1; }; done && sha256sum --check --ignore-missing --strict checksums.txt)
      - name: Version matches the release
        run: |
          project=$(sed -n 's:^  <version>\(.*\)</version>$:\1:p' pom.xml | head -n 1)
          test "v$project" = "$TAG"
      - name: Bundle native artifacts
        run: |
          version="${TAG#v}"
          declare -A platforms=(
            [x86_64-unknown-linux-gnu]=linux-x86_64
            [aarch64-unknown-linux-gnu]=linux-aarch64
            [x86_64-apple-darwin]=macos-x86_64
            [aarch64-apple-darwin]=macos-aarch64
            [x86_64-pc-windows-msvc]=windows-x86_64
            [aarch64-pc-windows-msvc]=windows-aarch64
          )
          bundle() {
            local source="$1" target="$2"
            mkdir -p "$(dirname "$target")"
            cp "$source" "$target"
            sha256sum "$target" | cut -d ' ' -f 1 > "$target.sha256"
          }
          for triple in "${!platforms[@]}"; do
            platform="${platforms[$triple]}"
            archive=$(find downloads -maxdepth 1 -name "nurt-$version-$triple.*" | sort | head -n 1)
            test -n "$archive"
            unpacked="unpacked/$triple"
            mkdir -p "$unpacked"
            case "$archive" in
              *.zip) unzip -q "$archive" -d "$unpacked" ;;
              *) tar -xzf "$archive" -C "$unpacked" ;;
            esac
            libarchive=$(find downloads -maxdepth 1 -name "nurt-lib-$version-$triple.*" | sort | head -n 1)
            test -n "$libarchive"
            libunpacked="unpacked-lib/$triple"
            mkdir -p "$libunpacked"
            case "$libarchive" in
              *.zip) unzip -q "$libarchive" -d "$libunpacked" ;;
              *) tar -xzf "$libarchive" -C "$libunpacked" ;;
            esac
            case "$platform" in
              windows-*) executable=nurt.exe; library=nurt.dll; packaged=nurt.dll ;;
              macos-*) executable=nurt; library=libnurt.1.dylib; packaged=libnurt.dylib ;;
              *) executable=nurt; library=libnurt.so.1; packaged=libnurt.so ;;
            esac
            bundle "$(find "$unpacked" -type f -name "$executable" | head -n 1)" \
              "nurt/src/main/resources/natives/$platform/$executable"
            bundle "$(find "$libunpacked" -type f -name "$library" | head -n 1)" \
              "nurt-ffm/src/main/resources/natives/$platform/$packaged"
          done
      - name: Build packages
        run: mvn -B -ntp -DskipTests package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-packages
          path: |
            bindings/java/nurt/target/nurt-*.jar
            bindings/java/nurt-ffm/target/nurt-ffm-*.jar
