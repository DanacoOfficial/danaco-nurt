name: Packaging

# Builds the system packages from the release archives and checks the
# installers and manifests. The release archives are provided as the artifact
# "release-archives" (nurt-<version>-<target>.tar.gz and .zip, checksums.txt)
# of the calling workflow.

on:
  workflow_call:
    inputs:
      version:
        description: Release version, for example 1.0.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.0
        required: true
        type: string
      run-id:
        description: Run that produced the artifact "release-archives"
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run the packaging tests
        run: python3 -I -m unittest discover -s packaging/tests -p 'test_*.py' -v
      - name: Install shellcheck
        run: sudo apt-get install -y --no-install-recommends shellcheck
      - name: Run shellcheck
        run: shellcheck -s sh packaging/install/install.sh packaging/deb/build-deb.sh packaging/tests/container-install.sh
      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $findings = Invoke-ScriptAnalyzer -Path packaging/install/install.ps1 -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost
          $findings | Format-Table
          if ($findings) { exit 1 }

  archives:
    name: Release archives
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      epoch: ${{ steps.epoch.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Take the build time from the commit
        id: epoch
        run: echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: archives
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify the checksums of the archives
        working-directory: archives
        run: sha256sum --check --strict checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: packaging-input
          path: archives
          retention-days: 7

  deb:
    name: Debian packages (${{ matrix.arch }})
    needs: archives
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      SOURCE_DATE_EPOCH: ${{ needs.archives.outputs.epoch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packaging-input
          path: archives
      - name: Build the packages
        run: |
          sh packaging/deb/build-deb.sh \
            --artifact "archives/nurt-${{ inputs.version }}-${{ matrix.target }}.tar.gz" \
            --version "${{ inputs.version }}" \
            --arch "${{ matrix.arch }}" \
            --output debs
      - name: Describe the packages
        run: |
          for package in debs/*.deb; do
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
          done
      - name: Run lintian
        run: |
          sudo apt-get install -y --no-install-recommends lintian
          lintian --fail-on error --tag-display-limit 0 debs/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: debs
          retention-days: 7

  install-deb:
    name: Install on ${{ matrix.image }}
    needs: deb
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:stable", "ubuntu:latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debs-amd64
          path: debs
      - name: Install in a clean container
        run: |
          docker run --rm \
            -v "$PWD/debs:/packages:ro" \
            -v "$PWD/packaging/tests:/tests:ro" \
            "${{ matrix.image }}" sh /tests/container-install.sh deb /packages

  rpm:
    name: RPM packages (${{ matrix.arch }})
    needs: archives
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      SOURCE_DATE_EPOCH: ${{ needs.archives.outputs.epoch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packaging-input
          path: archives
      - name: Render the specification
        run: |
          python3 -I packaging/release/render.py \
            --checksums archives/checksums.txt --output rendered --version "${{ inputs.version }}"
      - name: Build the packages
        run: |
          docker run --rm \
            -v "$PWD/rendered/rpm:/spec:ro" \
            -v "$PWD/archives:/archives:ro" \
            -v "$PWD/rpms:/rpms" \
            -e SOURCE_DATE_EPOCH \
            fedora:latest sh -c '
              set -eu
              dnf install -y -q rpm-build
              mkdir -p /root/rpmbuild/SOURCES
              cp /archives/nurt-${{ inputs.version }}-${{ matrix.arch }}-unknown-linux-gnu.tar.gz /root/rpmbuild/SOURCES/
              rpmbuild -bb --define "_buildhost reproducible" \
                --define "use_source_date_epoch_as_buildtime 1" \
                --define "clamp_mtime_to_source_date_epoch 1" /spec/nurt.spec
              cp /root/rpmbuild/RPMS/${{ matrix.arch }}/*.rpm /rpms/
            '
      - uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.arch }}
          path: rpms
          retention-days: 7

  install-rpm:
    name: Install on Fedora
    needs: rpm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rpms-x86_64
          path: rpms
      - name: Install in a clean container
        run: |
          docker run --rm \
            -v "$PWD/rpms:/packages:ro" \
            -v "$PWD/packaging/tests:/tests:ro" \
            fedora:latest sh /tests/container-install.sh rpm /packages

  install-script-unix:
    name: install.sh on ${{ matrix.os }}
    needs: archives
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packaging-input
          path: archives
      - name: Lay out a local release location
        run: |
          mkdir -p "releases/download/v${{ inputs.version }}" releases/latest/download
          cp archives/* "releases/download/v${{ inputs.version }}/"
          cp archives/checksums.txt releases/latest/download/
      - name: Install and run
        run: |
          NURT_RELEASES_URL="$PWD/releases" sh packaging/install/install.sh --bin-dir "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/nurt" version | head -n 1 | grep -q '^nurt [0-9]'

  install-script-windows:
    name: install.ps1 on Windows
    needs: archives
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packaging-input
          path: archives
      - name: Install and run
        shell: pwsh
        run: |
          $releases = Join-Path $env:RUNNER_TEMP 'releases'
          $download = Join-Path $releases 'download/v${{ inputs.version }}'
          $latest = Join-Path $releases 'latest/download'
          New-Item -ItemType Directory -Force -Path $download, $latest | Out-Null
          Copy-Item archives/* $download
          Copy-Item archives/checksums.txt $latest
          $env:NURT_RELEASES_URL = $releases
          $env:NURT_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin'
          $env:NURT_NO_PATH_UPDATE = '1'
          ./packaging/install/install.ps1
          $first = (& (Join-Path $env:NURT_INSTALL_DIR 'nurt.exe') version) | Select-Object -First 1
          if ($first -notmatch '^nurt \d') { throw "unexpected output: $first" }

  manifests:
    name: Manifests
    needs: archives
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SOURCE_DATE_EPOCH: ${{ needs.archives.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packaging-input
          path: archives
      - name: Render the manifests
        run: python packaging/release/render.py --checksums archives/checksums.txt --output rendered --version "${{ inputs.version }}"
      - name: Validate the winget manifests
        shell: pwsh
        run: |
          winget settings --enable LocalManifestFiles
          winget validate --manifest "rendered/winget/manifests/d/Danaco/Nurt/${{ inputs.version }}"
      - name: Validate the Scoop manifest against the schema
        shell: pwsh
        run: |
          python -m pip install --quiet check-jsonschema
          Invoke-WebRequest https://raw.githubusercontent.com/ScoopInstaller/Scoop/master/schema.json -OutFile scoop-schema.json
          check-jsonschema --schemafile scoop-schema.json rendered/scoop/nurt.json
      - name: Pack the Chocolatey package
        shell: pwsh
        run: |
          Push-Location rendered/chocolatey
          choco pack nurt.nuspec
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: manifests
          path: rendered
          retention-days: 7

  formula:
    name: Homebrew formulae
    needs: archives
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      SOURCE_DATE_EPOCH: ${{ needs.archives.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packaging-input
          path: archives
      - name: Render the formulae
        run: python3 packaging/release/render.py --checksums archives/checksums.txt --output rendered --version "${{ inputs.version }}"
      - name: Check the formula syntax and style
        run: |
          brew tap-new local/nurt
          cp rendered/homebrew/nurt.rb "$(brew --repository local/nurt)/Formula/nurt.rb"
          brew style local/nurt/nurt
