name: containers

on:
  pull_request:
    paths:
      - integrations/containers/**
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version to package, without the v prefix.
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/danacoofficial

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check image definitions
        run: bash integrations/containers/tests/check-dockerfiles.sh
      - name: Run hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: integrations/containers/nurt/Dockerfile
          config: integrations/containers/.hadolint.yaml
      - name: Run hadolint on the CI image
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: integrations/containers/ci/Dockerfile
          config: integrations/containers/.hadolint.yaml
      - name: Run hadolint on the development container image
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: integrations/containers/devcontainer/Dockerfile
          config: integrations/containers/.hadolint.yaml
      - name: Run ShellCheck
        run: shellcheck --shell=bash integrations/containers/tests/*.sh

  publish:
    name: Build and publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: nurt
            directory: nurt
          - name: nurt-ci
            directory: ci
          - name: nurt-devcontainer
            directory: devcontainer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = release ]; then
            echo "value=${RELEASE_TAG#v}" >>"$GITHUB_OUTPUT"
          else
            echo "value=$INPUT_VERSION" >>"$GITHUB_OUTPUT"
          fi
      - name: Stage the build context
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/context"
          downloads="$RUNNER_TEMP/downloads"
          mkdir -p "$context/amd64" "$context/arm64" "$downloads"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$downloads" \
            --pattern "nurt-$VERSION-*-unknown-linux-musl.tar.gz" --pattern checksums.txt
          (cd "$downloads" && grep -F -- "-unknown-linux-musl.tar.gz" checksums.txt | sha256sum --check --strict)
          tar -xzf "$downloads/nurt-$VERSION-x86_64-unknown-linux-musl.tar.gz" -C "$context/amd64" \
            --strip-components=1 "nurt-$VERSION-x86_64-unknown-linux-musl/nurt"
          tar -xzf "$downloads/nurt-$VERSION-aarch64-unknown-linux-musl.tar.gz" -C "$context/arm64" \
            --strip-components=1 "nurt-$VERSION-aarch64-unknown-linux-musl/nurt"
          cp LICENSE NOTICE "$context/"
          echo "CONTEXT=$context" >>"$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Log in to the registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Collect image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.value, '-') }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          file: integrations/containers/${{ matrix.image.directory }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Smoke test
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}:${{ steps.version.outputs.value }}
          KIND: ${{ matrix.image.directory }}
        run: bash integrations/containers/tests/smoke.sh "$IMAGE" "$KIND"
