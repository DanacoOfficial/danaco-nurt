name: Repository hygiene

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  content:
    name: Repository content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check content
        env:
          # Deployment-specific patterns are kept in the repository variable
          # NURT_HYGIENE_PATTERNS and are never written to the repository.
          NURT_HYGIENE_PATTERNS: ${{ vars.NURT_HYGIENE_PATTERNS }}
          NURT_HYGIENE_REQUIRE_EXTERNAL: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: bash tools/ci/repo-hygiene.sh --only content
      - name: Check language and style
        if: ${{ !cancelled() }}
        run: bash tools/ci/repo-hygiene.sh --only style
      - name: Check file headers
        if: ${{ !cancelled() }}
        run: bash tools/ci/repo-hygiene.sh --only headers

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: ShellCheck
        run: |
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck --shell=bash

  workflows:
    name: Workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

  commits:
    name: Commit messages and sign-off
    # Dependency update pull requests are generated by Dependabot, which does
    # not add a sign-off; they are reviewed and merged by a maintainer.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commits of the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash tools/ci/check-commits.sh "${BASE_SHA}..${HEAD_SHA}"
