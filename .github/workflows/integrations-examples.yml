name: integration-examples

on:
  pull_request:
    paths:
      - "integrations/examples/**"
  push:
    branches: [main]
    paths:
      - "integrations/examples/**"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test with the standard library only
        run: python -m unittest discover -s integrations/examples/tests -v
      - name: Install the framework packages
        run: python -m pip install "langchain-core>=1.0" "semantic-kernel[mcp]>=1.37"
      - name: Test with the framework packages
        run: python -m unittest discover -s integrations/examples/tests -v

  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [anthropic-typescript, openai-typescript, vercel-ai]
    defaults:
      run:
        working-directory: integrations/examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install the dependencies without the console package
        run: |
          npm pkg delete dependencies.nurt
          npm install --no-save --omit=optional
      - name: Test
        run: npm test

