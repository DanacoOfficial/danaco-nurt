name: integration-examples

on:
  pull_request:
    paths:
      - "integrations/examples/**"
  push:
    branches: [main]
    paths:
      - "integrations/examples/**"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test with the standard library only
        run: python -m unittest discover -s integrations/examples/tests -v
      - name: Install the framework packages
        run: python -m pip install "langchain-core>=1.0" "semantic-kernel[mcp]>=1.37"
      - name: Test with the framework packages
        run: python -m unittest discover -s integrations/examples/tests -v

  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [anthropic-typescript, openai-typescript, vercel-ai]
    defaults:
      run:
        working-directory: integrations/examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the dependencies without the console package
        run: |
          mapfile -t dependencies < <(node -p "Object.keys(require('./package.json').dependencies).filter((name) => name !== 'nurt').join('\n')")
          npm install --no-save --omit=optional "${dependencies[@]}"
      - name: Test
        run: npm test
