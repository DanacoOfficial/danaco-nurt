name: Publish packages

# Publishes the packages of a release whose archives are attached to the
# GitHub release v<version>. The workflow signs the checksums and the apt
# repository, updates the package managers and installs the published
# packages on clean systems.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Render and sign
    # Uploads the rendered files to the release; the other jobs publish with
    # their own credentials.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Validate the release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            '' | *[!0-9A-Za-z.-]*) echo "invalid version: $VERSION" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Take the build time from the release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          epoch=$(git log -1 --format=%ct "refs/tags/v${VERSION}")
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
      - name: Download the release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir archives
          gh release download "v${{ inputs.version }}" --repo "$GITHUB_REPOSITORY" --dir archives \
            --pattern 'nurt-*.tar.gz' --pattern 'nurt-*.zip' --pattern checksums.txt
          (cd archives && sha256sum --check --strict checksums.txt)
      - name: Check the dependencies of the Linux binaries
        run: |
          version="${{ inputs.version }}"
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            mkdir -p "checked/$triple"
            tar -xzf "archives/nurt-${version}-${triple}.tar.gz" -C "checked/$triple" --strip-components=1
            tar -xzf "archives/nurt-lib-${version}-${triple}.tar.gz" -C "checked/$triple" --strip-components=1
            bash tools/ci/check-dependencies.sh "checked/$triple/nurt" "checked/$triple/libnurt.so.1"
          done
          for archive in archives/nurt-"${version}"-*-unknown-linux-musl.tar.gz; do
            [ -e "$archive" ] || continue
            mkdir -p checked/musl
            tar -xzf "$archive" -C checked/musl --strip-components=1
            bash tools/ci/check-dependencies.sh checked/musl/nurt
            rm -rf checked/musl
          done
      - name: Import the signing key
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$SIGNING_KEY" | gpg --batch --quiet --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ID=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')" >> "$GITHUB_ENV"
      - name: Sign the checksums
        run: |
          gpg --batch --yes --local-user "$SIGNING_KEY_ID" --armor --detach-sign \
            --output archives/checksums.txt.asc archives/checksums.txt
      - name: Build the Debian packages
        run: |
          sh packaging/deb/build-deb.sh --artifact "archives/nurt-${{ inputs.version }}-x86_64-unknown-linux-gnu.tar.gz" \
            --lib-artifact "archives/nurt-lib-${{ inputs.version }}-x86_64-unknown-linux-gnu.tar.gz" \
            --version "${{ inputs.version }}" --arch amd64 --output debs
          sh packaging/deb/build-deb.sh --artifact "archives/nurt-${{ inputs.version }}-aarch64-unknown-linux-gnu.tar.gz" \
            --lib-artifact "archives/nurt-lib-${{ inputs.version }}-aarch64-unknown-linux-gnu.tar.gz" \
            --version "${{ inputs.version }}" --arch arm64 --output debs
      - name: Generate the signed apt repository
        run: |
          python3 -I packaging/apt-repo/mkrepo.py --packages debs --output apt --suite stable \
            --sign-key "$SIGNING_KEY_ID"
      - name: Render the manifests
        run: |
          python3 -I packaging/release/render.py --checksums archives/checksums.txt \
            --output rendered --version "${{ inputs.version }}"
      - name: Attach the signature and the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ inputs.version }}" --repo "$GITHUB_REPOSITORY" --clobber \
            archives/checksums.txt.asc debs/*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication
          path: |
            apt
            rendered
          retention-days: 14

  apt:
    name: apt repository
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication
          path: publication
      - name: Upload the repository
        env:
          DEPLOY_KEY: ${{ secrets.APT_DEPLOY_KEY }}
          DEPLOY_TARGET: ${{ secrets.APT_DEPLOY_TARGET }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.APT_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rt --delete-after --filter="P /pool/" -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            publication/apt/ "$DEPLOY_TARGET"

  homebrew:
    name: Homebrew tap
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication
          path: publication
      - name: Update the formula in the tap
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/DanacoOfficial/homebrew-tap.git" tap
          install -D publication/rendered/homebrew/nurt.rb tap/Formula/nurt.rb
          cd tap
          git config user.name "Danaco Official"
          git config user.email "support@danaco-group.pl"
          git add Formula/nurt.rb
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "nurt ${{ inputs.version }}"
          git push origin HEAD:main

  scoop:
    name: Scoop bucket
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication
          path: publication
      - name: Update the manifest in the bucket
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/DanacoOfficial/scoop-bucket.git" bucket
          install -D publication/rendered/scoop/nurt.json bucket/bucket/nurt.json
          cd bucket
          git config user.name "Danaco Official"
          git config user.email "support@danaco-group.pl"
          git add bucket/nurt.json
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "nurt ${{ inputs.version }}"
          git push origin HEAD:main

  winget:
    name: winget
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication
          path: publication
      - name: Submit the manifests
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_PUBLISH_TOKEN }}
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe submit --no-open "publication/rendered/winget/manifests/d/Danaco/Nurt/${{ inputs.version }}"

  chocolatey:
    name: Chocolatey
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication
          path: publication
      - name: Pack and push
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          Push-Location publication/rendered/chocolatey
          choco pack nurt.nuspec
          choco push (Get-ChildItem nurt.*.nupkg).FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          Pop-Location

  verify:
    name: Verify ${{ matrix.name }}
    needs: [apt, homebrew, scoop]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: install.sh
            runner: ubuntu-latest
            run: |
              curl -fsSL https://nurt.danaco-group.pl/install.sh | NURT_VERSION="${{ inputs.version }}" NURT_INSTALL_DIR="$RUNNER_TEMP/bin" sh
              "$RUNNER_TEMP/bin/nurt" version | head -n 1 | grep -q '^nurt [0-9]'
          - name: Homebrew
            runner: macos-latest
            run: |
              brew install DanacoOfficial/tap/nurt
              brew test nurt
          - name: apt on Debian
            runner: ubuntu-latest
            run: |
              docker run --rm debian:stable sh -c '
                set -eu
                apt-get update -qq
                apt-get install -y -qq ca-certificates curl
                install -d /etc/apt/keyrings
                curl -fsSL https://nurt.danaco-group.pl/danaco-nurt.asc -o /etc/apt/keyrings/danaco-nurt.asc
                curl -fsSL https://raw.githubusercontent.com/DanacoOfficial/nurt/v${{ inputs.version }}/packaging/apt-repo/nurt.sources \
                  -o /etc/apt/sources.list.d/nurt.sources
                apt-get update -qq
                apt-get install -y -qq nurt
                nurt version | head -n 1 | grep -q "^nurt [0-9]"
              '
    steps:
      - name: Install and run
        run: ${{ matrix.run }}
