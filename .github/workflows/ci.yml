name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    # Daily run for new security advisories and toolchain regressions.
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"
  RUSTUP_MAX_RETRIES: "10"
  # The interface tests of nurt-ffi compile C programs with clang; a missing
  # compiler fails them instead of skipping them. The runners of Linux and
  # macOS provide clang; the tests do not exist on Windows.
  NURT_REQUIRE_C_TOOLCHAIN: "1"
  # Minimum line coverage of the workspace and of the critical crates.
  COVERAGE_MIN_WORKSPACE: "80"
  COVERAGE_MIN_CRITICAL: "90"
  COVERAGE_CRITICAL_CRATES: >-
    -p nurt-contracts
    -p nurt-syntax
    -p nurt-correct
    -p nurt-journal
    -p nurt-fs
    -p nurt-ffi

defaults:
  run:
    shell: bash

# The build cache of every job is keyed by the job, the operating system, the
# compiler version (RUSTC_VERSION, set by the toolchain step) and Cargo.lock.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install && rustup show active-toolchain
          echo "RUSTC_VERSION=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_ENV"
      - name: Cache dependencies and build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: clippy-${{ runner.os }}-rustc-${{ env.RUSTC_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            clippy-${{ runner.os }}-rustc-${{ env.RUSTC_VERSION }}-
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install && rustup show active-toolchain
          echo "RUSTC_VERSION=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_ENV"
      - name: Cache dependencies and build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: test-${{ runner.os }}-rustc-${{ env.RUSTC_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            test-${{ runner.os }}-rustc-${{ env.RUSTC_VERSION }}-
      - name: Install the C compiler
        if: runner.os == 'Linux'
        run: sudo apt-get install --yes --no-install-recommends clang
      - name: Check the C compiler
        if: runner.os != 'Windows'
        run: clang --version
      - name: Install cargo-nextest
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2
        continue-on-error: true
        with:
          tool: cargo-nextest
      - name: Install mandoc
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends mandoc
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Run tests
        env:
          # The scheduled (nightly) run generates the full number of cases of
          # the property tests; other runs use the small default.
          NURT_PROPTEST_FULL: ${{ github.event_name == 'schedule' && '1' || '0' }}
          # On Linux the lint of the manual pages must run: mandoc is installed
          # above, so a missing mandoc fails the test instead of skipping it.
          NURT_REQUIRE_MANDOC: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: |
          if cargo nextest --version >/dev/null 2>&1; then
            cargo nextest run --workspace --locked --no-fail-fast --no-tests=fail
          else
            cargo test --workspace --locked --no-fail-fast
          fi
      - name: Run documentation tests
        run: cargo test --workspace --doc --locked
      - name: Run the differential tests of the file commands
        # The tests compare the commands with the programs of the system and
        # skip a program that is not installed; the cargo feature is off in
        # the other steps.
        if: runner.os == 'Linux'
        run: cargo test -p nurt-files --features differential --locked --no-fail-fast --test 'differential_*'

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
          echo "RUSTC_VERSION=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_ENV"
      - name: Cache dependencies and build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: coverage-${{ runner.os }}-rustc-${{ env.RUSTC_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            coverage-${{ runner.os }}-rustc-${{ env.RUSTC_VERSION }}-
      - name: Install the C compiler
        run: sudo apt-get install --yes --no-install-recommends clang
      - name: Check the C compiler
        run: clang --version
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Coverage of the critical crates
        run: |
          read -r -a crates <<< "${COVERAGE_CRITICAL_CRATES}"
          cargo llvm-cov nextest --locked --no-tests=warn "${crates[@]}" \
            --fail-under-lines "${COVERAGE_MIN_CRITICAL}"
      - name: Coverage of the workspace
        run: >-
          cargo llvm-cov nextest --workspace --locked --no-tests=fail
          --lcov --output-path lcov.info
          --fail-under-lines "${COVERAGE_MIN_WORKSPACE}"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore
          retention-days: 14

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install && rustup show active-toolchain
          echo "RUSTC_VERSION=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_ENV"
      - name: Cache dependencies and build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: docs-${{ runner.os }}-rustc-${{ env.RUSTC_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            docs-${{ runner.os }}-rustc-${{ env.RUSTC_VERSION }}-
      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - name: Install cargo-deny
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2
        with:
          tool: cargo-deny@0.22
      - name: Licenses, bans and sources
        run: cargo deny --locked check bans licenses sources
      - name: Security advisories
        run: cargo deny --locked check advisories

  cross-check:
    name: Check ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
          echo "RUSTC_VERSION=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_ENV"
      - name: Cache dependencies and build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cross-${{ matrix.target }}-rustc-${{ env.RUSTC_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cross-${{ matrix.target }}-rustc-${{ env.RUSTC_VERSION }}-
      - name: Check the contract crate
        run: cargo check -p nurt-contracts --all-targets --locked --target "${{ matrix.target }}"

