name: devcontainer-feature

on:
  pull_request:
    paths:
      - integrations/devcontainer/**
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Installer tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run ShellCheck
        run: |
          shellcheck -s sh integrations/devcontainer/src/nurt/install.sh integrations/devcontainer/test/nurt/alpine.sh
          shellcheck --shell=bash integrations/devcontainer/test/install-offline.sh integrations/devcontainer/test/nurt/test.sh integrations/devcontainer/test/nurt/major.sh
      - name: Run installer tests
        run: bash integrations/devcontainer/test/install-offline.sh

  feature:
    name: Feature tests
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install the devcontainer CLI
        run: npm install --global @devcontainers/cli
      - name: Test with the default options on the base image
        run: |
          devcontainer features test \
            --project-folder integrations/devcontainer \
            --features nurt \
            --base-image mcr.microsoft.com/devcontainers/base:bookworm
      - name: Test the scenarios
        run: |
          devcontainer features test \
            --project-folder integrations/devcontainer \
            --features nurt \
            --skip-autogenerated \
            --skip-duplicate-test

  publish:
    name: Publish
    if: github.event_name == 'release'
    needs: feature
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Publish the Feature
        uses: devcontainers/action@v1
        with:
          publish-features: 'true'
          base-path-to-features: integrations/devcontainer/src
          features-namespace: danacoofficial/features
        env:
          GITHUB_TOKEN: ${{ github.token }}
